      const wet = ST.weather === 'rain' || ST.weather === 'storm';
      ST.plants = Math.max(0, ST.plants + k * (0.03 * ST.plants * (1 - ST.plants / 1500) + (wet ? 3 : 0)) + k * 0.5);
      ST.animals = Math.max(0, ST.animals + k * 0.04 * (ST.plants / 18 - ST.animals));
      ST.water = clamp(ST.water + k * (wet ? 0.25 : -0.03), 4, 80);
      ST.kinds = Math.min(30, ST.kinds + k * 0.004 * (ST.plants > 400 ? 1 : -0.5));
    }
    // the vital signs: a level from 0 to 1, a word for it, and a line of detail. A new word is also news.
    const WORDS = { life: ['Bare', 'Sparse', 'Growing', 'Thriving', 'Teeming'], water: ['Parched', 'Dry', 'Balanced', 'Wet', 'Flooded'], warmth: ['Frozen', 'Cold', 'Mild', 'Hot', 'Scorched'] };
    const CUTS = { life: [0.1, 0.3, 0.55, 0.8], water: [0.15, 0.38, 0.62, 0.85], warmth: [0.15, 0.38, 0.62, 0.85] };
    const NEWS = {
      life: { Bare: ['🍂', 'Life has nearly gone'], Sparse: ['🍂', 'Life is sparse'], Growing: ['🌱', 'Life is growing back'], Thriving: ['🌿', 'Life is thriving'], Teeming: ['🌳', 'The world is teeming'] },
      water: { Parched: ['🏜️', 'The land is parched'], Dry: ['🌾', 'The land is drying out'], Balanced: ['💧', 'The water is in balance'], Wet: ['💧', 'The ground is wet through'], Flooded: ['🌊', 'The land is flooded'] },
      warmth: { Frozen: ['🧊', 'The world froze over'], Cold: ['❄️', 'A cold spell set in'], Mild: ['🌤️', 'The air turned mild'], Hot: ['☀️', 'A heat wave set in'], Scorched: ['🔥', 'The land is scorched'] },
    };
    const KMAX = 30;
    function wordOf(id, x) {
      const cuts = CUTS[id], cur = ST.words[id];
      let i = 0; while (i < cuts.length && x >= cuts[i]) i++;
      if (cur != null) { const ci = WORDS[id].indexOf(cur); if (ci !== i && Math.abs(x - cuts[Math.min(ci, i)]) < 0.02) return cur; }   // no flicker on an edge
      return WORDS[id][i];
    }
    function sendVitals() {
      const temp = 14 + 8 * Math.sin(((G.year % 1) - 0.2) * Math.PI * 2) + ST.heat + (ST.weather === 'snow' ? -4 : 0), core = 1180 + ST.heat * 40;
      const lv = { life: clamp(ST.plants / 1500 * 0.72 + ST.animals / 110 * 0.28, 0, 1), water: clamp((ST.water - 4) / 76, 0, 1), warmth: clamp((temp + 10) / 50, 0, 1) };
      const out = {};
      for (const id in lv) {
        const w = wordOf(id, lv[id]);
        if (ST.words[id] && w !== ST.words[id]) { const n = NEWS[id][w]; send('story', { id: 'vital.' + id + '.' + w, icon: n[0], text: n[1], kind: 'milestone' }); }
        ST.words[id] = w;
      }
      const kinds = Math.max(1, Math.round(ST.kinds));
      if (ST.kindsSeen && kinds > ST.kindsSeen) send('story', { id: 'kind.' + kinds, icon: '🦋', text: 'A new kind of life arrived', kind: 'milestone' });
      ST.kindsSeen = kinds;
      send('vitals', {
        life: { value: lv.life, word: ST.words.life, detail: 'plants ' + Math.round(ST.plants).toLocaleString('en') + ', animals ' + Math.round(ST.animals).toLocaleString('en') },
        variety: { value: kinds / KMAX, word: kinds + ' of ' + KMAX, detail: 'kinds of life' },
        water: { value: lv.water, word: ST.words.water, detail: 'lake ' + Math.round(lv.water * 100) + '% full, ' + WEATHER[ST.weather][1].toLowerCase() },
        warmth: { value: lv.warmth, word: ST.words.warmth, detail: 'surface ' + Math.round(temp) + '°, heat below ' + Math.round(core).toLocaleString('en') + '°' },
      });
    }

    // ── what tools do here: a named event, and sometimes a fake chain ──
    const send = (n, d) => { if (G.ui) G.ui.send(n, d); };
    function apply(h) {
      const v = VAR[G.tool], fam = v.family, w = where(h);
      thump(fam.side);
      if (fam.side === 'wreck') for (const t of G.things) {
        if (!t.alive) continue;
        const d = Math.hypot(t.x - h.x, t.z - h.z);
        if (d < 0.07) {
          t.alive = false; t.dead = 25;
          send('story', { id: 'lost.' + t.sp, icon: t.d.icon, text: 'A ' + t.d.name.toLowerCase() + ' was lost', kind: 'wreck' });
          if (G.follow === t) followIt(null);
          if (G.looked === t) send('subject', info(t, 'look'));
        } else if (d < 0.3 && isAnimal(t)) { t.scared = 3; t.rest = 0; t.hd = Math.atan2(t.z - h.z, t.x - h.x); }
      }
      send('story', { id: 'tool.' + v.id + '.' + w, icon: v.icon, text: SAYS[fam.id](v, w), kind: fam.side, minor: true });   // the player saw it: journal only
      const n = NUDGE[v.id], s = 1 + G.charge;
      if (n) { if (n[0]) { ST.weather = n[0]; ST.wT = 20; } ST.heat += n[1] * s; ST.plants = Math.max(0, ST.plants + n[2] * s); ST.animals = Math.max(0, ST.animals + n[3] * s); ST.water = clamp(ST.water + n[4] * s, 4, 80); }
      const prev = G.last[G.last.length - 1];
      G.last.push(fam.id); G.lastV.push({ id: v.id, label: v.icon + ' ' + v.name + ' at ' + w });
      if (G.last.length > 3) { G.last.shift(); G.lastV.shift(); }
      const p = prev && PAIRS[prev + '>' + fam.id];
      if (p) {
        const how = G.lastV.slice(-2).map((x) => x.label);
        setTimeout(() => { send('story', { id: 'react.' + p[0], icon: p[1], text: p[2], kind: 'reaction' }); send('discovery', { id: p[0], how, year: G.year }); }, 650);
      }
      const ids = G.lastV.map((x) => x.id).join('>');
      for (const d of CAT.discoveries) {
        if (d.tier !== 'engineered') continue;
        if (d.steps.filter((s2) => s2.tool).map((s2) => s2.tool).join('>') === ids) { const how = G.lastV.map((x) => x.label); setTimeout(() => rare(d, how), 1100); }
      }
    }
    function rare(d, how) { G.glint = 1.6; send('story', { id: 'react.' + d.id, icon: d.icon, text: d.steps[d.steps.length - 1].name + ' formed', kind: 'reaction' }); send('discovery', { id: d.id, how, year: G.year }); }
    function poke(h) {
      const w = where(h);
      send('story', { id: 'poke.' + w, icon: '👆', text: 'You poked ' + w, kind: 'tend', minor: true });
    }

    // ── pointer: left uses the tool, right or the glass or the sky turns, scroll zooms ──
    const P = new Map(); let mode = null, pinch0 = 0, dist0 = 0, down = null;
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('pointerdown', (e) => {
      audio(); cv.focus();
      cv.setPointerCapture(e.pointerId); P.set(e.pointerId, [e.clientX, e.clientY]);
      if (P.size === 2) { const [a, b] = [...P.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = G.dist; mode = 'pinch'; G.charging = false; G.charge = 0; return; }
      const h = pick(e.clientX, e.clientY), t = isActT(G.tool) && e.button !== 2 ? thingAt(e.clientX, e.clientY) : null;
      down = [e.clientX, e.clientY, t];
      if (t && G.tool === 'look') { mode = 'poke'; lookAt(t); }
      else if (t && G.tool === 'follow') { mode = 'poke'; if (isAnimal(t)) followIt(t); else lookAt(t); }
      else if (t && G.tool === 'hand') { mode = 'poke'; pokeThing(t); }
      else if (e.button === 2 || h.kind !== 'land' || G.tool === 'look' || G.tool === 'follow') mode = 'orbit';
      else if (G.tool === 'hand') { mode = 'poke'; poke(h); }
      else { mode = 'tool'; G.charging = true; G.charge = 0; G.hover = h; }
      G.dirty = true;
    });
    cv.addEventListener('pointermove', (e) => {
      const q = P.get(e.pointerId); G.mx = e.clientX; G.my = e.clientY;
      if (mode === 'pinch' && q) { P.set(e.pointerId, [e.clientX, e.clientY]); const [a, b] = [...P.values()]; G.dist = clamp(dist0 * pinch0 / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1])), 1.75, 7); }
      else if (mode === 'orbit' && q) {
        if (G.follow && down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) followIt(null);     // turning the bubble yourself takes the camera back
        G.yaw -= (e.clientX - q[0]) * 0.008; G.pitch = clamp(G.pitch + (e.clientY - q[1]) * 0.008, -1.4, 1.4);    // nearly the whole sphere, never flips
        P.set(e.pointerId, [e.clientX, e.clientY]);
      } else {
        if (q) P.set(e.pointerId, [e.clientX, e.clientY]);
        const h = pick(e.clientX, e.clientY);
        if (!G.adjusting && (h.kind === 'land' || mode !== 'tool')) G.hover = h.kind === 'land' ? h : null;
        const ht = !mode && isActT(G.tool) ? thingAt(e.clientX, e.clientY) : null;
        if (ht !== G.hoverT) { G.hoverT = ht; G.cdirty = true; }
      }
      cv.style.cursor = mode === 'orbit' ? 'grabbing' : G.hoverT ? (G.tool === 'look' ? 'zoom-in' : 'pointer') : G.hover && !isActT(G.tool) ? 'crosshair' : G.hover && G.tool === 'hand' ? 'pointer' : 'grab';
      G.dirty = true;
    });
    const up = (e) => {
      P.delete(e.pointerId);
      if (mode === 'tool' && G.hover) apply(G.hover);
      if (mode === 'orbit' && G.tool === 'look' && G.looked && down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) lookAt(null);    // a click on nothing closes the card
      if (P.size === 0) { mode = null; G.charging = false; G.charge = 0; }
      G.dirty = true;
    };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', () => { if (!mode) { G.hover = null; G.hoverT = null; G.mx = -1; G.dirty = true; } });
    cv.addEventListener('dblclick', (e) => {        // as in the creature study: double-click an animal with the hand to follow it
      if (G.tool !== 'hand') return;
      const t = thingAt(e.clientX, e.clientY); if (t && isAnimal(t)) followIt(t);
    });
    cv.addEventListener('wheel', (e) => { e.preventDefault(); G.dist = clamp(G.dist * Math.exp(clamp(e.deltaY, -200, 200) * (e.ctrlKey ? 0.01 : 0.0012)), 1.75, 7); if (G.follow) G.fdist = G.dist; G.dirty = true; }, { passive: false });

    // ── the loop ──
    let subT = 0; const lastSub = { look: '', follow: '' };
    let lastT = performance.now(), worldT = 0, perfT = 0, fr = 16.7, dr = 0, sm = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
      const t0 = performance.now();
      G.year += dt * G.speed / 30;                               // 1× is a year every 30 s here
      if (G.speed > 0) { G.drift += dt * 0.012 * Math.min(G.speed, 8); G.amb -= dt * G.speed; }
      stepStats(dt);
      if (G.speed > 0) stepThings(dt);
      let hops = false; for (const t of G.things) if (t.hop > 0) { t.hop = Math.max(0, t.hop - dt); hops = true; }
      {                                          // following: the camera turns to keep its animal in front, leans in, and slides it to mid-screen
        const t = G.follow, e = Math.min(1, dt * 2.2);
        let tx = 0, tyy = 0;
        if (t) {
          let dy = Math.atan2(t.x, t.z) - G.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
          const np = G.pitch + (0.75 - G.pitch) * e, nd = G.dist + (G.fdist - G.dist) * e;
          if (Math.abs(dy) > 1e-4 || Math.abs(np - G.pitch) > 1e-4 || Math.abs(nd - G.dist) > 1e-4) { G.yaw += dy * e; G.pitch = np; G.dist = nd; G.dirty = true; }
          const cam = camera(), p = proj(cam, t.x, LAND, t.z);
          if (p) { const lim = cam.Rs * 0.85; tx = clamp(G.panX + W / 2 - p[0], -lim, lim); tyy = clamp(G.panY + H * 0.46 - p[1], -lim, lim); }
        }
        const px = G.panX + (tx - G.panX) * e, py = G.panY + (tyy - G.panY) * e;
        if (Math.abs(px - G.panX) > 0.05 || Math.abs(py - G.panY) > 0.05) { G.panX = px; G.panY = py; G.dirty = true; }
        else if (!t && (G.panX || G.panY) && Math.abs(G.panX) + Math.abs(G.panY) < 0.2) { G.panX = G.panY = 0; G.dirty = true; }
      }
      subT += dt;
      if (subT > 0.5) {                           // keep the card current, but only send when something on it changed
        subT = 0;
        for (const [m, t] of [['look', G.looked], ['follow', G.follow]]) {
          if (!t) { lastSub[m] = ''; continue; }
          const d = info(t, m), j = JSON.stringify(d);
          if (j !== lastSub[m]) { lastSub[m] = j; send('subject', d); }
        }
      }
      if (G.amb <= 0) {
        G.amb = 9 + Math.random() * 12;
        const a = AMBIENT[(Math.random() * AMBIENT.length) | 0];
        send('story', { id: 'amb.' + a[1], icon: a[0], text: a[1], kind: a[2] });
        if (a[3] && G.year > 1 && Math.random() < 0.35) send('discovery', { id: a[3], how: [a[0] + ' ' + a[1]], year: G.year });
      }
      if (G.charging && VAR[G.tool] && VAR[G.tool].controls.charge) { G.charge = Math.min(1, G.charge + dt * 0.8); G.dirty = true; }   // only strikes charge
      if (G.glint > 0) { G.glint = Math.max(0, G.glint - dt); G.dirty = true; }
      const t1 = performance.now();
      G.frameN++;
      if (G.dirty || (G.speed > 0 && G.views.clouds && G.frameN % 3 === 0)) { trace(); G.dirty = false; G.cdirty = true; }   // idle and paused: nothing is traced
      if (G.cdirty || G.speed > 0 || hops) { compose(now); G.cdirty = false; }                                            // the animals move only while time does
      const t2 = performance.now();
      fr += (dt * 1000 - fr) * 0.06; sm += (t1 - t0 - sm) * 0.06; dr += (t2 - t1 - dr) * 0.06;
      worldT += dt; perfT += dt;
      if (worldT > 0.25) { worldT = 0; send('world', { year: G.year }); }
      if (perfT > 0.5) { perfT = 0; send('perf', { frame: fr, sim: sm, draw: dr }); sendVitals(); }
    }

    const host = {
      selectTool(id, ctl) { G.tool = id; G.ctl = Object.assign({}, ctl); G.hoverT = null; if (id !== 'look' && id !== 'follow' && G.looked) lookAt(null); G.dirty = true; },
      look(id) { lookAt(id ? G.things.find((t) => t.id === id) || null : null); },       // null closes the card
      follow(id) { followIt(id ? G.things.find((t) => t.id === id) || null : null); },   // null lets go
      idle(on) { if (on) { G.hover = null; G.hoverT = null; G.mx = -1; G.dirty = true; } },     // resting: no ring left where the pointer was
      setSlice(v) { G.sliceS = -0.95 + 1.9 * v; G.dirty = true; },                       // 0 to 1: how far back the cut sits
      setControl(id, k, v) { if (id === G.tool) { G.ctl[k] = v; G.dirty = true; } },
      adjusting(on) { G.adjusting = on; G.dirty = true; },        // hold the ring still while Shift is down
      setSpeed(s) { G.speed = s; ambLevel(); },
      setView(id, on) { G.views[id] = on; G.dirty = true; },
      setVolume(v) { G.vol = { world: v, events: v }; ambLevel(); },      // one level, 0 to 1
      newWorld() {
        G.seed = (Math.random() * 1e5) | 0; G.year = 0; G.last = []; G.lastV = []; Object.assign(ST, { weather: 'clear', wT: 18, heat: 0, plants: 620, animals: 40, water: 38, kinds: 6, words: {}, kindsSeen: 0 });
        lookAt(null); followIt(null); build(G.seed); send('world', { year: 0 }); sendVitals(); send('story', { id: 'new', icon: '🫧', text: 'A new world settled in the glass', kind: 'life' });
      },
      worldLink() { return location.href.split('#')[0] + '#seed=' + G.seed; },
    };
    const demo = {
      event() { const s = SAMPLE[(Math.random() * SAMPLE.length) | 0]; send('story', { id: s[0], icon: s[1], text: s[2], kind: s[3] }); },
      burst() { const pick8 = [0, 1, 0, 3, 4, 0, 5, 1]; pick8.forEach((n, i) => setTimeout(() => { const s = SAMPLE[n]; send('story', { id: s[0], icon: s[1], text: s[2], kind: s[3] }); }, i * 140)); },
      small() {
        const found = new Set(G.ui.state.found), left = CAT.discoveries.filter((d) => d.tier === 'witnessed' && !found.has(d.id));
        if (!left.length) return;
        const d = left[(Math.random() * left.length) | 0];
        send('discovery', { id: d.id, how: ['🌋 Volcano at the hills', '🌧️ Rain at the hills'], year: G.year });
      },
      rare() {
        const found = new Set(G.ui.state.found), d = CAT.discoveries.find((x) => x.tier === 'engineered' && !found.has(x.id));
        if (d) rare(d, d.steps.filter((s) => s.tool).map((s) => s.icon + ' ' + s.name + ' at the meadow'));
      },
      unlock() { const l = G.ui.state.locked; if (l.length) send('unlock', { id: l[(Math.random() * l.length) | 0], why: 'found in the crater' }); },
    };

    G.seed = 4821; build(G.seed);
    resize(); addEventListener('resize', resize);
    return {
      host, demo, debug: G,          // for checking by script only
      connect(ui) { G.ui = ui; send('world', { year: G.year }); sendVitals(); requestAnimationFrame(frame); },
    };
  }
  return { create };
})();
</script>

<script>
'use strict';
const game = Placeholder.create(document.getElementById('world'), CATALOGUE);
const ui = BubbleUI.mount(document.body, { catalogue: CATALOGUE, host: game.host, recordName: 'Journal' });
game.connect(ui);

document.getElementById('demo').addEventListener('click', (e) => {
  const d = e.target.dataset && e.target.dataset.d; if (!d) return;
  if (d === 'toggle') { document.getElementById('demo').classList.toggle('open'); return; }
  if (d === 'reset') { Object.keys(localStorage).filter((k) => k.startsWith('bui.')).forEach((k) => localStorage.removeItem(k)); location.reload(); return; }
  game.demo[d]();
});
</script>
