<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble World · interface study</title>
<!--
  Interface study for ref/Interface.md (draft 2), second pass after Rapha's review. Three parts, kept apart:
    1. BubbleUI      the interface. Knows nothing about the world. Talks to it through host calls and ui.send(event).
    2. Placeholder   a stand-in world: a drawn bubble, fake tools, fake events, fake stats. Swap this for a real build.
    3. Harness       test buttons that fire sample events through the same contract.
  The contract is listed in README.md next to this file.
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; color: #eaf2ff; font: 14px/1.35 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: grab; }

  /* ───────── the harness (not part of the interface) ───────── */
  #demo { position: fixed; right: 64px; bottom: 8px; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font: 11px/1.2 ui-rounded, system-ui, sans-serif; }
  #demo button { all: unset; cursor: pointer; padding: 4px 9px; border-radius: 8px; color: rgba(234, 242, 255, .7); background: rgba(255, 255, 255, .06); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
  #demo button:hover { color: #fff; background: rgba(255, 255, 255, .14); }
  #demo > button { opacity: .45; } #demo > button:hover, #demo.open > button { opacity: 1; }
  #demo .set { display: none; flex-wrap: wrap; justify-content: flex-end; gap: 5px; max-width: 300px; }
  #demo.open .set { display: flex; }

  /* ───────── the interface ───────── */
  .bui { --tend: #7df0b4; --wreck: #ff8d5c; --hand: #ffe6a8; --gold: #ffd66b; --ink: #eaf2ff;
         --glass: linear-gradient(180deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .035));
         --glass-hi: linear-gradient(180deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .07));
         --glass-on: linear-gradient(180deg, rgba(255, 255, 255, .24), rgba(255, 255, 255, .11));
         --rim: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 .5px rgba(255, 255, 255, .06);
         --dim: rgba(234, 242, 255, .78);
         --blur: blur(22px) saturate(1.7);
         --b: 44px; --s: 36px; --edge: 12px;
         --rw: min(340px, calc(100vw - 2 * var(--edge) - 2 * var(--b) - 28px));
         position: fixed; inset: 0; pointer-events: none; z-index: 2; color: var(--ink); }
  .bui * { box-sizing: border-box; }
  .bui-panel { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim), 0 8px 24px rgba(0, 0, 0, .2); }
  .bui-btn { all: unset; box-sizing: border-box; pointer-events: auto; position: relative; flex: none; width: var(--b); height: var(--b); border-radius: 13px; display: grid; place-items: center; cursor: pointer;
             background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim);
             color: var(--ink); line-height: 1; opacity: .66; transition: opacity .15s, transform .14s cubic-bezier(.3, 1.6, .5, 1); }
  .bui-btn:hover, .bui-btn:focus-visible { opacity: 1; transform: scale(1.07); background: var(--glass-hi); }
  .bui-btn:active { transform: scale(.92); }
  .bui-btn.small { width: var(--s); height: var(--s); border-radius: 11px; }
  .bui-btn svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .bui-btn.small svg { width: 19px; height: 19px; }
  .bui-btn .em { font-size: 22px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .35)); }
  .bui-btn kbd { position: absolute; right: 5px; bottom: 3px; font: 9px ui-monospace, monospace; opacity: .3; }
  .bui-btn.on, .bui-btn.on:hover { opacity: 1; background: var(--glass-on); }      /* chosen: a lighter pane of glass, nothing louder */
  .bui-btn.armed { opacity: 1; background: linear-gradient(180deg, rgba(255, 141, 92, .3), rgba(255, 141, 92, .1)); }
  .bui-btn.off { color: rgba(234, 242, 255, .45); }
  .bui-btn.locked { cursor: default; background: rgba(255, 255, 255, .03); }
  .bui-btn.locked .em { filter: grayscale(1) brightness(.3); }
  .bui-btn.planned .em { filter: grayscale(1); opacity: .42; }      /* on the design sheets, not built yet: grey, but readable */
  .bui-btn.planned { background: rgba(255, 255, 255, .03); }
  .bui-btn.shake { animation: bui-shake .3s; }
  .bui-badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: rgba(255, 255, 255, .92); color: #0b1020; font: 700 10px/16px system-ui, sans-serif; text-align: center; display: none; }
  .bui-badge.show { display: block; }
  .bui-dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 6px var(--gold); display: none; }
  .bui-dot.show { display: block; }
  .bui-more { position: absolute; right: 4px; bottom: 4px; display: flex; gap: 1.5px; }
  .bui-more b { width: 2.5px; height: 2.5px; border-radius: 50%; background: currentColor; opacity: .6; }
  @keyframes bui-shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  /* top left: the clock — a pie for the year, the year, pause and speed — then clouds and sound. No panel until hovered:
     then one pane of glass takes in the line and the four vital signs below it, and the two toggles slide in. */
  .bui-top { position: fixed; left: var(--edge); top: var(--edge); pointer-events: auto; border-radius: 14px; transition: background .2s, box-shadow .2s; }
  .bui-top.hot { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim), 0 8px 24px rgba(0, 0, 0, .2); }
  .bui-top .row { position: relative; z-index: 2; display: flex; align-items: center; gap: 3px; height: var(--s); padding: 0 4px 0 9px; }
  .bui-top .dial { width: 22px; height: 22px; flex: none; display: grid; }
  .bui-top .dial svg { width: 22px; height: 22px; }
  .bui-top .dial .bgd { fill: rgba(255, 255, 255, .1); }
  .bui-top .dial .pie { fill: rgba(140, 200, 255, .78); }      /* light blue: a little colour as the year fills */
  .bui-top .yr { margin: 0 3px 0 5px; font-weight: 400; letter-spacing: .02em; font-variant-numeric: tabular-nums; min-width: 9ch; white-space: nowrap; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
  .bui-top .sp { all: unset; box-sizing: border-box; cursor: pointer; height: 26px; min-width: 26px; padding: 0 5px; border-radius: 8px; display: grid; place-items: center; font: 600 12px/1 ui-rounded, system-ui, sans-serif; font-variant-numeric: tabular-nums; opacity: .7; transition: opacity .15s, background .15s; text-shadow: 0 1px 8px rgba(0, 0, 0, .6); }
  .bui-top .sp:hover { opacity: 1; background: rgba(255, 255, 255, .1); }
  .bui-top .sp.on { opacity: 1; background: rgba(255, 255, 255, .16); }
  .bui-top .sp.rt { min-width: 34px; }
  .bui-top .sp svg { width: 14px; height: 14px; fill: currentColor; stroke: none; }
  .bui-top .togs { position: relative; display: flex; align-items: center; gap: 2px; opacity: 0; transform: translateX(-6px); transition: opacity .18s, transform .18s; pointer-events: none; }
  .bui-top.hot .togs { opacity: 1; transform: none; pointer-events: auto; }
  .bui-top .ic { all: unset; box-sizing: border-box; cursor: pointer; flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; opacity: .6; transition: opacity .15s, background .15s; }
  .bui-top .ic:hover, .bui-top .ic.on { opacity: 1; background: rgba(255, 255, 255, .1); }
  .bui-top .ic.off { opacity: .45; }
  .bui-top .ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* a slim strip with a slider and no words: the slice's depth uses it */
  .bui-vslide { position: absolute; z-index: 5; right: 0; top: calc(100% + 6px); width: 28px; height: 112px; padding: 12px 0; border-radius: 0 0 12px 12px; display: none; justify-content: center; cursor: pointer; touch-action: none;
                background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim); transform-origin: top center; }
  .bui-vslide.show { display: flex; animation: bui-vgrow .2s ease-out; }
  @keyframes bui-vgrow { from { transform: scaleY(.2); opacity: 0; } }
  .bui-vslide .trk { position: relative; width: 4px; height: 100%; border-radius: 2px; background: rgba(255, 255, 255, .14); }
  .bui-vslide .f { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 2px; background: rgba(255, 255, 255, .7); }
  .bui-vslide .k { position: absolute; left: 50%; width: 12px; height: 12px; margin: 0 0 -6px -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); }
  .bui-top .drop { padding: 3px 12px 9px 11px; display: none; width: max-content; }
  .bui-top.hot .drop { display: block; animation: bui-in .18s ease-out; }
  /* a vital sign: its icon, a coloured bar that reads as a reading (no knob), and its word. Water and Warmth mark their middle */
  .bui-vit { display: grid; grid-template-columns: 18px 70px auto; align-items: center; gap: 8px; height: 22px; font-size: 12.5px; white-space: nowrap; cursor: default; }
  .bui-vit .em { font-size: 13px; text-align: center; }
  .bui-vit .w { opacity: .85; }
  .bui-vit .bar { position: relative; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .09); overflow: hidden; }
  .bui-vit .bar .f { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c); opacity: .85; transition: width .8s ease; }
  .bui-vit .bar.mid::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(10, 16, 36, .5); }
  .bui-vit.flash .w { animation: bui-flash 1.6s ease; }
  @keyframes bui-flash { 0% { opacity: .2; } 25% { opacity: 1; } 45% { opacity: .55; } 100% { opacity: .85; } }
  /* a vital that changes its word shows under the clock for a few seconds, then goes */

  /* top right: the journal button, faint until wanted. The journal opens in place over it. */
  .bui-col .bui-btn.rec { margin-bottom: 3px; }        /* the journal: small, at the top of the Tend column, set a little apart */
  .bui-col .bui-btn.rec.new { opacity: 1; }

  /* the two tool columns; side padding so a growing button and its glow are never clipped */
  .bui-col { position: fixed; top: calc(var(--sb, 48px) + var(--s) + 16px); bottom: 60px; transition: left .25s cubic-bezier(.3, 1.1, .5, 1); display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; padding: 10px 16px; }
  .bui-col::-webkit-scrollbar { display: none; }
  .bui-col.tend { left: calc(var(--edge) - 16px); }
  .bui-col.more-below { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }
  .bui-col.more-above { -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to top, #000 calc(100% - 36px), transparent); }
  .bui-col.more-above.more-below { -webkit-mask-image: linear-gradient(to bottom, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
  .bui-col.wreck { right: calc(var(--edge) - 16px); }
  .bui-colin { margin: auto 0; display: flex; flex-direction: column; gap: 7px; align-items: center; }
  /* bottom centre: actions on what is already in the world, not on either side. For now only the hand */
  .bui-bottom { position: fixed; left: 50%; bottom: var(--edge); transform: translateX(-50%); display: flex; gap: 7px; align-items: center; }
  .bui-bottom .bui-vsep { width: 1px; height: 22px; background: rgba(255, 255, 255, .1); margin: 0 2px; }
  .bui-bottom .wrap { position: relative; }
  .bui-bottom .bui-btn.live::after { content: ''; position: absolute; bottom: 5px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #fff; }   /* following someone */
  /* the slice's depth: the volume strip again, growing up from its button */
  .bui-bottom .bui-vslide { top: auto; bottom: calc(100% + 6px); right: auto; left: 50%; margin-left: -14px; border-radius: 12px 12px 0 0; transform-origin: bottom center; }
  /* what you looked at, or who you follow: a small card above the bar. It never covers the middle */
  .bui-card { position: fixed; left: 50%; bottom: calc(var(--edge) + var(--b) + 10px); transform: translateX(-50%); width: min(330px, calc(100vw - 2 * var(--edge) - 2 * var(--b) - 40px));
              border-radius: 16px; padding: 9px 8px 9px 12px; display: none; gap: 10px; align-items: center; pointer-events: auto; }
  .bui-card.show { display: flex; animation: bui-in .2s ease-out; }
  .bui-card .em { font-size: 30px; line-height: 1; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .35)); }
  .bui-card .tx { flex: 1; min-width: 0; line-height: 1.25; }
  .bui-card .hd { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .5; }
  .bui-card .nm { font-size: 14px; font-weight: 600; margin-top: 1px; }
  .bui-card .nm i { font-style: normal; font-weight: 400; opacity: .7; }
  .bui-card .ln { font-size: 12px; opacity: .78; margin-top: 2px; }
  .bui-card .mt { font-size: 11px; opacity: .5; margin-top: 3px; }
  .bui-card .ac { display: flex; flex-direction: column; gap: 5px; align-self: flex-start; }
  .bui-card .ac .bui-btn { width: 28px; height: 28px; border-radius: 9px; }
  .bui-card .ac .bui-btn svg { width: 16px; height: 16px; }
  .bui-sep { width: 20px; height: 1px; background: rgba(255, 255, 255, .1); margin: 1px 0; }
  .bui-foldbar { all: unset; pointer-events: auto; cursor: pointer; width: var(--b); height: 14px; border-radius: 7px; display: grid; place-items: center; opacity: .3; transition: opacity .15s; }
  .bui-foldbar:hover { opacity: .9; background: rgba(255, 255, 255, .08); }
  .bui-foldbar svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transform: rotate(-90deg); }
  .bui-col.folded .fam, .bui-col.folded .bui-foldbar, .bui-col.folded .bui-sep { display: none; }
  .bui-col .unfold { display: none; }
  .bui-col.folded .unfold { display: grid; }
  .bui-col .unfold .chev { position: absolute; bottom: 1px; left: 50%; transform: translateX(-50%) rotate(90deg); width: 10px; height: 10px; opacity: .55; stroke-width: 2.6; }

  /* the variants slide out toward the middle */
  /* a family's variants: a small panel beside its column, two buttons wide, with the family's name on top
     and the tool in hand under it. It grows down, never across the screen. */
  .bui-fly { --vb: calc(var(--b) - 6px); position: fixed; z-index: 3; pointer-events: auto; display: none; flex-direction: column; gap: 7px; padding: 8px 7px 7px; border-radius: 16px;
             width: calc(2 * var(--vb) + 5px + 14px); }
  .bui-fly.open { display: flex; animation: bui-slide-r .18s ease-out; }
  .bui-fly.wreck.open { animation-name: bui-slide-l; }
  .bui-fly .hd { padding: 0 3px; line-height: 1.2; }
  .bui-fly .hd .fn { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bui-fly .hd .vn { font-size: 12.5px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bui-fly .hd .st { font-size: 11px; opacity: .6; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bui-fly .grid { display: grid; grid-template-columns: repeat(2, var(--vb)); gap: 5px; max-height: calc(100vh - 120px); overflow-y: auto; scrollbar-width: none; }
  .bui-fly .grid::-webkit-scrollbar { display: none; }
  .bui-fly .bui-btn { opacity: .85; width: var(--vb); height: var(--vb); border-radius: 11px; box-shadow: var(--rim); }
  .bui-fly .bui-btn .em { font-size: 19px; }
  .bui-fly .bui-btn:hover { transform: scale(1.05); }

  /* tool settings: three dots on the button show the band; a ring beside it while you drag */
  .bui-dots { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 3px; pointer-events: none; }
  .bui-dots b { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, .22); }
  .bui-dots b.f { background: rgba(255, 255, 255, .85); }
  .bui-btn.banded .em { transform: translateY(-3px); }
  .bui-btn.banded kbd { display: none; }
  .bui-prev { position: fixed; z-index: 5; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .85); pointer-events: none; opacity: 0; transition: opacity .15s; transform: translate(-50%, -50%); }
  .bui-prev.show { opacity: 1; }
  @keyframes bui-slide-r { from { opacity: 0; transform: translateX(-10px); } }
  @keyframes bui-slide-l { from { opacity: 0; transform: translateX(10px); } }

  /* the live feed: top right, under the journal button; the newest line on top, older ones fading below */
  .bui-tr { position: fixed; top: var(--edge); right: var(--edge); width: min(330px, calc(100vw - var(--rowR, 260px) - var(--edge) - 20px));     /* level with the clock, never reaching it */ display: flex; flex-direction: column; align-items: flex-end; transition: opacity .25s; }
  .bui-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 17px; }
  .bui-steps .t { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: rgba(255, 255, 255, .1); font-size: 16px; }
  .bui-steps .t { box-shadow: var(--rim); }
  .bui-steps .a { font-size: 17px; padding: 0 2px; }
  .bui-steps .ar { opacity: .35; font-size: 11px; }
  .bui-steps .sil { width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, .09); }
  .bui-steps .sil.t { border-radius: 7px; background: rgba(255, 255, 255, .16); }
  /* the feed: plain text, newest on top. A new line opens a row at the top, so the rest glide down together;
     each line then fades slowly with age. Lines only ever leave from the bottom, so nothing above them moves */
  .bui-feed { pointer-events: auto; position: relative; width: 100%; }
  .bui-list { display: flex; flex-direction: column; align-items: flex-end; }
  .bui-line { cursor: pointer; display: flex; gap: 6px; align-items: baseline; justify-content: flex-end; max-width: 100%; height: 22px; padding: 2px 1px; overflow: hidden;
              font-size: 13px; line-height: 18px; color: var(--ink); text-shadow: 0 1px 3px rgba(0, 0, 0, .6), 0 0 12px rgba(0, 0, 0, .4);
              transition: opacity .7s ease, height .6s cubic-bezier(.2, .8, .3, 1); }
  .bui-list .bui-line.new { height: 0; }
  .bui-list .bui-line.gone { opacity: 0 !important; transition: opacity .25s ease; }      /* pushed past the room it has: out quickly, from the bottom */
  .bui-line .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bui-line .n, .bui-le .n { font-size: 11px; opacity: .55; font-variant-numeric: tabular-nums; }
  .bui-line.disc .t, .bui-le.disc .t { font-weight: 600; color: var(--ink); }
  .bui-line .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .55; flex: none; }
  /* looking back: the same lines, reaching further down the screen; no panel */
  .bui-hist { display: none; flex-direction: column; align-items: flex-end; overflow-y: auto; scrollbar-width: none; }
  .bui-hist::-webkit-scrollbar { display: none; }
  .bui-hist .bui-line { flex: none; opacity: .85; }
  .bui-hist .bui-line.minor { opacity: .5; }
  .bui-hist.capped { -webkit-mask-image: linear-gradient(to top, transparent 0, #000 36px); mask-image: linear-gradient(to top, transparent 0, #000 36px); }
  .bui-feed.hist .bui-list { display: none; }
  .bui-feed.hist .bui-hist { display: flex; }
  @keyframes bui-rise { from { opacity: 0; transform: translateY(-8px); } }
  @keyframes bui-fade { from { opacity: 0; } }
  @keyframes bui-in { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes bui-pop { from { opacity: 0; transform: translateY(-12px) scale(.85); } }

  /* bottom edge: frame time */
  .bui-perf { position: fixed; left: var(--edge); bottom: 4px;      /* bottom left: the centre is the hand's */ font: 10.5px ui-monospace, monospace; opacity: .35; white-space: nowrap; }
  .bui-perf b { color: #fff; font-weight: 600; }
  .bui-perf.hide { display: none; }

  /* resting: after a while with no input everything fades and only the world is left. Any move brings it back at once */
  .bui { transition: opacity .2s ease; }
  .bui.idle { opacity: 0; transition: opacity 1.4s ease; }
  .bui.idle * { pointer-events: none !important; }
  html.bui-idle #demo { opacity: 0; pointer-events: none; transition: opacity 1.4s ease; }
  html.bui-idle canvas { cursor: none !important; }

  /* the journal: the story and the discoveries in one panel on the right */
  /* it opens in place over its own button: the close button lands exactly where the journal button was */
  .bui-rec { position: fixed; z-index: 4; left: var(--edge); top: var(--edge); bottom: var(--edge); width: var(--rw); border-radius: 16px; padding: 0 0 12px; display: flex; flex-direction: column; pointer-events: none;
             opacity: 0; transform: scale(.97); transform-origin: left center; transition: opacity .2s ease, transform .25s cubic-bezier(.3, 1.2, .5, 1); }
  .bui-rec.open { opacity: 1; transform: none; pointer-events: auto; }
  .bui-rec.bui-panel { background: rgba(13, 17, 33, .96); -webkit-backdrop-filter: none; backdrop-filter: none; }     /* for reading: nearly solid */
  .bui-rec .hd { display: flex; align-items: center; gap: 6px; height: var(--s); margin-bottom: 6px; padding-left: 5px; }
  .bui-tabs { flex: 1; min-width: 0; display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(0, 0, 0, .16); }
  .bui-tabs button { all: unset; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-align: center; padding: 5px 8px; border-radius: 9px; font-size: 12.5px; font-weight: 600; opacity: .6; transition: background .15s, opacity .15s; }
  .bui-tabs button:hover { opacity: .9; }
  .bui-tabs button.on { opacity: 1; background: rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15); }
  .bui-tabs .c { font: 10.5px ui-monospace, monospace; opacity: .6; margin-left: 3px; }
  .bui-rec .body { flex: 1; overflow-y: auto; scrollbar-width: thin; -webkit-user-select: text; user-select: text; padding: 0 12px; }
  .bui-rec h3 { margin: 12px 0 7px; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; opacity: .55; font-weight: 700; }
  .bui-rec h3:first-child { margin-top: 4px; }
  .bui-le { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 10px; font-size: 12.5px; color: var(--dim); animation: bui-fade .3s ease-out; }
  .bui-le .t { flex: 1; } .bui-le .yr { font: 10.5px ui-monospace, monospace; opacity: .4; }
  .bui-le.minor { opacity: .5; }
  .bui-le.disc { background: rgba(255, 255, 255, .06); cursor: pointer; } .bui-le.disc:hover { background: rgba(255, 255, 255, .12); }
  .bui-hist .bui-le { cursor: pointer; } .bui-hist .bui-le:hover { background: rgba(255, 255, 255, .08); }
  .bui-empty { opacity: .45; font-size: 12.5px; padding: 8px; }
  .bui-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 5px; }
  .bui-chip { all: unset; position: relative; aspect-ratio: 1; border-radius: 11px; display: grid; place-items: center; font-size: 19px; background: rgba(255, 255, 255, .04); cursor: default; }
  .bui-chip.found { background: rgba(255, 255, 255, .11); cursor: pointer; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
  .bui-chip.found:hover, .bui-chip.sel { background: rgba(255, 255, 255, .22); }
  .bui-chip.fresh::after, .bui-er.fresh::after { content: ""; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .9); }
  .bui-detail { margin-top: 8px; padding: 8px 10px; border-radius: 11px; background: rgba(255, 255, 255, .07); font-size: 12.5px; display: none; }
  .bui-detail.show { display: block; }
  .bui-detail .nm, .bui-er .nm { font-weight: 700; font-size: 13.5px; }
  .bui-detail .how, .bui-er .how { opacity: .78; margin-top: 2px; font-size: 12px; }
  .bui-er { position: relative; padding: 8px 10px; border-radius: 12px; background: rgba(255, 255, 255, .045); margin-bottom: 6px; }
  .bui-er.found { background: rgba(255, 255, 255, .08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); }
  .bui-er.found .nm { margin-top: 5px; }
  .bui-er .len { font-size: 11px; opacity: .45; margin-top: 4px; }
  .bui-forget { all: unset; cursor: pointer; font-size: 11px; opacity: .4; margin-top: 10px; display: inline-block; }
  .bui-forget:hover { opacity: .9; text-decoration: underline; }

  /* a name, shown briefly */
  .bui-name { position: fixed; z-index: 6; padding: 3px 9px; border-radius: 9px; background: rgba(20, 26, 48, .7); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim); font-size: 12px; font-weight: 600; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; }
  .bui-name.show { opacity: 1; }

  @media (max-width: 640px) {
    .bui { --b: 40px; --s: 34px; --edge: 8px; }
    .bui-btn kbd { display: none; }
    .bui-line { font-size: 12px; }
    #demo { right: 54px; }
    .bui-top.hot ~ .bui-tr { opacity: 0; pointer-events: none; }       /* too narrow for both: the vitals step in front of the feed */
  }
  @media (max-height: 560px) {
    .bui { --b: 36px; --s: 32px; }
    .bui-btn .em { font-size: 18px; }
    .bui-btn kbd { display: none; }
    .bui-col { bottom: 50px; }
  }
</style>
</head>
<body>
<canvas id="world" tabindex="0"></canvas>
<div id="demo">
  <div class="set">
    <button data-d="event" title="One sample named event">event</button>
    <button data-d="burst" title="Eight events in a row, with repeats">burst ×8</button>
    <button data-d="small" title="A witnessed discovery">small find</button>
    <button data-d="rare" title="An engineered discovery">rare find</button>
    <button data-d="unlock" title="Unlock a tool variant">unlock</button>
    <button data-d="reset" title="Forget everything this page stored">reset</button>
</span>
  </div>
  <button data-d="toggle" title="Test buttons standing in for a game. Not part of the interface.">🧪 test</button>
</div>

<!-- ═════════════════════════ 1. THE INTERFACE ═════════════════════════ -->
<script>
'use strict';
const BubbleUI = (function () {
  const SV = (p) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + p + '</svg>';
  const ICON = {
    hand: SV('<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5"/><path d="M14 10.5V5.5a1.5 1.5 0 0 1 3 0V13"/><path d="M17 11a1.5 1.5 0 0 1 3 0v3a7 7 0 0 1-7 7h-1a6 6 0 0 1-4.8-2.4L4.3 15a1.5 1.5 0 0 1 2.3-1.9L8 14.5"/>'),
    look: SV('<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M10.5 8v.1M10.5 10.5v2.5"/>'),
    follow: SV('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>'),
    slice: SV('<path d="M12 3.5a8.5 8.5 0 0 0 0 17"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17" stroke-dasharray="1.6 2.6"/><path d="M12 1.5v21"/><path d="M5 14.5h7M6 17.5h6" opacity=".55"/>'),
    record: SV('<path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v12H8.5A3.5 3.5 0 0 1 5 16.5Z"/><path d="M5 16.5A3.5 3.5 0 0 1 8.5 13H19"/><path d="M9.5 8.5h5"/>'),
    sound: (lv) => SV('<path d="M3.5 9.5h3.5L11.5 5.5v13L7 14.5H3.5Z"/>' + (lv === 0 ? '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>' : '<path d="M15 9a4 4 0 0 1 0 6"/>' + (lv > 1 ? '<path d="M17.8 6.3a7.5 7.5 0 0 1 0 11.4"/>' : ''))),
    view: SV('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>'),
    fresh: SV('<circle cx="10.5" cy="13.5" r="7"/><path d="M4.5 12c3 1.6 8.5 1.6 12-.8"/><path d="M19 2.5v5M16.5 5h5"/>'),
    help: SV('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .9-1 1.6v.4"/><path d="M12 17.2v.1"/>'),
    pause: SV('<path d="M9 5.5v13M15 5.5v13"/>'),
    close: SV('<path d="M6 6l12 12M18 6 6 18"/>'),
    dots: SV('<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>'),
    chev: SV('<path d="M9 6l6 6-6 6"/>'),
    cloud: SV('<path d="M7 18h10.5a4 4 0 0 0 .4-8A6 6 0 0 0 6.4 11 3.5 3.5 0 0 0 7 18Z"/>'),
    nocloud: SV('<path d="M7 18h10.5a4 4 0 0 0 .4-8A6 6 0 0 0 6.4 11 3.5 3.5 0 0 0 7 18Z" opacity=".5"/><path d="M4 4l16 16"/>'),
    pauseF: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a.8.8 0 0 0 1.2.7l10.6-6.8a.8.8 0 0 0 0-1.4L9.2 4.5A.8.8 0 0 0 8 5.2Z"/></svg>',
    more: '<i class="bui-more"><b></b><b></b><b></b></i>',
  };
  const FAMKEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];
  const LOGMAX = 80;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bui.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bui.' + k, JSON.stringify(v)); } catch (e) { /* private window */ } },
  };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function mount(root, cfg) {
    const C = cfg.catalogue, host = cfg.host || {};
    const RECORD = cfg.recordName || 'Journal';
    const call = (name, ...a) => (typeof host[name] === 'function' ? host[name](...a) : undefined);
    const H = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

    // ── data ──
    const famById = {}, varById = {}, fams = { tend: [], wreck: [] };
    const S = {
      tool: 'hand', last: {}, sideLast: { tend: null, wreck: null },
      folded: store.get('folded', { tend: false, wreck: false }), lastOpened: 'tend',
      sound: { mute: !!store.get('vol', {}).mute, vol: 0.8 },        // one fixed level: the speaker only mutes
      views: store.get('views', {}),
      speed: 1, lastSpeed: 1, year: 0,
      found: store.get('found', {}), unseen: 0, log: [], tab: 'story',
      fly: null, recOpen: false, slice: { on: false, depth: 0.5 }, card: { look: null, follow: null }, beforeFollow: 'hand', perfOn: store.get('perf', true),
      locked: new Set(store.get('locked2', null) || []), newVar: {},
      ctl: store.get('ctl2', {}),
    };
    C.families.forEach((f) => {
      famById[f.id] = f; fams[f.side].push(f);
      f.variants.forEach((v) => { varById[v.id] = Object.assign({}, v, { family: f }); });
      S.last[f.id] = (f.variants.find((v) => v.lead) || f.variants[0]).id;
    });
    if (!store.get('locked2', null)) C.families.forEach((f) => f.variants.forEach((v) => { if (v.locked) S.locked.add(v.id); }));
    [...fams.tend, ...fams.wreck].forEach((f, i) => { f.key = f.key || FAMKEYS[i]; });
    C.views.forEach((v) => { if (!(v.id in S.views)) S.views[v.id] = v.on !== false; });
    const VITALS = C.vitals || [];
    const SEASONS = C.seasons || ['Spring', 'Summer', 'Autumn', 'Winter'];
    const discById = {}; C.discoveries.forEach((d) => { discById[d.id] = d; });
    const witnessed = C.discoveries.filter((d) => d.tier === 'witnessed');
    const engineered = C.discoveries.filter((d) => d.tier === 'engineered');
    const ACTS = { hand: 'Hand', look: 'Look', follow: 'Follow' };       // the bottom bar's tools: they act on what is already in the world
    const isAct = (id) => id in ACTS;
    const famOf = (id) => (isAct(id) ? null : varById[id].family);

    // ── root ──
    const ui = H('div', 'bui'); root.appendChild(ui);
    const label = H('div', 'bui-name'); ui.appendChild(label);

    // ── names: hover after a pause, gone in 1.5 s; a flash when chosen ──
    let hoverT = 0, hideT = 0, labelMode = '';
    function placeLabel(target) {
      const r = target.getBoundingClientRect(), W = innerWidth;
      label.style.left = '0px'; label.style.top = '0px';
      const lw = label.offsetWidth, lh = label.offsetHeight;
      let x, y;
      if (target.closest('.bui-fly')) {                     // outside the panel, level with the variant, never over another one
        const fr = target.closest('.bui-fly').getBoundingClientRect(), tend = target.closest('.bui-fly').classList.contains('tend');
        x = tend ? fr.right + 8 : fr.left - 8 - lw; y = r.top + r.height / 2 - lh / 2;
      }
      else if (target.closest('.bui-vit')) { x = r.right + 12; y = r.top + r.height / 2 - lh / 2; }       // beside the row, never over the next one
      else if (target.closest('.bui-top')) { x = r.left + r.width / 2 - lw / 2; y = r.bottom + 6; }
      else if (target.closest('.bui-bottom') || target.closest('.bui-card')) { x = r.left + r.width / 2 - lw / 2; y = r.top - 6 - lh; }       // above it
      else if (target.closest('.bui-rec')) { x = r.left + r.width / 2 - lw / 2; y = r.bottom + 6; }
      else if (r.left + r.width / 2 < W / 2) { x = r.right + 16; y = r.top + r.height / 2 - lh / 2; }
      else { x = r.left - 16 - lw; y = r.top + r.height / 2 - lh / 2; }
      label.style.left = Math.max(4, Math.min(W - lw - 4, x)) + 'px';
      label.style.top = Math.max(4, y) + 'px';
    }
    function showName(target, text, ms, mode) {
      if (!text) return;
      label.textContent = text; labelMode = mode || 'flash';
      placeLabel(target); label.classList.add('show');
      clearTimeout(hideT); hideT = setTimeout(() => label.classList.remove('show'), ms);
    }
    function showNameAt(text, x, y, leftOf, ms) {
      if (!text) return;
      label.textContent = text; labelMode = 'flash';
      label.style.left = '0px'; label.style.top = '0px';
      const lw = label.offsetWidth, lh = label.offsetHeight;
      label.style.left = Math.max(4, Math.min(innerWidth - lw - 4, leftOf ? x - lw : x)) + 'px';
      label.style.top = Math.max(4, y - lh / 2) + 'px';
      label.classList.add('show');
      clearTimeout(hideT); hideT = setTimeout(() => label.classList.remove('show'), ms || 1000);
    }
    function hideHover() { clearTimeout(hoverT); if (labelMode === 'hover') label.classList.remove('show'); }
    function mkBtn(cls, html, name) {
      const b = H('button', 'bui-btn ' + cls, html);
      b.addEventListener('mousedown', (e) => e.preventDefault());           // keep focus off, so Space never clicks a button
      b.addEventListener('pointerenter', (e) => {
        if (e.pointerType === 'touch') return;
        clearTimeout(hoverT);
        hoverT = setTimeout(() => showName(b, typeof name === 'function' ? name() : name, 1500, 'hover'), 450);
      });
      b.addEventListener('pointerleave', hideHover);
      b.addEventListener('pointerdown', () => clearTimeout(hoverT));
      return b;
    }

    // ── interface sounds (the interface owns this channel) ──
    let AC = null;
    function sfx(kind) {
      const lv = S.sound.mute ? 0 : S.sound.vol;
      if (!lv) return;
      try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { return; }
      const t = AC.currentTime;
      const N = { click: [[880, 0, 0.05, 0.03]], pick: [[660, 0, 0.08, 0.035], [990, 0.03, 0.09, 0.025]],
        chime: [[784, 0, 0.35, 0.05], [1175, 0.08, 0.45, 0.045]],
        rare: [[523, 0, 0.6, 0.06], [659, 0.1, 0.6, 0.06], [784, 0.2, 0.7, 0.06], [1047, 0.32, 0.9, 0.06], [1568, 0.46, 1.2, 0.045]],
        nope: [[220, 0, 0.12, 0.04]] }[kind] || [];
      for (const [f, d, len, g] of N) {
        const o = AC.createOscillator(), a = AC.createGain();
        o.type = kind === 'click' ? 'sine' : 'triangle'; o.frequency.value = f;
        a.gain.setValueAtTime(0, t + d); a.gain.linearRampToValueAtTime(g * lv, t + d + 0.01); a.gain.exponentialRampToValueAtTime(0.0001, t + d + len);
        o.connect(a).connect(AC.destination); o.start(t + d); o.stop(t + d + len + 0.05);
      }
    }

    // a name on hover, for things that are not tool buttons
    function hoverName(el, name) {
      el.addEventListener('mousedown', (e) => e.preventDefault());
      el.addEventListener('pointerenter', (e) => {
        if (e.pointerType === 'touch') return;
        clearTimeout(hoverT); hoverT = setTimeout(() => showName(el, typeof name === 'function' ? name() : name, 1500, 'hover'), 350);
      });
      el.addEventListener('pointerleave', hideHover);
      el.addEventListener('pointerdown', () => clearTimeout(hoverT));
    }

    // ═══ top left: the clock, then clouds and sound; hovering shows the four vital signs ═══
    const top = H('div', 'bui-top'), row = H('div', 'row'), drop = H('div', 'drop');
    top.append(row, drop); ui.append(top);
    const dial = H('span', 'dial', '<svg viewBox="0 0 24 24" aria-hidden="true"><circle class="bgd" cx="12" cy="12" r="9.5"/><path class="pie"/></svg>');
    const pie = dial.querySelector('.pie'), yearEl = H('span', 'yr', 'Time 0000');
    const bRate = H('button', 'sp rt');
    const togs = H('div', 'togs'), bCloud = H('button', 'ic'), bSound = H('button', 'ic');
    togs.append(bCloud, bSound);
    row.append(dial, yearEl, bRate, togs);
    const RATES = C.speeds.filter((s) => s > 0);

    // the clock: the year as a soft pie filling clockwise from the top, the year, and the speed. No pause button:
    // Space still pauses, and while paused the speed shows a pause mark and a click on it plays
    function renderClock() {
      const f = ((S.year % 1) + 1) % 1, a = (-90 + f * 360) * Math.PI / 180, x = 12 + 9.5 * Math.cos(a), y = 12 + 9.5 * Math.sin(a);
      pie.setAttribute('d', f < 0.003 ? '' : 'M12 12 L12 2.5 A9.5 9.5 0 ' + (f > 0.5 ? 1 : 0) + ' 1 ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' Z');
      const t = 'Time ' + String(Math.max(0, Math.floor(S.year))).padStart(4, '0'); if (yearEl.textContent !== t) yearEl.textContent = t;     // four digits, so it reads as counting up
      if (S.speed === 0) bRate.innerHTML = ICON.pauseF; else bRate.textContent = S.lastSpeed + '×';
      bRate.classList.toggle('on', S.speed === 0);
    }
    function setSpeed(s, fromGame) {
      if (s > 0) S.lastSpeed = s;
      S.speed = s; renderClock();
      if (!fromGame) call('setSpeed', s);
    }
    const stepRate = (dir) => { const i = RATES.indexOf(S.lastSpeed); setSpeed(RATES[Math.max(0, Math.min(RATES.length - 1, (i < 0 ? 0 : i) + dir))]); };
    bRate.addEventListener('click', (e) => { e.stopPropagation(); if (S.speed === 0) { setSpeed(S.lastSpeed); sfx('click'); return; } const i = RATES.indexOf(S.lastSpeed); setSpeed(RATES[(i + (e.shiftKey ? RATES.length - 1 : 1)) % RATES.length]); sfx('click'); });
    row.addEventListener('wheel', (e) => { if (togs.contains(e.target)) return; e.preventDefault(); stepRate(e.deltaY < 0 ? 1 : -1); }, { passive: false });
    hoverName(dial, () => SEASONS[Math.floor((((S.year % 1) + 1) % 1) * SEASONS.length)] + ', time ' + String(Math.max(0, Math.floor(S.year))).padStart(4, '0'));
    hoverName(bRate, () => (S.speed === 0 ? 'Paused · click to play' : 'Speed: click, or scroll on the clock'));

    // clouds: hide from view only; the world carries on
    function renderToggles() {
      const v = S.sound.mute ? 0 : S.sound.vol;
      bSound.innerHTML = ICON.sound(v === 0 ? 0 : 2); bSound.classList.toggle('off', v === 0);
      bCloud.innerHTML = S.views.clouds ? ICON.cloud : ICON.nocloud; bCloud.classList.toggle('off', !S.views.clouds);
    }
    bCloud.addEventListener('click', (e) => { e.stopPropagation(); S.views.clouds = !S.views.clouds; store.set('views', S.views); call('setView', 'clouds', S.views.clouds); renderToggles(); sfx('click'); });
    hoverName(bCloud, () => (S.views.clouds ? 'Hide the clouds' : 'Show the clouds'));

    // sound: the speaker is a mute toggle, nothing more; M does the same from anywhere
    function pushSound() { call('setVolume', S.sound.mute ? 0 : S.sound.vol); store.set('vol', S.sound); renderToggles(); }
    function toggleMute(anchor) {
      S.sound.mute = !S.sound.mute; if (!S.sound.mute && S.sound.vol < 0.05) S.sound.vol = 0.8;
      pushSound(); sfx('click'); if (anchor) showName(anchor, S.sound.mute ? 'Sound off' : 'Sound on', 1100);
    }
    bSound.addEventListener('click', (e) => { e.stopPropagation(); hideHover(); closeTransient(); toggleMute(bSound); });
    hoverName(bSound, () => (S.sound.mute ? 'Turn the sound on' : 'Mute'));

    // the row gets its glass, the toggles and the vitals while the pointer is on it (or the slider is out)
    let hotT = 0, inside = false;
    const cool = () => { if (!inside) top.classList.remove('hot'); };
    top.addEventListener('pointerenter', () => { inside = true; clearTimeout(hotT); top.classList.add('hot'); });
    top.addEventListener('pointerleave', () => { inside = false; clearTimeout(hotT); hotT = setTimeout(cool, 450); });

    // the four vital signs. The game sends each one's level (0 to 1), its word and a line of detail; the interface shows them
    const vitRows = {}, vitVals = {};
    function vitRow(v) {
      const r = H('div', 'bui-vit', '<span class="em"></span><span class="bar' + (v.middle ? ' mid' : '') + '"><span class="f"></span></span><span class="w">–</span>');
      r.querySelector('.em').textContent = v.icon; r.style.setProperty('--c', v.colour || '#cfd8e6');
      hoverName(r, () => v.name + (vitVals[v.id] && vitVals[v.id].detail ? ' · ' + vitVals[v.id].detail : ''));
      const upd = () => {
        const d = vitVals[v.id]; if (!d) return;
        r.querySelector('.f').style.width = (Math.max(0.03, Math.min(1, d.value)) * 100).toFixed(1) + '%';
        if (r.querySelector('.w').textContent !== d.word) r.querySelector('.w').textContent = d.word;
      };
      return { el: r, upd };
    }
    VITALS.forEach((v) => { vitRows[v.id] = vitRow(v); drop.appendChild(vitRows[v.id].el); });

    // ── tool settings: presets you can bend (from studies/tool-settings, card 7) ──
    // A brush has a size and, usually, a strength, each from 0 to 1. Size is cut into three named bands (the tool's own
    // names: Drizzle, Shower, Downpour); strength into light, even, heavy. Tap the tool in hand: the next band. Drag from
    // its button: sideways is size (toward the middle is bigger), up and down is strength. Hold Shift over the world: the
    // same, where you aim. A strike has no bands; it charges while held. The name always follows the band, never a number.
    const STRENGTH = ['light', 'even', 'heavy'];
    const BAND_MID = [[0.18, 0.28], [0.5, 0.5], [0.83, 0.85]];
    const band = (v) => (v < 0.34 ? 0 : v < 0.67 ? 1 : 2);
    const clamp01 = (v) => Math.max(0, Math.min(1, Math.round(v * 100) / 100));

    };
    function setCtl(id, k, v) {

      call('setControl', id, k, S.ctl[id][k]);

    function stepBand(id) {

    function paintDots() {

        const n = band(ctlOf(id).size);

      }

    // a ring beside the button while dragging, sized like the brush

    function showPrev(b, id) {
      const r = b.getBoundingClientRect(), c = ctlOf(id), d = 2 * (7 + c.size * 34), side = famOf(id).side;
      const x = side === 'tend' ? r.right + 16 + d / 2 : r.left - 16 - d / 2, y = r.top + r.height / 2;
      prev.style.width = prev.style.height = d + 'px'; prev.style.left = x + 'px'; prev.style.top = y + 'px';

    // press a family button: a tap picks it (or, on the tool in hand, steps its band); a drag fine-tunes it

    function selectTool(id, o) {

    function renderTools() {
      const fam = famOf(S.tool);
      handBtn.classList.toggle('on', S.tool === 'hand'); lookBtn.classList.toggle('on', S.tool === 'look'); followBtn.classList.toggle('on', S.tool === 'follow');

    // ═══ the live feed: top right, under the journal button. Discoveries are lines too, brighter and longer-lived ═══
    const tr = H('div', 'bui-tr'), feed = H('div', 'bui-feed'), list = H('div', 'bui-list'), hist = H('div', 'bui-hist');
    feed.append(list, hist); tr.append(feed); ui.append(tr);
    const LIFE = { disc: 18000, milestone: 12000, unlock: 12000 }, LIFE0 = 9000, MAXL = 7, ROW = 22;
    const lifeOf = (kind) => LIFE[kind] || LIFE0;
    const lines = [];                  // on screen, newest first, in the order they arrived. Nothing is ever moved
    const queue = [];                  // waiting lines, let out one at a time so a fast world never floods the feed
    let feedHover = false, histT = 0, nextAt = 0;
    feed.addEventListener('pointerenter', () => { feedHover = true; clearTimeout(histT); });
    feed.addEventListener('pointerleave', () => { feedHover = false; clearTimeout(histT); histT = setTimeout(closeHist, 600); });
    const openFromLine = (e) => { const l = e.target.closest('.bui-line'); const disc = l && l.dataset.disc; openRecord(true, disc ? 'found' : 'story', disc); };
    list.addEventListener('click', openFromLine); hist.addEventListener('click', openFromLine);
    // scrolling down on the feed looks back through the story without opening the journal:
    // the newest stays at the top while older lines slide in below and the feed grows down the screen
    let histH = 0, histBase = 28;
    const histCap = () => {          // looking back also stops above the Wreck buttons
      const c = cols.wreck, limit = Math.max(c.querySelector('.bui-colin').getBoundingClientRect().top, c.getBoundingClientRect().top + 10) - 12;
      return Math.max(ROW * 2, limit - feed.getBoundingClientRect().top);
    };
    function sizeHist() {
      hist.style.height = histH + 'px';
      hist.classList.toggle('capped', histH >= histCap() - 1 && hist.scrollTop < hist.scrollHeight - hist.clientHeight - 1);
    }
    feed.addEventListener('wheel', (e) => {
      const open = feed.classList.contains('hist');
      if (!open) { if (e.deltaY <= 0 || !S.log.some((x) => !x.minor)) return; openHist(); }
      e.preventDefault();
      const d = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY, C2 = hist.scrollHeight;
      let s = hist.scrollTop;
      if (d > 0) {                                    // back in time: the feed grows down the screen until it is full, then scrolls
        const g = Math.max(0, Math.min(d, histCap() - histH, C2 - histH));
        histH += g; s = Math.min(Math.max(0, C2 - histH), s + (d - g));
      } else {                                        // forward: scroll back to the newest, then draw back up
        const step = Math.min(-d, s); s -= step;
        if (-d > step) histH = Math.max(histBase, histH - (-d - step));
        if (histH <= histBase && s <= 0) { closeHist(); return; }
      }
      sizeHist(); hist.scrollTop = s;
    }, { passive: false });
    function lineEl(icon, text, n, kind, disc) {         // text only: no pill and no emoji
      const e = H('div', 'bui-line ' + (kind || ''), (kind === 'disc' ? '<span class="k">Discovered</span>' : '') + '<span class="t"></span><span class="n"></span>');
      e.querySelector('.t').textContent = text;

      if (disc) e.dataset.disc = disc;
      return e;
    }
    function fillHist() {
      hist.innerHTML = '';
      S.log.filter((x) => !x.minor).forEach((x) => hist.appendChild(lineEl(x.icon, x.text, x.n, x.disc ? 'disc' : x.kind, x.disc)));
    }
    function openHist() {
      fillHist();

      feed.classList.add('hist'); sizeHist();
      hist.scrollTop = 0;
    }
    function closeHist() { feed.classList.remove('hist'); histH = 0; }

    // everything goes into the journal's story, merged the same way the feed merges repeats
    function logPush(d) {
      const key = d.id || d.text, top5 = S.log.slice(0, 5).find((e) => e.key === key);
      if (top5) { top5.n++; top5.year = S.year; S.log.splice(S.log.indexOf(top5), 1); S.log.unshift(top5); }
      else { S.log.unshift({ key, icon: d.icon, text: d.text, kind: d.kind, disc: d.disc, minor: !!d.minor, n: 1, year: S.year }); if (S.log.length > LOGMAX) S.log.pop(); }
      if (S.recOpen && S.tab === 'story') renderRecord();
      if (feed.classList.contains('hist')) { const s = hist.scrollTop; fillHist(); hist.scrollTop = s > 4 ? s + 30 : 0; }
    }
    function logRow(e) {
      const r = H('div', 'bui-le' + (e.disc ? ' disc' : '') + (e.minor ? ' minor' : ''), '<span class="i"></span><span class="t"></span><span class="n"></span><span class="yr"></span>');
      r.querySelector('.i').textContent = e.icon || '•'; r.querySelector('.t').textContent = e.text;
      r.querySelector('.n').textContent = e.n > 1 ? '×' + e.n : ''; r.querySelector('.yr').textContent = 'y' + Math.floor(e.year);
      r.addEventListener('click', () => openRecord(true, e.disc ? 'found' : 'story', e.disc));
      return r;
    }
    // minor events (a poke, the player's own tool use) go to the journal only
    function addLine(d, toLog) {
      if (toLog !== false) logPush(d);
      if (d.minor) return;
      const key = d.id || d.text;
      const ex = lines.find((l) => l.key === key && l.age < l.life);
      if (ex) {                         // a repeat counts up where it is and never moves. Only the newest line is woken back up
        ex.n++; ex.el.querySelector('.n').textContent = '×' + ex.n;
        if (ex === lines[0]) ex.age = 0;
        return;
      }
      const q = queue.find((x) => x.key === key);
      if (q) { q.n++; return; }
      if (d.kind === 'disc') queue.unshift({ key, d, n: 1 }); else queue.push({ key, d, n: 1 });    // a discovery never waits behind news
      if (queue.length > 12) queue.splice(queue.findIndex((x) => x.d.kind !== 'disc'), 1);         // still in the journal
    }
    // a new line opens its row at the top (the others glide down as one) and fades in
    function pump(now) {
      if (!queue.length || now < nextAt) return;
      const { key, d, n } = queue.shift();
      const e = lineEl(d.icon, d.text, n, d.kind, d.disc);
      e.classList.add('new'); e.style.opacity = '0';
      list.prepend(e); lines.unshift({ key, el: e, n, age: 0, life: lifeOf(d.kind) });
      void e.offsetHeight; e.classList.remove('new');
      nextAt = now + (queue.length > 3 ? 350 : 700);
    }
    // a line holds, then fades over the second half of its life. It never fades ahead of an older line below it
    // (a discovery lives longer than news), so the feed always fades from the bottom up and no empty row opens.
    // Rows leave only from the bottom, where nothing sits below them, so nothing above ever moves
    function settle() {
      let older = -Infinity;
      for (let i = lines.length - 1; i >= 0; i--) { const l = lines[i]; l.rem = Math.max(l.life - l.age, older); older = l.rem; }
    }
    // the feed never reaches the Wreck buttons: it has as many rows as fit above them, and seven at most
    function feedRoom() {
      const c = cols.wreck, inner = c.querySelector('.bui-colin');
      const limit = Math.max(inner.getBoundingClientRect().top, c.getBoundingClientRect().top + 10) - 12;
      return Math.max(1, Math.min(MAXL, Math.floor((limit - list.getBoundingClientRect().top) / ROW)));
    }
    let room = MAXL;
    function styleLines() {
      lines.forEach((l, k) => {
        const tail = room >= 4 ? (k === room - 1 ? 0.35 : k === room - 2 ? 0.65 : 1) : 1;      // the last two rows fade off toward the limit
        const o = l.rem <= 0 ? 0 : Math.min(1, l.rem / (l.life * 0.5)) * (l.el.classList.contains('disc') ? 1 : 0.86) * tail;
        l.el.style.opacity = (feedHover && l.rem > 0 ? Math.max(o, 0.86) : o).toFixed(3);
      });
    }
    function trimLines() {
      room = feedRoom();
      settle();
      while (lines.length && lines[lines.length - 1].rem <= 0) lines.pop().el.remove();
      // past the room: the bottom rows go at once, quickly faded, then removed; nothing above them moves
      while (lines.length > room) {
        const l = lines.pop(); l.el.classList.add('gone'); setTimeout(() => l.el.remove(), 260);
      }
    }
    function stepsHTML(steps, silhouette) {
      return '<div class="bui-steps">' + steps.map((s, i) => {
        const ar = i ? '<span class="ar">▸</span>' : '';
        if (silhouette) return ar + '<span class="sil ' + (s.tool ? 't' : 'a') + '"></span>';
        if (s.tool) { const v = varById[s.tool]; return ar + '<span class="t ' + (v ? v.family.side : '') + '" title="' + esc(s.name) + '">' + s.icon + '</span>'; }
        return ar + '<span class="a" title="' + esc(s.name) + '">' + s.icon + '</span>';
      }).join('') + '</div>';
    }

    // one clock for the feed; it holds while the pointer rests on it
    let lastTick = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = now - lastTick; lastTick = now;
      if (!feedHover) {
        for (const l of lines) l.age += dt;
        pump(now);
      }
      trimLines(); styleLines();
    }, 100);

    // ═══ bottom edge: frame time ═══
    const perf = H('div', 'bui-perf' + (S.perfOn ? '' : ' hide')); ui.appendChild(perf);

    // ═══ the journal: the story and the discoveries, one panel on the right; the Wreck tools step aside for it ═══
    const rec = H('aside', 'bui-rec bui-panel');
    rec.innerHTML = '<div class="hd"><div class="bui-tabs"><button data-t="story">Story</button><button data-t="found">Found<span class="c"></span></button></div></div><div class="body"></div>';
    ui.appendChild(rec);
    const recBody = rec.querySelector('.body');
    rec.querySelectorAll('.bui-tabs button').forEach((b) => b.addEventListener('click', () => { S.tab = b.dataset.t; renderRecord(); sfx('click'); }));
    let selChip = null;
    const howText = (f) => (f.how && f.how.length ? f.how.map(esc).join(' <span style="opacity:.45">▸</span> ') : 'seen by chance') + (f.year != null ? ' · year ' + Math.floor(f.year) : '');
    function renderRecord() {
      const nW = witnessed.filter((d) => S.found[d.id]).length, nE = engineered.filter((d) => S.found[d.id]).length;
      rec.querySelectorAll('.bui-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === S.tab));
      rec.querySelector('.bui-tabs .c').textContent = (nW + nE) + '/' + (witnessed.length + engineered.length);
      recBody.innerHTML = '';
      if (S.tab === 'story') {
        if (!S.log.length) { recBody.appendChild(H('div', 'bui-empty', 'Nothing has happened yet. Poke something.')); return; }
        S.log.forEach((e) => recBody.appendChild(logRow(e)));
        return;
      }
      recBody.appendChild(H('h3', '', 'Witnessed · ' + nW + ' of ' + witnessed.length));
      const grid = H('div', 'bui-grid'), detail = H('div', 'bui-detail');
      witnessed.forEach((d) => {
        const f = S.found[d.id];
        const c = H('button', 'bui-chip' + (f ? ' found' : '') + (f && f.fresh ? ' fresh' : '') + (selChip === d.id ? ' sel' : ''), f ? d.icon : '');
        if (f) c.addEventListener('click', () => { selChip = selChip === d.id ? null : d.id; renderRecord(); });
        grid.appendChild(c);
      });
      recBody.append(grid, detail);
      if (selChip && S.found[selChip]) {
        const d = discById[selChip];
        detail.innerHTML = '<div class="nm">' + d.icon + ' ' + esc(d.name) + '</div><div class="how">' + howText(S.found[selChip]) + '</div>';
        detail.classList.add('show');
      }
      recBody.appendChild(H('h3', '', 'Engineered · ' + nE + ' of ' + engineered.length));
      engineered.forEach((d) => {
        const f = S.found[d.id];
        const r = H('div', 'bui-er' + (f ? ' found' : '') + (f && f.fresh ? ' fresh' : ''));
        r.innerHTML = f ? stepsHTML(d.steps) + '<div class="nm">' + d.icon + ' ' + esc(d.name) + '</div><div class="how">' + howText(f) + '</div>'
                        : stepsHTML(d.steps, true) + '<div class="len">' + Math.ceil(d.steps.length / 2) + ' steps</div>';
        recBody.appendChild(r);
      });
      const forget = H('button', 'bui-forget', 'Forget all discoveries');
      forget.addEventListener('click', () => { S.found = {}; store.set('found', S.found); selChip = null; renderRecord(); });
      recBody.appendChild(forget);
    }
    function openRecord(v, tab, focusId) {
      const o = v === undefined ? !S.recOpen : v;
      if (o !== S.recOpen) { clearTimeout(recT); recSeen = false; }
      if (o) closeTransient('rec');
      if (!o && S.recOpen) { for (const k in S.found) delete S.found[k].fresh; store.set('found', S.found); }
      if (o) S.tab = tab || (S.unseen > 0 ? 'found' : S.tab);
      S.recOpen = o; rec.classList.toggle('open', o); ui.classList.toggle('rec-open', o);
      if (o) { S.unseen = 0; if (focusId && discById[focusId] && discById[focusId].tier === 'witnessed') selChip = focusId; renderRecord(); }
      renderBadge();
    }
    function renderBadge() { const b = bRec.querySelector('.bui-badge'); b.textContent = S.unseen; b.classList.toggle('show', S.unseen > 0); bRec.classList.toggle('new', S.unseen > 0); }
    bRec.addEventListener('click', () => { openRecord(); sfx('click'); });

    // the journal opens on hover and folds away the moment the pointer leaves it. There is no close button.
    // Opened by J or a feed line, it waits until the pointer has been inside once. A press anywhere outside also folds it (and is how touch closes it).
    let recT = 0, recSeen = false;
    const inRec = (x, y) => { const r = rec.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
    bRec.addEventListener('pointerenter', (e) => {
      if (e.pointerType === 'touch' || S.recOpen) return;
      clearTimeout(recT);
      recT = setTimeout(() => { openRecord(true); recSeen = true; sfx('click'); }, 120);       // a short pause, so passing over the button does not open it
    });
    bRec.addEventListener('pointerleave', () => { if (!S.recOpen) clearTimeout(recT); });
    addEventListener('pointermove', (e) => {
      if (!S.recOpen || e.pointerType === 'touch') return;
      if (inRec(e.clientX, e.clientY)) recSeen = true;
      else if (recSeen && !e.buttons) openRecord(false);              // left it: gone. Not while a button is held, so text can be selected past the edge
    }, true);
    addEventListener('pointerup', (e) => { if (S.recOpen && recSeen && e.pointerType !== 'touch' && !inRec(e.clientX, e.clientY)) openRecord(false); }, true);   // a selection that ended outside
    document.addEventListener('pointerdown', (e) => { if (S.recOpen && !rec.contains(e.target) && !bRec.contains(e.target) && !inRec(e.clientX, e.clientY)) openRecord(false); }, true);

    // ── closing things ──
    function closeTransient(keep) {
      if (keep !== 'fly') closeFly();
    }
    document.addEventListener('pointerdown', (e) => { if (!ui.contains(e.target)) closeTransient(); }, true);

    // ═══ keys ═══
    const keyFam = {}; C.families.forEach((f) => { keyFam[f.key] = f; });
    function escape() {
      const open = S.fly || S.recOpen;
      if (S.tool !== 'hand' || open || S.card.look) {
        closeTransient(); if (S.recOpen) openRecord(false);
        if (S.card.look) call('look', null);
        if (S.tool !== 'hand') selectTool('hand');
      } else if (S.card.follow) { call('follow', null); showName(followBtn, 'Stopped following', 900); }
      else { S.folded.tend = S.folded.wreck = true; store.set('folded', S.folded); renderTools(); showName(unfoldBtns.tend, 'Folded', 900); }
    }
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || !e.key) return;
      const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const f = keyFam[e.key], k = e.key.toLowerCase();
      if (f) {
        const fam = famOf(S.tool);
        let id = S.last[f.id];
        if (fam && fam.id === f.id) {        // the same key again cycles through the unlocked variants
          const vs = f.variants.filter((v) => !S.locked.has(v.id)), i = vs.findIndex((v) => v.id === S.tool);
          id = vs[(i + 1) % vs.length].id;
        }
        if (S.folded[f.side]) setFold(f.side, false);
        selectTool(id);
        e.preventDefault();
      } else if (e.key === ' ') { e.preventDefault(); setSpeed(S.speed === 0 ? S.lastSpeed : 0); showName(bRate, S.speed === 0 ? 'Paused' : S.speed + '×', 900); sfx('click'); }
      else if (e.key === ',' || e.key === '.') { stepRate(e.key === '.' ? 1 : -1); showName(bRate, S.speed + '×', 900); sfx('click'); }
      else if ('[]{}'.includes(e.key) && !isAct(S.tool) && banded(S.tool)) {     // [ ] size, { } (shift) strength
        const k = '{}'.includes(e.key) ? 'strength' : 'size', c = ctlOf(S.tool);
        if (c[k] != null) { setCtl(S.tool, k, c[k] + ('[{'.includes(e.key) ? -0.1 : 0.1)); showName(toolAnchor(S.tool), settingText(S.tool), 1000); e.preventDefault(); }
      }
      else if (e.key === 'Escape') escape();
      else if (k === 'm') toggleMute(top.classList.contains('hot') ? bSound : bRate);
      else if (k === 'j') { openRecord(); sfx('click'); }
      else if (k === 'h') { closeTransient(); selectTool('hand'); }
      else if (k === 'l') { closeTransient(); selectTool(S.tool === 'look' ? 'hand' : 'look'); }
      else if (k === 'v') followBtn.click();
      else if (k === 'c') { setSlice(!S.slice.on); showName(sliceBtn, S.slice.on ? 'Slice' : 'Slice closed', 900); }
      else if (k === 'f') { S.perfOn = !S.perfOn; store.set('perf', S.perfOn); perf.classList.toggle('hide', !S.perfOn); }
    });
    addEventListener('keyup', (e) => { if (e.key === ' ') e.preventDefault(); });
    // hold Shift over the world and move: sideways is size, up and down is strength, right where you aim.
    // The game is told (adjusting) so it can hold its ring still instead of following the pointer.
    let px = -1, py = -1, sh = null;
    addEventListener('pointermove', (e) => {
      px = e.clientX; py = e.clientY;
      if (!sh) return;
      setCtl(sh.id, 'size', sh.c.size + (px - sh.x) / 130);
      if (sh.c.strength != null) setCtl(sh.id, 'strength', sh.c.strength - (py - sh.y) / 130);
      showNameAt(settingText(sh.id), sh.x + 18, sh.y - 26, false, 1500);
    }, true);
    addEventListener('keydown', (e) => {
      if (e.key !== 'Shift' || sh || isAct(S.tool) || !banded(S.tool) || px < 0) return;
      const over = document.elementFromPoint(px, py);
      if (over && ui.contains(over)) return;                     // only over the world
      sh = { id: S.tool, x: px, y: py, c: ctlOf(S.tool) };
      call('adjusting', true);
      showNameAt(settingText(sh.id), px + 18, py - 26, false, 1500);
    });
    const letGo = () => { if (sh) { sh = null; call('adjusting', false); } };
    addEventListener('keyup', (e) => { if (e.key === 'Shift') letGo(); });
    addEventListener('blur', letGo);

    // ═══ events from the game ═══
    const on = {
      world(d) { if (d.year != null) { S.year = d.year; renderClock(); } },
      vitals(d) {
        for (const id in d) {
          const v = VITALS.find((x) => x.id === id); if (!v) continue;
          const prev = vitVals[id];
          vitVals[id] = Object.assign({}, prev, d[id]);
          vitRows[id].upd();
          if (prev && prev.word && d[id].word && d[id].word !== prev.word) vitalChanged(v);
        }
      },
      story(d) { if (d && d.text) addLine(d); },
      discovery(d) {
        const def = discById[d.id]; if (!def) return;
        const f = S.found[d.id];
        if (f) { f.n = (f.n || 1) + 1; store.set('found', S.found); return; }      // announced the first time only
        S.found[d.id] = { how: d.how || [], year: d.year != null ? d.year : S.year, n: 1, fresh: true };
        store.set('found', S.found);
        addLine({ id: 'disc.' + d.id, icon: def.icon, text: def.name, kind: 'disc', disc: d.id });     // a discovery is a line in the story, brighter
        if (S.recOpen) { if (S.tab === 'found') renderRecord(); }
        else { S.unseen++; renderBadge(); }
        sfx(def.tier === 'engineered' ? 'rare' : 'chime');
      },
      unlock(d) {
        const v = varById[d.id]; if (!v || !S.locked.has(d.id)) return;
        S.locked.delete(d.id); store.set('locked2', [...S.locked]);
        S.newVar[v.family.id] = true; renderTools();
        addLine({ id: 'unlock.' + d.id, icon: v.icon, text: v.name + (d.why ? ' · ' + d.why : ''), kind: 'unlock' });
      },
      perf(d) {
        const p = ['<b>' + d.frame.toFixed(1) + '</b> ms frame'];
        if (d.sim != null) p.push(d.sim.toFixed(2) + ' sim');
        if (d.draw != null) p.push(d.draw.toFixed(2) + ' draw');
        if (d.cells != null) p.push('<b>' + d.cells.toLocaleString('en') + '</b> cells');
        perf.innerHTML = p.join(' · ');
      },
      speed(d) { setSpeed(d.speed, true); },
      tool(d) { selectTool(d.id, { fromGame: true, quiet: true }); },
      // the game says what is being looked at or followed: { mode: 'look' | 'follow', id, icon, name, state, line, kind, where, age, canFollow }; id null ends it
      subject(d) {
        const was = S.card.follow;
        S.card[d.mode] = d.id == null ? null : d;
        if (d.mode === 'follow' && d.id != null && S.tool === 'follow') selectTool(S.beforeFollow === 'follow' ? 'hand' : S.beforeFollow, { quiet: true });   // picked: back to what you held
        if (d.mode === 'follow' && d.id != null && (!was || was.id !== d.id)) S.card.look = null;   // a new follow takes the card
        renderCard();
      },
    };

    // ═══ resting: no input for a while and the interface fades out, leaving the world. Any input brings it back ═══
    const IDLE = cfg.idleAfter != null ? cfg.idleAfter : 10000;
    let idleT = 0, idle = false;
    const busy = () => S.recOpen || S.fly || !!sh;          // never while something is open or held
    function rest() {
      if (busy()) { idleT = setTimeout(rest, 2000); return; }
      idle = true; ui.classList.add('idle'); document.documentElement.classList.add('bui-idle');
      hideHover(); label.classList.remove('show'); call('idle', true);
    }
    function wake() {
      clearTimeout(idleT); idleT = setTimeout(rest, IDLE);
      if (!idle) return;
      idle = false; ui.classList.remove('idle'); document.documentElement.classList.remove('bui-idle'); call('idle', false);
    }
    ['pointermove', 'pointerdown', 'wheel', 'keydown', 'touchstart'].forEach((t) => addEventListener(t, wake, { capture: true, passive: true }));
    if (IDLE > 0) idleT = setTimeout(rest, IDLE);

    // ── start ──
    renderTools(); renderClock(); renderBadge(); placeTop(); renderSlice(); call('setSlice', S.slice.depth);
    pushSound();
    C.views.forEach((v) => call('setView', v.id, !!S.views[v.id]));
    call('selectTool', 'hand', {}); call('setSpeed', S.speed);

    return {
      send(name, data) { const h = on[name]; if (h) h(data || {}); else console.warn('BubbleUI: no such event', name); },
      get state() { return { tool: S.tool, speed: S.speed, found: Object.keys(S.found), locked: [...S.locked] }; },
    };
  }
  return { mount };
})();
</script>

<script>
'use strict';
// What a game provides: a catalogue (data) and a host (calls). Nothing here is part of the interface.
const CATALOGUE = (function () {
  // what a tool lets you set follows from its shape, and a tool can override it: a brush has a size in three named bands
  // and a strength; a line or a release has a size only; a strike charges while held; a whole-world event has nothing.
  const CTRL = { area: { size: true, strength: true }, line: { size: true }, point: { charge: true }, release: { size: true }, world: {} };
  const BANDS = { area: ['Small', 'Medium', 'Large'], line: ['Thin', 'Wide', 'Broad'], release: ['A few', 'A group', 'A crowd'], point: ['Small', 'Medium', 'Large'] };
  const NAMES = {
    raise: ['Nudge', 'Mound', 'Ridge'], sink: ['Dip', 'Hollow', 'Basin'], move: ['Handful', 'Scoop', 'Load'], smooth: ['Touch', 'Smooth', 'Level'],
    rain: ['Drizzle', 'Shower', 'Downpour'], clear: ['Gap', 'Clearing', 'Open sky'], shade: ['Wisp', 'Cover', 'Overcast'], spring: ['Trickle', 'Stream', 'Gush'],
    seeds: ['Sprinkle', 'Scatter', 'Sow'], bloom: ['Bud', 'Bloom', 'Riot'], deposit: ['Fleck', 'Vein', 'Lode'], cleanse: ['Rinse', 'Wash', 'Scour'],
    downpour: ['Heavy', 'Torrent', 'Deluge'], hail: ['Pellets', 'Hail', 'Hailstorm'], estorm: ['Crackle', 'Storm', 'Tempest'], quake: ['Tremor', 'Quake', 'Upheaval'],
    locusts: ['A few', 'A swarm', 'A plague'], blight: ['Spot', 'Rot', 'Blight'], fireball: ['Ember', 'Fireball', 'Inferno'], shower: ['A few', 'A shower', 'A storm'],
    oil: ['Seep', 'Gush', 'Geyser'], laser: ['Thin', 'Wide', 'Broad'],
  };
  const V = (id, name, icon, shape, extra) => {
    const v = Object.assign({ id, name, icon, shape, controls: Object.assign({}, CTRL[shape]) }, extra || {});
    if (v.controls.size) v.bands = NAMES[id] || BANDS[shape];
    return v;
  };
  const L = { locked: true }, K = { lead: true };
  const P = { locked: true, planned: true }, PK = { locked: true, planned: true, lead: true };   // planned: on the design sheets, not built anywhere yet
  const C1 = (c, more) => Object.assign({ controls: c }, more || {});
  return {
    families: [
      // ── tending: the 17 of Tools-v3.md, then everything else the sheets have talked about (planned, locked) ──
      { id: 'land', side: 'tend', name: 'Land', variants: [V('raise', 'Raise', '⛰️', 'area', K), V('sink', 'Sink', '🥣', 'area'), V('move', 'Move', '🪣', 'point', C1({ size: true }, L)), V('smooth', 'Smooth', '🧹', 'area', L),
        V('carve', 'Carve', '🥄', 'area', P), V('cliff', 'Cliff', '🧗', 'line', P)] },                                                            // Ideas #3: finer digging, cliffsides
      { id: 'water', side: 'tend', name: 'Water and sky', variants: [V('rain', 'Rain', '🌧️', 'area', K), V('clear', 'Clear', '☀️', 'area'), V('spring', 'Spring', '⛲', 'point', C1({ size: true }, L)), V('wind', 'Wind', '🌬️', 'world', L), V('shade', 'Shade', '⛅', 'area', L),
        V('river', 'River', '🏞️', 'line', P)] },                                                                                                  // Ideas #11
      { id: 'life', side: 'tend', name: 'Life', variants: [V('seeds', 'Seeds', '🌱', 'area', K), V('herd', 'Herd', '🐑', 'release'), V('flock', 'Flock', '🐦', 'release', L), V('pollinators', 'Pollinators', '🐝', 'release', L), V('bloom', 'Bloom', '🌸', 'area', L),
        V('treeseeds', 'Tree seeds', '🌳', 'area', P), V('waterseeds', 'Water seeds', '🪷', 'area', P), V('desertseeds', 'Desert seeds', '🌵', 'area', P)] },   // Ideas #14: kinds of seed (names are placeholders)
      { id: 'minerals', side: 'tend', name: 'Minerals', variants: [V('deposit', 'Deposit', '🫳', 'point', C1({ size: true }, K)),
        V('m_soil', 'Soil', '🟫', 'area', P), V('m_sand', 'Sand', '🏖️', 'area', P), V('m_rock', 'Rock', '◾', 'area', P), V('m_clay', 'Clay', '🧱', 'area', P), V('m_ash', 'Ash', '🩶', 'area', P), V('m_loam', 'Loam', '🟤', 'area', P),
        V('m_lavarock', 'Lava rock', '🌑', 'area', P), V('m_blacksand', 'Black sand', '⬛', 'area', P), V('m_glass', 'Glass', '🔮', 'area', P), V('m_salt', 'Salt', '◽', 'area', P), V('m_iron', 'Iron ore', '🧲', 'area', P), V('m_sulfur', 'Sulfur', '🟡', 'area', P),
        V('crystal', 'Grow a crystal', '💠', 'point', C1({}, P))] },                                                                             // Minerals.md: the 12 ground minerals; Ideas #18
      { id: 'mending', side: 'tend', name: 'Mending', variants: [V('cleanse', 'Cleanse', '🫧', 'area', K), V('seal', 'Seal', '🩹', 'point', C1({}))] },
