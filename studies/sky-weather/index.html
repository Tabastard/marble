<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky and weather study</title>
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;font:13px/1.35 ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:#eaf2ff;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}
button{all:unset;box-sizing:border-box;cursor:pointer}
.pane{background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.bar{position:fixed;bottom:18px;display:flex;flex-direction:column;gap:7px}
#tend{left:16px}#wreck{right:16px}
.bar button{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;line-height:1;opacity:.82;position:relative}
.bar button:hover{opacity:1;background:rgba(255,255,255,.12)}
.bar button.on{opacity:1;background:rgba(255,255,255,.2)}
.bar button kbd{position:absolute;right:4px;bottom:2px;font:9px ui-monospace,monospace;opacity:.3}
#top{position:fixed;top:12px;right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row{display:flex;gap:4px;padding:3px;border-radius:13px}
.row button{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font:600 13px ui-rounded,system-ui,sans-serif;opacity:.7}
.row button:hover{opacity:1;background:rgba(255,255,255,.1)}
.row button.on{opacity:1;background:rgba(255,255,255,.18)}
.row button.off{opacity:.35}
.row button.em{font-size:17px}
#feed{position:fixed;top:132px;right:16px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none;max-width:300px}
.toast{font-size:12.5px;color:rgba(234,242,255,.86);text-shadow:0 1px 8px rgba(0,0,0,.7);transition:opacity 1.2s,transform 1.2s;opacity:0;transform:translateY(4px)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(-4px)}
#hud{position:fixed;left:16px;top:12px;font:11px/1.5 ui-monospace,Menlo,monospace;color:rgba(234,242,255,.62);white-space:pre;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#hud b{color:rgba(234,242,255,.92);font-weight:600}
.drop{position:fixed;right:14px;top:96px;border-radius:14px;padding:10px 12px;display:none;width:250px;max-height:calc(100vh - 110px);overflow:auto;font-size:12px;color:rgba(234,242,255,.85);background:rgba(14,18,30,.78)}
.drop.show{display:block}
.drop label{display:grid;grid-template-columns:1fr 46px;gap:2px 8px;align-items:center;margin:6px 0}
.drop label span{opacity:.75}
.drop label i{font-style:normal;text-align:right;font:11px ui-monospace,monospace;opacity:.7}
.drop input[type=range]{grid-column:1 / span 2;width:100%;accent-color:#cfd8e6;margin:0}
.drop h4{margin:8px 0 2px;font-size:11px;font-weight:600;opacity:.5;text-transform:uppercase;letter-spacing:.05em}
.drop .rowb{display:flex;gap:6px;margin-top:8px}
.drop .rowb button{flex:1;text-align:center;padding:5px;border-radius:8px;background:rgba(255,255,255,.08);font-size:11px}
.drop .rowb button:hover{background:rgba(255,255,255,.16)}
#tip{position:fixed;pointer-events:none;font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(14,18,30,.8);opacity:0;transition:opacity .2s}
#err{position:fixed;inset:auto 16px 50% 16px;color:#ffb4a0;font:12px ui-monospace,monospace;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="tend" class="bar"></div>
<div id="wreck" class="bar"></div>
<div id="top">
  <div class="row pane" id="ctl">
    <button id="b-clouds" class="em" data-tip="Clouds on and off (C)">☁️</button>
    <button id="b-precip" class="em" data-tip="Rain and snow drawn, on and off (P)">☔</button>
    <button id="b-ma" data-tip="Clouds as point puffs (A)">A</button>
    <button id="b-mb" data-tip="Clouds as soft billboards (B)">B</button>
    <button id="b-mc" data-tip="Clouds as one sheet (D)">C</button>
    <button id="b-sound" class="em" data-tip="Sound (M mutes)">🔊</button>
    <button id="b-set" class="em" data-tip="Settings">⚙️</button>
    <button id="b-view" class="em" data-tip="Next view: whole, low, from above, following a cloud (V; N picks another cloud)">🎥</button>
    <button id="b-speed" data-tip="Time speed: ×1, ×3, ×10 (X)">×1</button>
    <button id="b-bench" class="em" data-tip="Time 240 frames (T)">⏱</button>
    <button id="b-reset" class="em" data-tip="Start again (R)">↺</button>
  </div>
  <div class="row pane" id="wx"></div>
</div>
<div id="feed"></div>
<div id="drop-sound" class="drop pane"></div>
<div id="drop-set" class="drop pane"></div>
<div id="tip"></div>
<div id="err"></div>
<script>
'use strict';
// ───────────────────────── constants: a bubble of radius 10 and a 128² grid, as in test-06 and the scale study ─────────────────────────
const R = 10, RR = R * R, N = 128, NN = N * N, WORLD = 2 * R * 1.02, HALF = WORLD / 2, CS = WORLD / (N - 1);
const Y0 = -2.6, HMAX = 2.9, HMIN = -7.9, MAGMA_Y = -7.1, ROCK_Y = -4.3;
const DT = 1 / 30;            // the world steps 30 times a second
const SCALE = 0.55;           // things on the land against test-06 (the scale study's "wider meadow": ×0.5 to ×0.6)
const LAPSE = 3.2;            // degrees colder per unit of height, so the hill gets snow first
const SOIL = 0, SAND = 1, ROCK = 2, GLASS = 3;
// materials are small bundles of properties; the rules read the columns
const MAT = [
  { name: 'soil', perm: 1.0, pull: 1.0, dry: [0.55, 0.42, 0.28], wet: [0.34, 0.25, 0.16] },
  { name: 'sand', perm: 2.0, pull: 0.8, dry: [0.90, 0.81, 0.60], wet: [0.66, 0.56, 0.40] },
  { name: 'rock', perm: 0.2, pull: 1.4, dry: [0.56, 0.55, 0.58], wet: [0.42, 0.42, 0.46] },

];
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(a) { return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let RNG = mulberry(1);
const rnd = () => RNG();            // the world's randomness: seeded, so the same inputs on the same steps give the same world
const vr = () => Math.random();     // looks only
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }

function fbm(x, y, o) { let s = 0, a = 0.5, f = 1, n = 0; for (let k = 0; k < o; k++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

// ───────────────────────── the grid ─────────────────────────
// Every cell holds plain values. The sky writes rain and snowfall into the cells; the rules below and the fire read
// them, and never ask where they came from.
const W = { tick: 0, time: 0 };
const FIELDS = ['h', 'top', 'moist', 'T', 'veg', 'vegMax', 'ice', 'wd', 'ws', 'wflow', 'shoreAge', 'ps', 'ripA', 'ripB',
  'snow', 'rain', 'snowfall', 'fire', 'burnLeft', 'reach', 'scar', 'char', 'tree', 'drift', 'dust', 'taint'];
function alloc() {
  for (const f of FIELDS) W[f] = new Float32Array(NN);
  W.mat = new Uint8Array(NN); W.inside = new Uint8Array(NN); W.shore = new Uint8Array(NN);
  W.rained = new Uint8Array(NN);   // 1 once rain or snow has fallen on the cell since the start: the reach measure
  W.treeAt = new Int16Array(NN);
  W.xs = new Float32Array(N); for (let i = 0; i < N; i++) W.xs[i] = i * CS - HALF;
  W.insideCount = 0; W.landCount = 0;
}
const HILL = [3.4, -2.9], LAKE = [-5.4, 4.4], LEVEL0 = Y0 - 0.35;
function genLand(seed) {
  RNG = mulberry(seed || 7);
  const { h, mat, veg, vegMax, moist, T, xs } = W;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, x = xs[i], z = xs[j];
    let e = Y0 + (fbm(x * 0.2 + 11, z * 0.2 + 3, 4) - 0.5) * 1.5 + (fbm(x * 0.9 + 5, z * 0.9 + 9, 2) - 0.5) * 0.16;
    const dh = Math.hypot(x - HILL[0], z - HILL[1]);
    e += 3.0 * Math.exp(-dh * dh / (2 * 1.8 * 1.8));                                   // a hill that can hold snow
    const ga = Math.atan2(z - HILL[1], x - HILL[0]) * 4 + (fbm(x * 0.35 + 21, z * 0.35 + 4, 2) - 0.5) * 3.0;
    e -= 0.32 * Math.pow(1 - Math.abs(Math.sin(ga)), 3) * smooth(0.5, 1.3, dh) * Math.exp(-dh * dh / (2 * 2.6 * 2.6));   // gullies
    const dl = Math.hypot(x - LAKE[0], z - LAKE[1]);
    e -= 1.5 * Math.exp(-dl * dl / (2 * 2.3 * 2.3));                                   // a lake basin against the glass
    h[c] = Math.min(e, HMAX);
    mat[c] = e > Y0 + 2.2 ? ROCK : SOIL;
    vegMax[c] = mat[c] === SOIL ? clamp(0.6 + (fbm(x * 0.7 + 40, z * 0.7 + 8, 3) - 0.5) * 1.0, 0.15, 0.95) : 0;
    veg[c] = vegMax[c];
    moist[c] = clamp(0.24 + 0.6 * Math.exp(-dl * dl / 14), 0, 1);
    T[c] = 15;
    W.drift[c] = clamp((fbm(x * 0.9 + 70, z * 0.9 + 30, 3) - 0.5) * 2.2 + 0.5, 0, 1);   // where snow drifts deep and where it lies thin
  }
  for (const f of ['ice', 'wd', 'wflow', 'shoreAge', 'ripA', 'ripB', 'snow', 'rain', 'snowfall', 'fire', 'burnLeft', 'reach', 'scar', 'char', 'tree', 'dust', 'taint']) W[f].fill(0);
  W.rained.fill(0); W.treeAt.fill(-1);

  let seedC = -1, best = 1e9;
  for (let c = 0; c < NN; c++) {
    if (!W.inside[c]) continue;
    const x = xs[c % N], z = xs[(c / N) | 0];
    if (Math.hypot(x - LAKE[0], z - LAKE[1]) < 2.5 && W.top[c] < best) { best = W.top[c]; seedC = c; }
  }

    const c = stack.pop();

  }
  for (let c = N; c < NN - N; c++) {
    if (depth0[c] > 0 || !W.inside[c]) continue;
    if (depth0[c - 1] > 0 || depth0[c + 1] > 0 || depth0[c - N] > 0 || depth0[c + N] > 0 || depth0[c - N - 1] > 0 || depth0[c + N + 1] > 0) {

}
function updateTop() { W.top.set(W.h); }
function updateInside() {
  const { top, inside, xs } = W, lim = (R - 0.08) * (R - 0.08);
  let n = 0;
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i, x = xs[i], z = xs[j], y = top[c];

}
function sampleField(f, x, z) {
  let gx = (x + HALF) / CS, gz = (z + HALF) / CS;

  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, c = j * N + i;
  return (f[c] * (1 - fx) + f[c + 1] * fx) * (1 - fz) + (f[c + N] * (1 - fx) + f[c + N + 1] * fx) * fz;

// the land as it is drawn: a smooth curve through the 4×4 cells around a point (the 2× mesh of the scale study)
function crom(a, b, c, d, t) { return b + 0.5 * t * (c - a + t * (2 * a - 5 * b + 4 * c - d + t * (3 * (b - c) + d - a))); }

  const gx = clamp((x + HALF) / CS, 1, N - 2.001), gz = clamp((z + HALF) / CS, 1, N - 2.001);
  const i = gx | 0, j = gz | 0, tx = gx - i, tz = gz - j, t = W.top;
  const row = (jj) => { const o = clamp(jj, 0, N - 1) * N; return crom(t[o + Math.max(0, i - 1)], t[o + i], t[o + i + 1], t[o + Math.min(N - 1, i + 2)], tx); };

const cellAt = (x, z) => clamp(Math.round((z + HALF) / CS), 0, N - 1) * N + clamp(Math.round((x + HALF) / CS), 0, N - 1);
const cx = (c) => W.xs[c % N], cz = (c) => W.xs[(c / N) | 0];
// fn(c, falloff 0..1, distance) for every inside cell within r of (x, z)
function forBrush(x, z, r, fn) {
  const i0 = Math.max(1, Math.floor((x - r + HALF) / CS)), i1 = Math.min(N - 2, Math.ceil((x + r + HALF) / CS));
  const j0 = Math.max(1, Math.floor((z - r + HALF) / CS)), j1 = Math.min(N - 2, Math.ceil((z + r + HALF) / CS));
  const xs = W.xs, ins = W.inside;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = xs[i] - x, dz = xs[j] - z, d = Math.sqrt(dx * dx + dz * dz);
    if (d > r) continue;
    const c = j * N + i;
    if (!ins[c]) continue;
    const t = 1 - d / r;
    fn(c, t * t * (3 - 2 * t), d);
  }

// ───────────────────────── feedback: named events and a calm feed ─────────────────────────
const SAID = {};
const EVENTS = [];
function say(key, text) {
  if (W.quiet) return;
  EVENTS.push({ key, tick: W.tick });
  if (EVENTS.length > 400) EVENTS.shift();
  if (typeof document === 'undefined') return;
  const now = performance.now();
  if (SAID[key] && now - SAID[key] < 6000) return;
  SAID[key] = now;
  const box = document.getElementById('feed'), d = document.createElement('div');
  d.className = 'toast'; d.textContent = text; box.prepend(d);
  requestAnimationFrame(() => d.classList.add('in'));
  setTimeout(() => d.classList.add('out'), 4200); setTimeout(() => d.remove(), 5600);
  while (box.children.length > 5) box.lastChild.remove();
}

// ───────────────────────── particles (looks only): flames, smoke, steam, puffs, splashes ─────────────────────────
const PCAP = 2400;
const P = { n: 0, x: new Float32Array(PCAP), y: new Float32Array(PCAP), z: new Float32Array(PCAP), vx: new Float32Array(PCAP), vy: new Float32Array(PCAP), vz: new Float32Array(PCAP), life: new Float32Array(PCAP), max: new Float32Array(PCAP), s: new Float32Array(PCAP), grow: new Float32Array(PCAP), g: new Float32Array(PCAP), col: new Float32Array(PCAP * 4), data: new Float32Array(PCAP * 9) };

    const drift = P.g[k] <= 0 ? 0.9 : 0.1, w = SKY.windAt(P.x[k], P.z[k], clamp((P.y[k] - Y0) / 7.5, 0, 1)), wx = w[0], wz = w[1];
    P.x[k] += (P.vx[k] + wx * drift) * dt; P.y[k] += P.vy[k] * dt; P.z[k] += (P.vz[k] + wz * drift) * dt;

    const d2 = P.x[k] * P.x[k] + P.y[k] * P.y[k] + P.z[k] * P.z[k];
    if (d2 > (R - 0.2) * (R - 0.2)) { const s = (R - 0.2) / Math.sqrt(d2); P.x[k] *= s; P.y[k] *= s; P.z[k] *= s; P.vy[k] *= 0.5; }

function rippleAt(x, z, amp, rad) { forBrush(x, z, rad, (c, f) => { if (W.wd[c] > 0.015 && W.ice[c] < 0.5) W.ripA[c] += amp * f; }); }
function rippleStep() {
  const a = W.ripA, b = W.ripB, wd = W.wd, ice = W.ice;
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i;
    if (wd[c] < 0.015 || ice[c] > 0.5) { b[c] = 0; continue; }

// ───────────────────────── water: virtual pipes on every cell (water A of the water study) ─────────────────────────
const WATER = (() => {
  const w = new Float32Array(NN), fL = new Float32Array(NN), fR = new Float32Array(NN), fU = new Float32Array(NN), fD = new Float32Array(NN);

  function substep() {
    const { top, inside, ice } = W;

  for (const s of STATES) {
    const b = document.createElement('button');
    b.className = 'em'; b.textContent = s.icon; b.dataset.tip = s.name + ': ' + s.tip; b.dataset.id = s.id;
    b.onclick = () => { SOUND.init(); SKY.nudge(s.id, 1, 45, 'chip'); };
    tipFor(b); wx.appendChild(b);
  }
  window.addEventListener('resize', resize);
}
// the settings drawer: the numbers this study is tuning, live
const SETTINGS = [
  ['Fire', 'Reach: how far a spark can travel (per hop kept)', () => FIRE.P, 'decay', 0.8, 0.97, 0.005],
  ['Fire', 'Spread speed', () => FIRE.P, 'spread', 0.5, 6, 0.1],
  ['Fire', 'Burn time of grass, s', () => FIRE.P, 'burnGrass', 1, 8, 0.25],
  ['Fire', 'Scar: seconds before burned ground can burn again', () => FIRE.P, 'scar', 20, 300, 5],
  ['Fire', 'Embers in the wind', () => FIRE.P, 'ember', 0, 2, 0.05],
  ['Rain', 'Rain tool size (units)', () => UI.brush, 'rain', 0.6, 4.5, 0.1],
  ['Rain', 'How fast rain puts fire out', () => FIRE.P, 'douse', 1, 12, 0.5],
  ['Rain', 'Runoff into puddles', () => RULES, 'runoff', 0, 0.04, 0.001],
  ['Sky', 'Cloud layer height', () => SKY.P, 'cloudY', 2.5, 6.5, 0.1],
  ['Sky', 'Drift back to fair, s', () => SKY.P, 'drift', 10, 180, 5],
];
function settingsPanel(d) {
  let html = '', last = '';
  SETTINGS.forEach((s, i) => {
    if (s[0] !== last) { html += `<h4>${s[0]}</h4>`; last = s[0]; }
    const v = s[2]()[s[3]];
    html += `<label><span>${s[1]}</span><i id="sv${i}">${(+v).toFixed(3).replace(/\.?0+$/, '')}</i><input type="range" min="${s[4]}" max="${s[5]}" step="${s[6]}" value="${v}" data-i="${i}"></label>`;
  });
  html += '<div class="rowb"><button id="set-def">Defaults</button><button id="set-fire">Measure fire</button></div><div id="set-out" style="font:11px ui-monospace,monospace;white-space:pre-wrap;opacity:.7;margin-top:6px"></div>';
  d.innerHTML = html;
  for (const inp of d.querySelectorAll('input')) inp.oninput = () => { const s = SETTINGS[+inp.dataset.i]; s[2]()[s[3]] = +inp.value; document.getElementById('sv' + inp.dataset.i).textContent = (+inp.value).toFixed(3).replace(/\.?0+$/, ''); };
  document.getElementById('set-def').onclick = () => { FIRE.defaults(); SKY.defaults(); RULES.runoff = 0.008; UI.brush.rain = 2.4; settingsPanel(d); };
  document.getElementById('set-fire').onclick = () => {
    const out = document.getElementById('set-out'); out.textContent = 'measuring…';
    setTimeout(() => {
      const r = STUDY.fireTest({ secs: 60 }), w = STUDY.fireTest({ secs: 60, rainAt: 8 });
      out.textContent = `spark, no rain: peak ${r.peak} burning, ${r.burned} burned (${r.pctLand}% of land), out at ${r.outAt} s, reach ${r.reach}\nrain at 8 s: peak ${w.peak}, ${w.burned} burned, out at ${w.outAt} s`;
      reset();
    }, 30);
  };
}

// ───────────────────────── the cloud lab: views, following one cloud, time speed ─────────────────────────
// Views: the whole bubble; low, looking across under the clouds; from above; and following one cloud close up, so
// it can be watched forming, churning and fraying. Speed runs the world 3 or 10 times faster to show it.
const LAB = { view: 0, follow: 0, speed: 1 };
const VIEWS = [[0.75, 0.42, 27, 0, -1.4, 0], [0.75, 0.06, 23, 0, 0.5, 0], [0.75, 1.42, 27, 0, -1.4, 0], null];
function nextView(i) {
  LAB.view = i === undefined ? (LAB.view + 1) % VIEWS.length : i;
  const v = VIEWS[LAB.view];
  if (v) { CAM.yaw = v[0]; CAM.pitch = v[1]; CAM.dist = v[2]; CAM.tx = v[3]; CAM.ty = v[4]; CAM.tz = v[5]; }
  else { CAM.pitch = 0.2; CAM.dist = 14; LAB.follow = 0; }
  document.getElementById('b-view').classList.toggle('on', LAB.view !== 0);
}
function followed() {
  const list = SKY.CLOUDS.filter((c) => !c.poof);
  if (!list.length) return null;
  let cl = list.find((c) => c.id === LAB.follow);
  if (!cl) { const after = list.filter((c) => c.id > LAB.follow); cl = after.length ? after[0] : list[0]; LAB.follow = cl.id; }
  return cl;
}
function nextSpeed() {
  LAB.speed = LAB.speed === 1 ? 3 : LAB.speed === 3 ? 10 : 1;
  const b = document.getElementById('b-speed'); b.textContent = '×' + LAB.speed; b.classList.toggle('on', LAB.speed > 1);
}

// ───────────────────────── run ─────────────────────────
function reset(seed) {
  const depth0 = genLand(seed);
  WATER.init(depth0);
  WATER0 = 0; for (let c = 0; c < NN; c++) WATER0 += depth0[c];
  P.n = 0;
  RNG = mulberry((seed || 7) * 31 + 5);
  FIRE.init();
  SKY.init();
  W.quiet = true;
  for (let k = 0; k < 30; k++) tick();
  W.quiet = false; EVENTS.length = 0;
  W.rained.fill(0);
  colourDirty = true;
}
let colourDirty = true, last = 0, acc = 0, hudT = 0;
const FR = { n: 0, js: 0, gap: 0, max: 0 };
let PAUSED = false, benchOut = '';
function frame(now) {
  const t0 = performance.now();
  const dt = last ? Math.min(0.1, (now - last) / 1000) : 1 / 60;
  if (last) FR.gap += now - last;
  last = now;
  resize(); cameraUpdate();
  const ht = UI.tool;
  if (ht === 'rain' || ht === 'clear' || ht === 'grow' || ht === 'spark') { const h = pick(UI.px, UI.py); UI.hover = h ? { x: h.x, z: h.z, r: brushOf(ht) } : null; }
  else if (ht === 'bolt' && UI.down && UI.hit) UI.hover = { x: UI.hit.x, z: UI.hit.z, r: 0.2 + 0.6 * clamp(UI.held * DT / 1.2, 0, 1) };
  else UI.hover = null;
  if (LAB.view === 3) {
    // follow one cloud: the camera's target eases after it
    const cl = followed();
    if (cl) { const p = SKY.drawPos(cl), k = Math.min(1, dt * 2); CAM.tx += (p[0] - CAM.tx) * k; CAM.ty += (p[1] - 0.3 - CAM.ty) * k; CAM.tz += (p[2] - CAM.tz) * k; }
  }
  acc += dt * LAB.speed;
  let steps = 0;
  const maxSteps = 3 * LAB.speed;
  if (PAUSED) acc = 0;
  while (acc >= DT && steps < maxSteps) { tick(); acc -= DT; steps++; colourDirty = true; }
  if (steps === maxSteps) acc = 0;
  const ldt = Math.min(0.1, dt * LAB.speed);
  rippleStep(); particlesStep(ldt); SKY.looks(ldt); FIRE.looks(ldt);
  renderFrame(now / 1000, colourDirty && (W.tick & 1) === 0);
  if ((W.tick & 1) === 0) colourDirty = false;
  SOUND.update(dt);
  const js = performance.now() - t0;
  FR.n++; FR.js += js; FR.max = Math.max(FR.max, js);
  if (now - hudT > 500) {
    const fps = FR.gap > 0 ? (1000 * (FR.n - 1)) / FR.gap : 0;
    const gpu = RD.gpuN ? (RD.gpuMs / RD.gpuN).toFixed(2) + ' ms' : 'n/a';
    document.getElementById('hud').innerHTML =
      `frame <b>${(FR.js / FR.n).toFixed(2)} ms</b> cpu (worst ${FR.max.toFixed(1)}) · gpu ${gpu} · ${fps.toFixed(0)} fps\n` +
      `sim <b>${(PERF.simN ? PERF.simMs / PERF.simN : 0).toFixed(2)} ms</b> a step, 30 steps/s · ${(RD.tris / 1000).toFixed(0)}k triangles\n` +
      `cells <b>${W.insideCount.toLocaleString()}</b> in the bubble (grid ${N}×${N}, ${W.landCount.toLocaleString()} land)\n` +
      SKY.hud() + '\n' + FIRE.hud() + (benchOut ? '\n' + benchOut : '') +
      (LAB.speed > 1 ? `\ntime ×${LAB.speed}` : '') + (LAB.view === 3 && followed() ? '\nfollowing ' + SKY.describe(followed()) : '');
    FR.n = 0; FR.js = 0; FR.gap = 0; FR.max = 0; PERF.simMs = 0; PERF.simN = 0; RD.gpuMs = 0; RD.gpuN = 0;
    hudT = now;
  }
  requestAnimationFrame(frame);
}
function runBench() {
  benchOut = 'timing…';
  setTimeout(() => { const r = STUDY.bench(240); benchOut = `timed 240 frames: ${r.frameMs} ms a frame (worst ${r.worstMs}), sim ${r.simMsPerStep} ms a step, clouds ${['A', 'B', 'C'][SKY.mode()]}`; }, 30);
}
// the looks-only systems advanced by one sim step, for stepping the world without frames
function looks() { particlesStep(DT); SKY.looks(DT); FIRE.looks(DT); rippleStep(); }
// a small handle for testing from the console
window.STUDY = {
  W, ATM: () => ATM, tick, EVENTS, reset, FIRE: () => FIRE, SKY: () => SKY,
  run(sec) { const n = Math.round(sec / DT); for (let k = 0; k < n; k++) { tick(); looks(); } colourDirty = true; },
  at(tool, x, z, sec, brush) {
    const b = UI.brush[tool]; if (brush) UI.brush[tool] = brush;
    const n = Math.max(1, Math.round(sec / DT));
    for (let k = 0; k < n; k++) { const c = cellAt(x, z); applyTool(tool, { x, y: W.ps[c], z }, k, DT); tick(); looks(); }
    if (brush) UI.brush[tool] = b; colourDirty = true;
  },
  view(yaw, pitch, dist, tx, ty, tz) {
    CAM.yaw = yaw; CAM.pitch = pitch; if (dist) CAM.dist = dist;
    if (tx !== undefined) { CAM.tx = tx; CAM.ty = ty; CAM.tz = tz; }
  },
  pause(on) { PAUSED = !!on; },
  // whole frames back to back (one sim step every other frame, as at 60 fps), waiting for the GPU each time
  bench(frames) {
    const t = { all: 0, sim: 0, worst: 0 };
    for (let k = 0; k < frames; k++) {
      const t0 = performance.now();
      if (k & 1) { const s = performance.now(); tick(); t.sim += performance.now() - s; }
      rippleStep(); particlesStep(1 / 60); SKY.looks(1 / 60); FIRE.looks(1 / 60);
      resize(); cameraUpdate(); renderFrame(performance.now() / 1000, (k & 3) === 1);
      gl.finish();
      const d = performance.now() - t0; t.all += d; if (d > t.worst) t.worst = d;
    }
    return { frameMs: +(t.all / frames).toFixed(2), simMsPerStep: +(t.sim / (frames / 2)).toFixed(2), worstMs: +t.worst.toFixed(1), tris: RD.tris, clouds: SKY.count(), puffs: SKY.drawn() };
  },
  // one spark on dry meadow, watched until it is out: how big, how long, how far
  fireTest(o) {
    o = o || {};
    reset(o.seed);
    if (o.weather) { SKY.nudge(o.weather, 1, 9999, 'test'); for (let k = 0; k < 15; k++) STUDY.run(1); }
    const at = o.at || FIRE.meadow(o.spot || 0);
    W.quiet = true;
    const scar0 = Float32Array.from(W.char);
    FIRE.spark(at[0], at[1], o.r || 0.45, 1);
    let peak = 0, peakAt = 0, outAt = -1, burned = 0, reach = 0, rained = false;
    const trace = [];
    for (let s = 1; s <= (o.secs || 90); s++) {
      if (o.rainAt && s === o.rainAt) rained = true;
      for (let k = 0; k < 30; k++) {
        if (rained && s - o.rainAt < (o.rainFor || 12)) { const c = cellAt(at[0], at[1]); applyTool('rain', { x: at[0], y: W.ps[c], z: at[1] }, k + (s - o.rainAt) * 30, DT); }
        tick();
      }
      const n = FIRE.burning();
      if (n > peak) { peak = n; peakAt = s; }
      if (s % 5 === 0) trace.push(n);
      if (n === 0 && outAt < 0) { outAt = s; if (!o.full) break; }
    }
    for (let c = 0; c < NN; c++) if (W.char[c] > 0.05 && scar0[c] < 0.05) { burned++; reach = Math.max(reach, Math.hypot(cx(c) - at[0], cz(c) - at[1])); }
    W.quiet = false;
    return { at: at.map((v) => +v.toFixed(2)), peak, peakAt, burned, pctLand: +(100 * burned / W.landCount).toFixed(1), outAt, reach: +reach.toFixed(2), trace: trace.join(' ') };
  },
};
try {
  alloc();
  const cv = document.getElementById('cv');
  renderInit(cv);
  inputInit();
  reset();
  resize(); cameraUpdate();
  requestAnimationFrame(frame);
} catch (err) {
  document.getElementById('err').textContent = String(err && err.stack || err);
  console.error(err);
}
</script>
