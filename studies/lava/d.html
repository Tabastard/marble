// The test land (varied on 2026-11-14 so lava can be tried on more than one hill):

// ───────────────────────── feedback: named events ─────────────────────────

// lights is one generation further from where it started, and after FIRE_GEN generations it cannot spread. So one
// spark burns a ragged patch a metre or two across and goes out. Damp ground and thin grass do not catch. Burned
// ground is charred and cannot burn again until its grass has grown back and REBURN seconds have passed (test-03's
// lesson). Water or rain puts a fire out at once. A burning square is only warm (130°), so heat alone never carries
// a fire on: only lava, embers and the spreading rule light grass.
const FIRE = [];

const NB8 = [-1, 1, -N, N, -N - 1, -N + 1, N - 1, N + 1];
function canBurn(c) {
  return W.inside[c] && W.mat[c] === SOIL && W.fire[c] === 0 && W.vent[c] === 0 && W.lava[c] <= 0.004 &&
    W.wd[c] < 0.01 && W.veg[c] > 0.2 && W.moist[c] < 0.6 && !rained(c) && W.time - W.burnAt[c] > REBURN;

function ignite(c, gen) {

  return true;
}
function fireStep(dt) {
  if (!FIRE.length) return;

  for (let k = FIRE.length - 1; k >= 0; k--) {
    const c = FIRE[k];
    if (wd[c] > 0.01 || rained(c)) {                 // water or rain: out at once, lightly charred
      fire[c] = 0; W.burnAt[c] = W.time; W.char[c] = Math.max(W.char[c], 0.4); out++;
      FIRE[k] = FIRE[FIRE.length - 1]; FIRE.pop(); continue;
    }

    veg[c] = Math.max(0, veg[c] - dt * 0.45);
    if (T[c] < 130) T[c] = 130;
    const g = W.fgen[c];
    if (g < FIRE_GEN && rnd() < dt * 2.2) {
      const n = c + NB8[(rnd() * 8) | 0];
      if (rnd() < veg[n] * (1 - W.moist[n])) ignite(n, g + 1);
    }
    if (flames > 0 && vr() < dt * 14 * Math.min(1, f + 0.3)) {
      flames--;

      SPAWN_ST = 2.2;
      spawn(x, W.top[c] + 0.03, z, (vr() - 0.5) * 0.12, 0.55 + vr() * 0.6, (vr() - 0.5) * 0.12, 0.28 + vr() * 0.3, 0.05 + vr() * 0.05, -0.12, -0.5, 1.0, 0.5 + vr() * 0.4, 0.1 + vr() * 0.1, 1);

      for (const d of NB8) { const n = c + d; if (W.fire[n] === 0 && W.char[n] < 0.3) W.char[n] = 0.2 + 0.15 * vr(); }

}

// ───────────────────────── stones and embers thrown by a volcano ─────────────────────────
// Designer, 2026-11-14: what a volcano throws is embers and small boulders, not more lava, so nothing it throws makes
// lava where it lands. An ember glows on the ground for a few seconds and goes out. A boulder rolls a little,
// glows as it cools and stays as a dark stone. Either can light the grass it lands on. One that falls in water
// hisses and sinks to the bed. A flow that runs over a stone swallows it. Stones are objects drawn as small faceted
// rocks, not cells of ground, so they never make a square.
const STONES = [];

function stoneLand(b, c) {
  const big = b.r > 0.75;

    vx: big ? b.vx * 0.3 : 0, vz: big ? b.vz * 0.3 : 0, roll: big ? 1.5 : 0, yaw: rnd() * TAU, seed: rnd() * 100 };
  STONES.push(s);

  return s;

function stonesStep(dt) {
  for (let i = STONES.length - 1; i >= 0; i--) {
    const s = STONES[i];
    if (s.roll > 0) {
      // a boulder rolls on downhill from where it lands, slowing, and stops within a second or two
      const e = CS, gx = (sampleField(W.h, s.x + e, s.z) - sampleField(W.h, s.x - e, s.z)) / (2 * e), gz = (sampleField(W.h, s.x, s.z + e) - sampleField(W.h, s.x, s.z - e)) / (2 * e);
      s.vx = (s.vx - gx * 7 * dt) * (1 - 2.2 * dt); s.vz = (s.vz - gz * 7 * dt) * (1 - 2.2 * dt);
      const nx = s.x + s.vx * dt, nz = s.z + s.vz * dt;
      if (W.inside[cellAt(nx, nz)]) { s.x = nx; s.z = nz; s.yaw += Math.hypot(s.vx, s.vz) * dt / Math.max(0.03, s.size); }
      s.roll -= dt;
      if (Math.hypot(s.vx, s.vz) < 0.04) s.roll = 0;
    }
    const c = cellAt(s.x, s.z);
    if (!W.inside[c] || W.vent[c] === 1 || W.lava[c] > s.size * 0.9) { STONES.splice(i, 1); continue; }   // swallowed by lava
    s.y = sampleField(W.h, s.x, s.z) + s.size * 0.35;
    if (s.heat > 0) {
      if (W.wd[c] > 0.02) {
        s.heat = 0; s.roll = 0;

        rippleAt(s.x, s.z, 0.04, 0.4); SND.hiss(0.4, s.x, s.z);
      }
      s.heat -= dt / (s.ember ? EMBER_LIFE : BOULDER_COOL) * (rained(c) ? 6 : 1);
      if (rained(c) && vr() < dt * 4 && STEAM_BUDGET > 0) { STEAM_BUDGET--; steam(s.x, s.y + s.size, s.z, 1, 0.25); }
      if (s.heat > 0.35 && W.fire[c] === 0) { if (ignite(c, 0)) W.T[c] = Math.max(W.T[c], 150); }
      if (s.ember && vr() < dt * 2 * s.heat) spawn(s.x, s.y + s.size, s.z, (vr() - 0.5) * 0.3, 0.6 + vr() * 0.6, (vr() - 0.5) * 0.3, 0.5, 0.018, 0, 1.5, 1.0, 0.55, 0.12, 1);
    }
    if (s.ember && s.heat <= 0) STONES.splice(i, 1);     // an ember burns out

}

// ───────────────────────── sound (looks only: it never touches the world) ─────────────────────────
// All made in code with WebAudio, nothing stored. World sounds: the rumble of an erupting volcano (deeper and louder
// with the level), soft rain, fire crackle and lava bubbling. Event sounds: hiss and steam, the thud of a vent
// opening, a stone landing, a well sealing. The 🔊 button steps through all on → world sounds quiet → off (M).

// ───────────────────────── tools: every tool writes into the same cells ─────────────────────────
const TOOLS = [

  { id: 'pour', icon: '💧', key: '2', side: 'tend', tip: 'Pour water (2)' },
  { id: 'rain', icon: '🌧️', key: '3', side: 'tend', tip: 'Rain: soaks the ground, puts fire out, hardens lava into lava stone (3)' },
  { id: 'raise', icon: '⛰️', key: '4', side: 'tend', tip: 'Raise land (4)' },
  { id: 'lower', icon: '⛏️', key: '5', side: 'tend', tip: 'Lower land: dig deep for a lava well (5)' },
  { id: 'vent', icon: '🌋', key: '6', side: 'wreck', tip: 'Open a vent; click it again to grow the volcano (6)' },

    for (let k = 0; k < 3; k++) {
      const a = vr() * TAU, d = Math.sqrt(vr()) * r * 0.8;
      spawn(hit.x + Math.cos(a) * d, hit.y + 2.2 + vr() * 0.6, hit.z + Math.sin(a) * d, 0, -3, 0, 1.5, 0.05, 0, 9, 0.55, 0.8, 1.0, 0.85);
    }
    if (vr() < 0.6) { const a = vr() * TAU, d = Math.sqrt(vr()) * r * 0.8; rippleAt(hit.x + Math.cos(a) * d, hit.z + Math.sin(a) * d, -0.025, 0.35); }

    // hiss of steam (see quench and setRock). It beats lava and fire decisively, as test-03 taught.

    let hot = 0;
    forBrush(hit.x, hit.z, rr, (c, f) => {

// ───────────────────────── the fixed-rate step ─────────────────────────
const PERF = { simMs: 0, simN: 0 };
function tick() {
  const t0 = performance.now();
  if (UI.down && UI.tool) {
    const hit = pick(UI.px, UI.py, UI.tool === 'poke');
    UI.hit = hit;
    if (hit) { applyTool(UI.tool, hit, UI.held, DT); UI.held++; }
  }
  STEAM_BUDGET = 5;
  volcanoStep(DT);
  LAVA.step(DT);
  updateTop(); updateInside();
  WATER.step(DT);
  worldRules(DT);
  fireStep(DT);
  stonesStep(DT);
  lavaShared(DT);
  W.time += DT;
  if ((W.tick & 3) === 0) shoreScan(DT * 4);
  // what a pointer or a falling drop meets: land, or water deep enough to read as water
  const { ps, top, wd } = W;
  for (let c = 0; c < NN; c++) ps[c] = top[c] + (wd[c] > 0.01 ? wd[c] : 0);
  W.tick++;
  PERF.simMs += performance.now() - t0; PERF.simN++;
}

// ───────────────────────── water A: virtual pipes on every cell ─────────────────────────
// The test-06 way, tidied. Each cell holds a depth and four outflows ("pipes") to its neighbours. Each step a pipe's
// flow keeps some of its momentum and is pushed by the difference in water surface, so water runs downhill, carries
// waves, and settles. Damping is stronger than in test-06 so a lake goes calm in a few seconds. Ice blocks the pipes.
const WATER = (() => {
  const w = new Float32Array(NN), fL = new Float32Array(NN), fR = new Float32Array(NN), fU = new Float32Array(NN), fD = new Float32Array(NN);
  const s = new Float32Array(NN), flow = new Float32Array(NN), ws = new Float32Array(NN), wflow = new Float32Array(NN);
  const K = 0.14;
  function substep() {
    const { top, inside, ice } = W;
    for (let c = 0; c < NN; c++) s[c] = top[c] + w[c];
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
      const c = j * N + i, d = w[c];
      if (d <= 0.0006 || !inside[c] || ice[c] > 0.5) { fL[c] = fR[c] = fU[c] = fD[c] = 0; continue; }
      const sc = s[c], damp = d > 0.1 ? 0.955 : d > 0.03 ? 0.9 : 0.7;
      let a = inside[c - 1] && ice[c - 1] <= 0.5 ? fL[c] * damp + K * (sc - s[c - 1]) : 0;
      let b = inside[c + 1] && ice[c + 1] <= 0.5 ? fR[c] * damp + K * (sc - s[c + 1]) : 0;
      let u = inside[c - N] && ice[c - N] <= 0.5 ? fU[c] * damp + K * (sc - s[c - N]) : 0;
      let v = inside[c + N] && ice[c + N] <= 0.5 ? fD[c] * damp + K * (sc - s[c + N]) : 0;
      if (a < 0) a = 0; if (b < 0) b = 0; if (u < 0) u = 0; if (v < 0) v = 0;
      const sum = a + b + u + v;
      if (sum > d) { const k = d / sum; a *= k; b *= k; u *= k; v *= k; }
      fL[c] = a; fR[c] = b; fU[c] = u; fD[c] = v;
    }
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
      const c = j * N + i;
      if (!inside[c]) continue;
      const inn = fR[c - 1] + fL[c + 1] + fD[c - N] + fU[c + N], out = fL[c] + fR[c] + fU[c] + fD[c];
      const nw = w[c] + inn - out;
      w[c] = nw > 0 ? nw : 0;
      flow[c] += ((inn > out ? inn : out) - flow[c]) * 0.2;
    }
  }
  return {
    name: 'A · pipes', letter: 'a',
    desc: 'Every cell holds water and pushes it to its neighbours through four pipes with momentum. Water flows, sloshes, then settles.',
    init(depth0) {
      w.set(depth0); fL.fill(0); fR.fill(0); fU.fill(0); fD.fill(0); flow.fill(0);
      W.wd = w; W.ws = ws; W.wflow = wflow;
    },
    step(dt) {
      substep(); substep(); substep();
      const top = W.top;
      for (let c = 0; c < NN; c++) {
        ws[c] = top[c] + w[c];
        const f = flow[c] * 260 - 0.08;
        wflow[c] = f > 0 ? (f > 1 ? 1 : f) : 0;
      }
    },
    pour(x, z, r, vol) {
      let sum = 0;
      forBrush(x, z, r, (c, f) => { sum += f; });
      if (sum > 0) forBrush(x, z, r, (c, f) => { w[c] += (vol * f) / sum; });
    },
    take(c, a) { const t = w[c] < a ? w[c] : a; w[c] -= t; return t; },
    cells() { return W.insideCount; },
    stats() { return 'every cell flows'; },
  };
})();


// ───────────────────────── lava D: rivers first ─────────────────────────
// Lava follows the land's own drainage lines. Each step every square with lava sends it to its single lowest
// neighbour (of eight), the way rain would drain, so lava runs in narrow rivers down the gullies and joins where
// they join. A river only holds so much: lava deeper than a channel's worth (CAP) spills sideways into the other
// lower neighbours, so a big eruption widens and forks its rivers, and a hollow fills until it brims over. The
// lowest neighbour is read live from the land plus lava, so digging a channel or raising a dam steers it, and a
// river that silts up with its own crust finds a new way. Cooling is as in B: moving lava stays hot, still lava
// stiffens. A poke pushes lava out from under the finger, and the drawing rings.
const LAVA = (() => {
  const inn = new Float32Array(NN), innH = new Float32Array(NN), out = new Float32Array(NN);

  const NX = [-1, 1, 0, 0, -1, 1, -1, 1], NZ = [0, 0, -1, 1, -1, -1, 1, 1];
  const ND = [1, 1, 1, 1, Math.SQRT2, Math.SQRT2, Math.SQRT2, Math.SQRT2];
  let active = 0;
  function addLava(c, a, heat) { const l = W.lava[c]; W.lheat[c] = (W.lheat[c] * l + a * heat) / (l + a); W.lava[c] = l + a; }
  return {
    name: 'D · rivers first', letter: 'd', ring: 2,
    desc: 'Every square sends its lava to its lowest neighbour, as rain would drain, so lava runs in the land\'s own drainage lines. Only what a channel cannot hold spills sideways.',
    init() { vents.length = 0; active = 0; },
    vent(v) { if (!vents.includes(v)) vents.push(v); },
    spill(x, z, vol) {
      let sum = 0; forBrush(x, z, 0.18, (c, f) => { sum += f; });
      if (sum > 0) forBrush(x, z, 0.18, (c, f) => { if (W.vent[c] !== 1) addLava(c, vol * f / sum, 1); });
    },
    step(dt) {
      const T = W.time, { h, lava, lheat, inside, top, vent, wd, lvx, lvz } = W;
      for (const v of vents) {
        if (T >= v.end) continue;
        const rate = RATE * v.k * Math.min(1, (v.end - T) / 1.5) * dt;
        let sum = 0; forBrush(v.x, v.z, 0.22, (c, f) => { sum += f; });
        forBrush(v.x, v.z, 0.22, (c, f) => { if (vent[c] !== 1) addLava(c, rate * f / sum, 1); });
      }
      inn.fill(0); innH.fill(0);
      active = 0;
      for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {

        let best = -1, bestDrop = YIELD;

          const n = c + NB[q];
          if (!inside[n]) continue;
          const drop = (s - top[n]) / ND[q];
          if (drop > bestDrop) { bestDrop = drop; best = q; }
        }
        let sent = 0;
        if (best >= 0) {
          const n = c + NB[best], f = Math.min(l * 0.5, (bestDrop - YIELD) * 0.4 * mob);
          inn[n] += f; innH[n] += f * ht; sent = f;

      }
    },
    poke(x, z, k) {

      forBrush(x, z, 0.32, (c, f) => { if (vent[c] !== 1 && lava[c] > 0.01) { const a = lava[c] * 0.45 * f * k; lava[c] -= a; took += a; heatSum += a * lheat[c]; } });
      if (took <= 0) return;
      forBrush(x, z, 0.75, (c, f, d) => { if (d > 0.3 && vent[c] !== 1 && W.inside[c]) ring += 1 - f; });
      forBrush(x, z, 0.75, (c, f, d) => { if (d > 0.3 && vent[c] !== 1 && W.inside[c]) addLava(c, took * (1 - f) / ring, heatSum / took); });
    },
    chill(x, z, r, dt) { forBrush(x, z, r, (c, f) => { if (W.lava[c] > 0) W.lheat[c] -= dt * f * 0.9; }); },
    remove(c) { W.lava[c] = 0; W.lheat[c] = 0; },
    cells() { return active; },
    stats() { return `${active} cells flowing`; },
    // the hot layer and the wells: B's convection rolls
    glsl: `
// B · flowing cells. The hot layer turns in slow convection rolls: a fixed field of currents, and the surface
// pattern is carried along it (two copies half a cycle apart, cross-faded). A poke stirs a swirl into the currents.
// the rolls are bent by a slow, large noise so they do not sit on a square grid
vec2 rollP(vec2 xz) { return xz + vec2(noise(xz * 0.22 + 3.0), noise(xz * 0.22 + 11.0)) * 2.6 - 1.3; }
vec2 rollVel(vec3 P) {
  vec2 p = rollP(P.xz);

}
`,

})();


// ───────────────────────── colour of the ground ─────────────────────────
function groundColours(texC) {
  const { mat, moist, veg, T, vent, shore, wd, inside, ice, top } = W;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, o = c * 4, m = MAT[mat[c]], wk = Math.min(1, moist[c] * 0.95);
    const hv = 0.94 + 0.12 * hash2(i * 1.7, j * 1.3);
    let r = lerp(m.dry[0], m.wet[0], wk) * hv, g = lerp(m.dry[1], m.wet[1], wk) * hv, b = lerp(m.dry[2], m.wet[2], wk) * hv;
    let e = 0;
    const v = veg[c];
    if (v > 0.01 && mat[c] === SOIL) {
      const lush = clamp(moist[c] * 1.4, 0, 1), a = Math.min(1, v * 1.5);
      const gr = lerp(0.74, 0.30, lush), gg = lerp(0.74, 0.60, lush), gb = lerp(0.36, 0.22, lush);
      r = lerp(r, gr * hv, a); g = lerp(g, gg * hv, a); b = lerp(b, gb * hv, a);
    }
    // the shoreline: a dark wet line at the water, a pale sand bank behind it
    const s = shore[c];
    if (s && (mat[c] === SOIL || mat[c] === SAND)) {
      const sc = s === 1 ? [0.58, 0.49, 0.34] : s === 2 ? [0.86, 0.78, 0.57] : [0.84, 0.78, 0.58];
      const a = s === 3 ? 0.35 : 0.85;
      r = lerp(r, sc[0], a); g = lerp(g, sc[1], a); b = lerp(b, sc[2], a);
    }
    // burned grass: charred dark ground that the grass covers again as it grows back
    if (W.char[c] > 0 && mat[c] === SOIL) { const a = W.char[c] * 0.85 * (W.burnAt[c] > -1e8 ? 1 - Math.min(1, v / (0.6 * W.vegMax[c] + 1e-3)) : 1); r = lerp(r, 0.12 * hv, a); g = lerp(g, 0.11 * hv, a); b = lerp(b, 0.10 * hv, a); }
    if (isRock(c)) { const a = rockAge(c); r = lerp(0.13, 0.40, a) * hv; g = lerp(0.12, 0.39, a) * hv; b = lerp(0.12, 0.40, a) * hv; }
    if (wd[c] > 0.02) { const a = smooth(0.02, 0.6, wd[c]) * 0.5; r = lerp(r, 0.30, a); g = lerp(g, 0.33, a); b = lerp(b, 0.22, a); }   // drowned floor: mud
    const t = T[c];
    if (t < 0 && wd[c] < 0.01) { const a = Math.min(0.9, -t / 8); r = lerp(r, 0.92, a); g = lerp(g, 0.96, a); b = lerp(b, 1.0, a); }   // frost
    if (t > 70) { const a = smooth(70, 220, t) * 0.8; r = lerp(r, 0.24, a); g = lerp(g, 0.17, a); b = lerp(b, 0.12, a); }          // scorch
    if (t > 300 && vent[c] !== 1) e = smooth(300, 650, t) * 0.5;
    if (W.fire[c] > 0) { const a = 0.5 + 0.5 * (1 - W.fire[c]); r = lerp(r, 0.13, a); g = lerp(g, 0.10, a); b = lerp(b, 0.06, a); e = Math.max(e, 0.1 + 0.12 * W.fire[c]); }   // burning grass: blackening, a faint glow; the flames carry it
    if (vent[c] === 1) { r = 0.24; g = 0.09; b = 0.07; e = 1; }
    else if (W.lava[c] > 0.004) { r = 0.11; g = 0.075; b = 0.065; e = W.lheat[c] * 0.85; }   // the sides of a flow
    else if (vent[c] === 2 && wd[c] < 0.01) e = Math.max(e, 0.12);
    if (!inside[c]) e = 0;
    texC[o] = r >= 1 ? 255 : (r * 255) | 0; texC[o + 1] = g >= 1 ? 255 : (g * 255) | 0; texC[o + 2] = b >= 1 ? 255 : (b * 255) | 0;
    texC[o + 3] = (e * 255) | 0;
  }
  if (FX.side) {
    // cells beyond the glass are never wet or grown over, but their colour blends into the land and lake bed just
    // inside: give each the colour of the ground just inside it
    for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
      const c = j * N + i;
      if (inside[c]) continue;
      let r = 0, g = 0, b = 0, n = 0;
      for (const k of [c - 1, c + 1, c - N, c + N, c - N - 1, c - N + 1, c + N - 1, c + N + 1]) if (inside[k]) { r += texC[k * 4]; g += texC[k * 4 + 1]; b += texC[k * 4 + 2]; n++; }
      if (n) { texC[c * 4] = r / n; texC[c * 4 + 1] = g / n; texC[c * 4 + 2] = b / n; }

}

      for (let k = 0; k < 10; k++) { S.at('vent', PEAK[0], PEAK[1], DT); S.run(0.2); }
      let maxStones = 0;
      for (let k = 0; k < 20; k++) { S.run(1); maxStones = Math.max(maxStones, STONES.length); }
      LAVA.spill = sp;
      const e = evs();
      landed = (e.bombstone || 0) + (e.ember || 0) + (e.bombwater || 0);
      let burned = 0; for (let c = 0; c < NN; c++) if (W.burnAt[c] > -1e8) burned++;
      out.bombs = { lavaSpillsFromBombs: spills, landed, boulders: STONES.filter((o) => !o.ember).length, embersLeft: STONES.filter((o) => o.ember).length, maxStonesAtOnce: maxStones, cellsBurned: burned, events: e };
    }
    reset();
    return out;
  },
};
try {
  alloc();
  const cv = document.getElementById('cv');
  renderInit(cv);
  inputInit();
  document.getElementById('name').innerHTML = '<b>' + LAVA.name + '</b><br>' + LAVA.desc;
  const me = document.getElementById('lnk-' + LAVA.letter); if (me) me.classList.add('on');
  if (FX.side) {
    const vb = document.getElementById('views'); vb.style.display = ''; vb.onclick = () => nextView();
    const fb = document.getElementById('fxbtn'), panel = document.getElementById('fxpanel');
    fb.style.display = '';
    const save = () => { try { localStorage.setItem('water-study-fx', JSON.stringify(Array.from(FXV))); } catch (e) { /* not kept */ } };
    const draw = () => {
      panel.innerHTML = FXLIST.map((f, i) => `<label><input type="checkbox" data-i="${i}" ${FXV[i] > 0.5 ? 'checked' : ''}><span>${f[1]}<small>${f[3]}</small></span></label>`).join('') +
        '<div class="row"><button data-all="1">All on</button><button data-all="0">All off</button><button data-all="d">Defaults</button></div>';
      for (const cb of panel.querySelectorAll('input')) cb.onchange = () => { FXV[+cb.dataset.i] = cb.checked ? 1 : 0; save(); };
      for (const b of panel.querySelectorAll('[data-all]')) b.onclick = () => { FXLIST.forEach((f, i) => { FXV[i] = b.dataset.all === 'd' ? f[2] : +b.dataset.all; }); save(); draw(); };
    };
    draw();
    fb.onclick = () => { panel.style.display = panel.style.display === 'block' ? 'none' : 'block'; };
    window.addEventListener('keydown', (e) => { if (e.key === 'e' || e.key === 'E') fb.onclick(); });
  }
  reset();
  if (FX.side) nextView(0);
  resize(); cameraUpdate();
  requestAnimationFrame(frame);
} catch (err) {
  document.getElementById('err').textContent = String(err && err.stack || err);
  console.error(err);
}
</script>
