<style>

'use strict';
// ═════════════════════════════ basics ═════════════════════════════

  b[13] = a[0]*a[9]*a[14]-a[0]*a[10]*a[13]-a[8]*a[1]*a[14]+a[8]*a[2]*a[13]+a[12]*a[1]*a[10]-a[12]*a[2]*a[9];

  b[14] = -a[0]*a[5]*a[14]+a[0]*a[6]*a[13]+a[4]*a[1]*a[14]-a[4]*a[2]*a[13]-a[12]*a[1]*a[6]+a[12]*a[2]*a[5];

// ═════════════════════════════ GL ═════════════════════════════
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { antialias: true, alpha: false });
const ERR = [];
if (!gl) { document.body.insertAdjacentHTML('beforeend', '<div id="err">This study needs WebGL2.</div>'); throw new Error('no webgl2'); }
const TQ = gl.getExtension('EXT_disjoint_timer_query_webgl2');
function prog(name, vs, fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) ERR.push(name + ': ' + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);

  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) ERR.push(name + ' link: ' + gl.getProgramInfoLog(p));

  return { p, u(n) { if (!(n in cache)) cache[n] = gl.getUniformLocation(p, n); return cache[n]; } };

// flat-shaded triangle soup, as test-06, plus a body part and its pivot on every vertex
// 13 floats per vertex: pos 3, normal 3, colour 3, part 1, pivot 3
const WH = [1, 1, 1];
class Geo {
  constructor(autoPiv) { this.v = []; this.k = 0; this.pt = 0; this.pv = [0, 0, 0]; this.autoPiv = !!autoPiv; }   // autoPiv: every piece pivots on its own centre (skeleton bones)
  P(part, piv) { this.pt = part; this.pv = piv || [0, 0, 0]; return this; }
  tri(a, b, c, col, ctr) {
    let nx = (b[1] - a[1]) * (c[2] - a[2]) - (b[2] - a[2]) * (c[1] - a[1]);
    let ny = (b[2] - a[2]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[2] - a[2]);
    let nz = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const l = Math.hypot(nx, ny, nz); if (l < 1e-9) return;
    nx /= l; ny /= l; nz /= l;
    if (ctr) {
      const mx = (a[0] + b[0] + c[0]) / 3 - ctr[0], my = (a[1] + b[1] + c[1]) / 3 - ctr[1], mz = (a[2] + b[2] + c[2]) / 3 - ctr[2];
      if (nx * mx + ny * my + nz * mz < 0) { const t = b; b = c; c = t; nx = -nx; ny = -ny; nz = -nz; }
    }
    const fr = (((Math.sin(++this.k * 12.9898) * 43758.5453) % 1) + 1) % 1, sh = 0.94 + 0.12 * fr;
    const r = col[0] * sh, g = col[1] * sh, bl = col[2] * sh, P = this.pt, V = this.pv;
    for (const p of [a, b, c]) this.v.push(p[0], p[1], p[2], nx, ny, nz, r, g, bl, P, V[0], V[1], V[2]);
  }
  quad(a, b, c, d, col, ctr) { this.tri(a, b, c, col, ctr); this.tri(a, c, d, col, ctr); }
  box(cx, cy, cz, sx, sy, sz, col) {
    const x0 = cx - sx / 2, x1 = cx + sx / 2, y0 = cy - sy / 2, y1 = cy + sy / 2, z0 = cz - sz / 2, z1 = cz + sz / 2, o = [cx, cy, cz];
    const p = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    for (const f of [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [3, 2, 6, 7], [0, 3, 7, 4], [1, 2, 6, 5]]) this.quad(p[f[0]], p[f[1]], p[f[2]], p[f[3]], col, o);
    return this;
  }
  ico(cx, cy, cz, rx, ry, rz, col, detail, wob) {

  }
  limb(a, b, r0, r1, sides, col, caps) {
    if (this.autoPiv) this.pv = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];

    const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;

  octa(cx, cy, cz, rx, ry, rz, col) {                    // eight faces: the cheapest little solid (eyes, paws, feet)
    if (this.autoPiv) this.pv = [cx, cy, cz];

  leaf(base, tip, hw, th, col, fwd) {                     // a flat leaf shape from base to tip, facing fwd (an ear)
    let u = [tip[0] - base[0], tip[1] - base[1], tip[2] - base[2]];
    const cr = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]], nm = (v) => { const l = Math.hypot(...v); return v.map(x => x / l); };

function setFox(v) { FOX = v; setSeg('foxv', v); }
setFox(FOX);
for (const b of document.querySelectorAll('#foxv button')) b.addEventListener('click', () => setFox(+b.dataset.v));
for (const b of document.querySelectorAll('#birdv button')) b.addEventListener('click', () => setBird(+b.dataset.v));
const SLOWB = document.getElementById('slow');
function setSlow(v) { SLOW = v; SLOWB.classList.toggle('on', v); }
SLOWB.addEventListener('click', () => setSlow(!SLOW));
document.getElementById('add').addEventListener('click', () => { audioOn(); addHundred(); });
document.getElementById('sub').addEventListener('click', () => { for (const a of A.slice()) if (a.extra) removeAnimal(a); });
document.getElementById('babies').addEventListener('click', () => { audioOn(); babies(); });
document.getElementById('strand').addEventListener('click', () => { audioOn(); strandFish(); });
document.getElementById('reset').addEventListener('click', () => baseCast());
document.getElementById('vol').addEventListener('input', e => { AU.vol = +e.target.value; audioOn(); if (AU.out) AU.out.gain.value = AU.vol; });
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase(); audioOn();
  if (k === '1') setTool('hand'); else if (k === '2') setTool('warm'); else if (k === '3') setTool('bolt'); else if (k === '4') setTool('fire'); else if (k === '5') setTool('cold');
  else if (k === 'm') setMode((MODE + 1) % 3); else if (k === 'g') setFlight(1 - FLIGHT); else if (k === 'v') setRabbit(3 - RABBIT); else if (k === 'n') setBird(3 - BIRD); else if (k === 'x') setFox(3 - FOX); else if (k === 's') setSlow(!SLOW);
  else if (k === 'h') addHundred(); else if (k === 'b') babies(); else if (k === 'f') strandFish(); else if (k === 'r') baseCast();
});
window.addEventListener('resize', resize);

// ═════════════════════════════ the frame ═════════════════════════════
const SUN = (() => { const v = [-0.45, 0.8, 0.4], l = Math.hypot(...v); return v.map(x => x / l); })();
const PVAO = gl.createVertexArray(), PVB = gl.createBuffer();
gl.bindVertexArray(PVAO); gl.bindBuffer(gl.ARRAY_BUFFER, PVB); gl.bufferData(gl.ARRAY_BUFFER, PBUF.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 36, 12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 36, 28);
gl.bindVertexArray(null);
const BGVAO = gl.createVertexArray();
const LP = new Float32Array(16), LC = new Float32Array(12), SCU = new Float32Array(32), FRU = new Float32Array(32), RIU = new Float32Array(40);
let DT = 0.016;
function lights(P) {
  const fl = FLASH;
  gl.uniform3fv(P.u('uSun'), SUN);
  gl.uniform3f(P.u('uSunCol'), 0.68, 0.63, 0.52);
  gl.uniform3f(P.u('uAmb'), 0.5 + 0.6 * fl, 0.56 + 0.6 * fl, 0.66 + 0.7 * fl);
  gl.uniform4fv(P.u('uL'), LP); gl.uniform3fv(P.u('uLC'), LC);
}
const STAT = { frame: [], cpu: [], sim: [], fill: [], gpu: [], last: performance.now(), q: null, qs: [] };
const avg = (a) => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
const push = (a, v) => { a.push(v); if (a.length > 60) a.shift(); };

function frame(now) {
  requestAnimationFrame(frame);
  const fdt = Math.min(0.05, (now - STAT.last) / 1000); push(STAT.frame, now - STAT.last); STAT.last = now;
  step(fdt * (SLOW ? 0.25 : 1), true);
}
function step(dt, render) {
  const c0 = performance.now();
  DT = dt; TIME += dt;
  FLASH = Math.max(0, FLASH - dt * 4);
  camUpdate(); handTrack();
  // simulate
  const s0 = performance.now();
  if (dt > 0) for (let i = A.length - 1; i >= 0; i--) { const a = A[i]; if (a) updateAnimal(a, dt); }   // a zero step would divide by zero in the speeds
  const s1 = performance.now();
  if (dt > 0) { drawHazards(dt); particlesStep(dt); }
  // fill instances
  const f0 = performance.now();
  drawAnimals();
  const f1 = performance.now();
  drawScenery();
  // lights: fires and warmth
  LP.fill(0); LC.fill(0); let li = 0;
  for (const f of FIRES) if (li < 4 && f.t < f.life) { LP.set([f.x, hAt(f.x, f.z) + 0.3, f.z, 0.9 + 0.2 * Math.sin(TIME * 23 + li)], li * 4); LC.set([1, 0.5, 0.15], li * 3); li++; }
  for (const w of WARMS) if (li < 4) { LP.set([w.x, hAt(w.x, w.z) + 0.4, w.z, 0.6 * Math.min(1, w.life - w.t)], li * 4); LC.set([1, 0.75, 0.4], li * 3); li++; }
  for (let i = 0; i < 8; i++) { const s = SCORCH[i]; SCU.set(s ? [s.x, s.z, s.r, s.w] : [0, 0, 1, 0], i * 4); const f = FROSTS[i]; FRU.set(f ? [f.x, f.z, f.r, f.w] : [0, 0, 1, 0], i * 4); }
  for (let i = 0; i < 10; i++) RIU.set(RIP[i], i * 4);
  if (!render) return;

  // render
  if (TQ && !STAT.q) { STAT.q = gl.createQuery(); gl.beginQuery(TQ.TIME_ELAPSED_EXT, STAT.q); }
  else if (TQ) STAT.q2 = 1;
  DRAWS = 0; TRIS = 0;
  gl.viewport(0, 0, cv.width, cv.height);
  gl.clearColor(0.012, 0.016, 0.04, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  // space
  gl.disable(gl.DEPTH_TEST); gl.useProgram(PB.p);
  gl.uniformMatrix4fv(PB.u('uInvVP'), false, IVP); gl.uniform3fv(PB.u('uCam'), CAM.eye); gl.uniform1f(PB.u('uTime'), TIME); gl.uniform1f(PB.u('uFlash'), FLASH);
  gl.bindVertexArray(BGVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); DRAWS++;
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
  // land and its cut-away
  gl.useProgram(PT.p); gl.uniformMatrix4fv(PT.u('uVP'), false, VP); lights(PT); gl.uniform1f(PT.u('uTime'), TIME); gl.uniform4fv(PT.u('uScorch'), SCU); gl.uniform4fv(PT.u('uFrost'), FRU);
  gl.uniform1f(PT.u('uClip'), RS); gl.bindVertexArray(TER.vao); gl.drawElements(gl.TRIANGLES, TER.n, gl.UNSIGNED_INT, 0); DRAWS++; TRIS += TER.n / 3;
  gl.uniform1f(PT.u('uClip'), 0); gl.bindVertexArray(RIM.vao); gl.drawElements(gl.TRIANGLES, RIM.n, gl.UNSIGNED_INT, 0); DRAWS++; TRIS += RIM.n / 3;
  // things
  gl.useProgram(PI_.p); gl.uniformMatrix4fv(PI_.u('uVP'), false, VP); lights(PI_); gl.uniform1f(PI_.u('uTime'), TIME); gl.uniform1f(PI_.u('uAlpha'), 1);
  for (const k of ['trunk', 'canopy', 'pine', 'tuft', 'flower', 'reed', 'lily']) M[k].draw(PI_);
  for (const k of ANIMAL_MESHES) M[k].draw(PI_);
  for (const k in SK) SK[k].draw(PI_);
  // water, ice, particles
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
  gl.useProgram(PW.p); gl.uniformMatrix4fv(PW.u('uVP'), false, VP); lights(PW); gl.uniform1f(PW.u('uTime'), TIME); gl.uniform3fv(PW.u('uCam'), CAM.eye); gl.uniform4fv(PW.u('uRip'), RIU); gl.uniform4fv(PW.u('uFrost'), FRU);
  gl.bindVertexArray(WAT.vao); gl.drawElements(gl.TRIANGLES, WAT.n, gl.UNSIGNED_INT, 0); DRAWS++;
  gl.useProgram(PI_.p); gl.uniform1f(PI_.u('uAlpha'), 0.45); M.ice.draw(PI_);
  if (PBN) {
    gl.useProgram(PP.p); gl.uniformMatrix4fv(PP.u('uVP'), false, VP); gl.uniform1f(PP.u('uPx'), cv.height / (2 * Math.tan(FOV / 2)));
    gl.bindVertexArray(PVAO); gl.bindBuffer(gl.ARRAY_BUFFER, PVB); gl.bufferSubData(gl.ARRAY_BUFFER, 0, PBUF, 0, PBN * 9);
    gl.drawArrays(gl.POINTS, 0, PBN); DRAWS++;
  }
  gl.depthMask(true); gl.disable(gl.BLEND);
  if (TQ && STAT.q && !STAT.q2) { gl.endQuery(TQ.TIME_ELAPSED_EXT); STAT.qs.push(STAT.q); STAT.q = null; }
  STAT.q2 = 0;
  if (TQ && STAT.qs.length) { const q = STAT.qs[0]; if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) { if (!gl.getParameter(TQ.GPU_DISJOINT_EXT)) push(STAT.gpu, gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6); gl.deleteQuery(q); STAT.qs.shift(); } }
  const c1 = performance.now();
  push(STAT.cpu, c1 - c0); push(STAT.sim, s1 - s0); push(STAT.fill, f1 - f0);
  if ((STAT.tick = (STAT.tick || 0) + 1) % 15 === 0) showStats();
}
const STATS = document.getElementById('stats');
function showStats() {
  const n = A.length, fr = avg(STAT.frame), sim = avg(STAT.sim), fill = avg(STAT.fill);
  const lines = [
    `frame   ${fr.toFixed(1)} ms   (${(1000 / fr).toFixed(0)} fps)`,
    `cpu     ${avg(STAT.cpu).toFixed(2)} ms` + (STAT.gpu.length ? `   gpu ${avg(STAT.gpu).toFixed(2)} ms` : ''),
    `animals ${n}   update ${sim.toFixed(2)} ms   pose ${fill.toFixed(2)} ms`,
    `        ${n ? ((sim + fill) * 1000 / n).toFixed(1) : '–'} µs each`,
    `draws   ${DRAWS}   tris ${(TRIS / 1000).toFixed(1)}k   points ${PBN}`,
    `motion  ${['test-06', 'bounce', 'bend'][MODE]}${SLOW ? '   slow ×¼' : ''}`,
  ];
  if (ERR.length) lines.push('ERR ' + ERR[0].slice(0, 120));
  STATS.textContent = lines.join('\n');
}
// for measuring from outside
window.STUDY = {
  get A() { return A; }, mode: setMode, rabbit: setRabbit, bird: setBird, fox: setFox, flight: setFlight, add: addHundred, reset: baseCast, babies, strand: strandFish, strike, fire: lightFire, cold: coldSnap, warm: warmth, poke, tris: TRIS_OF,
  // advance n steps of 1/60 s and draw the last one (for watching when the page is in a background tab)
  step(n) { for (let i = 0; i < (n || 1); i++) step(1 / 60 * (SLOW ? 0.25 : 1), i === (n || 1) - 1); return TIME.toFixed(2); },
  follow(sp, i) { const l = A.filter(a => a.sp === sp); CAM.follow = l[i || 0] || null; CAM.dist = 1.4; CAM.pitch = 0.35; return !!CAM.follow; },
  // fixed-step timing that does not depend on the frame rate: n steps of update + pose, and n full draws finished on the GPU
  bench(n) {
    n = n || 200; let sim = 0, fill = 0;
    for (let i = 0; i < n; i++) { const t0 = performance.now(); for (let j = A.length - 1; j >= 0; j--) { const a = A[j]; if (a) updateAnimal(a, 1 / 60); } const t1 = performance.now(); drawAnimals(); fill += performance.now() - t1; sim += t1 - t0; TIME += 1 / 60; }
    return { animals: A.length, updateMs: sim / n, poseMs: fill / n, usEach: (sim + fill) / n * 1000 / A.length };
  },
  stats() { return { frame: avg(STAT.frame), cpu: avg(STAT.cpu), sim: avg(STAT.sim), fill: avg(STAT.fill), gpu: STAT.gpu.length ? avg(STAT.gpu) : null, animals: A.length, draws: DRAWS, tris: TRIS, errors: ERR.slice() }; },
};
resize(); baseCast(); setMode(2); requestAnimationFrame(frame);
</script>
