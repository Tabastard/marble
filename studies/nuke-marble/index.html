<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nuke in the marble · Effect Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="studio/studio.css">
</head>
<body>
<script src="studio/marble-glass.js"></script>
<script src="studio/studio.js"></script>
<script>
'use strict';
/* ======================================================================
   NUKE IN THE MARBLE: the nuke (../nuke/) set off inside the 1st Choice glass sphere, which is tight round it.
   The cap squeezes against the dome and rolls down the walls, the shock bounces off the glass, dust and fire stop at it,
   smoke leaves soot that clears slowly, and the hot cloud makes the glass glow where it first touches.
   The studio's marble mode (studio/, BUILDER.md) draws space, the sky inside, the cut-away earth and the glass.
   ====================================================================== */

/* ---------- shaders ---------- */

const G_CRATER=`
uniform vec4 uCrater;
float craterH(float r){float x=r/uCrater.x;float b=-uCrater.y*pow(max(1.-x*x,0.),1.5);float m=uCrater.z*exp(-pow((x-1.1)/.26,2.));return (b+m)*uCrater.w;}`;
const G_LIGHT=`
uniform vec3 uSunDir,uSunCol,uAmbTop,uAmbBot,uBlastPos,uBlastCol,uFogCol,uCam;
uniform float uBlastR,uFogK;
uniform vec4 uCloudSh,uCloudSh2;
float cloudShadow(vec3 p){
  if(uSunDir.y<.04)return 1.;
  vec2 c=p.xz+uSunDir.xz*((uCloudSh2.x-p.y)/uSunDir.y);
  float s=uCloudSh.w*(1.-ss(uCloudSh.z*.5,uCloudSh.z*1.1,length(c-uCloudSh.xy)));
  vec2 b=uCloudSh.xy-uSunDir.xz*(uCloudSh2.x/uSunDir.y);
  float h=clamp(dot(p.xz,b)/max(dot(b,b),1e-3),0.,1.);
  float ds=length(p.xz-b*h);
  s=max(s,uCloudSh2.z*(1.-ss(uCloudSh2.y*.7,uCloudSh2.y*1.7,ds)));
  return 1.-s;
}`;

/* ---------- ground fire: reads the baked spread map, so it is a pure function of time ---------- */
const G_FIRE=`
precision highp sampler2D;
uniform sampler2D uFire;uniform vec4 uFireA,uFireB;uniform vec3 uShockT;
float shockAt(float r){return r<uShockT.z?uShockT.x+uShockT.y*(1.-sqrt(max(1.-r/uShockT.z,0.))):1e5;}
float fireLit(float lit,float r){float a=shockAt(r);return max(uFireA.z+lit*uFireA.w,a<1e4?a+.35:0.);}`;
/* ---------- ground ---------- */
const VS_GROUND=`#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
uniform mat4 uVP;
${G_CRATER}
out vec3 vW;
void main(){vW=vec3(aPos.x,craterH(length(aPos)),aPos.y);gl_Position=uVP*vec4(vW,1.);}`;
const FS_GROUND=FH+`
in vec3 vW;out vec4 o;
uniform sampler2D uShadow;uniform vec2 uRes,uSeed2;uniform float uT;
uniform vec4 uScorch,uEmber,uShock,uShock2;uniform vec2 uScF;
${G_MARBLE}
${G_COMMON}
${G_CRATER}
${G_LIGHT}
${G_FIRE}
float h21(vec2 p){uvec2 q=uvec2(ivec2(floor(p)));q*=uvec2(1597334673u,3812015801u);uint n=(q.x^q.y)*1597334673u;return float(n)*(1./4294967295.);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float fbm2(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+17.3;a*=.5;}return s;}
uniform vec4 uFireC,uFireD,uFireE,uFireF; // F: burnout width, hold, heat, break  // C: heat, falloff, texture, scale  D: churn, edge break, glow, glow reach  E: ember bed, bed fade, scar, rim speed
vec3 fireCell(vec4 s,float r,float n,float em,float pb){ // x: temperature, y: how burnt, z: light thrown ahead of the rim
  if(s.b<.02)return vec3(0.);
  float dt=uT-fireLit(s.r,r),burn=max(s.g*uFireB.x,.1);
  if(dt<0.)return vec3(0.,0.,uFireD.z*exp(dt*uFireE.w/max(uFireD.w,1.)));
  float pw=ss(1.-uFireF.x,1.,s.a),hold=burn+pw*uFireF.y*max(1.+uFireF.w*(pb-.5)*1.8,.1),u=dt/hold; // land nearest the perimeter burns longest
  float T=uFireC.x*mix(1.,uFireF.z,pw)*ss(0.,.12,dt)*pow(max(1.-u,0.),mix(uFireC.y,.35,pw))*(.2+.36*n);
  float bed=max(exp(-max(dt-hold*.8,0.)/max(uFireE.y,.1))-.12,0.)/.88; // reaches true zero instead of leaving a faint wash
  T=max(T,.13*uFireE.x*em*ss(.35,.8,u)*bed);
  return vec3(T*(1.-ss(.988,1.,s.a)),ss(.05,.7,dt/burn),0.);
}
void main(){
  vec3 p=vW;if(marbleOff(p))discard;float r=length(p.xz);vec2 dir=p.xz/max(r,1e-3);
  float dh=(craterH(r+.8)-craterH(r-.8))/1.6;
  vec3 n=normalize(vec3(-dh*dir.x,1.,-dh*dir.y));
  float cd=length(p-uCam);
  float fN=1.-ss(250.,1400.,cd),fF=1.-ss(40.,300.,cd);
  float nA=fbm2(p.xz*.0035+uSeed2),nB=fbm2(p.xz*.028+uSeed2.yx),nC=vn(p.xz*.37),nD=vn(p.xz*2.9);
  vec3 alb=mix(vec3(.215,.16,.098),vec3(.33,.262,.165),nA);
  alb=mix(alb,vec3(.17,.20,.085),ss(.46,.72,nB)*.6);
  alb*=mix(1.,.70+.60*nC,fN);alb*=mix(1.,.84+.32*nD,fF);
  // scorch: glass / char / singe, edges broken up by angular + radial noise
  float aN=fbm2(dir*2.6+uSeed2*3.)-.5,stN=vn(dir*19.+r*.004+uSeed2)-.5,pN=vn(p.xz*.045+7.)-.5;
  float rn=r*(1.+.30*aN+.14*pN);
  float front=ss(uScF.x,uScF.x*.75,r)*uScF.y;
  float glass=(1.-ss(uScorch.x*.75,uScorch.x*1.12,rn))*front;
  float charr=(1.-ss(uScorch.y*.6,uScorch.y*1.15,rn*(1.+.35*stN)))*front;
  float singe=(1.-ss(uScorch.z*.4,uScorch.z*1.2,rn*(1.+.7*stN)))*front;
  alb=mix(alb,vec3(.15,.095,.05),singe*.8);
  alb=mix(alb,vec3(.026,.022,.020),charr*.96);
  alb=mix(alb,vec3(.009,.009,.011),glass);
  float fT=0.,fG=0.;
  if(uFireB.y>0.&&r*uFireA.x<.72){
    float fReach=.5/(uFireA.x*1.15),fEdge=1.-ss(.88,1.,r/fReach);
    vec2 wp=p.xz;
    if(uFireD.y>0.)wp+=(vec2(vn(p.xz*.03+uSeed2),vn(p.xz*.03+uSeed2.yx+9.))-.5)*uFireD.y*2.+(vec2(vn(p.xz*.13+3.),vn(p.xz*.13+21.))-.5)*uFireD.y*.7;
    float wr=length(wp);vec2 fuv=wp*uFireA.x+.5,cc=floor(fuv*uFireA.y);
    vec4 fm=texture(uFire,fuv);
    if(fm.b>.004){
      float pb=.6*vn(p.xz*.018+uSeed2*2.)+.4*vn(p.xz*.07+uSeed2.yx);
      float dq=uT-fireLit(fm.r,wr),fn=.5;
      if(dq>-1.&&dq<fm.g*uFireB.x+uFireE.y*5.){ // only land that is glowing pays for the moving texture
        float sc=uFireC.w,ch=uFireD.x,n1=clamp((fbm2(p.xz*.2*sc-dir*uT*2.2*ch+uSeed2)-.24)/.46,0.,1.),n2=vn(p.xz*.9*sc+vec2(uT*3.1,-uT*2.3)*ch);
        fn=clamp(.5+(.68*n1+.32*n2-.5)*uFireC.z*1.6,0.,1.);
      }
      vec3 fs=fireCell(fm,wr,fn,.45+.55*vn(p.xz*.09+uSeed2*5.),pb);
      if(uFireB.z>.001){ // the study's look: hard cells, a stepped palette and a 25 Hz flicker per cell
        float rc=length((cc+.5)/uFireA.y-.5)/uFireA.x;
        vec3 fp=fireCell(texelFetch(uFire,ivec2(cc),0),rc,h21(cc+floor(uT*25.)*vec2(13.,7.)),.45+.55*h21(cc),pb);
        fp.x=floor(fp.x*14.+.5)/14.;fs=mix(fs,fp,uFireB.z);
      }
      // soot darkens what is already there, so the glass, char and blast streaks stay readable through the scar
      float sa=fm.a*(1.+.025*stN),scar=fs.y*(1.-.4*ss(.9,.985,sa))*(1.-ss(.975,1.01,sa))*uFireE.z; // the burn runs right out to the perimeter
      alb=mix(alb,alb*.3+vec3(.007,.006,.005),scar);fT=fs.x;fG=fs.z*fEdge;
    }
  }
  vec2 sm=texture(uShadow,gl_FragCoord.xy/uRes).rg;
  float csh=cloudShadow(p);
  vec3 col=alb*(uSunCol*max(dot(n,uSunDir),0.)*sm.r*csh+mix(uAmbBot,uAmbTop,.5+.5*n.y));
  vec3 lv=uBlastPos-p;float d2=dot(lv,lv);vec3 ld=lv*inversesqrt(d2);
  float att=1./(1.+d2/(uBlastR*uBlastR));
  col+=alb*uBlastCol*att*(max(dot(n,ld),0.)*.65+.35)*sm.g;
  vec3 v=normalize(uCam-p);
  col+=uSunCol*pow(max(dot(n,normalize(uSunDir+v)),0.),90.)*glass*.5*sm.r*csh;
  col+=uBlastCol*att*pow(max(dot(n,normalize(ld+v)),0.),40.)*glass*.2;
  // embers in the scar + molten crater
  float em=ss(.58,.9,vn(p.xz*.62+uSeed2*9.))*ss(.35,.85,vn(p.xz*2.7+3.));
  float fl=.62+.38*sin(uT*2.7+vn(p.xz*.21)*25.);
  float zone=clamp(charr*(1.-.6*glass)+singe*.1,0.,1.);
  col+=heat(uEmber.x*(.55+.7*em))*em*zone*uEmber.y*fl*mix(.25,1.,fN);
  col+=heat(uEmber.z*(.7+.6*nC))*glass*uEmber.w;
  if(fT>0.)col+=heat(fT)*uFireB.y;
  if(fG>.001)col+=alb*vec3(1.,.42,.12)*fG*uFireB.y*2.5;
  // shock front on the ground
  float ring=exp(-pow((r-uShock.x)/uShock.y,2.))*uShock.z;
  float wake=ss(uShock.x-uShock.y*7.,uShock.x,r)*step(r,uShock.x)*uShock.z;
  // the shock that bounced off the glass, running back in
  float ring2=exp(-pow((r-uShock2.x)/uShock2.y,2.))*uShock2.z;
  float wake2=ss(uShock2.x+uShock2.y*5.,uShock2.x,r)*step(uShock2.x,r)*uShock2.z;
  col=mix(col,vec3(.60,.53,.42)*(uSunCol*.45+uAmbTop+uBlastCol*att*.5),clamp(ring*.6+wake*.25+ring2*.6+wake2*.18,0.,1.));
  col=mix(col,uFogCol,1.-exp(-cd*uFogK));
  o=vec4(col,1.);
}`;

/* ---------- trees (+ bomb) ---------- */
const G_TREE=`
layout(location=0) in vec3 aPos;layout(location=1) in vec3 aNrm;layout(location=2) in float aPart;
layout(location=3) in vec4 iPos;layout(location=4) in vec4 iRnd;
uniform mat4 uVP;uniform float uT,uMode;uniform vec4 uShockP,uTreeP,uShockB;uniform vec3 uBomb;
${G_COMMON}
${G_CRATER}
${G_FIRE}
vec3 treeWorld(out vec3 nrm,out float charA){
  if(uMode>.5){nrm=aNrm;charA=0.;return aPos*uBomb.y+vec3(0.,uBomb.x,0.);}
  float cr=cos(iPos.w),sr=sin(iPos.w);
  vec2 gp=iPos.xy;float dist=length(gp);vec2 dir=gp/max(dist,1e-3);
  float aDet=uT-uTreeP.w;
  float cz=1.-ss(uTreeP.y*.55,uTreeP.y*1.05,dist*(.85+.3*iRnd.x));
  charA=aDet>0.?cz*ss(0.,1.2,aDet):0.;
  if(uFireB.y>0.&&dist*uFireA.x<.72){vec4 fs=textureLod(uFire,gp*uFireA.x+.5,0.);if(fs.b>.02)charA=max(charA,ss(.05,.6,(uT-fireLit(fs.r,dist))/max(fs.g*uFireB.x,.1)));}
  vec3 lp=aPos;
  if(aPart>.5){lp.xz*=1.-.82*charA;}
  lp=vec3(lp.x*cr-lp.z*sr,lp.y,lp.x*sr+lp.z*cr)*iPos.z;
  vec3 n=vec3(aNrm.x*cr-aNrm.z*sr,aNrm.y,aNrm.x*sr+aNrm.z*cr);
  if(aDet>0.&&dist<uTreeP.z)lp*=0.;
  float ang=0.;
  if(uShockP.w>.5&&dist<uShockP.z){
    float tArr=uShockP.x+uShockP.y*(1.-sqrt(max(1.-dist/uShockP.z,0.)));
    float a=uT-tArr;
    if(a>0.){
      float within=1.-ss(uTreeP.x*.8,uTreeP.x*1.1,dist*(.9+.2*iRnd.y));
      float x=a/(.5+.5*iRnd.z);
      float f=x<1.?x*x:1.-.07*exp(-(x-1.)*4.)*abs(sin((x-1.)*9.));
      ang=within*f*(1.5-.12*iRnd.w);
      ang+=(1.-within)*.3*exp(-a*1.1)*sin(a*6.+iRnd.x*6.)*ss(uShockP.z,uTreeP.x,dist);
      float rr=2.*uShockB.x-dist; // the bounce reaches this tree when the outgoing shock would have reached rr
      if(uShockB.y>0.&&uShockB.x<uShockP.z&&rr<uShockP.z){float b=uT-(uShockP.x+uShockP.y*(1.-sqrt(max(1.-rr/uShockP.z,0.))));
        if(b>0.)ang-=(1.-within)*.22*uShockB.y*exp(-b*1.3)*sin(b*6.+iRnd.y*6.);}
    }
  }
  float ca=cos(ang),sa=sin(ang);
  float al=dot(lp.xz,dir);vec2 pp=lp.xz-dir*al;
  float al2=al*ca+lp.y*sa,y2=-al*sa+lp.y*ca;
  lp=vec3(pp.x+dir.x*al2,y2,pp.y+dir.y*al2);
  float nl=dot(n.xz,dir);vec2 np=n.xz-dir*nl;
  float nl2=nl*ca+n.y*sa,ny2=-nl*sa+n.y*ca;
  nrm=vec3(np.x+dir.x*nl2,ny2,np.y+dir.y*nl2);
  float gy=craterH(dist);
  vec3 w=vec3(gp.x,gy,gp.y)+lp;w.y=max(w.y,gy+.04);
  return w;
}`;
const VS_TREE=`#version 300 es
precision highp float;
${G_TREE}
out vec3 vN,vW;out float vPart,vChar;out vec4 vRnd;
void main(){vec3 n;float ch;vec3 w=treeWorld(n,ch);vN=n;vW=w;vPart=aPart;vChar=ch;vRnd=iRnd;gl_Position=uVP*vec4(w,1.);}`;
const FS_TREE=FH+`
in vec3 vN,vW;in float vPart,vChar;in vec4 vRnd;out vec4 o;
uniform float uT,uMode;uniform vec4 uEmber;
${G_COMMON}
${G_LIGHT}
void main(){
  vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;
  vec3 alb=vPart<.5?vec3(.20,.14,.09):mix(vec3(.07,.17,.05),vec3(.17,.26,.07),vRnd.x);
  if(uMode>.5)alb=vec3(.10,.115,.10);
  alb=mix(alb,vec3(.012,.011,.010),vChar*.96);
  vec3 col=alb*(uSunCol*max(dot(n,uSunDir),0.)*cloudShadow(vW)+mix(uAmbBot,uAmbTop,n.y*.5+.5));
  vec3 lv=uBlastPos-vW;float d2=dot(lv,lv);
  col+=alb*uBlastCol/(1.+d2/(uBlastR*uBlastR))*(max(dot(n,lv*inversesqrt(d2)),0.)*.8+.2);
  float fl=.55+.45*sin(uT*5.+vRnd.y*40.+vW.y*1.3);
  col+=heat(uEmber.x*(.7+.5*vRnd.z))*vChar*uEmber.y*fl*.5;
  col=mix(col,uFogCol,1.-exp(-length(vW-uCam)*uFogK));
  o=vec4(col,1.);
}`;
const VS_SHADOW=`#version 300 es
precision highp float;
${G_TREE}
uniform vec4 uShL;
void main(){
  vec3 n;float ch;vec3 w=treeWorld(n,ch);vec3 g;
  if(uShL.w<.5){g=w-uShL.xyz*(w.y/uShL.y);}
  else{float s=uShL.y/max(uShL.y-w.y,uShL.y*.02);g=uShL.xyz+(w-uShL.xyz)*s;}
  g.y=craterH(length(g.xz))+.03;
  gl_Position=uVP*vec4(g,1.);
}`;
const FS_BLACK=FH+`out vec4 o;void main(){o=vec4(0.);}`;

/* ---------- the volume ---------- */
const FS_VOL=FH+`
in vec2 vUv;out vec4 o;
uniform sampler2D uDepth;uniform sampler3D uNoise;
uniform mat4 uInvVP;uniform vec3 uCam,uSeed,uBMin,uBMax,uHeadC;
uniform vec4 uHead,uHeadN,uHeadH,uHeadX,uStem,uStemN,uStemF,uSkirt,uSurge,uShell,uRing,uPil,uWind,uStep,uQ;
uniform ivec2 uQi;uniform float uJit,uFogK,uGlowR;
uniform vec4 uSph,uSq,uWallP,uWallQ,uSkirt2;uniform sampler3D uWall; // the glass: centre and radius; squeeze; wall smoke; the bounced dust ring
uniform vec3 uSunDir,uSunCol,uAmbTop,uAmbBot,uFogCol,uGlowPos,uGlowCol,uColHead,uColStem,uColDust;
uniform vec4 uLtPos[2];uniform vec3 uLtCol[2];
${G_COMMON}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec3 gRd; // this pixel's ray, for the wall smoke
// the glass: the head is squeezed into the last stretch inside the sphere, so a cap that would pass the glass flattens against it
vec3 squash(vec3 p,out float st){vec3 v=p-uSph.xyz;float R=uSph.w,s=length(v)/R,k=uSq.x;st=1.;if(s<=k||uSq.y<=1.)return p;
  float x=min((s-k)/(1.-k),1.),s2=k+(1.-k)*(x+(uSq.y-1.)*x*x);st=max(1.+2.*(uSq.y-1.)*x,s2/s);return uSph.xyz+v*(s2/s);}
// wind: height-dependent shear applied to the sample position
vec3 warp(vec3 p){float s=.2+.8*pow(clamp(p.y/uWind.z,0.,1.6),1.3);p.xz-=uWind.xy*s;return p;}

// head = torus (major R, minor a) smooth-unioned with a dome; R=0 gives the fireball sphere
float headSD(vec3 q,out float base,out vec2 q2,out float rho){
  float S=uHead.x,kt=uHead.y,fl=uHead.z;
  float R=kt*S,a=(1.-kt)*S;
  rho=length(q.xz);float y=q.y/fl;
  q2=vec2(rho-R,y);
  float dT=length(q2)-a;
  float mm=clamp(kt*2.,0.,1.);
  float eh=S*(1.-.06*mm),ev=a*(1.+.12*mm);
  float dE=(length(vec2(rho/eh,(y-.22*a*mm)/ev))-1.)*min(eh,ev);
  dE=max(dE,-.3*a*mm-y);
  float d=smin(dT,dE,.3*a);
  base=clamp(-d/(.62*a),0.,1.);
  return d*fl*.85;
}
// noise lookups: Pr rotates poloidally about the ring core (the roll), Pa scrolls up the axis
void headCoords(vec3 q,vec2 q2,float rho,out vec3 Pr,out vec3 Pa,out float w){
  float S=uHead.x,R=uHead.y*S;
  w=ss(.06*S,.38*S,rho);
  vec2 dir=q.xz/max(rho,1e-4);
  vec2 r2=vec2(q2.x*uHeadX.z-q2.y*uHeadX.w,q2.x*uHeadX.w+q2.y*uHeadX.z);
  float rr=r2.x+R;
  Pr=vec3(dir.x*rr,r2.y,dir.y*rr)/S*uHeadN.x+uSeed+vec3(0.,uHeadX.y,0.);
  Pa=vec3(q.x,q.y/uHead.z-uHeadX.x*S,q.z)/S*uHeadN.x+uSeed.zxy+vec3(0.,uHeadX.y,0.);
}
float headN(vec3 Pr,vec3 Pa,float w,float lod){
  float n=0.;
  if(w>.001)n+=w*textureLod(uNoise,Pr,lod).r;
  if(w<.999)n+=(1.-w)*textureLod(uNoise,Pa,lod).r;
  return n;
}
float headG(vec3 Pr,vec3 Pa,float w){
  float n=0.;
  if(w>.001)n+=w*textureLod(uNoise,Pr*3.3,0.).g;
  if(w<.999)n+=(1.-w)*textureLod(uNoise,Pa*3.3,0.).g;
  return n;
}
vec3 stemP(vec3 p){return vec3(p.x,(p.y-uStemN.y)*.55,p.z)*uStemN.x+uSeed.yzx;}
float stemSD(vec3 p,float rho,out float base){
  float top=uStem.y,r0=uStem.x;
  float h=clamp(p.y/max(top,1.),0.,1.);
  float rad=r0*(1.+uStemF.x*exp(-p.y/(r0*1.6))+uStemF.y*ss(.72,1.,h));
  base=clamp((rad-rho)/(.75*rad),0.,1.)*ss(top,top-r0*1.2,p.y);
  return max(rho-rad,p.y-top)*.6;
}
// cheap density for light taps (head + stem, low mip, no detail)
float sigLo(vec3 pw){
  vec3 p=warp(pw);float s=0.,st;
  if(uHead.w>0.){
    float base,rho;vec2 q2;vec3 q=warp(squash(pw,st))-uHeadC;
    if(headSD(q,base,q2,rho)<0.){
      vec3 Pr,Pa;float w;headCoords(q,q2,rho,Pr,Pa,w);
      float n=headN(Pr,Pa,w,1.5);
      s+=clamp((base-uHeadN.y*(1.-n))/.13,0.,1.)*uHeadN.w;
    }
  }
  if(uStem.z>0.){
    float base;
    if(stemSD(p,length(p.xz),base)<0.){
      float n=textureLod(uNoise,stemP(p),1.5).r;
      s+=clamp((base-uStemN.z*(1.-n))/.15,0.,1.)*uStem.w;
    }
  }
  return s;
}
// full field. returns conservative distance to the nearest component bound (<0 = inside one)

    ['stall.roll','Roll down',0,20,.1,'How fast the pressed smoke rolls down the walls, in degrees a second'],['stall.sheet','Wall smoke',0,2,.05,'How much smoke stays pressed on the glass']]},
  {phase:'drift',c:[['drift.speed','Drift speed',0,4,.05],['drift.grey','Fade to grey',0,1,.01]],sep:true},
  {name:'Lens',full:'Glow, lightning, bloom, shake and exposure',c:[['glow.intensity','Glow',0,4,.05,'Inner glow intensity'],['glow.radius','Glow reach',.2,3,.05],['lightning.intensity','Lightning',0,5,.05,'Lightning intensity'],
    ['lightning.freq','Frequency',0,6,.05,'Lightning strikes per second'],['lightning.dur','Duration',.03,1,.01,'Lightning flicker duration (s)'],['post.bloom','Bloom',0,4,.05],['post.shake','Shake',0,3,.05,'Camera shake'],['post.adapt','Exposure dip',0,1.5,.05,'How far exposure drops after the flash'],['post.grain','Grain',0,2,.05,'Film grain']]},
  {name:'Glass',full:'The sphere, soot and the bounce',c:[['glass.radius','Sphere size',.15,1,.01,'Radius of the glass as a share of the shock\'s reach at the middle yield (900 m): 0.4 is 360 m. It stays put when the yield changes'],
    ['glass.soot','Soot',0,3,.05,'How dark the smoke leaves the glass'],['glass.clear','Soot clears',3,120,1,'How long soot takes to clear, in seconds (to about a third)'],
    ['glass.bounce','Bounce',0,1.5,.05,'Strength of the shock that bounces back off the glass'],['glass.heat','Heat glow',0,3,.05,'How brightly the glass glows where the hot cloud first touches it']]},

    ['ground.scorch3','Singe radius',20,1500,5,'Singed brown fringe'],['ground.emberDur','Ember time',0,120,1,'How long embers glow (s)'],['ground.trees','Trees',0,2000,10,'Tree count']]}

const NOTES=`
  <h3>Nuke in the marble</h3>
  <h4>Plan</h4>
  <p><b>The event.</b> A bomb goes off inside a small glass world floating in space. The cloud has nowhere to go: it hits the dome, flattens and spreads along the glass, then rolls down the walls. The shock rings off the glass and comes back. When it clears, the glass is left smudged with soot that slowly fades.</p>
  <p><b>Phases</b> (middle yield, seconds): Drop 0–1.5 · Flash 1.5 · Fireball 1.5–6.5 · Shock 1.6–7.6, reaching the glass about 1.3 s in and bouncing back as a weaker ring · Ground fire 2–18, out at the glass · Stem 2.5–16.5 · Cap 4.5–20.5, rising until it meets the dome · <b>Press</b> 16.5–30.5 (the nuke's Stall, renamed): the cap spreads along the inside of the glass and the pressed smoke rolls down the walls · Drift 27–51: the smoke swirls and thins, and the soot clears.</p>
  <p><b>The chain.</b> The flash lights the inside of the bubble. The shock hits the glass, jolts the marble and bounces back across the scorched ground, knocking the trees a second time. The fire burns out along the glass. The cap reaches the dome while still hot, so the glass glows briefly where it first touches. The smoke pressed on the glass leaves soot, and the soot outlives the cloud.</p>
  <p><b>Yield.</b> The sphere stays the same size, so the yield decides how tight it is. A small yield barely touches the glass: the shock reaches it weakly and the cap stays clear of the dome. The middle yield meets the dome and rolls down the walls. The biggest fills the upper sphere with churning smoke, soots most of the glass and pushes the fire out to the wall. The sphere's own size is on the Glass page.</p>
  <p><b>How each part is made.</b></p>
  <ul>
    <li><b>The world in the glass</b> is the studio's marble mode: the sky painted on the inside of the glass, space and stars outside, the land clipped to the disc where it meets the glass, the cut-away earth and lava below, and the 1st Choice glass laid over the finished frame.</li>
    <li><b>The squeeze</b> changes the space the head is drawn in. Inside 70% of the radius nothing changes. Beyond that, everything out to 1.3 radii is squeezed into the last 30%, so a cap that would pass the glass flattens against it instead of being cut off.</li>
    <li><b>The wall bake</b> is a baked field, like the fire. A map of the glass (48 round × 24 down, every quarter second) is run forward once from the settings. It records where the head presses, the pressed smoke flowing down to the land line, soot building and clearing, and a brief heat glow where the hot head first touches. The volume reads it as a sheet of smoke along the inside of the glass, with its billows flowing downward. The glass reads it for soot and heat.</li>
    <li><b>The bounce</b> is a ground hook and a volume ring: a second ring and dust skirt mirrored at the glass, running back inward.</li>
    <li><b>Stopping at the glass:</b> the volume is marched only inside the sphere, the dust skirt piles at the wall, the fire's bake has no fuel past the glass, and sparks that reach the glass stick there and fade.</li>
  </ul>
  <h4>What changed from the nuke</h4>
  <p>The cap's ceiling and size are held in by the dome, and the middle yield spreads less at the top (0.45 instead of 0.7) so it meets the glass rather than swallowing the sphere. The wind drift is held to a swirl, since the sphere is sealed. The camera shake comes from the shock hitting the glass, not from it reaching the camera. The haze is lighter, since the camera looks in from space. The Stall phase is now Press, with two more settings: Roll down and Wall smoke. There is a new Glass page, and the Glow page's settings moved onto Lens and Ground is called Land, so the row of page names still fits. Trees grow only inside the disc. The camera views frame the marble. Everything else is the nuke, with the same shaders and settings.</p>
  <h4>How the nuke is made</h4>
  <p>There is no fluid simulation and no smoke particles. The entire cloud is a closed-form density field, a pure function of (position, time, seed, settings), evaluated per pixel by a ray marcher. Because nothing is integrated frame to frame, the timeline can be scrubbed to any instant and a seed always replays identically. The head is a signed-distance shape (a torus smoothly joined to a dome), the stem a flared column, the dust a ground ring behind the shock front, each carved by a tiling 3D noise texture. The ground fire runs the fire study's spread rules once and the ground shader reads when each cell lit and how long it burned.</p>`;

/* ======================================================================
   THE EFFECT, HANDED TO THE STUDIO
   ====================================================================== */
let partTimer=0;
Studio.run({
  id:'nuke-marble',title:'Nuke in the marble',action:'Nuke',actionColor:'#a8322a',
  marble:{radius:()=>GW().R,glass:{glsl:GLASS_HOOK,set:setGlass}},
  phases:PHASES,defaults:DEF,pages:PAGES,notes:NOTES,
  size:{key:'yield',label:'Yield',apply:applyYield},
  height:()=>S.cap.ceiling,
  phone:S=>{S.q.volScale=.4;S.q.steps=40;S.q.renderScale=1;S.q.particles=1;S.fire.sparks=3000},
  changed(path){if(path==='seed'||path==='ground.trees'||path==='glass.radius')buildTrees();clearTimeout(partTimer);partTimer=setTimeout(buildParticles,120);
    clearTimeout(wallTimer);wallTimer=setTimeout(bakeWall,90)},
  rebuild(){buildTrees();buildParticles();bakeWall()},
  render,
  busyFrom:()=>S.flash.start,
  sheet(){const det=S.flash.start,sc=(Studio.total-1.5-det)/49.5;return[.3,1.6,4,10,17,27,42].map(tm=>{const ts=tm*sc;return{t:det+ts,label:'T+'+ts.toFixed(ts<10?2:1)+'s',note:'('+tm+'s ref)'}})},
  sheetInfo:()=>'sun '+S.g.sunElev+'° · steps '+S.q.steps,
  stats:()=>'fire bake  '+FIRE.ms.toFixed(0)+' ms · '+FIRE.N+' grid\nwall bake  '+WALL.ms.toFixed(0)+' ms · '+WALL.NS+' steps\nglass  '+GW().R.toFixed(0)+' m radius\nvolume  '+F.vw+'×'+F.vh,
});
/* the old test hooks still answer: NUKE.x reads the effect's own pieces first, then the studio's */
window.NUKE=new Proxy({FIRE,WALL,bakeFire,bakeWall,buildParticles,kin,GW},{get:(o,k)=>k in o?o[k]:STUDIO[k]});
</script>
