<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scale study</title>
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#dfe8f5;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.pane{position:fixed;background:rgba(18,22,34,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:12px}
#hud{left:14px;top:14px;padding:9px 12px;font:11px/1.5 ui-monospace,Menlo,monospace;color:#a9b8cc;white-space:pre;pointer-events:none;max-width:calc(100vw - 330px)}
#hud b{color:#eef3fa;font-weight:600}
#hud .k{color:#7d8ca3}
#panel{right:14px;top:14px;width:268px;padding:10px 12px 12px;color:#c9d5e6}
#panel h3{margin:10px 0 5px;font:600 11px system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#7f8ea6}
#panel h3:first-child{margin-top:0}
.seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:rgba(0,0,0,.22)}
.seg button{flex:1;border:0;background:transparent;color:#aebbd0;font:500 12px system-ui,sans-serif;padding:6px 0;border-radius:7px;cursor:pointer}
.seg button:hover{color:#fff;background:rgba(255,255,255,.07)}
.seg button.on{color:#fff;background:rgba(255,255,255,.18)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.presets button{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#c9d5e6;font:500 12px system-ui,sans-serif;padding:6px 4px;border-radius:8px;cursor:pointer;text-align:left}
.presets button small{display:block;color:#7f8ea6;font-size:10.5px;margin-top:1px}
.presets button:hover{background:rgba(255,255,255,.09)}
.presets button.on{background:rgba(255,255,255,.17);color:#fff;border-color:rgba(255,255,255,.22)}
.row{display:flex;align-items:center;gap:8px}
.row input{flex:1;accent-color:#c9d5e6}
.row span{font:11px ui-monospace,Menlo,monospace;color:#eef3fa;min-width:42px;text-align:right}
.note{font-size:11px;color:#7f8ea6;margin-top:3px}
.tools{display:flex;gap:4px;margin-top:10px}
.tools button{flex:1;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#c9d5e6;font:500 12px system-ui,sans-serif;padding:6px 0;border-radius:8px;cursor:pointer}
.tools button:hover{background:rgba(255,255,255,.1)}
#bench{font:11px/1.45 ui-monospace,Menlo,monospace;color:#a9b8cc;margin-top:6px;white-space:pre-wrap}
#err{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(60,10,10,.85);padding:14px 18px;border-radius:10px;display:none;white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;max-width:80vw}
@media (max-width:720px){#hud{max-width:none;right:14px;font-size:10px}#panel{top:auto;bottom:14px;left:14px;right:14px;width:auto}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="pane"></div>
<div id="panel" class="pane">
  <h3>Presets</h3>
  <div class="presets" id="presets"></div>
  <h3>Sim grid</h3>
  <div class="seg" id="segN"></div>
  <h3>Land mesh</h3>
  <div class="seg" id="segM"></div>
  <div class="note">Mesh vertices per sim cell, on each side. The land is drawn smooth between cells.</div>
  <h3>World scale</h3>
  <div class="row"><input type="range" id="sS" min="0.2" max="1.2" step="0.05"><span id="vS"></span></div>
  <div class="note">Shrinks trees, animals, flowers and rocks against the land. More of them fill it.</div>
  <h3>Animals against trees</h3>
  <div class="row"><input type="range" id="sA" min="0.25" max="1" step="0.05"><span id="vA"></span></div>
  <div class="note">1 is test-06, where a deer stands taller than a tree.</div>
  <div class="tools"><button id="bBench" title="Run 240 frames back to back and time them (B)">⏱ Time it</button><button id="bView" title="Back to the whole bubble (Esc)">◎ Whole view</button></div>
  <div id="bench"></div>
</div>
<div id="err"></div>

// ───────────────────────── Scale study ─────────────────────────
// test-06's look and models on a land whose sim grid, mesh density and world scale can be changed live.

// ───────── test-06/src/gl.js ─────────
// ───────────────────────── gl: a very small WebGL2 toolkit ─────────────────────────


const GLX = { gl: null, errors: [] };

function glInit(canvas) {

function mkProgram(name, vs, fs) {

// ── instanced mesh: per instance a mat4 + rgba (a = glow) ──
class InstMesh {
  constructor(geo, cap) {
    const gl = GLX.gl;

    this.ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);

  add(px, py, pz, yaw, pitch, roll, sx, sy, sz, r, g, b, e) {

    const o = this.n++ * 20, d = this.data;
    matTRS(d, o, px, py, pz, yaw, pitch, roll, sx, sy, sz);

  }

    if (!this.n) return;
    const gl = GLX.gl;

    if (this.dirty) { gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * 20); this.dirty = false; }

// ── a dynamic float buffer bound to a VAO (particles, immediate triangles) ──
class DynBuf {
  constructor(floats) {
    const gl = GLX.gl;
    this.vao = gl.createVertexArray(); this.buf = gl.createBuffer();
    gl.bindVertexArray(this.vao); gl.bindBuffer(gl.ARRAY_BUFFER, this.buf); gl.bufferData(gl.ARRAY_BUFFER, floats * 4, gl.DYNAMIC_DRAW);
  }
  upload(data, floats) {
    const gl = GLX.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    if (floats > 0) gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, floats);
  }

// ───────── test-06/src/models.js ─────────
// ───────────────────────── models: little low-poly shapes, built in code ─────────────────────────
// Pure white vertices take the per-instance tint; every other colour is kept as authored.


const M = {};
const WH = [1, 1, 1];

function modelsInit() {

const LAND_W = 2 * Math.sqrt(RR - Y0 * Y0);               // land width at the mean land level
const SQM_PER_ACRE = 4046.86;

// ───────────────────────── settings ─────────────────────────
const GRIDS = [96, 128, 192, 256], MESHES = [1, 2, 4];

// ───────────────────────── the land: one function of x and z, the same at every grid ─────────────────────────
// test-06's worldGen for seed 1, written per point so every grid resolution samples the same land.
const SOIL = 0, SAND = 1, ROCK = 2;
const MATCOL = [[0.72, 0.56, 0.37, 0.44, 0.31, 0.20], [0.92, 0.82, 0.58, 0.76, 0.66, 0.44], [0.58, 0.57, 0.60, 0.46, 0.46, 0.50]];
const GEN = (() => {
  const rng = mulberry(1 * 7919 + 13);
  const ang = rng() * TAU, ox = rng() * 100, oz = rng() * 100;
  return {
    ox, oz,
    mx: Math.cos(ang) * 4.4, mz: Math.sin(ang) * 4.4,
    lx: Math.cos(ang + 2.5) * 3.0, lz: Math.sin(ang + 2.5) * 3.0,
    dx: Math.cos(ang - 2.1) * 6.2, dz: Math.sin(ang - 2.1) * 6.2,
    lakeLevel: Y0 - 0.42,
  };
})();
const PT = { h: 0, w: 0, mat: 0, moist: 0, veg: 0, flo: 0, snow: 0 };
function genPoint(x, z) {
  const g = GEN;
  let e = Y0 + (fbm(x * 0.21 + g.ox, z * 0.21 + g.oz, 4) - 0.5) * 1.7 + (fbm(x * 0.9 + g.oz, z * 0.9 + g.ox, 2) - 0.5) * 0.18;
  const dm = Math.hypot(x - g.mx, z - g.mz);
  e += 2.75 * Math.exp(-dm * dm / (2 * 1.45 * 1.45)) * (0.82 + 0.36 * fbm(x * 0.8 + 3, z * 0.8 + 7, 3));
  const dl = Math.hypot(x - g.lx, z - g.lz);
  e -= 1.25 * Math.exp(-dl * dl / (2 * 1.9 * 1.9));
  let h = e, w = 0, mat = SOIL;
  if (dl < 4.6 && e < g.lakeLevel) w = g.lakeLevel - e;
  const dd = Math.hypot(x - g.dx, z - g.dz);
  const dune = Math.exp(-dd * dd / (2 * 1.7 * 1.7)) + (fbm(x * 0.7 + 40, z * 0.7 + 11, 2) - 0.5) * 0.5;
  if (dune > 0.55) { mat = SAND; h += 0.12 * Math.sin(x * 4 + z * 2.5) * (dune - 0.5); }
  else if (dl < 5 && e < g.lakeLevel + 0.13) mat = SAND;
  else if (e > Y0 + 1.75 + (fbm(x * 1.3, z * 1.3, 2) - 0.5) * 0.7) mat = ROCK;
  const T = 17 - 7.5 * (h - Y0);
  const moist = clamp(0.2 + 0.75 * Math.exp(-dl * dl / 10) + (fbm(x * 0.5 + 9, z * 0.5 + 2, 2) - 0.5) * 0.16, 0, 1);
  let veg = 0, flo = 0, snow = 0;
  if (mat === SOIL && w <= 0) {
    veg = clamp((moist > 0.26 ? 0.3 + moist * 0.6 : 0.3) + (fbm(x * 1.1 + 5, z * 1.1 + 5, 2) - 0.5) * 0.7, 0, 0.85);
    if (moist > 0.5 && fbm(x * 1.6 + 70, z * 1.6 + 31, 2) > 0.66 && T > 6) flo = 0.5 + 0.5 * fbm(x * 3 + 1, z * 3 + 2, 2);
  }
  if (T < -1.5) { snow = 0.24; veg = 0; flo = 0; }
  PT.h = h; PT.w = w; PT.mat = mat; PT.moist = moist; PT.veg = veg; PT.flo = flo; PT.snow = snow; PT.T = T;
  return PT;
}

// ───────────────────────── the grid ─────────────────────────
const W = {};
let N = 0, NN = 0, CS = 0;
function gridAlloc(size) {
  N = size; NN = N * N; CS = WORLD / (N - 1);
  for (const f of ['h', 'w', 'top', 'moist', 'moist0', 'veg', 'veg0', 'flo', 'snow', 'T', 'T0', 'fL', 'fR', 'fU', 'fD', 's', 'flow']) W[f] = new Float32Array(NN);
  W.mat = new Uint8Array(NN); W.inside = new Uint8Array(NN);
  W.xs = new Float32Array(N); for (let i = 0; i < N; i++) W.xs[i] = i * CS - HALF;
  W.texH = new Float32Array(NN * 4); W.texC = new Uint8Array(NN * 4);
  const lim = (R - 0.06) * (R - 0.06);
  let n = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, x = W.xs[i], z = W.xs[j], p = genPoint(x, z);
    W.h[c] = p.h; W.w[c] = p.w; W.mat[c] = p.mat; W.moist[c] = W.moist0[c] = p.moist; W.veg[c] = W.veg0[c] = p.veg; W.flo[c] = p.flo; W.snow[c] = p.snow;
    W.T[c] = W.T0[c] = p.T;
    const ins = i > 0 && j > 0 && i < N - 1 && j < N - 1 && x * x + z * z + p.h * p.h < lim ? 1 : 0;
    W.inside[c] = ins; n += ins;
    if (!ins) W.w[c] = 0;
  }
  W.insideCount = n;
  tops();
}
function tops() { const { h, snow, top } = W; for (let c = 0; c < NN; c++) top[c] = h[c] + snow[c] * SNOWK; }
// bilinear height of the land top at x, z
function topAt(x, z) {
  const gx = clamp((x + HALF) / CS, 0, N - 1.001), gz = clamp((z + HALF) / CS, 0, N - 1.001);
  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, c = j * N + i, t = W.top;
  return lerp(lerp(t[c], t[c + 1], fx), lerp(t[c + N], t[c + N + 1], fx), fz);
}

// ───────────────────────── a stand-in for test-06's world step ─────────────────────────
// test-06 runs its world 60 times a second: two water passes, then heat, fire, moisture and growth over every cell.
// This study has no tools, so nothing would change; it runs the same number of full-grid passes so the cost of a
// bigger grid shows up honestly. Water is the pipe model from the water study (water A), which is test-06's.
const SIM = { ms: 0, n: 0, texMs: 0, texN: 0, step: 0 };
function waterSub() {
  const { top, inside, w, fL, fR, fU, fD, s, flow } = W, K = 0.14;
  for (let c = 0; c < NN; c++) s[c] = top[c] + w[c];
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {

    resize(); cameraUpdate(1 / 60); renderFrame(time);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, PIX);   // gl.finish does not wait in Chrome; a read-back does
    const d = performance.now() - t0; t.all += d; if (d > t.worst) t.worst = d;
  }
  const nb = numbers(), C = LIFE.counts;
  return {
    setting: `${UI.n} · ${UI.m}× · ×${UI.s} · animals ×${UI.a}`,
    frameMs: +(t.all / frames).toFixed(2), worstMs: +t.worst.toFixed(1), simMs: +(t.sim / frames).toFixed(2), texMs: +(t.tex / frames).toFixed(2),
    cells: W.insideCount, grid: N, landVerts: nb.landVerts, tris: TRI.frame.total, trisBy: TRI.frame.by,
    things: C, treesAcross: +nb.treesAcross.toFixed(1), rabbitsAcross: Math.round(nb.rabbitsAcross), hopsAcross: Math.round(nb.hopsAcross),
    acresTree: +nb.acresTree.toFixed(1), acresRabbit: +nb.acresRabbit.toFixed(2), cellsPerTree: +nb.cellsPerTree.toFixed(2), cellsPerRabbit: +nb.cellsPerRabbit.toFixed(2),
    closeTrees: +nb.closeTrees.toFixed(1), closeRabbits: Math.round(nb.closeRabbits), lensMin: +nb.lensMin.toFixed(2),
    canvas: RD.w + '×' + RD.h,
  };
}
function runBench() {
  const el = document.getElementById('bench');
  el.textContent = 'timing…';
  setTimeout(() => {
    const r = bench(240);
    el.textContent = `${r.frameMs} ms a frame (worst ${r.worstMs})\nsim ${r.simMs} · textures ${r.texMs}\n${fmt(r.tris)} triangles at ${r.canvas}`;
  }, 30);
}

// ───────────────────────── the loop ─────────────────────────
let acc = 0, last = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.1, last ? (now - last) / 1000 : 1 / 60);
  if (last) FR.gap += now - last;
  last = now;
  const t0 = performance.now();
  acc += dt;
  let n = 0;
  while (acc >= 1 / 60 - 1e-9 && n < 4) { simTick(); acc -= 1 / 60; n++; }
  if (n === 4) acc = 0;
  textures();
  crittersStep(dt, now / 1000);
  resize(); cameraUpdate(dt); renderFrame(now / 1000);
  const cpu = performance.now() - t0;
  FR.n++; FR.cpu += cpu; FR.max = Math.max(FR.max, cpu);
  if (now - hudT > 500) { hud(); hudT = now; }
  requestAnimationFrame(frame);
}

window.STUDY = {
  UI, PRESETS, LIFE, W, YARD, CAM,
  set(s) { applySettings(s); },
  preset(id) { const p = PRESETS.find((q) => q.id === id); applySettings({ n: p.n, m: p.m, s: p.s, a: p.a }); },
  bench,
  numbers,
  // every preset in turn, timed from the whole-bubble view
  measureAll(frames) {
    const keep = { ...UI }, out = [];
    for (const p of PRESETS) { applySettings({ n: p.n, m: p.m, s: p.s, a: p.a }); bench(120); out.push({ preset: p.name, ...bench(frames || 240) }); }
    applySettings(keep);
    return out;
  },
};

try {
  renderInit();
  yardsticks();
  const h = new URLSearchParams(location.hash.slice(1));
  const start = { n: 128, m: 1, s: 1, a: 1 };
  if (GRIDS.includes(+h.get('n'))) start.n = +h.get('n');
  if (MESHES.includes(+h.get('m'))) start.m = +h.get('m');
  if (h.get('s')) start.s = clamp(+h.get('s') || 1, 0.2, 1.2);
  if (h.get('a')) start.a = clamp(+h.get('a') || 1, 0.25, 1);
  bindInput();
  applySettings(start, 'init');
  resize(); requestAnimationFrame(frame);
} catch (e) {
  const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = String(e && e.message || e);
  console.error(e);
}
</script>
