<script>
'use strict';
// ───────────────────────── constants (the same world as test-06: a bubble of radius 10, a 128² grid) ─────────────────────────
const R = 10, RR = R * R, N = 128, NN = N * N, WORLD = 2 * R * 1.02, HALF = WORLD / 2, CS = WORLD / (N - 1);
// the lava sits deep enough for a lake several units deep; the two units of rock above it are the hot layer, which

const AMB = 15, DT = 1 / 30;
// page switches: the side page turns on the view through the glass, bubbles, geysers and its starting scene

// effect switches, so each look can be judged on its own (the side page has a panel for them)
const FXLIST = [
  ['caus', 'Caustics on the lake bed', 1, 'Moving light on the ground under water.'],
  ['shafts', 'Light shafts under water', 1, 'Soft beams when looking in through the glass.'],
  ['fog', 'Underwater fog', 1, 'Things further into the water fade to its colour.'],
  ['under', 'Sky window from below', 1, 'The bright patch and ripple shimmer on the underside of the surface.'],
  ['glints', 'Glints', 0, 'Tiny bright specks on the surface.'],
  ['lap', 'Lapping bands', 1, 'Slow bands moving through the shallows.'],
  ['crest', 'Ripple highlights', 1, 'Ripple crests catch the light.'],
  ['swell', 'Surface swell', 1, 'Slow wobble of the surface on still water.'],
  ['foam', 'Foam line at the edge', 1, 'The white line where water meets land.'],
  ['bubbles', 'Bubbles', 1, 'Every bubble source.'],
  ['clouds', 'Clouds', 1, 'Show the clouds. The rain still falls when they are hidden.'],
  ['rainbow', 'Rainbows in spray', 1, 'A rainbow in waterfall mist, seen with the sun behind you.'],
  ['newcol', 'New water colour (C)', 1, 'One colour rule for all water: the ground under it fades into one clear blue by how far the light travels. Off: the old depth scale. C flips it.'],

const FXV = new Float32Array(14);
for (let i = 0; i < FXLIST.length; i++) FXV[i] = FX.side ? FXLIST[i][2] : (i === 9 ? 1 : 1);

const SOIL = 0, SAND = 1, ROCK = 2, OBSID = 3;
// materials are small bundles of properties; the rules below read the columns
const MAT = [

  { name: 'sand', hard: 1.3, perm: 2.0, dry: [0.90, 0.81, 0.60], wet: [0.66, 0.56, 0.40] },
  { name: 'rock', hard: 0.45, perm: 0.2, dry: [0.56, 0.55, 0.58], wet: [0.42, 0.42, 0.46] },
  { name: 'obsidian', hard: 0.3, perm: 0.05, dry: [0.13, 0.10, 0.18], wet: [0.10, 0.07, 0.14] },

const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

let RNG = mulberry(1);
const rnd = () => RNG();            // the world's randomness: seeded, so the same inputs on the same ticks give the same world
const vr = () => Math.random();     // looks only
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y); let fx = x - i, fy = y - j;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);

function fbm(x, y, o) { let s = 0, a = 0.5, f = 1, n = 0; for (let k = 0; k < o; k++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

// ───────────────────────── the grid ─────────────────────────
// Every cell holds plain values. The water module owns how water moves; it reports depth (wd), surface (ws) and
// how fast it runs (wflow) per cell, and answers add/take. Heat, ice, soaking, shorelines and the lava wells are
// shared rules below that act on whatever water the module reports, so all three pages play by the same rules.
const W = { tick: 0 };
function alloc() {
  for (const f of ['h', 'top', 'moist', 'T', 'veg', 'vegMax', 'q', 'ice', 'wd', 'ws', 'wflow', 'shoreAge', 'ps', 'ripA', 'ripB', 'boil', 'bed', 'qx', 'sh', 'salt', 'hin', 'frz', 'carve', 'groove'])
    W[f] = new Float32Array(NN);
  W.mat = new Uint8Array(NN); W.vent = new Uint8Array(NN); W.glass = new Uint8Array(NN); W.inside = new Uint8Array(NN); W.shore = new Uint8Array(NN);
  W.xs = new Float32Array(N); for (let i = 0; i < N; i++) W.xs[i] = i * CS - HALF;
  W.insideCount = 0;
}
// ───────────────────────── the one map: every page starts from the same land ─────────────────────────
// A small world laid out so each kind of water has a place to be tried:
//   LAKE   the big deep lake, against the glass (the aquarium view looks into it)
//   FJORD  a second deep lake against the glass, under a sheer cliff whose foot meets its shallow edge (a cliff dropping
//          straight into deep water was cut by the grid into teeth seen through the glass)
//   MESA   a high flat-topped mountain whose fjord side is that cliff; a little pool on top spills over its edge
//          through a notch, so a pour there makes a waterfall into the fjord (seen through the glass too)
//   HILL   the volcano: the tallest mountain, with a tarn in its crater, for water washing down
//   SPIRE  a sharp rocky peak by the glass
//   ISLE   a broad shallow lake with beaches and two islands
// and rolling meadow between them, with the geyser and the hot spring dug into it by the scene below.
const HILL = [3.0, -3.0], LAKE = [-5.4, 4.4], FJORD = [-3.4, -7.6], MESA = [-3.6, -3.0], ISLE = [4.0, 4.4], SPIRE = [7.0, -2.2];
const LEVEL0 = Y0 - 0.35;
const MESA_DIR = (() => { const dx = FJORD[0] - MESA[0], dz = FJORD[1] - MESA[1], l = Math.hypot(dx, dz); return [dx / l, dz / l]; })();
const MESA_POOL = [MESA[0] + MESA_DIR[0] * 1.15, MESA[1] + MESA_DIR[1] * 1.15];
const MESA_LIP = [MESA[0] + MESA_DIR[0] * 2.05, MESA[1] + MESA_DIR[1] * 2.05];
function landHeight(x, z) {
  let e = Y0 + (fbm(x * 0.2 + 11, z * 0.2 + 3, 4) - 0.5) * 1.2 + (fbm(x * 0.9 + 5, z * 0.9 + 9, 2) - 0.5) * 0.16;
  // the volcano, with a crater on top
  const dv = Math.hypot(x - HILL[0], z - HILL[1]);
  e += 4.3 * Math.exp(-dv * dv / (2 * 1.8 * 1.8)) - 1.7 * Math.exp(-dv * dv / (2 * 0.6 * 0.6));
  // the spire
  const ds = Math.hypot(x - SPIRE[0], z - SPIRE[1]);
  e += 3.3 * Math.exp(-ds * ds / (2 * 1.05 * 1.05)) + 0.5 * (fbm(x * 1.6, z * 1.6, 2) - 0.5) * Math.exp(-ds * ds / 4);
  // the big lake and the fjord: flat-floored basins running out to the glass
  const dl = Math.hypot(x - LAKE[0], z - LAKE[1]);
  e -= 2.6 * (1 - smooth(1.0, 3.3, dl));
  const df = Math.hypot(x - FJORD[0], z - FJORD[1]);
  e -= 2.7 * (1 - smooth(1.0, 2.5, df));
  // the shallow lake, with two islands
  const di = Math.hypot(x - ISLE[0], z - ISLE[1]);
  e -= 0.85 * (1 - smooth(1.5, 3.2, di));   // wide and gently shelving: beaches all round
  const d1 = Math.hypot(x - ISLE[0] + 0.8, z - ISLE[1] + 0.5), d2 = Math.hypot(x - ISLE[0] - 0.9, z - ISLE[1] - 0.6);
  e += 1.0 * Math.exp(-d1 * d1 / (2 * 0.42 * 0.42)) + 0.75 * Math.exp(-d2 * d2 / (2 * 0.34 * 0.34));
  // the mesa: a flat top, a gentle slope up on most sides and a sheer cliff on the fjord side
  const dm = Math.hypot(x - MESA[0], z - MESA[1]);
  const toward = dm > 1e-3 ? ((x - MESA[0]) * MESA_DIR[0] + (z - MESA[1]) * MESA_DIR[1]) / dm : 0;
  const width = lerp(1.9, 0.4, smooth(0.25, 0.8, toward));   // the cliff: sheer, but two cells wide so the grid does not cut it into teeth
  const m = 1 - smooth(2.0, 2.0 + width, dm);
  if (m > 0) {
    let top = Y0 + 2.6 + (fbm(x * 0.8 + 3, z * 0.8 + 1, 2) - 0.5) * 0.12;
    // the pool on top, and a notch from it to the cliff edge
    const dp = Math.hypot(x - MESA_POOL[0], z - MESA_POOL[1]);
    top -= 0.42 * Math.exp(-dp * dp / (2 * 0.42 * 0.42));
    const ax = MESA_LIP[0] - MESA_POOL[0], az = MESA_LIP[1] - MESA_POOL[1], al = ax * ax + az * az;
    const tt = clamp(((x - MESA_POOL[0]) * ax + (z - MESA_POOL[1]) * az) / al, 0, 1.15);
    const dseg = Math.hypot(x - MESA_POOL[0] - ax * tt, z - MESA_POOL[1] - az * tt);

// fill a basin to just below its brim: the highest level at which the water poured into its lowest point would stay
// within the basin's own area (found by halving), less a margin, and never above cap
function fillBasin(depth0, px, pz, r, rmax, margin, cap) {
  const { top, inside, xs } = W;
  let seed = -1, best = 1e9;
  for (let c = 0; c < NN; c++) {
    if (!inside[c]) continue;
    if (Math.hypot(xs[c % N] - px, xs[(c / N) | 0] - pz) < r && top[c] < best) { best = top[c]; seed = c; }
  }
  if (seed < 0) return;
  const mark = new Int32Array(NN);
  let stamp = 0;
  const flood = (L, write) => {
    stamp++;
    const stack = [seed]; mark[seed] = stamp;
    while (stack.length) {
      const c = stack.pop();
      if (Math.hypot(xs[c % N] - px, xs[(c / N) | 0] - pz) > rmax) return false;   // it got out
      if (write) depth0[c] = Math.max(depth0[c], L - top[c]);
      for (const n of [c - 1, c + 1, c - N, c + N]) if (mark[n] !== stamp && inside[n] && top[n] < L) { mark[n] = stamp; stack.push(n); }
    }
    return true;
  };

  else for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (flood(mid, false)) lo = mid; else hi = mid; }

function genLand() {
  RNG = mulberry(7);
  const { h, mat, veg, vegMax, moist, T, xs } = W;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, x = xs[i], z = xs[j];
    h[c] = landHeight(x, z);
    T[c] = AMB;
  }

  // earth everywhere else, the mesa's flat top included
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, x = xs[i], z = xs[j], e = h[c];
    const sl = i > 0 && i < N - 1 && j > 0 && j < N - 1 ? Math.max(Math.abs(h[c + 1] - h[c - 1]), Math.abs(h[c + N] - h[c - N])) / (2 * CS) : 0;
    mat[c] = sl > 1.15 + (fbm(x * 1.3, z * 1.3, 2) - 0.5) * 0.5 || e > Y0 + 3.0 ? ROCK : SOIL;
    vegMax[c] = mat[c] === SOIL ? clamp(0.55 + (fbm(x * 0.7 + 40, z * 0.7 + 8, 3) - 0.5) * 1.1 - Math.max(0, e - Y0 - 2.0) * 0.3, 0.1, 0.95) : 0;
    veg[c] = vegMax[c];
  }

  W.glass.fill(0); W.sites = []; W.springCells = []; W.boilCells = []; W.warmCells = []; W.hotBed = []; W.fumes = []; W.hotSaid = false; W.qx.fill(0); W.bed.fill(0); W.steam = []; W.vap = 0; W.sh.fill(0); W.salt.fill(0); W.hin.fill(0); W.frz.fill(0); W.carve.fill(0); W.groove.fill(0); W.stageSaid = {}; W.hits = []; W.fall = []; W.falls = []; W.fallId = 0;
  updateTop(); updateInside();
  // the starting water: each basin filled to just below its brim (the two lakes at the glass no higher than LEVEL0)
  const depth0 = new Float32Array(NN);
  fillBasin(depth0, LAKE[0], LAKE[1], 2.5, 4.2, 0.1, LEVEL0);
  fillBasin(depth0, FJORD[0], FJORD[1], 1.8, 3.2, 0.1, LEVEL0);
  fillBasin(depth0, ISLE[0], ISLE[1], 2.0, 3.7, 0.16, 99);
  fillBasin(depth0, HILL[0], HILL[1], 0.6, 1.3, 0.12, 99);
  fillBasin(depth0, MESA_POOL[0], MESA_POOL[1], 0.4, 0.8, 0.05, 99);

  const dist = new Float32Array(NN).fill(99), q = [];
  for (let c = 0; c < NN; c++) if (depth0[c] > 0) { dist[c] = 0; q.push(c); veg[c] = 0; }
  for (let k = 0; k < q.length; k++) {
    const c = q[k];
    if (dist[c] >= 14) continue;
    for (const n of [c - 1, c + 1, c - N, c + N]) if (n >= 0 && n < NN && dist[n] > dist[c] + 1) { dist[n] = dist[c] + 1; q.push(n); }
  }
  for (let c = 0; c < NN; c++) moist[c] = depth0[c] > 0 ? 1 : clamp(0.22 + 0.55 * Math.exp(-dist[c] * dist[c] / 30), 0, 1);

    if (depth0[c - 1] > 0 || depth0[c + 1] > 0 || depth0[c - N] > 0 || depth0[c + N] > 0 || depth0[c - N - 1] > 0 || depth0[c + N + 1] > 0) {

}
function updateTop() { const { h, top, vent } = W; for (let c = 0; c < NN; c++) top[c] = vent[c] === 1 ? MAGMA_Y : h[c]; }
function updateInside() {
  const { top, inside, xs } = W, lim = (R - 0.08) * (R - 0.08);
  let n = 0;
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i, x = xs[i], z = xs[j], y = top[c];

function landChanged() { updateTop(); updateInside(); if (WATER.landChanged) WATER.landChanged(); }
function sampleField(f, x, z) {
  let gx = (x + HALF) / CS, gz = (z + HALF) / CS;
  gx = clamp(gx, 0, N - 1.001); gz = clamp(gz, 0, N - 1.001);
  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, c = j * N + i;
  return (f[c] * (1 - fx) + f[c + 1] * fx) * (1 - fz) + (f[c + N] * (1 - fx) + f[c + N + 1] * fx) * fz;

const cellAt = (x, z) => clamp(Math.round((z + HALF) / CS), 0, N - 1) * N + clamp(Math.round((x + HALF) / CS), 0, N - 1);
// fn(c, falloff 0..1, distance) for every inside cell within r of (x, z)
function forBrush(x, z, r, fn) {
  const i0 = Math.max(1, Math.floor((x - r + HALF) / CS)), i1 = Math.min(N - 2, Math.ceil((x + r + HALF) / CS));
  const j0 = Math.max(1, Math.floor((z - r + HALF) / CS)), j1 = Math.min(N - 2, Math.ceil((z + r + HALF) / CS));
  const xs = W.xs, ins = W.inside;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = xs[i] - x, dz = xs[j] - z, d = Math.sqrt(dx * dx + dz * dz);
    if (d > r) continue;
    const c = j * N + i;
    if (!ins[c]) continue;
    const t = 1 - d / r;
    fn(c, t * t * (3 - 2 * t), d);
  }

// The ring of cells just beyond the glass is never inside the bubble, so no tool works on it, but the land surface
// is drawn from it too: if it stays high while the land inside is dug away, a jagged wall of land stands between
// the water and the glass. So the ground beyond the glass is never higher than the ground just inside it: the land
// always runs down into the glass, never up.
function settleRim(x, z, r) {
  const { h, inside } = W;
  const i0 = Math.max(1, Math.floor((x - r + HALF) / CS) - 2), i1 = Math.min(N - 2, Math.ceil((x + r + HALF) / CS) + 2);
  const j0 = Math.max(1, Math.floor((z - r + HALF) / CS) - 2), j1 = Math.min(N - 2, Math.ceil((z + r + HALF) / CS) + 2);
  // the ground just past the glass carries on from the ground inside it (the mean of its inside neighbours, the
  // side ones counting double), so the land is cut cleanly by the glass. It used to drop to its lowest neighbour,

  if (wilted > 20 && !SS.wilt) { SS.wilt = 1; say('wilt', 'The plants by the hot water wilt'); } else if (!wilted) SS.wilt = 0;
  if (shMax > 2.5 && !SS.shudder) { SS.shudder = 1; say('superheat', 'The water shudders: it is superheating'); } else if (shMax < 0.5) SS.shudder = 0;

  for (let c = 0; c < NN; c++) if (salt[c] > 0) salt[c] = Math.max(0, salt[c] - dt * (wd[c] > 0.05 ? 0.6 : 0.011));

// Vents in a hot lake bed: where a lake's floor lies deep in the hot layer, a small vent now and then opens in it.

// puff of steam. There are never more than three, never close together or by a spring or geyser, and a vent closes

    if (W.bed[c] > 0.45 && !F.some((f) => Math.hypot(f.x - x, f.z - z) < 2.0) && !W.sites.some((s) => Math.hypot(s.x - x, s.z - z) < 1.6)) {

// A sealed well under a small, confined pool builds up heat and erupts as a geyser now and then: it gulps bubbles,

// spreads out and it stays a calm hot spring with a steady chain of bubbles.
function sitesStep(dt) {

    if ((W.tick % 15) === 0 || s.kind === 'dry') {
      // how big the body of water over the plug is: count connected wet cells, stopping at 300
      const seen = new Set([s.c]), stack = [s.c];
      while (stack.length && seen.size < 300) {
        const k = stack.pop();
        for (const nb of [k - 1, k + 1, k - N, k + N]) if (!seen.has(nb) && W.inside[nb] && W.wd[nb] > 0.03) { seen.add(nb); stack.push(nb); }
      }

      const amt = s.spray * dt / 1.4;

// how far each dry cell is from open water (1 = right at the edge), and how long it has been a shore
function shoreScan(dt) {

  // only still water makes a shore: a stream running down a slope gets no sand bank
  const wet = (c) => wd[c] > 0.025 && ice[c] < 0.5 && inside[c] && W.wflow[c] < 0.12;
  for (let c = 0; c < NN; c++) shore[c] = 0;
  for (let c = N + 1; c < NN - N - 1; c++) {
    if (!inside[c] || wd[c] > 0.025) continue;
    if (wet(c - 1) || wet(c + 1) || wet(c - N) || wet(c + N)) shore[c] = 1;
  }
  for (let pass = 2; pass <= 3; pass++)
    for (let c = N + 1; c < NN - N - 1; c++) {
      if (shore[c] || !inside[c] || wd[c] > 0.025) continue;
      if (shore[c - 1] === pass - 1 || shore[c + 1] === pass - 1 || shore[c - N] === pass - 1 || shore[c + N] === pass - 1) shore[c] = pass;
    }

    } else if (shoreAge[c] > 0 && !(wd[c] > 0.025)) shoreAge[c] = Math.max(0, shoreAge[c] - dt * 0.05);

const PERF = { simMs: 0, simN: 0 };
function tick() {

  }

// ───────────────────────── water A: virtual pipes on every cell ─────────────────────────
// The test-06 way, tidied. Each cell holds a depth and four outflows ("pipes") to its neighbours. Each step a pipe's
// flow keeps some of its momentum and is pushed by the difference in water surface, so water runs downhill, carries
// waves, and settles. Damping is stronger than in test-06 so a lake goes calm in a few seconds. Ice blocks the pipes.
const WATER = (() => {
  const w = new Float32Array(NN), fL = new Float32Array(NN), fR = new Float32Array(NN), fU = new Float32Array(NN), fD = new Float32Array(NN);

  const K = 0.14;

  // side, so it follows the small valleys in the ground and gathers into streams (pour on a hill made a broad sheet
  // the width of the pour). The thinner the water, the stronger the pull: a lake is not touched.
  // A running film is also drawn sideways toward wetter neighbours on the same level or lower, as water beads into a
  // rivulet: the edges of a sheet feed its middle (coh, against the sideways push of its own depth).
  const RIV = { film: 0.03, p: 1, coh: 2 };   // p: 1 on, 0 off
  function substep() {
    const { top, inside, ice } = W;

      let b = inside[c + 1] && ice[c + 1] <= 0.5 ? fR[c] * damp + K * (sc - s[c + 1]) : 0;
      let u = inside[c - N] && ice[c - N] <= 0.5 ? fU[c] * damp + K * (sc - s[c - N]) : 0;
      let v = inside[c + N] && ice[c + N] <= 0.5 ? fD[c] * damp + K * (sc - s[c + N]) : 0;
      if (a < 0) a = 0; if (b < 0) b = 0; if (u < 0) u = 0; if (v < 0) v = 0;
      if (d < RIV.film && RIV.p > 0) {
        const m = a > b ? (a > u ? (a > v ? a : v) : (u > v ? u : v)) : (b > u ? (b > v ? b : v) : (u > v ? u : v));
        if (m > 0) {

          r = u * im; u += (m * r * r * r - u) * k; r = v * im; v += (m * r * r * r - v) * k;

            let x;
            if (inside[c - 1] && top[c - 1] <= tc && (x = (w[c - 1] < F ? w[c - 1] : F) - d) > 0) a += C * x;
            if (inside[c + 1] && top[c + 1] <= tc && (x = (w[c + 1] < F ? w[c + 1] : F) - d) > 0) b += C * x;
            if (inside[c - N] && top[c - N] <= tc && (x = (w[c - N] < F ? w[c - N] : F) - d) > 0) u += C * x;
            if (inside[c + N] && top[c + N] <= tc && (x = (w[c + N] < F ? w[c + N] : F) - d) > 0) v += C * x;
          }
        }

      if (sum > d) { const k = d / sum; a *= k; b *= k; u *= k; v *= k; }

      FXV[12] = FXV[12] > 0.5 ? 0 : 1; colourDirty = true;
      try { if (FX.side) localStorage.setItem('water-study-fx', JSON.stringify(Array.from(FXV).slice(0, FXLIST.length))); } catch (er) { /* not kept */ }
      const box = document.getElementById('toasts'), d = document.createElement('div');

      setTimeout(() => d.classList.add('out'), 1500); setTimeout(() => d.remove(), 2100);

// ───────────────────────── the side page's starting scene and views ─────────────────────────
// Made with the player's own tools, so it is an ordinary world, and the same on every page: a well on dry ground
// flooded a little (a small pool: a geyser), and a well dug through the big lake's shore (the lake floods it: a calm
// hot spring inside the lake). Fish only on the side page.
const GEYSER = [0.2, 1.0];
const SCENE = { wall: [0, 0], shore: [0, 0] };
function sideScene() {
  W.quiet = true;
  const act = (tool, x, z, sec, brush) => {
    const b = UI.brush; UI.brush = brush;
    const n = Math.round(sec / DT);
    for (let k = 0; k < n; k++) { const c = cellAt(x, z); applyTool(tool, { x, y: W.ps[c], z }, k, DT); tick(); }
    UI.brush = b;
  };
  const L = Math.hypot(LAKE[0], LAKE[1]);
  SCENE.wall = [LAKE[0] / L * 8.3, LAKE[1] / L * 8.3];
  // a deep pocket dug into the big lake where it meets the glass, so the cut through the glass shows clean deep water
  act('lower', SCENE.wall[0], SCENE.wall[1], 4, 1.6);
  act('lower', GEYSER[0], GEYSER[1], 9, 0.8);
  act('pour', GEYSER[0], GEYSER[1], 4, 0.6);
  // walk from the lake's middle toward the centre of the world until the ground is dry: that is the shore
  let sx = LAKE[0], sz = LAKE[1];
  for (let k = 0; k < 80; k++) { if (W.wd[cellAt(sx, sz)] < 0.02) break; sx -= LAKE[0] / L * 0.1; sz -= LAKE[1] / L * 0.1; }
  // the well goes in just inland, dry, then a shallow channel lets the lake in
  const ux = -LAKE[0] / L, uz = -LAKE[1] / L;
  const wx = sx + ux * 1.2, wz = sz + uz * 1.2;
  SCENE.shore = [wx, wz];
  act('lower', wx, wz, 9, 0.75);
  for (let k = 0; k <= 6; k++) act('lower', sx - ux * 0.4 + ux * k * 0.25, sz - uz * 0.4 + uz * k * 0.25, 0.35, 0.45);
  for (let k = 0; k < 150; k++) tick();
  // the scene starts settled: the steam from opening its wells is not left to form a cloud and rain at once
  W.steam.length = 0; W.vap = 0; CLOUDS.length = 0; W.stageSaid = {};
  if (FX.side) fishSpawn();
  W.quiet = false;
  EVENTS.length = 0;
}
// looking in from the glass at a point: the camera outside the bubble on that side, a little below the water line
const throughGlass = (p, dist) => { const l = Math.hypot(p[0], p[1]); return [Math.atan2(p[0] / l, p[1] / l), -0.1, dist, p[0] / l * 4, LEVEL0 - 1.0, p[1] / l * 4]; };
const VIEWS = [
  () => throughGlass(LAKE, 17),                                          // the big lake through the glass
  () => throughGlass(FJORD, 16),                                         // the fjord and the cliff through the glass
  () => [Math.atan2(MESA_DIR[0], MESA_DIR[1]) + 0.5, 0.35, 11, MESA_LIP[0], -2.0, MESA_LIP[1]],   // the cliff, the pool on top
  () => [2.3, 0.55, 12, HILL[0], -1.0, HILL[1]],                         // the volcano and its tarn
  () => [-0.6, 0.6, 12, ISLE[0], -3.0, ISLE[1]],                          // the shallow lake and its islands
  () => [0.5, 0.42, 14, GEYSER[0], -2.0, GEYSER[1]],                      // the geyser
  () => [0.9, 0.5, 13, SCENE.shore[0], -3.5, SCENE.shore[1]],            // the hot spring in the lake's shore
  () => [0.75, 0.42, 27, 0, -2.2, 0],                                    // the whole bubble
];
let viewIx = 0;
function nextView(i) {
  viewIx = i === undefined ? (viewIx + 1) % VIEWS.length : i;
  const v = VIEWS[viewIx]();
  CAM.yaw = v[0]; CAM.pitch = v[1]; CAM.dist = v[2]; CAM.tx = v[3]; CAM.ty = v[4]; CAM.tz = v[5];
}

// ───────────────────────── run ─────────────────────────
function reset() {
  const depth0 = genLand();
  WATER.init(depth0);
  W.tick = 0; P.n = 0; BB.n = 0; FISH.length = 0; springSaid = false;
  CLOUDS.length = 0; DROP.n = 0; BOLTS.length = 0; CRACKS.length = 0; HITW.length = 0; WX.gloom = 0; WX.flash = 0; WX.said = {}; UI.cloud = null;
  sideScene();   // every page: the same world
  for (let k = 0; k < 4; k++) tick();
  colourDirty = true;
}

      `sim ${(PERF.simN ? PERF.simMs / PERF.simN : 0).toFixed(2)} ms per step, 30 steps/s\n` +
      `cells: grid ${N}×${N}, ${W.insideCount.toLocaleString()} in the bubble · water sim ${WATER.cells().toLocaleString()}\n` +
      `water: ${wet.toLocaleString()} wet cells · volume ${v.toFixed(0)} · ${WATER.stats()}` + (FX.side ? ` · ${BB.n} bubbles · ${FISH.filter((f) => f.state !== 'dead').length} fish` : '');

// the looks-only systems advanced by one sim step, for stepping the world without frames
let lookT = 0;

  view(yaw, pitch, dist, tx, ty, tz) {

  // run whole frames back to back (one sim step every other frame, as at 60 fps) and wait for the GPU each time

  },
  reset,
  pause(on) { PAUSED = !!on; },
  // paint each drawing path a flat colour (side page): red earth at the glass, yellow and cyan and white the band at
  // the glass, green the land mesh, magenta and blue the far side of the glass seen from inside
  debug(on) { RD.dbg = on ? 1 : 0; },
  // the checks behind the README: drives the page through the player's tools on the sim clock and reports numbers

    const S = STUDY, out = {};

    const vol = () => +volume()[0].toFixed(1);

    function lakeCalm() {
      const cells = [];
