<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land tools</title>
<style>
  :root { --glass: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); --glass-hi: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.07)); --glass-on: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.12));
          --rim: inset 0 1px 0 rgba(255,255,255,.09); --blur: blur(14px) saturate(1.1); --txt: rgba(236,239,244,.86); --dim: rgba(236,239,244,.52); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; color: var(--txt); font: 12px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  .bar { position: fixed; top: 10px; bottom: 10px; width: 136px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; transition: opacity .18s; }
  #left { left: 10px; } #right { right: 10px; }
  .pane { pointer-events: auto; background: var(--glass), rgba(16,17,20,.42); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim), 0 8px 24px rgba(0,0,0,.2); border-radius: 12px; padding: 7px; }
  .scroller { flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .fam { font-size: 10px; letter-spacing: .05em; color: var(--dim); margin: 6px 1px 3px; }
  .fam:first-child { margin-top: 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .t { position: relative; height: 34px; border: 0; border-radius: 9px; background: rgba(255,255,255,.045); color: inherit; font-size: 17px; line-height: 34px; text-align: center; padding: 0; cursor: pointer; transition: background .1s, transform .1s; touch-action: none; }
  .t:hover { background: rgba(255,255,255,.14); transform: scale(1.06); }
  .t.on { background: var(--glass-on); box-shadow: var(--rim); }
  .t i { position: absolute; font-style: normal; font-size: 9px; line-height: 1; right: 3px; top: 3px; color: rgba(255,255,255,.75); }
  .t b { position: absolute; left: 4px; top: 2px; font-size: 10px; font-weight: 400; color: rgba(255,255,255,.55); }
  .t.drop { opacity: .38; }
  #hand .nm { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hand .bd { color: var(--dim); font-size: 11px; min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 3px; align-items: center; }
  .mini { flex: 1 1 0; height: 24px; min-width: 0; border: 0; border-radius: 7px; background: rgba(255,255,255,.05); color: var(--txt); font-size: 12px; cursor: pointer; padding: 0; }
  .mini:hover { background: rgba(255,255,255,.14); } .mini.on { background: var(--glass-on); }
  input[type=text], textarea { width: 100%; background: rgba(0,0,0,.28); color: var(--txt); border: 0; border-radius: 7px; padding: 4px 6px; font: inherit; outline: none; user-select: text; }
  textarea { height: 86px; resize: none; font: 10px/1.3 ui-monospace, Menlo, monospace; }
  #read { font: 10px/1.45 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre; }
  #hint { position: fixed; left: 156px; bottom: 16px; color: rgba(255,255,255,.82); text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none; opacity: 0; transition: opacity .25s; font-size: 12.5px; }
  #tip { position: fixed; z-index: 9; pointer-events: none; padding: 3px 7px; border-radius: 7px; background: rgba(24,25,28,.86); color: #eceef2; font-size: 11.5px; opacity: 0; transition: opacity .08s; max-width: 240px; white-space: normal; }
  #shop, #lands { background: rgba(17,18,21,.9) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; position: fixed; top: 10px; bottom: 10px; width: 262px; overflow-y: auto; display: none; scrollbar-width: none; }
  #shop { left: 154px; } #lands { right: 154px; width: 230px; bottom: auto; }
  #shop.open, #lands.open { display: block; }
  #shop h4, #lands h4 { font-size: 10px; letter-spacing: .05em; color: var(--dim); font-weight: 500; margin: 10px 0 4px; }
  #shop h4:first-child, #lands h4:first-child { margin-top: 0; }
  .ctl { margin: 5px 0; } .ctl label { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; margin-bottom: 2px; }
  .ctl label em { font-style: normal; color: var(--txt); }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .chip { border: 0; border-radius: 7px; background: rgba(255,255,255,.055); color: var(--txt); font: inherit; font-size: 11px; padding: 3px 7px; cursor: pointer; }
  .chip:hover { background: rgba(255,255,255,.14); } .chip.on { background: var(--glass-on); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px; background: none; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%; background: #e8ebf0; }
  .icons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; }
  .icons .chip { padding: 2px 0; text-align: center; font-size: 14px; }
  .fold .bar, .fold #shop, .fold #lands, .fold #hint { opacity: 0; pointer-events: none; }
  .fold .bar * { pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div class="bar" id="left"></div>
<div class="bar" id="right"></div>
<div class="pane" id="shop"></div>
<div class="pane" id="lands"></div>
<div id="hint"></div>
<div id="tip"></div>
<script>
window.LAND_TEST = /[?&]test\b/.test(location.search);
const MODELS_BUILD = () => {
// ───────────────────────── gl: copied from test-06/src/core.js and gl.js, unchanged where it matters ─────────────────────────
// Geo and InstMesh are test-06's own, so every model is built and lit exactly as the game builds and lights it.
const TAU = Math.PI * 2;
const R = 10;                 // bubble radius (test-06 core.js)
const N = 128;                // sim grid resolution
const CS = (2 * R * 1.02) / (N - 1);   // one land cell
const Y0 = -2.6;              // mean land level, measured from the bubble's centre
const GLX = { gl: null, errors: [] };
function matPerspective(o, fovy, aspect, near, far) {

  return o;
}
function matLookAt(o, ex, ey, ez, cx, cy, cz, cam) {
  let zx = ex - cx, zy = ey - cy, zz = ez - cz;
  let l = 1 / Math.hypot(zx, zy, zz); zx *= l; zy *= l; zz *= l;

  let xx = zz, xy = 0, xz = -zx;
  l = 1 / Math.hypot(xx, xy, xz); xx *= l; xz *= l;

  o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
  o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
  o[12] = -(xx * ex + xy * ey + xz * ez);
  o[13] = -(yx * ex + yy * ey + yz * ez);
  o[14] = -(zx * ex + zy * ey + zz * ez);
  o[15] = 1;
  if (cam) {
    cam.right[0] = xx; cam.right[1] = xy; cam.right[2] = xz;
    cam.up[0] = yx; cam.up[1] = yy; cam.up[2] = yz;
    cam.fwd[0] = -zx; cam.fwd[1] = -zy; cam.fwd[2] = -zz;
  }

}
function matMul(o, a, b) {
  for (let c = 0; c < 4; c++) {

    o[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }

}
// write a TRS matrix (R = Ry(yaw)·Rx(pitch)·Rz(roll)) into o at offset; model "front" is +Z
function matTRS(o, off, px, py, pz, yaw, pitch, roll, sx, sy, sz) {
  const cy = Math.cos(yaw), sy_ = Math.sin(yaw), cx = Math.cos(pitch), sx_ = Math.sin(pitch), cz = Math.cos(roll), sz_ = Math.sin(roll);
  o[off] = (cy * cz + sy_ * sx_ * sz_) * sx; o[off + 1] = (cx * sz_) * sx; o[off + 2] = (-sy_ * cz + cy * sx_ * sz_) * sx; o[off + 3] = 0;
  o[off + 4] = (-cy * sz_ + sy_ * sx_ * cz) * sy; o[off + 5] = (cx * cz) * sy; o[off + 6] = (sy_ * sz_ + cy * sx_ * cz) * sy; o[off + 7] = 0;
  o[off + 8] = (sy_ * cx) * sz; o[off + 9] = (-sx_) * sz; o[off + 10] = (cy * cx) * sz; o[off + 11] = 0;
  o[off + 12] = px; o[off + 13] = py; o[off + 14] = pz; o[off + 15] = 1;
}
function mkProgram(name, vs, fs) {
  const gl = GLX.gl, p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) GLX.errors.push(name + (type === gl.VERTEX_SHADER ? ' (vertex): ' : ' (fragment): ') + gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) GLX.errors.push(name + ' (link): ' + gl.getProgramInfoLog(p));
  const cache = {};

// ── flat-shaded triangle soup builder: 9 floats per vertex (pos, normal, colour) ──
class Geo {
  constructor() { this.v = []; this.k = 0; }
  // ctr: a point "inside" the solid, so the face can be oriented outward automatically
  tri(a, b, c, col, ctr) {
    let nx = (b[1] - a[1]) * (c[2] - a[2]) - (b[2] - a[2]) * (c[1] - a[1]);
    let ny = (b[2] - a[2]) * (c[0] - a[0]) - (b[0] - a[0]) * (c[2] - a[2]);
    let nz = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const l = Math.hypot(nx, ny, nz);
    if (l < 1e-9) return;
    nx /= l; ny /= l; nz /= l;
    if (ctr) {
      const mx = (a[0] + b[0] + c[0]) / 3 - ctr[0], my = (a[1] + b[1] + c[1]) / 3 - ctr[1], mz = (a[2] + b[2] + c[2]) / 3 - ctr[2];
      if (nx * mx + ny * my + nz * mz < 0) { const t = b; b = c; c = t; nx = -nx; ny = -ny; nz = -nz; }
    }
    const fr = (((Math.sin(++this.k * 12.9898) * 43758.5453) % 1) + 1) % 1;
    const sh = 0.94 + 0.12 * fr;
    const r = col[0] * sh, g = col[1] * sh, bl = col[2] * sh;
    this.v.push(a[0], a[1], a[2], nx, ny, nz, r, g, bl, b[0], b[1], b[2], nx, ny, nz, r, g, bl, c[0], c[1], c[2], nx, ny, nz, r, g, bl);
  }
  quad(a, b, c, d, col, ctr) { this.tri(a, b, c, col, ctr); this.tri(a, c, d, col, ctr); }
  box(cx, cy, cz, sx, sy, sz, col) {
    const x0 = cx - sx / 2, x1 = cx + sx / 2, y0 = cy - sy / 2, y1 = cy + sy / 2, z0 = cz - sz / 2, z1 = cz + sz / 2, o = [cx, cy, cz];
    const p = [[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]];
    for (const f of [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [3, 2, 6, 7], [0, 3, 7, 4], [1, 2, 6, 5]]) this.quad(p[f[0]], p[f[1]], p[f[2]], p[f[3]], col, o);
    return this;
  }
  // ellipsoid from a subdivided icosahedron; wob roughens it
  ico(cx, cy, cz, rx, ry, rz, col, detail, wob) {
    const t = (1 + Math.sqrt(5)) / 2;
    let vs = [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]];
    let fs = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
    const nrm = (p) => { const l = Math.hypot(p[0], p[1], p[2]); return [p[0] / l, p[1] / l, p[2] / l]; };

      const nf = [], mid = (a, b) => { vs.push(nrm([(vs[a][0] + vs[b][0]) / 2, (vs[a][1] + vs[b][1]) / 2, (vs[a][2] + vs[b][2]) / 2])); return vs.length - 1; };
      for (const f of fs) { const a = mid(f[0], f[1]), b = mid(f[1], f[2]), c = mid(f[2], f[0]); nf.push([f[0], a, c], [f[1], b, a], [f[2], c, b], [a, b, c]); }

  limb(a, b, r0, r1, sides, col, caps) {
    let dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2];
    const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;
    let ux = Math.abs(dy) > 0.9 ? 1 : 0, uy = Math.abs(dy) > 0.9 ? 0 : 1, uz = 0;
    let px = uy * dz - uz * dy, py = uz * dx - ux * dz, pz = ux * dy - uy * dx;

    const o = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2];
    const ring = (c, r) => { const out = []; for (let i = 0; i < sides; i++) { const t = (i / sides) * TAU, cs = Math.cos(t) * r, sn = Math.sin(t) * r; out.push([c[0] + px * cs + qx * sn, c[1] + py * cs + qy * sn, c[2] + pz * cs + qz * sn]); } return out; };
    const A = ring(a, r0), B = ring(b, r1);
    for (let i = 0; i < sides; i++) {
      const j = (i + 1) % sides;
      if (r1 > 1e-4) this.quad(A[i], A[j], B[j], B[i], col, o); else this.tri(A[i], A[j], b, col, o);
      if (caps) { this.tri(a, A[i], A[j], col, o); if (r1 > 1e-4) this.tri(b, B[i], B[j], col, o); }

  cone(cx, y0, cz, r, h, sides, col) { return this.limb([cx, y0, cz], [cx, y0 + h, cz], r, 0, sides, col, true); }

  // ── lean shapes (asset manager, 2026-11-14): cheap forms, so the leanest shape is also the easiest one to reach for.
  //    A build that takes a model made with these copies them along with it. ──
  // octa: 8 triangles from six points (front, back, top, bottom, left, right); the cheapest closed body
  octa(f, b, t, d, l, r, col) {
    const o = [(f[0] + b[0] + t[0] + d[0] + l[0] + r[0]) / 6, (f[1] + b[1] + t[1] + d[1] + l[1] + r[1]) / 6, (f[2] + b[2] + t[2] + d[2] + l[2] + r[2]) / 6];

  bicone(a, b, m, rx, ry, sides, col) {
    let dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2]; const l = Math.hypot(dx, dy, dz); dx /= l; dy /= l; dz /= l;

    let ux = py * dz - pz * dy, uy = pz * dx - px * dz, uz = px * dy - py * dx; const ul = Math.hypot(ux, uy, uz); ux /= ul; uy /= ul; uz /= ul;   // side

  mirror(f) {

    }

  }

// ── instanced mesh: per instance a mat4 + rgba (a = glow), plus (asset manager only) a vec4 of surface effects:
//    snow on top, char, weathered grey, ash on top; all zero looks exactly as test-06 ──
class InstMesh {

const GC_PEAT = [0.3, 0.25, 0.16];                   // the dark mound of a swamp tussock
const GC_BURNT = [0, 0.92, 0, 0];

const gch = (s, i) => { const x = Math.sin(s * 12.9898 + i * 78.233) * 43758.5453; return x - Math.floor(x); };
const gcDir = (a) => [Math.cos(a), 0, Math.sin(a)], gcSide = (a) => [-Math.sin(a), 0, Math.cos(a)];
const gcAt = (d, s, r, w, y) => [d[0] * r + s[0] * w, y, d[2] * r + s[2] * w];
// a blade: one triangle from a base w wide, r0 out from the middle in direction a, to a tip h high and `lean` further out. 1
function gcBlade(g, a, r0, w, h, lean, col) {
  const d = gcDir(a), s = gcSide(a);
  g.tri(gcAt(d, s, r0, -w / 2, 0), gcAt(d, s, r0, w / 2, 0), gcAt(d, s, r0 + lean, 0, h), col || GC_WH);
}
// a bent blade: a lower triangle up to a knee, then a thin tip carrying on from where the blade is a fifth of its width, out to
// a tip that may droop. 2. tipCol colours the tip (a seed head, frost)
function gcBent(g, a, r0, w, h, lean, tipH, tipOut, col, tipCol) {
  const d = gcDir(a), s = gcSide(a), L = gcAt(d, s, r0, -w / 2, 0), R = gcAt(d, s, r0, w / 2, 0), K = gcAt(d, s, r0 + lean * 0.5, 0, h * 0.68);
  const at = (P, t) => [P[0] + (K[0] - P[0]) * t, P[1] + (K[1] - P[1]) * t, P[2] + (K[2] - P[2]) * t];
  g.tri(L, R, K, col || GC_WH); g.tri(at(L, 0.8), at(R, 0.8), gcAt(d, s, r0 + lean + tipOut, 0, tipH), tipCol || col || GC_WH);
}
// a mat lying on the ground: a fan from a centre h high to a ring of n points, every other one pulled in by `lobe`. n
function gcMat(g, c, r, n, h, seed, lobe, col) {
  const ring = Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2 + gch(seed, 30) * 2, k = (i % 2 ? 1 - lobe : 1) * (0.85 + gch(seed, i) * 0.3); return [c[0] + Math.cos(a) * r * k, c[1] + 0.004, c[2] + Math.sin(a) * r * k]; });
  const top = [c[0] + (gch(seed, 40) - 0.5) * r * 0.3, c[1] + h, c[2] + (gch(seed, 41) - 0.5) * r * 0.3];
  for (let i = 0; i < n; i++) g.tri(ring[i], ring[(i + 1) % n], top, col || GC_WH, [top[0], top[1] - 1, top[2]]);
}

// ───────────────────────── 1 · first sprouts ─────────────────────────
// a sprout: a thin stem and two seed leaves opening into a V, the drawing everyone makes of something coming up. 3
function gcSprout(g, x, z, h, a, k) {
  const S = [x, h, z], d = gcDir(a), s = gcSide(a), L = 0.034 * k, W = 0.014 * k;
  g.tri([x - s[0] * 0.004, 0, z - s[2] * 0.004], [x + s[0] * 0.004, 0, z + s[2] * 0.004], S, GC_WH);
  for (const sg of [1, -1]) g.tri(S, [x + d[0] * sg * L + s[0] * W, h + 0.016 * k, z + d[2] * sg * L + s[2] * W], [x + d[0] * sg * L - s[0] * W, h + 0.006 * k, z + d[2] * sg * L - s[2] * W], GC_WH);
}
function gcSprouts(g, cut) {
  if (cut === 'A') gcSprout(g, 0, 0, 0.035, 0.3, 1.2);                                                        // one. 3
  else if (cut === 'B') { gcSprout(g, 0, 0, 0.04, 0.3, 1.15); gcSprout(g, 0.05, 0.035, 0.026, 1.4, 0.9); gcSprout(g, -0.045, 0.03, 0.02, 2.5, 0.8); }   // three. 9
  else { gcSprout(g, 0, 0, 0.034, 0.3, 1.1); for (let i = 0; i < 3; i++) gcBlade(g, i * 2.1 + 1, 0.035, 0.012, 0.045 + i * 0.01, 0.012, GC_WH); }   // one, and fresh grass. 3 + 3
}

// ───────────────────────── 2 · tall grass ─────────────────────────
// not a reed: no head on a stalk. A loose fan of long blades, arching, so a meadow of it reads as a soft sheet that is taller
// and lighter than the tufts
function gcTall(g, cut) {
  if (cut === 'A') for (let i = 0; i < 5; i++) gcBlade(g, i * 1.26 + 0.2, 0.02, 0.022, 0.24 + gch(1, i) * 0.08, 0.07 + gch(2, i) * 0.06);   // five long blades splayed. 5
  else if (cut === 'B') for (let i = 0; i < 4; i++) gcBent(g, i * 1.57 + 0.4, 0.02, 0.026, 0.3 + gch(3, i) * 0.06, 0.08, 0.2 + gch(4, i) * 0.06, 0.07);   // four arching blades. 8
  else {                                                                                                        // gone to seed: three tan-tipped blades over four plain ones. 4 + 6
    for (let i = 0; i < 4; i++) gcBlade(g, i * 1.57 + 0.9, 0.02, 0.022, 0.2 + gch(5, i) * 0.05, 0.08);
    for (let i = 0; i < 3; i++) gcBent(g, i * 2.09 + 0.2, 0.012, 0.02, 0.34 + gch(6, i) * 0.06, 0.05, 0.33 + gch(7, i) * 0.05, 0.03, GC_WH, GC_SEED);
  }
}

// ───────────────────────── 3 · dune grass ─────────────────────────
// marram on sand: thin blades all bending the same way (+x, downwind). A build turns every clump with the wind, as the patch view does.
function gcDune(g, cut) {
  const fan = [-0.5, -0.15, 0.2, 0.55];
  if (cut === 'A') fan.forEach((a, i) => gcBlade(g, a, 0.01, 0.016, 0.22 + gch(8, i) * 0.06, 0.12 + gch(9, i) * 0.06));   // four leaning blades. 4
  else {
    [-0.4, 0.05, 0.45].forEach((a, i) => gcBent(g, a, 0.01, 0.028, 0.27 + gch(10, i) * 0.05, 0.1, 0.17 + gch(11, i) * 0.04, 0.12));   // three curving over. 6
    if (cut === 'C') { const R = [[0.06, 0.004, -0.07], [0.06, 0.004, 0.07], [0.2, 0.004, 0.0]]; g.tri(R[0], R[1], [0.07, 0.04, 0], GC_SAND); g.tri(R[1], R[2], [0.07, 0.04, 0], GC_SAND); g.tri(R[2], R[0], [0.07, 0.04, 0], GC_SAND); }   // and the drift of sand in its lee. + 3
  }
}

// ───────────────────────── 4 · swamp grass ─────────────────────────
function gcSwamp(g, cut) {
  if (cut === 'A') for (let i = 0; i < 4; i++) gcBent(g, i * 1.57 + 0.3, 0.015, 0.026, 0.3 + gch(12, i) * 0.06, 0.09, 0.18, 0.1);   // a fountain of arching blades. 8
  else if (cut === 'B') {                                                                                      // a tussock: a dark mound, blades fanning out of it. 4 + 5
    gcMat(g, [0, 0, 0], 0.08, 4, 0.06, 13, 0, GC_PEAT);
    for (let i = 0; i < 5; i++) gcBlade(g, i * 1.26 + 0.5, 0.02, 0.024, 0.26 + gch(14, i) * 0.08, 0.1 + gch(15, i) * 0.04);
  } else for (let i = 0; i < 6; i++) { const a = i * 1.05 + gch(16, i); gcBlade(g, a, 0.015 + gch(17, i) * 0.02, 0.012, 0.3 + gch(18, i) * 0.1, 0.015); }   // rushes: six straight spears. 6
}

// ───────────────────────── 5 · snow grass ─────────────────────────
// only the top of the tuft shows through the snow
function gcSnow(g, cut) {
  if (cut === 'A') for (let i = 0; i < 3; i++) gcBlade(g, i * 2.09 + 0.4, 0.012, 0.018, 0.06 + gch(19, i) * 0.02, 0.025);   // three short blades. 3
  else if (cut === 'B') for (let i = 0; i < 3; i++) gcBent(g, i * 2.09 + 0.4, 0.012, 0.02, 0.075 + gch(20, i) * 0.02, 0.02, 0.07, 0.012, GC_WH, GC_FROST);   // frost-tipped. 6
  else for (let i = 0; i < 5; i++) gcBlade(g, i * 1.26 + 0.1, 0.035, 0.016, 0.045 + gch(21, i) * 0.02, 0.03);   // a ring round a buried middle. 5
}

// ───────────────────────── 6 · salt marsh grass ─────────────────────────
function gcSalt(g, cut) {
  if (cut === 'A') for (let i = 0; i < 4; i++) gcBlade(g, i * 1.57 + 0.6, 0.015, 0.02, 0.06 + (i % 2) * 0.025, 0.03);   // a short red tuft. 4
  else if (cut === 'B') [[0, 0, 0.08], [0.03, 0.02, 0.06], [-0.025, 0.025, 0.05]].forEach(([x, z, h]) => g.limb([x, 0, z], [x + 0.005, h, z], 0.01, 0, 3, GC_WH, false));   // samphire: three fleshy upright fingers. 9
  else for (let i = 0; i < 5; i++) gcBlade(g, i * 1.26, 0.008, 0.024, 0.018, 0.06);                         // a low red star of blades lying flat. 5
}

// ───────────────────────── 7 · pioneer moss ─────────────────────────
function gcMoss(g, cut) {
  // cushions are low and wide, so a slope of them reads as soft green patches and not as scattered points
  if (cut === 'A') gcMat(g, [0, 0, 0], 0.12, 6, 0.022, 22, 0.3);                                            // one low lobed cushion. 6
  else if (cut === 'B') { gcMat(g, [0, 0, 0], 0.1, 5, 0.02, 23, 0.25); gcMat(g, [0.1, 0, 0.05], 0.07, 4, 0.016, 24, 0.15); }   // two cushions. 9
  else gcMat(g, [0, 0, 0], 0.12, 8, 0.008, 25, 0.45);                                                        // a lichen crust, flat and lobed. 8
}

// ───────────────────────── 8 · cave moss ─────────────────────────
// pale moss for damp cave walls and floors: everything lies flat, so a build can stick it to a wall as well as a floor
function gcCave(g, cut) {
  if (cut === 'A') gcMat(g, [0, 0, 0], 0.12, 8, 0.012, 26, 0.4);                                             // a pale lobed patch. 8
  else if (cut === 'B') { gcMat(g, [0, 0, 0], 0.08, 5, 0.01, 27, 0.3); for (let i = 0; i < 3; i++) gcBlade(g, i * 2.09 + 0.3, 0.02 + i * 0.012, 0.008, 0.035 + i * 0.006, 0.004); }   // with spore stalks. 5 + 3
  else [[0, 0, 0.07], [0.08, 0.04, 0.05], [-0.06, 0.06, 0.045]].forEach(([x, z, r], i) => gcMat(g, [x, 0, z], r, 3, r * 0.25, 28 + i, 0));   // three flat cushions. 9
}

// ───────────────────────── 9 · algae ─────────────────────────
// a green film floating on new water (A, B), or strands waving up from the bed (C)
function gcAlgae(g, cut) {
  if (cut === 'A') gcMat(g, [0, 0, 0], 0.2, 7, 0.004, 31, 0.12);                                             // one ragged film: a blob, not a star. 7
  else if (cut === 'B') { gcMat(g, [0, 0, 0], 0.15, 5, 0.004, 32, 0.35); gcMat(g, [0.17, 0, 0.08], 0.09, 4, 0.003, 33, 0.3); }   // a film and a scrap. 9
  else for (let i = 0; i < 3; i++) gcBlade(g, i * 2.09 + 0.5, 0.01, 0.014, 0.2 + gch(33, i) * 0.08, 0.08);   // strands. 3
}

// ───────────────────────── 10 · water weed ─────────────────────────
// a stem: one thin triangle, with small leaves on it in pairs or alone. 1 + leaves
function gcStem(g, a, h, lean, leaves) {
  const d = gcDir(a), s = gcSide(a), top = [d[0] * lean, h, d[2] * lean];
  g.tri([s[0] * -0.006, 0, s[2] * -0.006], [s[0] * 0.006, 0, s[2] * 0.006], top, GC_WH);
  leaves.forEach(([t, side, len]) => {
    const p = [top[0] * t, h * t, top[2] * t], o = side * len;
    g.tri(p, [p[0] + s[0] * o + d[0] * 0.01, p[1] + len * 0.6, p[2] + s[2] * o + d[2] * 0.01], [p[0] + s[0] * o * 0.4, p[1] + len * 0.9, p[2] + s[2] * o * 0.4], GC_WH);
  });
}
function gcWeed(g, cut) {
  if (cut === 'A') for (let i = 0; i < 3; i++) gcBlade(g, i * 2.09 + 0.3, 0.012, 0.03, 0.26 + gch(34, i) * 0.08, 0.06);   // three ribbons. 3
  else if (cut === 'B') { gcStem(g, 0.3, 0.3, 0.05, [[0.35, 1, 0.05], [0.6, -1, 0.05], [0.85, 1, 0.045]]); gcStem(g, 2.6, 0.24, 0.06, [[0.4, -1, 0.045], [0.65, 1, 0.045], [0.9, -1, 0.04]]); }   // two leafy stems. 2 × 4
  else [[0.3, 0.28], [2.4, 0.22], [4.4, 0.25]].forEach(([a, h]) => gcStem(g, a, h, 0.04, [[1, 1, 0.05], [1, -1, 0.05]]));   // three stems, each topped by a pair of leaves. 3 × 3
}

const GROUNDCOVER_PARTS = {};
const GC_BUILD = { gcSprouts, gcTall, gcDune, gcSwamp, gcSnow, gcSalt, gcMoss, gcCave, gcAlgae, gcWeed };
for (const [name, f] of Object.entries(GC_BUILD)) for (const cut of ['A', 'B', 'C']) GROUNDCOVER_PARTS[name + cut] = { cap: 3000, build: () => gcgeo((g) => f(g, cut)) };
const gcTris = (mesh) => GROUNDCOVER_PARTS[mesh].build().v.length / 27;

// ── entries ──
// tints: [label, colour] looks, the first the default. cuts: what each cut is (and, as [text, where], where the patch view
// puts it). o.patch: the patch view's defaults. o.dead: the dry and burnt looks, [label, tint, fx]
function gcEntry(id, name, about, brief, envs, mesh, tints, cuts, picked, o) {
  o = o || {};
  const text = (c) => (Array.isArray(cuts[c]) ? cuts[c][0] : cuts[c]), label = (c) => 'Cut ' + c + ' · ' + gcTris(mesh + c) + ', ' + text(c);
  const order = [picked, ...['A', 'B', 'C'].filter((c) => c !== picked)];
  const dead = o.dead || [['Dry', [0.8, 0.72, 0.4]], ['Burnt', null, GC_BURNT]];
  return {
    id, group: 'drafts', status: 'draft', lineup: o.lineup || 'plants', round: 'ground cover', name, picked: label(picked), about, brief, envs, needs: [],
    stage: o.stage || 'pioneer', scale: 1, stand: 'ground', count: o.count || 3000, from: 'ground cover · ' + mesh + 'A / B / C', patch: o.patch,
    parts: (v) => [GC(mesh + (v.cut || picked), { tint: v.tint || tints[0][1], fx: v.fx, e: v.e })],
    variants: [...order.map((c) => Object.assign({ label: label(c), cut: c }, Array.isArray(cuts[c]) ? { where: cuts[c][1] } : {})),
      ...tints.slice(1).map(([label, tint]) => ({ label, cut: picked, tint })), ...(o.extra || []),
      ...dead.map(([label, tint, fx]) => Object.assign({ label, cut: picked }, tint ? { tint } : {}, fx ? { fx } : {}))],
  };
}

// Small shared helpers: maths, seeded randomness, noise. Nothing here knows about land, tools or the camera.
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const smooth = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function mulberry(a) { return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y); let fx = x - i, fy = y - j;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);

// ═════════ session.js ═════════
// A SESSION is every stroke kept as an input, so a land can be replayed from the start and handed on as text.
// Every action of the player goes through ACT, which writes it down and then does it.
const ACT = (() => {
  const log = [], rows = new Map();
  let gap = 0, seedBase = 1, start = null;       // water steps since the last event; what the session started from
  const rowRef = (row) => { const k = JSON.stringify(row); if (!rows.has(k)) rows.set(k, rows.size); return rows.get(k); };
  const rowOf = (id) => { for (const [k, v] of rows) if (v === id) return JSON.parse(k); return null; };
  const nextSeed = () => (seedBase * 7919 + log.length * 13) | 0;
  const put = (o) => { o.gap = gap; gap = 0; log.push(o); return o; };
  function startFrom(desc) { log.length = 0; rows.clear(); gap = 0; seedBase = desc.seed || 1; start = desc; }

  // a stroke of a brush: its start, then one point for each tick
  function brushBegin(row, x, z, opts) { opts.seed = nextSeed(); const ev = put({ k: 'b', row: rowRef(row), x, z, opts: { ...opts }, pts: [] }); E.begin(row, x, z, opts); return ev; }
  function brushTick(ev, x, z) { ev.pts.push([x, z]); E.tick(x, z, 1 / 60); }
  function brushEnd() { E.endBrush(); }
  // a line, outline, shape, stamp or moved selection is written down whole, at the moment it lands
  function gestureDone(g) { put({ k: 'g', row: rowRef(g.row), opts: { ...g.opts }, pts: g.pts.map((p) => [p[0], p[1]]), x0: g.x0, z0: g.z0, x1: g.x1, z1: g.z1, pull: g.pull, rot: g.rot, straight: g.straight }); }
  function click(row, x, z, opts) { opts.seed = nextSeed(); put({ k: 'c', row: rowRef(row), x, z, opts: { ...opts } }); runClick(row, x, z, opts); }
  function runClick(row, x, z, opts) { if (row.ops[0] && row.ops[0].op === 'paste') E.pasteAt(row, x, z, opts); else E.oneShot(row, x, z, opts); }
  function whole(row, opts) { opts.seed = nextSeed(); put({ k: 'w', row: rowRef(row), opts: { ...opts } }); return E.whole(row, opts); }
  const undo = () => { put({ k: 'u' }); return E.undo(); };
  const redo = () => { put({ k: 'r' }); return E.redo(); };
  const pick = (which, x, z) => { put({ k: 'p', which, x, z }); doPick(which, x, z); };
  const doPick = (which, x, z) => { if (which === 'level') E.pick.level = L.at(x, z); else E.pick.clone = [x, z]; };
  const sea = (v) => { put({ k: 's', v }); WATER.setSea(v); };
  const waterStep = () => { WATER.step(); gap++; };

  // run the whole session again from its start. Returns the land's checksum, so a replay can be compared with the live land.
  async function replay(onProgress) {
    const events = log.slice(), desc = start, savedRows = new Map(rows);
    const wants = L.checksum();
    await onReset(desc);
    rows.clear(); for (const [k, v] of savedRows) rows.set(k, v);
    log.length = 0; log.push(...events); gap = 0;
    const ws = (n) => { for (let k = 0; k < n; k++) WATER.step(); };
    let n = 0;
    for (const ev of events) {
      ws(ev.gap);
      if (ev.k === 'b') { const row = rowOf(ev.row); E.begin(row, ev.x, ev.z, { ...ev.opts }); for (const p of ev.pts) { E.tick(p[0], p[1], 1 / 60); WATER.step(); } E.endBrush(); }
      else if (ev.k === 'g') {
        const row = rowOf(ev.row); E.gestureStart(row, ev.x0, ev.z0, { ...ev.opts });
        const g = E.gesture(); if (g) { g.pts = ev.pts; g.x1 = ev.x1; g.z1 = ev.z1; g.pull = ev.pull; g.rot = ev.rot; g.straight = ev.straight; E.gestureEnd(); }
      }
      else if (ev.k === 'c') runClick(rowOf(ev.row), ev.x, ev.z, { ...ev.opts });
      else if (ev.k === 'w') E.whole(rowOf(ev.row), { ...ev.opts });
      else if (ev.k === 'u') E.undo();
      else if (ev.k === 'r') E.redo();
      else if (ev.k === 'p') doPick(ev.which, ev.x, ev.z);
      else if (ev.k === 's') WATER.setSea(ev.v);
      if (++n % 3 === 0) { onProgress && onProgress(n / events.length); await new Promise((r) => setTimeout(r)); }
    }
    return { same: L.checksum() === wants, strokes: events.length };
  }
  let onReset = async () => {};
  const setReset = (f) => { onReset = f; };

  // ───────── a land as text ─────────
  async function landToText() {
    const N = L.N, a = new Int16Array(N * N); let prev = 0;
    for (let c = 0; c < a.length; c++) { const v = Math.round(L.h[c] * 2000); a[c] = v - prev; prev = v; }
    const z = await deflate(new Uint8Array(a.buffer));
    return JSON.stringify({ marbleLand: 1, n: N, cell: L.CS, seed: L.st.seed, sea: WATER.st.sea, springs: WATER.st.springs, items: PLACE.list(), z: z.z, h: bytesToB64(z.data) });
  }
  async function landFromText(text) {
    const o = JSON.parse(text); if (!o.marbleLand || o.n !== L.N) throw new Error('not a land for this grid');
    const u = await inflate(b64ToBytes(o.h), o.z), a = new Int16Array(u.buffer, u.byteOffset, u.length >> 1); let v = 0;
    for (let c = 0; c < a.length; c++) { v += a[c]; L.h[c] = v / 2000; }
    L.base.set(L.h); L.prot.fill(0); L.sel.fill(0); L.st.hasSel = false; L.st.seed = o.seed || 1; L.touchAll();
    WATER.reset(); (o.springs || []).forEach((s) => WATER.st.springs.push(s)); WATER.st.sea = o.sea == null ? -100 : o.sea; WATER.wakeAll();
    for (let k = 0; k < 240; k++) WATER.step(); WATER.spreadNear();
    PLACE.set(o.items || []);
    startFrom({ seed: o.seed || 1, text });
  }
  return { log, startFrom, brushBegin, brushTick, brushEnd, gestureDone, click, whole, undo, redo, pick, sea, waterStep, replay, setReset, landToText, landFromText, nextSeed };
})();

// THE CAMERA. Orbit, zoom and pan, and one key to fall straight down into a map view. It knows the land only as a height to aim at.
const CAM = (() => {

    o[8] = (a[4] * b[10] - a[5] * b[8] + a[7] * b[6]) * d; o[9] = (a[1] * b[8] - a[0] * b[10] - a[3] * b[6]) * d; o[10] = (a[12] * b[4] - a[13] * b[2] + a[15] * b[0]) * d; o[11] = (a[9] * b[2] - a[8] * b[4] - a[11] * b[0]) * d;
    o[12] = (a[5] * b[7] - a[4] * b[9] - a[6] * b[6]) * d; o[13] = (a[0] * b[9] - a[1] * b[7] + a[2] * b[6]) * d; o[14] = (a[13] * b[1] - a[12] * b[3] - a[14] * b[0]) * d; o[15] = (a[8] * b[3] - a[9] * b[1] + a[10] * b[0]) * d;

    if (mod) return;
    if (k === ' ') { space = true; e.preventDefault(); return; }
    if (k === 'Escape') { if (E.gesture()) { E.gestureCancel(); P.stage = null; P.mode = null; } else if (L.st.hasSel) ACT.whole(ROWS.byId('sel-clear'), { size: 0.5, strength: 0.5 }); needDraw = true; return; }
    if (k === 'Tab') { e.preventDefault(); APP.on.fold(); return; }
    if (k === 'm' || k === 'M') return APP.on.map();
    if (k === 'r' || k === 'R') return APP.on.ring();
    if (k === 'e' || k === 'E') return APP.on.fresh();
    if (k === 'w' || k === 'W') return UI.toggleShop();
    if (k === 'k' || k === 'K') return UI.setMark('keep');
    if (k === 'j' || k === 'J') return UI.setMark('maybe');
    if (k === 'l' || k === 'L') return UI.setMark('drop');
    if (k === 'n' || k === 'N') { e.preventDefault(); return UI.openNote(); }
    if (k === '[') return UI.adjust(-0.06, 0); if (k === ']') return UI.adjust(0.06, 0);
    if (k === '{') return UI.adjust(0, -0.08); if (k === '}') return UI.adjust(0, 0.08);
    if (k >= '1' && k <= '9') { const f = famKeys[+k - 1], list = ROWS.list.filter((r) => r.family === f && r.stroke.mode !== 'whole'); if (list.length) { const i = list.indexOf(APP.row); pickTool(list[(i + 1) % list.length]); } }
  });
  addEventListener('keyup', (e) => { APP.alt = e.altKey; APP.shift = e.shiftKey; if (e.key === ' ') space = false; if (e.key === 'Shift') P.shiftAxis = null; });
  addEventListener('blur', () => { APP.alt = false; APP.shift = false; space = false; });

  // ───────── engine feel ─────────
  E.hooks.dab = (x, z, moved, S) => { FX.dust(x, z, moved, S.row.family); SOUND.grain(S.row.family, moved); S.total = (S.total || 0) + moved; needDraw = true; };
  E.hooks.settle = (S) => { const a = S.total || 0; FX.settle(S.cx, S.cz, a); SOUND.settle(S.row.family, a); needDraw = true; };

  // ───────── the frame ─────────
  const TICK = 1 / 60; let last = now(), acc = 0, fadeT = 0, ft = 16, busy = 2, nDraw = 0, readT = 0, lastDraw = 0, time = 0;
  const read = () => document.getElementById('read');
  function step(dtMs) {
    const t0 = now(), dt = Math.min(dtMs, 100) / 1000; time += dt; acc += dt;
    let ticks = 0;
    while (acc >= TICK && ticks < 5) {
      acc -= TICK; ticks++;
      if (P.mode === 'brush' && P.ev) { ACT.brushTick(P.ev, P.tx, P.tz); needDraw = true; }
      if (!E.gesture()) ACT.waterStep();
    }
    if (acc > TICK * 5) acc = 0;
    if (E.gesture()) { E.gestureGhost(); needDraw = true; }
    fadeT += dt; if (fadeT > 0.25) { L.fadeFresh(fadeT); fadeT = 0; }
    const moved = CAM.update(dt, cv.clientWidth, cv.clientHeight); if (moved) needDraw = true;
    if (FX.step(dt)) needDraw = true;
    // the ring under the pointer, draped on the ground
    const row = APP.row, g = E.gesture();
    if (g) { const R = g.R || E.sizeOf(UI.sizeOf(g.row), g.row); RENDER.st.brush = { x: g.mode === 'line' || g.mode === 'outline' ? g.x1 : g.x0, z: g.mode === 'line' || g.mode === 'outline' ? g.z1 : g.z0, r: R, kind: 1, ang: 0 }; }
    else if (P.over && P.hit && row && row.stroke.mode !== 'whole') { const sh = (row.tip && row.tip.shape) || 'round', S = E.stroke(); RENDER.st.brush = { x: P.mode === 'brush' && S ? S.cx : P.hit[0], z: P.mode === 'brush' && S ? S.cz : P.hit[2], r: E.sizeOf(UI.sizeOf(row), row), kind: sh === 'square' ? 2 : sh === 'bar' ? 3 : sh === 'ring' ? 4 : 1, ang: S ? S.ang || 0 : 0 }; }
    else RENDER.st.brush = null;
    if (P.mode === 'brush') { const h = CAM.pick(P.x, P.y); if (h) P.hit = h; }
    const idleWater = WATER.st.moving, t = now();
    if (needDraw || (idleWater && t - lastDraw > 46) || t - lastDraw > 180) {
      RENDER.resize(); RENDER.sync(); RENDER.draw(time); needDraw = false; lastDraw = t; nDraw++;
    }
    busy += (now() - t0 - busy) * 0.08;
    readT += dt; if (readT > 0.33) { readT = 0; paintRead(); }
  }
  function paintRead() {
    const r = read(), s = E.stats, w = WATER.st; if (!r) return;
    r.textContent = 'frame ' + ft.toFixed(1) + ' ms\ncpu   ' + busy.toFixed(1) + ' ms\ngrid  ' + L.N + '² · ' + (L.CS).toFixed(2) + '\nlast  ' + (s.lastCells | 0) + ' cells\n      ' + s.lastMs.toFixed(1) + ' ms\ndraw  ' + (RENDER.st.tris / 1000 | 0) + 'k tris\nwater ' + (w.activeTiles * 16 * 16 | 0) + ' cells';
  }
  function loop(tt) { requestAnimationFrame(loop); const d = tt - last; last = tt; ft += (d - ft) * 0.08; step(d); }

  // ───────── start ─────────
  for (const s of store.get('stamps', [])) { try { E.stampFromSaved(s); } catch (e) { /* a stamp that no longer loads */ } }
  for (const r of store.get('mine', [])) { r.bands = r.bands || ROWS.DEFAULT_BANDS; r.limits = r.limits || {}; ROWS.add(r); }
  const eds = store.get('edits', {}); for (const id of Object.keys(eds)) if (ROWS.byId(id)) ROWS.add(Object.assign(ROWS.byId(id), eds[id]));
  L.generate(1, false); WATER.seed(); ACT.startFrom({ seed: 1, blank: false });
  RENDER.init(cv); UI.build(); pickTool(ROWS.byId('raise'));
  requestAnimationFrame(loop);

  // a small handle for tests: step frames by hand and read the land
  window.LANDSTUDY = { L, E, WATER, ROWS, ACT, CAM, RENDER, APP, UI, SOUND, FX, PLACE, P, step, newWorld, pickTool, screen(x, z, y) { const v = CAM.vp, yy = y == null ? L.at(x, z) : y, w = v[3] * x + v[7] * yy + v[11] * z + v[15]; return [(v[0] * x + v[4] * yy + v[8] * z + v[12]) / w * 0.5 * cv.clientWidth + cv.clientWidth / 2, (-(v[1] * x + v[5] * yy + v[9] * z + v[13]) / w) * 0.5 * cv.clientHeight + cv.clientHeight / 2]; } };
})();

</script>
