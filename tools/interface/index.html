ow from what is inside\".\n// Read from the same height map the cut-away layers are drawn from, so the bands of light line up with them.\nvec3 insideLight(vec3 p) {\n  vec3 nn = normalize(p);\n  vec2 uv = vec2(atan(nn.z, nn.x) / 6.2831853 + 0.5, acos(clamp(nn.y, -1.0, 1.0)) / 3.14159265);\n  vec4 w = textureLod(uInsideW, uv, 0.0);                                                    // how much sky, water, magma and earth lie behind the glass here\n  float y = p.y;\n  vec3 sky = mix(vec3(0.80, 0.93, 1.0), vec3(0.27, 0.58, 0.95), smoothstep(-0.25, 0.9, y / RAD));\n  sky += vec3(1.0, 0.95, 0.8) * pow(max(dot(nn, uSun), 0.0), 6.0) * 0.6;                     // brighter toward the sun\n  vec3 lava = vec3(1.0, 0.42, 0.08) * (0.85 + 0.15 * sin(uTime * 1.1 + p.x * 0.8 + p.z * 0.6));\n  return sky * w.r * P_iK + vec3(0.3, 0.75, 0.85) * w.g * P_iW + lava * w.b * P_iL + vec3(0.45, 0.32, 0.2) * w.a * P_iE\n       + textureLod(uInsideC, uv, 0.0).rgb;                                                  // and any light the world gave as a colour\n}\n\nvoid main() {\n  vec3 d = rayAt(vP);\n  vec3 g = d * 220.0;\n  vec3 id = floor(g);\n  vec3 f = fract(g) - vec3(0.5, 0.5, 0.5);\n  float h = hash3(id);\n  float star = step(1.0 - 0.0045 * P_sC, h) * (1.0 - smoothstep(0.04, 0.24, length(f)));\n  star *= (0.4 + 0.6 * fract(h * 71.0)) * (0.65 + 0.35 * sin(uTime * 1.5 + h * 500.0));\n  float neb = noise3(d * 2.2 + vec3(3.0, 3.0, 3.0)) * noise3(d * 4.7 - vec3(1.0, 1.0, 1.0));\n  vec3 col = vec3(0.016, 0.02, 0.05) * P_sB + (vec3(0.10, 0.05, 0.16) * neb * 1.4 + vec3(0.02, 0.09, 0.11) * noise3(d * 1.6 + vec3(9.0, 9.0, 9.0)) * 0.5) * P_sN;\n  col += vec3(0.9, 0.95, 1.0) * star * P_sS;\n  float b = dot(uCam, d);\n  float cc = dot(uCam, uCam) - RR;\n  float disc = b * b - cc;\n  if (disc > 0.0) {\n    float sq = sqrt(disc);\n    vec3 pf = uCam + d * (-b + sq);\n    float hgt = pf.y / RAD;\n    vec3 sky = mix(vec3(0.80, 0.93, 1.0), vec3(0.27, 0.58, 0.95), smoothstep(-0.25, 0.9, hgt));\n    float sd = max(dot(normalize(pf), uSun), 0.0);\n    sky += vec3(1.0, 0.95, 0.8) * (pow(sd, 220.0) * 1.2 + pow(sd, 12.0) * 0.18 * P_sg);\n    if (P_sr > 0.0 && sd > 0.6) {                                   // soft rays round the sun, seen through the glass\n      vec3 sT = normalize(cross(uSun, vec3(0.0, 1.0, 0.0)) + vec3(1e-5, 0.0, 1e-5));\n      vec3 sBn = cross(uSun, sT);\n      vec3 pd = normalize(pf);\n      float ang = atan(dot(pd, sBn), dot(pd, sT));\n      float ray = pow(abs(cos(ang * 3.0)), 24.0) + 0.6 * pow(abs(cos(ang * 3.0 + 0.5236)), 48.0);\n      sky += vec3(1.0, 0.96, 0.86) * ray * pow(sd, 30.0) * P_sr * 0.9;\n    }\n    col = mix(col, sky, 0.94 * smoothstep(0.0, 0.1, sq / RAD));\n  } else if (b < 0.0) {\n    float miss = sqrt(max(cc + RR - b * b, 0.0)) - RAD;\n    float hk = exp(-miss * 0.8 / P_hW) * 0.13 * P_hS;\n    if (P_im > 0.5 && hk > 0.0015) {                               // the halo takes the colour of what lies inside, at the nearest point of the rim (and not where it is too faint to see)\n      // what lies inside round the rim, worked out once a frame at 128 points (sharp and spread), read by angle;\n      // light spreads as it leaves the glass, so further out the spread ring counts more\n      vec3 q = uCam - d * b;\n      float s = fract(atan(dot(q, uRingV), dot(q, uRingU)) / 6.2831853);\n      vec3 li = mix(texture(uRing, vec2(s, 0.25)).rgb, texture(uRing, vec2(s, 0.75)).rgb, smoothstep(0.0, 3.5, miss)) * 4.0;\n      col += li * hk;\n    } else if (P_im < 0.5) {\n      col += P_hC * exp(-miss * 0.8 / P_hW) * 0.13 * P_hS;\n      col += vec3(0.7, 0.25, 0.08) * exp(-miss * 1.6 / P_hW) * 0.06 * (1.0 - smoothstep(-0.2, 0.35, d.y + 0.25)) * P_hR;\n    }\n  }\n  o = vec4(col, 1.0);\n}",

  const LOGMAX = 80;

      speed: 1, lastSpeed: 1, year: 0,

      else {                                                // on a bar: toward the middle of the window, wherever the bar has been put

    const clock = { shown: 0, perSpeed: 0, heardAt: 0, heard: null, frame: 0, wash: -1e9, painted: '' };

    }

    const vitRows = {}, vitVals = {};

    // ── tool settings: presets you can bend (from studies/tool-settings, card 7) ──

    const ctlDef = (id) => (varById[id] || {}).controls || {};
    const banded = (id) => !!ctlDef(id).size;
    const charges = (id) => !!ctlDef(id).charge;
    const ctlOf = (id) => {
      const d = ctlDef(id), c = S.ctl[id] || {}, o = {};
      if (d.size) o.size = c.size != null ? c.size : MID.size;
      if (d.strength) o.strength = c.strength != null ? c.strength : MID.strength;
      return o;
    };
    const settingText = (id) => {
      if (charges(id)) return 'hold to charge';
      if (!banded(id)) return '';
      const c = ctlOf(id), names = varById[id].bands;
      return names[band(c.size)] + (c.strength != null ? ' · ' + STRENGTH[band(c.strength)] : '');
    };
    function setCtl(id, k, v, later) {          // later: the caller saves once it is done (Shift held over the world moves it every frame)
      (S.ctl[id] = S.ctl[id] || {})[k] = clamp01(v);
      if (!later) store.set('ctl2', S.ctl);
      call('setControl', id, k, S.ctl[id][k]);
    }

    function selectTool(id, o) {
      o = o || {};
      if (!isAct(id) && (!varById[id] || S.locked.has(id))) return;
      if (id === 'follow' && S.tool !== 'follow') S.beforeFollow = S.tool;
      S.tool = id;
      const fam = famOf(id);
      if (fam) S.last[fam.id] = id;
      renderTools();
      if (!o.fromGame) call('selectTool', id, isAct(id) ? {} : ctlOf(id));
      if (!o.quiet) {
        sfx('pick');
        const anchor = o.anchor || toolAnchor(id);
        if (!o.noName) showName(anchor, isAct(id) ? (id === 'follow' ? 'Follow · pick an animal' : id === 'look' ? 'Look · pick anything' : id === 'work' ? 'Work here · click a spot on the land' : ACTS[id]) : varById[id].name + (settingText(id) ? ' · ' + settingText(id) : ''), 1100);
      }
    }
    const toolAnchor = (id) => { const fam = famOf(id); return fam ? hotAnchor(id) : id === 'look' ? lookBtn : id === 'follow' ? followBtn : id === 'work' ? workBtn : handBtn; };

    // the tool in hand lights up, wherever it is shown
    function renderTools() {
      handBtn.classList.toggle('on', S.tool === 'hand'); workBtn.classList.toggle('on', S.tool === 'work');
      lookBtn.classList.toggle('on', S.tool === 'look'); followBtn.classList.toggle('on', S.tool === 'follow');
      markHot(); if (S.tool !== 'work') closeWork();
    }

    // ═══ the live feed: top right, under the journal button. Discoveries are lines too, brighter and longer-lived ═══
    const tr = H('div', 'bui-move bui-tr'), feed = H('div', 'bui-feed'), list = H('div', 'bui-list'), hist = H('div', 'bui-hist');
    feed.append(list, hist); tr.append(feed); ui.append(tr);
    const LIFE = { disc: 18000, milestone: 12000, unlock: 12000 }, LIFE0 = 9000, MAXL = 7, ROW = 22;
    const lifeOf = (kind) => LIFE[kind] || LIFE0;
    const lines = [];                  // on screen, newest first, in the order they arrived. Nothing is ever moved
    const queue = [];                  // waiting lines, let out one at a time so a fast world never floods the feed
    let feedHover = false, histT = 0, nextAt = 0;
    feed.addEventListener('pointerenter', () => { feedHover = true; clearTimeout(histT); });
    feed.addEventListener('pointerleave', () => { feedHover = false; clearTimeout(histT); histT = setTimeout(closeHist, 600); });
    const openFromLine = (e) => { const l = e.target.closest('.bui-line'); const disc = l && l.dataset.disc; openRecord(true, disc ? 'found' : 'story', disc); };
    list.addEventListener('click', openFromLine); hist.addEventListener('click', openFromLine);
    // scrolling down on the feed looks back through the story without opening the journal:
    // the newest stays at the top while older lines slide in below and the feed grows down the screen
    let histH = 0, histBase = 28;
    let feedSpace = ROW * MAXL;         // how far the lines can reach before they meet a panel, wherever the panels have been put
    const histCap = () => Math.max(ROW * 2, feedSpace);          // looking back also stops short of it
    function sizeHist() {
      hist.style.height = histH + 'px';
      hist.classList.toggle('capped', histH >= histCap() - 1 && hist.scrollTop < hist.scrollHeight - hist.clientHeight - 1);
    }
    feed.addEventListener('wheel', (e) => {
      const open = feed.classList.contains('hist');
      const dy = tr.classList.contains('gu') ? -e.deltaY : e.deltaY;       // in the lower half older lines are above, so scrolling up looks back
      if (!open) { if (dy <= 0 || !S.log.some((x) => !x.minor)) return; openHist(); }
      e.preventDefault();
      const d = e.deltaMode === 1 ? dy * 30 : dy, C2 = hist.scrollHeight;
      let s = hist.scrollTop;
      if (d > 0) {                                    // back in time: the feed grows down the screen until it is full, then scrolls
        const g = Math.max(0, Math.min(d, histCap() - histH, C2 - histH));
        histH += g; s = Math.min(Math.max(0, C2 - histH), s + (d - g));
      } else {                                        // forward: scroll back to the newest, then draw back up
        const step = Math.min(-d, s); s -= step;
        if (-d > step) histH = Math.max(histBase, histH - (-d - step));
        if (histH <= histBase && s <= 0) { closeHist(); return; }
      }
      sizeHist(); hist.scrollTop = s;
    }, { passive: false });
    function lineEl(text, n, kind, disc) {         // text only: no pill and no emoji
      const e = H('div', 'bui-line ' + (kind || ''), (kind === 'disc' ? '<span class="k">Discovered</span>' : '') + '<span class="t"></span><span class="n"></span>');
      e.querySelector('.t').textContent = text;
      if (n > 1) e.querySelector('.n').textContent = '×' + n;
      if (disc) e.dataset.disc = disc;
      return e;
    }
    function fillHist() {
      hist.innerHTML = '';
      S.log.filter((x) => !x.minor).forEach((x) => hist.appendChild(lineEl(x.text, x.n, x.disc ? 'disc' : x.kind, x.disc)));
    }
    function openHist() {
      fillHist();
      histH = histBase = Math.max(list.offsetHeight, 28);        // start exactly as tall as the live feed, so nothing jumps
      feed.classList.add('hist'); sizeHist();
      hist.scrollTop = 0;
    }
    function closeHist() { feed.classList.remove('hist'); histH = 0; }

    // everything goes into the journal's story, merged the same way the feed merges repeats
    function logPush(d) {
      const key = d.id || d.text, top5 = S.log.slice(0, 5).find((e) => e.key === key);
      if (top5) { top5.n++; top5.year = S.year; S.log.splice(S.log.indexOf(top5), 1); S.log.unshift(top5); }
      else { S.log.unshift({ key, icon: d.icon, text: d.text, kind: d.kind, disc: d.disc, minor: !!d.minor, n: 1, year: S.year }); if (S.log.length > LOGMAX) S.log.pop(); }
      if (storyEl && storyEl.classList.contains('open')) syncStory();
      if (feed.classList.contains('hist')) { const s = hist.scrollTop; fillHist(); hist.scrollTop = s > 4 ? s + 30 : 0; }
    }
    function logRow(e) {
      const r = H('div', 'bui-le' + (e.disc ? ' disc' : '') + (e.minor ? ' minor' : ''), '<span class="i"></span><span class="t"></span><span class="n"></span><span class="yr"></span>');
      r.querySelector('.i').textContent = e.icon || '•'; r.querySelector('.t').textContent = e.text;
      r.querySelector('.n').textContent = e.n > 1 ? '×' + e.n : ''; r.querySelector('.yr').textContent = 'y' + Math.floor(e.year);
      r.addEventListener('click', () => openRecord(true, e.disc ? 'found' : 'story', e.disc));
      return r;
    }
    // minor events (a poke, the player's own tool use) go to the journal only
    function addLine(d, toLog) {
      if (toLog !== false) logPush(d);
      if (d.minor) return;
      const key = d.id || d.text;
      const ex = lines.find((l) => l.key === key && l.age < l.life);
      if (ex) {                         // a repeat counts up where it is and never moves. Only the newest line is woken back up
        ex.n++; ex.el.querySelector('.n').textContent = '×' + ex.n;
        if (ex === lines[0]) ex.age = 0;
        return;
      }
      const q = queue.find((x) => x.key === key);
      if (q) { q.n++; return; }
      if (d.kind === 'disc') queue.unshift({ key, d, n: 1 }); else queue.push({ key, d, n: 1 });    // a discovery never waits behind news
      if (queue.length > 12) queue.splice(queue.findIndex((x) => x.d.kind !== 'disc'), 1);         // still in the journal
    }
    // a new line opens its row at the top (the others glide down as one) and fades in
    function pump(now) {
      if (!queue.length || now < nextAt) return;
      const { key, d, n } = queue.shift();
      const e = lineEl(d.text, n, d.kind, d.disc);
      e.classList.add('new'); e.style.opacity = '0';
      list.prepend(e); lines.unshift({ key, el: e, n, age: 0, life: lifeOf(d.kind) });
      void e.offsetHeight; e.classList.remove('new');
      nextAt = now + (queue.length > 3 ? 350 : 700);
    }
    // a line holds, then fades over the second half of its life. It never fades ahead of an older line below it
    // (a discovery lives longer than news), so the feed always fades from the bottom up and no empty row opens.
    // Rows leave only from the bottom, where nothing sits below them, so nothing above ever moves
    function settle() {
      let older = -Infinity;
      for (let i = lines.length - 1; i >= 0; i--) { const l = lines[i]; l.rem = Math.max(l.life - l.age, older); older = l.rem; }
    }
    // the feed never reaches a panel: it has as many rows as fit above the first one below it, and seven at most
    function feedRoom() {
      return Math.max(1, Math.min(MAXL, Math.floor(feedSpace / ROW)));
    }
    let room = MAXL;
    function styleLines() {
      lines.forEach((l, k) => {
        const tail = room >= 4 ? (k === room - 1 ? 0.35 : k === room - 2 ? 0.65 : 1) : 1;      // the last two rows fade off toward the limit
        const o = l.rem <= 0 ? 0 : Math.min(1, l.rem / (l.life * 0.5)) * (l.el.classList.contains('disc') ? 1 : 0.86) * tail;
        l.el.style.opacity = (feedHover && l.rem > 0 ? Math.max(o, 0.86) : o).toFixed(3);
      });
    }
    function trimLines() {
      room = feedRoom();
      settle();
      while (lines.length && lines[lines.length - 1].rem <= 0) lines.pop().el.remove();
      // past the room: the bottom rows go at once, quickly faded, then removed; nothing above them moves
      while (lines.length > room) {
        const l = lines.pop(); l.el.classList.add('gone'); setTimeout(() => l.el.remove(), 260);
      }
    }
    function stepsHTML(steps, silhouette) {
      return '<div class="bui-steps">' + steps.map((s, i) => {
        const ar = i ? '<span class="ar">▸</span>' : '';
        if (silhouette) return ar + '<span class="sil ' + (s.tool ? 't' : 'a') + '"></span>';
        if (s.tool) { const v = varById[s.tool]; return ar + '<span class="t ' + (v ? v.family.side : '') + '" title="' + esc(s.name) + '">' + s.icon + '</span>'; }
        return ar + '<span class="a" title="' + esc(s.name) + '">' + s.icon + '</span>';
      }).join('') + '</div>';
    }

    // one clock for the feed; it holds while the pointer rests on it
    let lastTick = performance.now();
    setInterval(() => {
      const now = performance.now(), dt = now - lastTick; lastTick = now;
      if (!lines.length && !queue.length) return;          // an empty feed: nothing to age, fade or let in
      if (!feedHover) {
        for (const l of lines) l.age += dt;
        pump(now);
      }
      trimLines(); styleLines();
    }, 100);

    // ═══ the journal: the discoveries, in a square of its own that opens in place ═══
    const rec = H('aside', 'bui-rec bui-jour');
    rec.innerHTML = '<div class="hd"><div class="ttl">Discoveries<span class="c"></span></div></div><div class="body"></div>';      // tools.html: the story has its own panel on the right
    ui.appendChild(rec);
    const recBody = rec.querySelector('.body');
    let selChip = null;
    const howText = (f) => (f.how && f.how.length ? f.how.map(esc).join(' <span style="opacity:.45">▸</span> ') : 'seen by chance') + (f.year != null ? ' · year ' + Math.floor(f.year) : '');
    function renderRecord() {
      const nW = witnessed.filter((d) => S.found[d.id]).length, nE = engineered.filter((d) => S.found[d.id]).length;
      rec.querySelector('.ttl .c').textContent = (nW + nE) + '/' + (witnessed.length + engineered.length);
      recBody.innerHTML = '';
      recBody.appendChild(H('h3', '', 'Witnessed · ' + nW + ' of ' + witnessed.length));
      const grid = H('div', 'bui-grid'), detail = H('div', 'bui-detail');
      witnessed.forEach((d) => {
        const f = S.found[d.id];
        const c = H('button', 'bui-chip' + (f ? ' found' : '') + (f && f.fresh ? ' fresh' : '') + (selChip === d.id ? ' sel' : ''), f ? d.icon : '');
        if (f) c.addEventListener('click', () => { selChip = selChip === d.id ? null : d.id; renderRecord(); });
        grid.appendChild(c);
      });
      recBody.append(grid, detail);
      if (selChip && S.found[selChip]) {
        const d = discById[selChip];
        detail.innerHTML = '<div class="nm">' + d.icon + ' ' + esc(d.name) + '</div><div class="how">' + howText(S.found[selChip]) + '</div>';
        detail.classList.add('show');
      }
      recBody.appendChild(H('h3', '', 'Engineered · ' + nE + ' of ' + engineered.length));
      engineered.forEach((d) => {
        const f = S.found[d.id];
        const r = H('div', 'bui-er' + (f ? ' found' : '') + (f && f.fresh ? ' fresh' : ''));
        r.innerHTML = f ? stepsHTML(d.steps) + '<div class="nm">' + d.icon + ' ' + esc(d.name) + '</div><div class="how">' + howText(f) + '</div>'
                        : stepsHTML(d.steps, true) + '<div class="len">' + Math.ceil(d.steps.length / 2) + ' steps</div>';
        recBody.appendChild(r);
      });
      const forget = H('button', 'bui-forget', 'Forget all discoveries');
      forget.addEventListener('click', () => { S.found = {}; store.set('found', S.found); selChip = null; renderRecord(); });
      recBody.appendChild(forget);
    }
    function openRecord(v, tab, focusId) {
      if (v !== false && tab === 'story') { openPanel('story'); return; }      // the story lives on the right now
      const o = v === undefined ? !S.recOpen : v;
      if (!o && S.recOpen) { for (const k in S.found) delete S.found[k].fresh; store.set('found', S.found); }
      S.recOpen = o; rec.classList.toggle('open', o); journalM.set(o);
      if (o) { S.unseen = 0; if (focusId && discById[focusId] && discById[focusId].tier === 'witnessed') selChip = focusId; renderRecord(); }
      renderBadge();
    }
    function renderBadge() { const b = bRec.querySelector('.bui-badge'); b.textContent = S.unseen; b.classList.toggle('show', S.unseen > 0); bRec.classList.toggle('new', S.unseen > 0); }

    // ═══ keys ═══
    // Esc lets go of one thing at a time: the journal, a look and the tool in hand first, then whoever is being followed
    function escape() {
      if (S.tool !== 'hand' || S.recOpen || S.card.look) {
        if (S.recOpen) openRecord(false);
        if (S.card.look) call('look', null);
        if (S.tool !== 'hand') selectTool('hand');
      } else if (S.card.follow) { call('follow', null); showName(followBtn, 'Stopped following', 900); }
    }
    const typing = (e) => { const t = e.target; return !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); };
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || !e.key || typing(e)) return;
      const k = e.key.toLowerCase();
      if (e.key === ' ') { e.preventDefault(); setSpeed(S.speed === 0 ? S.lastSpeed : 0); showName(clockAnchor(), S.speed === 0 ? 'Paused' : speedWord(), 900); sfx('click'); }
      else if (e.key === ',' || e.key === '.') { stepRate(e.key === '.' ? 1 : -1); showName(clockAnchor(), speedWord(), 900); sfx('click'); }
      else if ('[]{}'.includes(e.key) && !isAct(S.tool) && banded(S.tool)) {     // [ ] size, { } (shift) strength
        const k = '{}'.includes(e.key) ? 'strength' : 'size', c = ctlOf(S.tool);
        if (c[k] != null) { setCtl(S.tool, k, c[k] + ('[{'.includes(e.key) ? -0.1 : 0.1)); showName(toolAnchor(S.tool), settingText(S.tool), 1000); e.preventDefault(); }
      }
      else if (e.key === 'Escape') escape();
      else if (k === 'm') toggleMute(timeM.isOpen() ? bSound : timeBtn);
      else if (k === 'j') { openRecord(); sfx('click'); }
      else if (k === 'h') selectTool('hand');
      else if (k === 'l') selectTool(S.tool === 'look' ? 'hand' : 'look');
      else if (k === 'v') followBtn.click();
      else if (k === 'c') { setSlice(!S.slice.on); showName(sliceBtn, S.slice.on ? 'Slice' : 'Slice closed', 900); }
    });
    addEventListener('keyup', (e) => { if (e.key === ' ') e.preventDefault(); });
    // hold Shift over the world and move: sideways is size, up and down is strength, right where you aim.
    // The game is told (adjusting) so it can hold its ring still instead of following the pointer.
    let px = -1, py = -1, sh = null;
    addEventListener('pointermove', (e) => {
      px = e.clientX; py = e.clientY;
      if (!sh) return;
      setCtl(sh.id, 'size', sh.c.size + (px - sh.x) / 130, true);
      if (sh.c.strength != null) setCtl(sh.id, 'strength', sh.c.strength - (py - sh.y) / 130, true);
      showNameAt(settingText(sh.id), sh.x + 18, sh.y - 26, false, 1500);
    }, true);
    addEventListener('keydown', (e) => {
      if (e.key !== 'Shift' || sh || isAct(S.tool) || !banded(S.tool) || px < 0) return;
      const over = document.elementFromPoint(px, py);
      if (over && ui.contains(over)) return;                     // only over the world
      sh = { id: S.tool, x: px, y: py, c: ctlOf(S.tool) };
      call('adjusting', true);
      showNameAt(settingText(sh.id), px + 18, py - 26, false, 1500);
    });
    const letGo = () => { if (sh) { sh = null; store.set('ctl2', S.ctl); call('adjusting', false); } };
    addEventListener('keyup', (e) => { if (e.key === 'Shift') letGo(); });
    addEventListener('blur', letGo);

    // ═══ events from the game ═══
    const on = {
      world(d) { if (d.year != null) { hearYear(d.year); S.year = d.year; } },
      vitals(d) {
        for (const id in d) {
          const v = VITALS.find((x) => x.id === id); if (!v) continue;
          const prev = vitVals[id];
          vitVals[id] = Object.assign({}, prev, d[id]);
          vitRows[id].upd();
          if (prev && prev.word && d[id].word && d[id].word !== prev.word) vitalChanged(v);
        }
      },
      story(d) { if (d && d.text) addLine(d); },
      discovery(d) {
        const def = discById[d.id]; if (!def) return;
        const f = S.found[d.id];
        if (f) { f.n = (f.n || 1) + 1; store.set('found', S.found); return; }      // announced the first time only
        S.found[d.id] = { how: d.how || [], year: d.year != null ? d.year : S.year, n: 1, fresh: true };
        store.set('found', S.found);
        addLine({ id: 'disc.' + d.id, icon: def.icon, text: def.name, kind: 'disc', disc: d.id });     // a discovery is a line in the story, brighter
        if (S.recOpen) renderRecord();          // open: the new find shows at once
        else { S.unseen++; renderBadge(); }
        sfx(def.tier === 'engineered' ? 'rare' : 'chime');
      },
      unlock(d) {
        const v = varById[d.id]; if (!v || !S.locked.has(d.id)) return;
        S.locked.delete(d.id); opened.add(d.id); store.set('opened1', [...opened]);
        markUnlocked(v);
        addLine({ id: 'unlock.' + d.id, icon: v.icon, text: v.name + (d.why ? ' · ' + d.why : ''), kind: 'unlock' });
      },
      speed(d) { setSpeed(d.speed, true); },
      tool(d) { selectTool(d.id, { fromGame: true, quiet: true }); },
      place(d) { if (S.tool === 'work') openWork(d); },          // work mode: a click on the land opens your ring there
      // the game says what is being looked at or followed: { mode: 'look' | 'follow', id, icon, name, state, line, kind, where, age, canFollow }; id null ends it
      subject(d) {
        const was = S.card.follow;
        S.card[d.mode] = d.id == null ? null : d;
        if (d.mode === 'follow' && d.id != null && S.tool === 'follow') selectTool(S.beforeFollow === 'follow' ? 'hand' : S.beforeFollow, { quiet: true });   // picked: back to what you held
        if (d.mode === 'follow' && d.id != null && (!was || was.id !== d.id)) S.card.look = null;   // a new follow takes the card
        renderCard();
      },
    };

    // ═══ hotbars: your own tools, up to ten a side, filled from the box of every tool. Work mode: your own sets, round a spot ═══
    const SETMAX = 8;
    const SHAPE_FAMS = ['land', 'place', 'rockkind', 'caves'];
    const sideOf = (id) => varById[id].family.side;
    const setOf = (id) => (SHAPE_FAMS.includes(varById[id].family.id) ? 'shape' : sideOf(id));
    const firstUnlocked = (side) => fams[side].map((f) => S.last[f.id]).filter((id) => !S.locked.has(id));
    // a save from an older catalogue may name tools that are gone, or on the other side now: those are left out, and anything missing starts fresh
    const known = (list, ok) => (Array.isArray(list) ? [...new Set(list.filter((id) => typeof id === 'string' && varById[id] && ok(id)))] : null);
    const savedHot = store.get('hot3', null) || {}, savedWork = store.get('work1', null) || {}, savedSets = savedWork.sets || {};
    S.hot = {};
    for (const side of ['tend', 'wreck']) S.hot[side] = known(savedHot[side], (id) => sideOf(id) === side) || firstUnlocked(side).slice(0, 5);
    const WORK0 = {
      tend: ['rain', 'seeds', 'herd', 'clear', 'cleanse', 'seal', 'deposit'],
      shape: ['raise', 'sink', 'smooth', 'carve', 'cliff', 'boulder', 'waterfall', 'cavemouth'],
      wreck: ['lightning', 'volcano', 'quake', 'asteroid', 'oil', 'locusts', 'laser', 'hurricane'] };
    S.work = { cur: savedWork.cur in WORK0 ? savedWork.cur : 'tend', sets: {} };
    for (const k in WORK0) S.work.sets[k] = (known(savedSets[k], () => true) || WORK0[k].filter((id) => varById[id])).slice(0, SETMAX);
    const saveHot = () => store.set('hot3', S.hot), saveWork = () => store.set('work1', S.work);
    var hotReady = false;
    const hot = {}, boxes = {}, boxBtns = {};
    const HOTK = { tend: ['1', '2', '3', '4', '5'], wreck: ['6', '7', '8', '9', '0'] };
    const nameOf = (v) => (S.locked.has(v.id) ? (v.planned ? v.name + ' · planned' : '?') : v.name);
    const nope = (el) => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); sfx('nope'); };
    // take a tool into the hand
    function take(id, el, from) {
      if (S.locked.has(id)) { nope(el); return false; }
      hideHover(); selectTool(id, { anchor: el, noName: from !== 'box' });       // a bar's own slot lights up; the box names what you took
      S.work.cur = setOf(id); saveWork();
      return true;
    }
    function hotAnchor(id) {
      const side = sideOf(id), bar = hot[side]; if (!bar) return handBtn;

      else if (kind === 'brush') { mode = 'brush'; hoverHit = hit; brushAcc = 0; use(S.tool, hit, Object.assign({ first: true }, S.ctl)); }       // the first landing at once, so a quick click counts
      else if (kind === 'strike') { mode = 'charge'; hoverHit = hit; charge = 0; }
      else { mode = 'once'; use(S.tool, hit, Object.assign({}, S.ctl)); }
    });
    cv.addEventListener('pointermove', (e) => {
      const was = P.get(e.pointerId); mx = e.clientX; my = e.clientY;
      if (!was) return;
      P.set(e.pointerId, [e.clientX, e.clientY]);
      if (mode === 'pinch') { const [a, b] = [...P.values()]; cam.zoomTo(dist0 * pinch0 / Math.max(10, Math.hypot(a[0] - b[0], a[1] - b[1]))); return; }
      if (down && !down.moved && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) down.moved = true;
      if (mode === 'orbit' || (mode === 'tap' && down.moved)) cam.orbit(e.clientX - was[0], e.clientY - was[1]);
    });
    const lift = (e) => {
      if (!P.has(e.pointerId)) return;
      P.delete(e.pointerId);
      if (mode === 'tap' && down && !down.moved && e.type === 'pointerup') {
        if (S.tool === 'work') emit('place', { x: down.x, y: down.y, ground: down.hit.ground });
        else use(S.tool, down.hit, {});
      } else if (mode === 'charge' && hoverHit && e.type === 'pointerup') use(S.tool, hoverHit, { charge });
      mode = P.size ? 'orbit' : null; charge = 0; down = null;
    };
    cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
    cv.addEventListener('pointerleave', () => { if (!P.size) { mx = -1; my = -1; } });
    cv.addEventListener('wheel', (e) => { e.preventDefault(); cam.zoomBy(clamp(e.deltaY, -200, 200) * 0.0016); }, { passive: false });

    // ── calls from the interface ──
    const host = {
      selectTool(id, ctl) { S.tool = id; S.ctl = Object.assign({}, ctl); if (mode === 'brush' || mode === 'charge') mode = null; },
      setControl(id, k, x) { if (id === S.tool) S.ctl[k] = x; },
      adjusting(on) { S.adjusting = on; },
      useAt(x, y, id) { const h = pickAt(x, y); if (h && VAR[id]) use(id, h, kindOf(id) === 'strike' ? { charge: 0.5 } : { size: 0.5, strength: 0.5, once: true }); },
      setSpeed(n) { clock.speed = n; },
      setVolume(level) { mixer.mute(level === 0); },
      setView(id, on) { if (world.setView) world.setView(id, on); },
      setSlice(depth) { if (world.setSlice) world.setSlice(depth); },
      look(id) { if (world.look) world.look(id); else if (id == null) emit('subject', { mode: 'look', id: null }); },
      follow(id) { if (world.follow) world.follow(id); else if (id == null) emit('subject', { mode: 'follow', id: null }); },
      idle(on) { S.idle = on; },
    };

    // ── behind the gear: the readout, the sound levels, the seed ──
    const tray = buildTray({
      levels: mixer.levels, setLevel: (k, x) => { mixer.ctx(); mixer.set(k, x); },
      seed: () => seed,
      newWorld(s) { store.del('save'); begin(s == null ? (Math.random() * 1e5) | 0 : s, null); tray.sync(); },
      resetLayout: () => ui.resetLayout(),
      about: 'Marble frame ' + VERSION + (typeof MARBLE_BUILD === 'object' ? ' · ' + MARBLE_BUILD.hash + ' · ' + MARBLE_BUILD.built : '') + (saving ? '' : ' · saving off'),
    });
    ui = BubbleUI.mount(document.body, {
      catalogue: C, host, recordName: world.recordName || 'Journal', idleAfter: param('idle') != null ? +param('idle') : 10000,
      tray: { el: tray.el, name: world.name || 'Marble' },
      audio: { ctx: () => mixer.ctx(), out: () => mixer.bus('ui') },
    });
    for (const [n, d] of waiting) ui.send(n, d);
    waiting.length = 0;
    ui.send('world', { year: clock.year });

    // ── one frame ──
    const ST = { n: 0, gap: 0, frame: 0, sim: 0, draw: 0, glass: 0, ticks: 0, asked: 0, gpu: [], out: {} };
    const timer = gl.getExtension('EXT_disjoint_timer_query_webgl2'), queries = [];
    // A held brush lands thirty times a second of real time, whatever the speed, so a tool feels the same at Normal and at
    // Fastest and still works while paused. Each landing is logged with the tick it fell on.
    function brush(dt) {
      if (mode !== 'brush' || !hoverHit) { brushAcc = 0; return; }
      brushAcc += dt;
      while (brushAcc >= clock.TICK) { brushAcc -= clock.TICK; land(S.tool, hoverHit, Object.assign({}, S.ctl)); }
    }
    function simulate(dt) {
      const t0 = performance.now();
      flush(); brush(dt);
      const n = clock.advance(dt, (tk) => world.step(tk));
      ST.sim += performance.now() - t0; ST.ticks += n;
    }
    function render(time, dt) {
      resize(); cam.update(dt, W, H);
      // where the tool in hand is aimed: under the pointer, held still while Shift adjusts it, gone while the interface rests
      const kind = kindOf(S.tool), working = mode === 'brush' || mode === 'charge';
      if ((kind !== 'brush' && kind !== 'strike') || (S.idle && !working)) hoverHit = null;
      else if (working) { if (!S.adjusting) hoverHit = pickAt(mx, my) || hoverHit; }
      else if (mode || mx < 0) hoverHit = null;
      else if (!S.adjusting) hoverHit = pickAt(mx, my);
      if (world.hover) world.hover(hoverHit ? { tool: S.tool, hit: hoverHit, settings: S.ctl, charge: mode === 'charge' ? charge : 0, held: mode === 'brush' } : null);
      let q = null;
      if (timer) {
        while (queries.length && gl.getQueryParameter(queries[0], gl.QUERY_RESULT_AVAILABLE)) {
          const r = queries.shift();
          if (!gl.getParameter(timer.GPU_DISJOINT_EXT)) { ST.gpu.push(gl.getQueryParameter(r, gl.QUERY_RESULT) / 1e6); if (ST.gpu.length > 120) ST.gpu.shift(); }
          gl.deleteQuery(r);
        }
        if (queries.length < 6) { q = gl.createQuery(); gl.beginQuery(timer.TIME_ELAPSED_EXT, q); }
      }
      const t0 = performance.now();
      const target = glass.begin(cam, time, W, H);
      const t1 = performance.now();
      world.draw(cam, target);
      const t2 = performance.now();
      glass.end(cam, time);
      ST.draw += t2 - t1; ST.glass += t1 - t0 + performance.now() - t2;
      if (q) { gl.endQuery(timer.TIME_ELAPSED_EXT); queries.push(q); }
    }
    let last = 0, tWorld = 0, tRead = 0, tSave = 0;
    function frame(now) {
      requestAnimationFrame(frame);
      const dt = Math.min(0.1, last ? (now - last) / 1000 : 1 / 60);
      if (last) ST.gap += now - last;
      last = now;
      const t0 = performance.now();
      try {
        if (mode === 'charge') charge = Math.min(1, charge + dt * 0.8);
        simulate(dt);
        render(now / 1000, dt);
      } catch (e) { fail(e); throw e; }
      ST.n++; ST.frame += performance.now() - t0;
      if (now - tWorld > 250) { tWorld = now; ui.send('world', { year: clock.year }); }
      if (now - tRead > 500) { tRead = now; readout(); }
      if (now - tSave > 15000) { tSave = now; save(); }
    }
    function readout() {
      const n = Math.max(1, ST.n), o = ST.out;
      o.frame = ST.frame / n; o.sim = ST.sim / n; o.draw = ST.draw / n; o.glass = ST.glass / n; o.ticks = ST.ticks / n;
      o.fps = ST.n > 1 ? 1000 * (ST.n - 1) / ST.gap : 0; o.gpu = ST.gpu.length ? median(ST.gpu.slice(-60)) : null;
      o.cells = typeof world.cells === 'function' ? world.cells() : world.cells || 0; o.size = W + '×' + H; o.behind = clock.behind; o.asked = glass.asked / n;
      ST.n = 0; ST.gap = 0; ST.frame = 0; ST.sim = 0; ST.draw = 0; ST.glass = 0; ST.ticks = 0;
      tray.readout(o);
    }
    addEventListener('pagehide', save);
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else last = 0; });

    // ── for checking by script (and for a builder's own measurements) ──
    const PIX = new Uint8Array(4);
    window.MARBLE = {
      version: VERSION, build: typeof MARBLE_BUILD === 'object' ? MARBLE_BUILD : null, frame: F, world, cam, clock, glass, mixer, ui, log, state: S, saving, key: KEY,
      get stats() { return ST.out; },
      newWorld: (s) => { store.del('save'); begin(s, null); tray.sync(); },
      // run n ticks now, without drawing: the sim's own speed. Returns ms per tick
      step(n) { n = n || 1; const t0 = performance.now(); for (let i = 0; i < n; i++) { world.step(clock.TICK); clock.tick++; } return (performance.now() - t0) / n; },
      use(tool, hit, settings) { land(tool, hit, settings || {}); },
      pick: pickAt,
      // draw one frame now and return the colour at a canvas pixel (0..255, y down), for checking without a screenshot
      pixel(x, y) { render(performance.now() / 1000, 1 / 60); gl.readPixels(x, H - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, PIX); return [...PIX]; },
      // time n whole frames back to back, waiting for the GPU after each. Works with the pane hidden
      bench(n) { n = n || 120; const t = []; let time = performance.now() / 1000; for (let k = 0; k < n; k++) { const t0 = performance.now(); render(time, 1 / 60); time += 1 / 60; gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, PIX); t.push(performance.now() - t0); } return { median: +median(t).toFixed(2), size: W + '×' + H }; },
      // The glass's own cost, two ways. `whole` and `noGlass` are whole frames timed back to back with and without the
      // glass, so `glassTotal` is what the glass adds. `space` and `pass` are its two big passes alone, each repeated
      // and waited for (the picture step between them cannot be timed alone: the GPU may put it off).
      cost(n) {
        const whole = window.MARBLE.bench(n).median; glass.bypass = true; const none = window.MARBLE.bench(n).median; glass.bypass = false;
        glass.measure(); render(performance.now() / 1000, 1 / 60); const c = glass.cost;
        return { whole, noGlass: none, glassTotal: +(whole - none).toFixed(2), space: +c.space.toFixed(2), pass: +c.glass.toFixed(2), size: c.size };
      },
    };
    resize(); requestAnimationFrame(frame);
  }

  // ── the gear's panel. Plain words and bars in the interface's own quiet look ──
  function buildTray(o) {
    const el = document.createElement('div'); el.className = 'mf-tray';
    el.innerHTML =
      '<div class="mf-read">–</div><i class="rule"></i>' +
      ['master:Everything', 'world:World sounds', 'ui:Clicks and chimes'].map((s) => { const [k, n] = s.split(':'); return '<label class="mf-lv"><span>' + n + '</span><input type="range" min="0" max="1" step="0.01" data-lv="' + k + '"></label>'; }).join('') +
      '<i class="rule"></i><div class="mf-row"><span>Seed</span><input class="mf-seed" type="text" inputmode="numeric" spellcheck="false"><button data-a="go">Open</button></div>' +
      '<div class="mf-row"><button data-a="new">New world</button><button data-a="link">Copy link</button></div>' +
      '<div class="mf-row"><button data-a="layout">Reset layout</button></div>' +
      '<div class="mf-about"></div>';
    const $ = (s) => el.querySelector(s), seedIn = $('.mf-seed');
    $('.mf-about').textContent = o.about;
    el.querySelectorAll('[data-lv]').forEach((r) => {
      r.value = o.levels[r.dataset.lv];
      r.addEventListener('input', () => o.setLevel(r.dataset.lv, +r.value));
      r.addEventListener('change', () => r.blur());                            // so Space pauses again
    });
    let sure = 0;
    const flash = (b, t) => { const was = b.dataset.t || (b.dataset.t = b.textContent); b.textContent = t; clearTimeout(b._t); b._t = setTimeout(() => { b.textContent = was; }, 1400); };
    const open = () => { const s = parseInt(seedIn.value, 10); if (isFinite(s) && s !== o.seed()) o.newWorld(s); seedIn.blur(); };
    seedIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') open(); e.stopPropagation(); });
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'go') open();
      else if (a === 'new') { const now = performance.now(); if (now - sure < 2000) { sure = 0; o.newWorld(null); flash(b, 'New world'); } else { sure = now; flash(b, 'Again to confirm'); } }      // a new world wipes this one: it takes a second click
      else if (a === 'link') { const u = location.href.split('#')[0] + '#seed=' + o.seed(); if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => flash(b, 'Copied'), () => flash(b, u)); else flash(b, u); }
      else if (a === 'layout') o.resetLayout();
    });
    const f = (x) => (x < 10 ? x.toFixed(2) : x.toFixed(1));
    const T = {
      el,
      sync() { seedIn.value = o.seed(); },
      readout(r) {
        $('.mf-read').textContent =
          'script ' + f(r.frame) + ' ms' + (r.gpu != null ? ' · gpu ' + f(r.gpu) + ' ms' : '') + ' · ' + r.fps.toFixed(0) + ' fps\n' +
          'world ' + f(r.sim) + ' · draw ' + f(r.draw) + ' · glass ' + f(r.glass) + '\n' +
          (r.cells ? r.cells.toLocaleString('en') + ' cells · ' : '') + r.ticks.toFixed(1) + ' ticks a frame' + (r.behind ? ' · running slow' : '') + '\n' + r.size;
      },
    };
    T.sync();
    return T;
  }

  return { version: VERSION, world(def) { DEF = def; }, start() { try { start(); } catch (e) { fail(e); } } };
})();

</script>

<!-- ═════════════════════════ 2. THE WORLD ═════════════════════════ -->
<script>
'use strict';
{
// ───────── frame/worlds/placeholder/world.js ─────────
// ───────────────────────── the placeholder world ─────────────────────────
// A deliberately plain world, here only to prove the frame's contract end to end: a gently domed disc of bare ground in
// the lower part of the sphere, open sky above, a cut-away where the ground meets the glass, and heat at the bottom.
// Three tools change the ground, the ground slowly settles back by itself, and a few events are sent for real.
// It has no plants, animals, water or weather, and it is not a model for how land should be stored.
const N = 64;                              // cells across: one height for each
let F, R, CS, Y0, HOT, MAG, FLOOR, CEIL;   // set in init, from the sphere's radius
let h, base, inside;                       // heights now, heights the ground settles back to, which cells lie inside the glass
let dirty = true, ring = null, t = 0;
let hot = 0, lifted = 0, words = {}, lastTool = '', vitalT = 0, insideN = 1;
let G = null;                              // what was made on the graphics card (once)

const at = (i, j) => j * N + i;
// the ground's height at a point, between the cells
function heightAt(x, z) {
  const gx = clamp((x + R) / CS, 0, N - 1.001), gz = clamp((z + R) / CS, 0, N - 1.001);
  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j;
  return lerp(lerp(h[at(i, j)], h[at(i + 1, j)], fx), lerp(h[at(i, j + 1)], h[at(i + 1, j + 1)], fx), fz);
}
// add a soft bump (or a dip) round a point
function bump(x, z, radius, amount) {
  const r2 = radius * radius, i0 = Math.max(0, Math.floor((x - radius * 2 + R) / CS)), i1 = Math.min(N - 1, Math.ceil((x + radius * 2 + R) / CS));
  const j0 = Math.max(0, Math.floor((z - radius * 2 + R) / CS)), j1 = Math.min(N - 1, Math.ceil((z + radius * 2 + R) / CS));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = i * CS - R - x, dz = j * CS - R - z, k = at(i, j);
    h[k] = clamp(h[k] + amount * Math.exp(-(dx * dx + dz * dz) / r2), FLOOR, CEIL);
  }
  dirty = true;
}
function count() {
  let nHot = 0, sum = 0;
  for (let k = 0; k < N * N; k++) if (inside[k]) { if (h[k] < HOT) nHot++; sum += h[k] - base[k]; }
  hot = nHot; lifted = sum / insideN;
}
const say = (id, icon, text, kind, minor) => F.emit('story', { id, icon, text, kind, minor });

// what the frame shows as vital signs: two here, each a level and a word
const LAND = ['Sunken', 'Level', 'Heaped'], WARM = ['Cool', 'Warm', 'Hot'];
function vitals(quiet) {
  const landV = clamp(0.5 + lifted / 1.6, 0, 1), warmV = clamp(hot / (insideN * 0.12), 0, 1);
  const now = { land: LAND[landV < 0.4 ? 0 : landV > 0.6 ? 2 : 1], warmth: WARM[warmV <= 0 ? 0 : warmV < 0.5 ? 1 : 2] };
  F.emit('vitals', {
    land: { value: landV, word: now.land, detail: (lifted >= 0 ? '+' : '') + lifted.toFixed(2) + ' against where it settles' },
    warmth: { value: warmV, word: now.warmth, detail: hot + ' cells open to the heat' },
  });
  if (!quiet) {
    if (words.land && now.land !== words.land) say('land.' + now.land, '⛰️', 'The ground is ' + now.land.toLowerCase(), 'milestone');
    if (words.warmth && now.warmth !== words.warmth) say('warmth.' + now.warmth, '🌡️', 'The world runs ' + now.warmth.toLowerCase(), 'milestone');
  }
  words = now;
}

const TERRAIN_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aXZ;
layout(location = 1) in float aH;
uniform mat4 uVP;
out vec3 vW;
void main() {
  vW = vec3(aXZ.x, aH, aXZ.y);
  gl_Position = uVP * vec4(vW, 1.0);
}`;
const TERRAIN_FS = `#version 300 es
precision highp float;
in vec3 vW;
uniform vec3 uSun, uSunCol, uAmb;
uniform vec4 uRing;        // x, z, radius, how full (a strike charging)
uniform float uRingK, uTime, uRR, uY0, uHot;
out vec4 o;
void main() {
  if (dot(vW, vW) > uRR) discard;
  vec3 n = normalize(cross(dFdx(vW), dFdy(vW)));
  if (n.y < 0.0) n = -n;
  float d = uY0 - vW.y;                                                              // how far below the resting level
  vec3 col = mix(vec3(0.60, 0.55, 0.46), vec3(0.34, 0.30, 0.28), smoothstep(0.2, 2.6, d));
  col = mix(col, vec3(0.70, 0.66, 0.56), smoothstep(0.3, 2.2, -d));
  col *= uAmb + uSunCol * max(dot(n, uSun), 0.0);
  float hk = 1.0 - smoothstep(uHot - 0.3, uHot + 0.8, vW.y);                          // ground dug down to the heat glows
  col += vec3(1.0, 0.36, 0.05) * hk * (0.75 + 0.25 * sin(uTime * 1.3 + vW.x * 0.9 + vW.z * 0.7));
  if (uRingK > 0.0) {
    float dr = length(vW.xz - uRing.xy);
    float w = max(fwidth(dr) * 1.5, 0.03);
    float line = 1.0 - smoothstep(w, w * 2.0, abs(dr - uRing.z));
    float fill = (1.0 - smoothstep(uRing.z * uRing.w - w, uRing.z * uRing.w, dr)) * step(0.001, uRing.w);
    col = mix(col, vec3(1.0), (line * 0.7 + fill * 0.22) * uRingK);
  }
  o = vec4(col, 1.0);
}`;
const SHELL_VS = `#version 300 es
precision highp float;
layout(location = 0) in vec3 aPos;
uniform mat4 uVP;
out vec3 vW;
void main() {
  vW = aPos;
  gl_Position = uVP * vec4(aPos, 1.0);
}`;
const SHELL_FS = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec3 vW;
uniform sampler2D uH;
uniform vec3 uSunCol, uAmb;
uniform float uTime, uHalf, uCS, uN, uHot, uMag;
out vec4 o;
float topAt(vec2 xz) {
  vec2 g = clamp((xz + uHalf) / uCS, vec2(0.0), vec2(uN - 1.001));
  vec2 fl = floor(g), f = g - fl;
  ivec2 i = ivec2(fl);
  return mix(mix(texelFetch(uH, i, 0).r, texelFetch(uH, i + ivec2(1, 0), 0).r, f.x), mix(texelFetch(uH, i + ivec2(0, 1), 0).r, texelFetch(uH, i + ivec2(1, 1), 0).r, f.x), f.y);
}
void main() {
  float top = topAt(vW.xz), y = vW.y;
  if (y > top) discard;                                                               // open air above the ground: nothing to cut through
  float d = top - y;
  vec3 col = mix(vec3(0.38, 0.27, 0.19), vec3(0.47, 0.44, 0.45), smoothstep(0.45, 0.7, d));     // soil, then rock
  col = mix(col, vec3(0.25, 0.20, 0.21), smoothstep(uHot + 1.2, uHot - 0.2, y));                  // darker toward the heat
  col *= uAmb + uSunCol * 0.55;
  float glow = 1.0 - smoothstep(uMag, uHot + 0.9, y);
  col += vec3(0.55, 0.13, 0.02) * glow * glow * (0.6 + 0.2 * sin(uTime * 1.1 + vW.x * 0.8 + vW.z * 0.6));
  float m = 1.0 - smoothstep(uMag - 0.4, uMag + 0.5, y + 0.25 * sin(vW.x * 1.7 + uTime * 0.5) * sin(vW.z * 1.3 - uTime * 0.4));
  col = mix(col, mix(vec3(0.9, 0.2, 0.03), vec3(1.0, 0.68, 0.16), 0.5 + 0.5 * sin(uTime * 0.8 + vW.x * 2.1 - vW.z * 1.6 + y * 3.0)), m);
  o = vec4(col, 1.0);
}`;

function makeGraphics() {
  const gl = F.gl, g = {};
  g.pTerrain = mkProgram('placeholder ground', TERRAIN_VS, TERRAIN_FS);
  g.pShell = mkProgram('placeholder cut-away', SHELL_VS, SHELL_FS);
  if (GLX.errors.length) throw new Error(GLX.errors.join('\n'));
  // the ground: one point for each cell, its height in a buffer of its own so only that is sent when the ground changes
  g.vao = gl.createVertexArray(); gl.bindVertexArray(g.vao);
  const xz = new Float32Array(N * N * 2);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { xz[at(i, j) * 2] = i * CS - R; xz[at(i, j) * 2 + 1] = j * CS - R; }
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, xz, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  g.hBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, g.hBuf); gl.bufferData(gl.ARRAY_BUFFER, N * N * 4, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
  const idx = new Uint16Array((N - 1) * (N - 1) * 6);
  let k = 0;
  for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++) {
    const a = at(i, j), b = a + 1, c = a + N, d = c + 1;
    if ((i + j) & 1) { idx[k++] = a; idx[k++] = c; idx[k++] = b; idx[k++] = b; idx[k++] = c; idx[k++] = d; }
    else { idx[k++] = a; idx[k++] = c; idx[k++] = d; idx[k++] = a; idx[k++] = d; idx[k++] = b; }
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
  g.count = idx.length;
  // the cut-away: the lower part of a sphere just inside the glass, shown wherever it is below the ground
  g.shellVao = gl.createVertexArray(); gl.bindVertexArray(g.shellVao);
  const SEG = 96, RINGS = 48, RS = R * 0.996, th0 = Math.acos(Math.min(0.99, (CEIL + 0.3) / R));
  const sp = new Float32Array((RINGS + 1) * (SEG + 1) * 3), si = new Uint16Array(RINGS * SEG * 6);
  k = 0;
  for (let r = 0; r <= RINGS; r++) for (let s = 0; s <= SEG; s++) {
    const th = th0 + (Math.PI - th0) * (r / RINGS), ph = (s / SEG) * TAU;
    sp[k++] = RS * Math.sin(th) * Math.cos(ph); sp[k++] = RS * Math.cos(th); sp[k++] = RS * Math.sin(th) * Math.sin(ph);
  }
  k = 0;
  for (let r = 0; r < RINGS; r++) for (let s = 0; s < SEG; s++) {
    const a = r * (SEG + 1) + s, b = a + 1, c = a + SEG + 1, d = c + 1;
    si[k++] = a; si[k++] = c; si[k++] = b; si[k++] = b; si[k++] = c; si[k++] = d;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, sp, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, si, gl.STATIC_DRAW);
  g.shellCount = si.length;
  gl.bindVertexArray(null);
  // the heights again as a picture, for the cut-away to read
  g.texH = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, g.texH);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, N, N, 0, gl.RED, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return g;
}

const BAND = { size: true, strength: true };
const mixed = { sky: 0, water: 0, earth: 0, magma: 0 };     // one answer object, used again for every glassSample

Marble.world({
  id: 'placeholder',
  name: 'Placeholder',
  yearSeconds: 30,
  cells: N * N,

  catalogue: {
    families: [
      { id: 'land', side: 'tend', name: 'Land', variants: [
        { id: 'raise', name: 'Raise', icon: '⛰️', shape: 'area', lead: true, controls: BAND, bands: ['Nudge', 'Mound', 'Ridge'] },
        { id: 'sink', name: 'Lower', icon: '🕳️', shape: 'area', controls: BAND, bands: ['Dip', 'Hollow', 'Basin'] },
      ] },
      { id: 'strike', side: 'wreck', name: 'Strike', variants: [
        { id: 'crater', name: 'Crater', icon: '☄️', shape: 'point', lead: true, controls: { charge: true } },
      ] },
    ],
    discoveries: [
      { id: 'heat', name: 'Heat below', icon: '🔥', tier: 'witnessed' },
      { id: 'sealed', name: 'Sealed over', icon: '🪨', tier: 'engineered', marks: {},
        steps: [{ tool: 'crater', icon: '☄️', name: 'Crater' }, { icon: '🔥', name: 'Heat laid bare' }, { tool: 'raise', icon: '⛰️', name: 'Raise' }, { icon: '🪨', name: 'Sealed over' }] },
    ],
    vitals: [
      { id: 'land', name: 'Land', icon: '⛰️', colour: '#c9b48a', middle: true },
      { id: 'warmth', name: 'Warmth', icon: '🌡️', colour: '#ff9a5c' },
    ],
  },

  // Build everything from the seed. Called again for a new world, so it resets all of it.
  init(seed, frame) {
    F = frame; R = F.R; CS = 2 * R / (N - 1);
    Y0 = -R * 0.26; HOT = -R * 0.6; MAG = -R * 0.71; FLOOR = -R * 0.74; CEIL = R * 0.29;
    const rnd = F.random('land'), ox = rnd() * 100, oz = rnd() * 100;
    h = new Float32Array(N * N); base = new Float32Array(N * N); inside = new Uint8Array(N * N); insideN = 0;
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const x = i * CS - R, z = j * CS - R, r2 = (x * x + z * z) / (R * R);
      base[at(i, j)] = h[at(i, j)] = Y0 + 0.55 * (1 - r2) + (fbm(x * 0.22 + ox, z * 0.22 + oz, 3) - 0.5) * 0.7;      // a gentle dome, with the seed's own slight rise and fall
      if (x * x + z * z + Y0 * Y0 < R * R) { inside[at(i, j)] = 1; insideN++; }
    }
    dirty = true; ring = null; t = 0; words = {}; lastTool = ''; vitalT = 0;
    if (!G) G = makeGraphics();
    count(); vitals(true);
    say('new', '🫧', 'A bare world settled in the glass', 'life');
  },

  // One fixed tick. The ground slowly settles back to where it began, so every mark heals without help.
  step(dt) {
    t += dt;
    const k = 1 - Math.exp(-dt / 70);
    let moved = false;
    for (let c = 0; c < N * N; c++) { const d = base[c] - h[c]; if (d > 0.002 || d < -0.002) { h[c] += d * k; moved = true; } }
    if (moved) dirty = true;
    vitalT += dt;
    if (vitalT >= 0.5) {
      vitalT = 0;
      const was = hot; count();
      if (was > 0 && hot === 0) say('heat.closed', '🪨', 'The ground closed over the heat', 'reaction');
      vitals(false);
    }
  },

  // A tool used at a point. Every tool, the hand included, comes through here.
  apply(tool, hit, s) {
    const was = hot;
    if (tool === 'raise' || tool === 'sink') {
      const radius = lerp(0.9, 2.8, s.size != null ? s.size : 0.5), amount = (s.once ? 0.5 : 0.035) * lerp(0.5, 2.2, s.strength != null ? s.strength : 0.5);
      bump(hit.x, hit.z, radius, tool === 'raise' ? amount : -amount);
      if (s.first || s.once) { say('tool.' + tool, tool === 'raise' ? '⛰️' : '🕳️', tool === 'raise' ? 'You raised the ground' : 'You lowered the ground', 'tend', true); F.sound.tone({ freq: tool === 'raise' ? 180 : 130, to: tool === 'raise' ? 240 : 95, len: 0.18, gain: 0.05 }); }
    } else if (tool === 'crater') {
      const c = s.charge != null ? s.charge : 0.5, radius = lerp(1.0, 2.6, c);
      bump(hit.x, hit.z, radius, -lerp(1.2, 4.6, c));
      bump(hit.x, hit.z, radius * 1.9, lerp(0.15, 0.5, c));                                       // the rim it throws up
      say('crater', '☄️', c > 0.66 ? 'A great crater opened' : 'A crater opened', 'wreck');
      F.sound.tone({ freq: 110, to: 38, len: 0.5, gain: 0.16, type: 'triangle' });
    } else if (tool === 'hand') {
      say('poke', '👆', 'You poked the ground', 'tend', true); F.sound.tone({ freq: 520, len: 0.07, gain: 0.03 });
    } else if (tool === 'look') {
      const y = heightAt(hit.x, hit.z), isHot = y < HOT + 0.3;
      F.emit('subject', { mode: 'look', id: 'ground', icon: isHot ? '🔥' : '🟫', name: isHot ? 'Hot rock' : 'Bare ground', kind: 'Ground', line: (y - Y0 >= 0 ? 'Raised ' : 'Dug ') + Math.abs(y - Y0).toFixed(1) + (isHot ? ', open to the heat' : '') });
    } else return;
    lastTool = tool;
    count();
    if (was === 0 && hot > 0) { say('heat.open', '🔥', 'Heat broke through the ground', 'reaction'); F.emit('discovery', { id: 'heat', how: ['☄️ A crater, deep enough'] }); }
    if (was > 0 && hot === 0 && tool === 'raise') { say('heat.sealed', '🪨', 'You sealed the heat over', 'reaction'); F.emit('discovery', { id: 'sealed', how: ['☄️ Crater down to the heat', '⛰️ Raise the ground back over it'] }); }
  },

  // Where a view line meets the ground. Only the open ground counts: the cut-away at the wall is not something to work on.
  pick(o, d) {
    const hitS = F.raySphere(o, d, R * 0.995); if (!hitS) return null;
    let a = Math.max(hitS[0], 0), b = hitS[1];
    const below = (s) => o[1] + d[1] * s < heightAt(o[0] + d[0] * s, o[2] + d[2] * s);
    if (below(a + 0.01)) return null;
    for (let s = a + 0.15; s < b; s += 0.15) {
      if (!below(s)) { a = s; continue; }
      let lo = a, hi = s;
      for (let i = 0; i < 6; i++) { const m = (lo + hi) / 2; if (below(m)) hi = m; else lo = m; }
      return { x: o[0] + d[0] * hi, y: o[1] + d[1] * hi, z: o[2] + d[2] * hi };
    }
    return null;
  },

  // The tool in hand, aimed: the frame says where, the world draws the ring.
  hover(a) {
    ring = a && { x: a.hit.x, z: a.hit.z, radius: a.tool === 'crater' ? lerp(1.0, 2.6, a.charge || 0) : lerp(0.9, 2.8, a.settings.size != null ? a.settings.size : 0.5), fill: a.tool === 'crater' ? Math.max(a.charge, 0.001) : 0 };
  },

  // What lies behind the glass in a direction: sky above the ground, earth below it, magma at the bottom.
  glassSample(dir) {
    const x = dir[0] * R, y = dir[1] * R, z = dir[2] * R, top = heightAt(x, z);
    if (y > top + 0.4) return 'sky';
    mixed.sky = smooth(top - 0.05, top + 0.4, y);
    mixed.magma = 1 - smooth(MAG - 0.6, MAG + 1.5, y);
    mixed.earth = clamp(1 - mixed.sky - mixed.magma, 0, 1);
    return mixed;
  },

  draw(cam) {
    const gl = F.gl;
    if (dirty) {
      gl.bindBuffer(gl.ARRAY_BUFFER, G.hBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, h);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.texH); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RED, gl.FLOAT, h);
      dirty = false;
    }
    let p = G.pShell; gl.useProgram(p.p);
    gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
    gl.uniform3fv(p.u('uSunCol'), F.sunColor); gl.uniform3fv(p.u('uAmb'), F.ambient);
    gl.uniform1f(p.u('uTime'), t % 3600); gl.uniform1f(p.u('uHalf'), R); gl.uniform1f(p.u('uCS'), CS); gl.uniform1f(p.u('uN'), N);
    gl.uniform1f(p.u('uHot'), HOT); gl.uniform1f(p.u('uMag'), MAG);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, G.texH); gl.uniform1i(p.u('uH'), 0);
    gl.bindVertexArray(G.shellVao); gl.drawElements(gl.TRIANGLES, G.shellCount, gl.UNSIGNED_SHORT, 0);
    p = G.pTerrain; gl.useProgram(p.p);
    gl.uniformMatrix4fv(p.u('uVP'), false, cam.vp);
    gl.uniform3fv(p.u('uSun'), F.sun); gl.uniform3fv(p.u('uSunCol'), F.sunColor); gl.uniform3fv(p.u('uAmb'), F.ambient);
    gl.uniform1f(p.u('uTime'), t % 3600); gl.uniform1f(p.u('uRR'), R * R); gl.uniform1f(p.u('uY0'), Y0); gl.uniform1f(p.u('uHot'), HOT);
    gl.uniform4f(p.u('uRing'), ring ? ring.x : 0, ring ? ring.z : 0, ring ? ring.radius : 1, ring ? ring.fill : 0); gl.uniform1f(p.u('uRingK'), ring ? 1 : 0);
    gl.bindVertexArray(G.vao); gl.drawElements(gl.TRIANGLES, G.count, gl.UNSIGNED_SHORT, 0);
    gl.bindVertexArray(null);
  },

  // The whole state as plain data, and back again. The frame keeps it under this world's save key.
  save() { return { h: Array.from(h, (x) => Math.round(x * 1000)), t }; },
  load(s) { if (!s || !s.h || s.h.length !== N * N) throw new Error('not this world\'s save'); for (let k = 0; k < N * N; k++) h[k] = s.h[k] / 1000; t = s.t || 0; dirty = true; count(); vitals(true); },
  // a number that changes if any height does, for checking that the same seed and the same inputs give the same world
  checksum() { let a = 0; for (let k = 0; k < N * N; k++) a = (Math.imul(a, 31) + Math.round(h[k] * 1000)) | 0; return a; },
});

}
</script>

'use strict';
Marble.start();
