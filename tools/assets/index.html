<title>Bubble World · Assets</title>

<style>
  :root {
    --ink: #eaf2ff; --dim: rgba(234, 242, 255, .6); --faint: rgba(234, 242, 255, .38);
    --glass: linear-gradient(180deg, rgba(255, 255, 255, .085), rgba(255, 255, 255, .03));
    --glass-hi: linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .06));
    --glass-on: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, .1));
    --pane: linear-gradient(180deg, rgba(22, 28, 46, .62), rgba(14, 18, 32, .62));
    --rim: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 .5px rgba(255, 255, 255, .05);
    --blur: blur(22px) saturate(1.5);
    --edge: 12px; --side: 268px; --info: 272px; --tool: 48px;
    --lean: #86c9a1; --fair: #e2c06e; --heavy: #e58b7c;   /* the three verdicts: within the lean limit, within the fair limit, over it */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080b14; color: var(--ink); font: 14px/1.4 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  button { all: unset; cursor: pointer; }
  button:focus-visible { outline: 1px solid rgba(255, 255, 255, .5); outline-offset: 2px; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .glass { background: var(--pane); box-shadow: var(--rim); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); border-radius: 16px; }
  .ib { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: var(--glass); box-shadow: var(--rim); color: var(--dim); transition: background .15s, color .15s; }
  .ib:hover { background: var(--glass-hi); color: var(--ink); }
  .ib.on { background: var(--glass-on); color: var(--ink); }

  /* the world fills the window; the panels float over it */
  #sc { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #sc:active { cursor: grabbing; }

  /* left: every model */
  #side { position: fixed; left: var(--edge); top: var(--edge); bottom: var(--edge); width: var(--side); display: flex; flex-direction: column; gap: 8px; }   /* two boxes: the search and filters, then the gallery */
  #side-top { flex: none; padding-bottom: 8px; }
  #head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px 14px; }
  #head .ib { width: 32px; height: 32px; flex: none; }
  #q { flex: 1; min-width: 0; height: 32px; border: 0; border-radius: 10px; padding: 0 11px; font: inherit; font-size: 12.5px; color: var(--ink); background: rgba(255, 255, 255, .05); outline: none; }
  #q::placeholder { color: var(--faint); }
  #q:focus { background: rgba(255, 255, 255, .09); }
  #q:focus::placeholder { color: transparent; }                 /* the count is a hint; it goes when you click in */
  #q::-webkit-search-cancel-button { filter: invert(1); opacity: .4; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px 12px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }
  .grp h2 { margin: 12px 4px 7px; font-size: 11.5px; font-weight: 600; color: var(--faint); letter-spacing: .03em; }
  .grp h2 span { margin-left: 6px; font-weight: 500; opacity: .7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 7px; }   /* two across at the default width, up to four when widened */
  #grip { position: absolute; top: 14px; bottom: 14px; right: 0; width: 10px; cursor: ew-resize; touch-action: none; }
  #grip::after { content: ''; position: absolute; top: 50%; right: 3px; width: 3px; height: 34px; margin-top: -17px; border-radius: 2px; background: rgba(255, 255, 255, .1); opacity: 0; transition: opacity .15s; }
  #side:hover #grip::after, #grip.on::after { opacity: 1; }
  .card { position: relative; display: block; border-radius: 13px; background: var(--glass); box-shadow: var(--rim); overflow: hidden; transition: background .15s; }
  .card:hover { background: var(--glass-hi); }
  .card.on { background: var(--glass-on); }
  .card:focus-visible { outline: none; }
  .card canvas { display: block; width: 100%; aspect-ratio: 1; }
  .card .nm { position: absolute; left: 6px; right: 6px; bottom: 6px; font-size: 11px; color: var(--ink); opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .card .mark { position: absolute; top: 6px; right: 7px; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .card .mark.ok { color: var(--dim); }
  .card .mark svg { width: 13px; height: 13px; }


  /* right: the numbers */
  #info { position: fixed; right: var(--edge); top: var(--edge); width: var(--info); height: calc(100% - 2 * var(--edge)); display: flex; flex-direction: column; gap: 8px; }   /* two boxes: the tabs and their row, then the tab itself */
  #info-top { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 8px; }   /* pinned: the tabs, and the row under them */
  #info-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 14px; scrollbar-width: none; }
  #info-body::-webkit-scrollbar { display: none; }
  /* the right panel: the name and the controls on top (both tabs), then quiet sections with one style of heading */
  /* the open model's name, on the stage at the top left of the free space */
  #ttl { position: fixed; top: calc(var(--edge) + 4px); left: 0; pointer-events: none; max-width: 40vw; }
  #ttl-nm { font-size: 17px; font-weight: 600; text-shadow: 0 1px 8px rgba(0, 0, 0, .35); }
  #ttl-num { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #ttl-num b { color: var(--ink); font-weight: 600; }
  #ttl-num .sep { color: var(--faint); }
  /* the approval goes with the name: a small pill, "Approve" until it is approved */
  #ttl-row { display: flex; align-items: center; gap: 10px; }
  #ttl-nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { pointer-events: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px 0 7px; border-radius: 11px; font-size: 11.5px; font-weight: 500; color: var(--dim); background: rgba(255, 255, 255, .07); transition: background .15s, color .15s; }
  .pill:hover { color: var(--ink); background: rgba(255, 255, 255, .12); }
  .pill svg { width: 13px; height: 13px; }
  /* under the tabs: what the stage shows, the same in every tab: colour, silhouette or parts, then edges and skeleton, then the line-up */
  #stage-ctl { display: flex; align-items: center; justify-content: space-between; margin: 0 -2px; }
  .tg { width: 38px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--faint); transition: background .15s, color .15s; }
  .tg:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
  .tg.on { color: var(--ink); background: var(--glass-on); }
  .tg svg { width: 18px; height: 18px; }
  .pbsep { width: 1px; height: 20px; flex: none; background: rgba(255, 255, 255, .09); margin: 0 3px; }
  /* the looks tab: every look of the open model, two across */
  #looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .lk { position: relative; display: block; border-radius: 11px; background: var(--glass); box-shadow: var(--rim); overflow: hidden; transition: background .15s; }
  .lk:hover { background: var(--glass-hi); }
  .lk.on { background: var(--glass-on); }
  .lk:focus-visible { outline: none; }
  .lk canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; }
  .lk span { position: absolute; left: 5px; right: 5px; bottom: 4px; font-size: 10px; color: var(--ink); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #lk-note { margin-top: 8px; }
  .sec { margin: 18px 0 7px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .sec[hidden] { display: none; }
  .stat { margin-top: 14px; }
  .stat + .stat { margin-top: 12px; }
  #ab { font-size: 12.5px; color: var(--dim); line-height: 1.45; }
  #brief { font-size: 12px; color: var(--faint); margin-top: 6px; line-height: 1.45; }
  #area { font-size: 12px; color: var(--faint); margin-top: 6px; }
  #lint div { position: relative; padding-left: 13px; font-size: 12px; color: var(--dim); line-height: 1.4; }
  #lint div + div { margin-top: 3px; }
  #lint div::before { content: ''; position: absolute; left: 1px; top: 6px; width: 5px; height: 5px; border-radius: 50%; box-sizing: border-box; border: 1px solid var(--dim); }
  #lint div.fix::before { background: var(--ink); border-color: var(--ink); }   /* filled: breaks a limit; hollow: worth a look */
  /* About: closed by default at the bottom of the Info tab; mostly a record for Claude */
  #about summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
  #about summary::-webkit-details-marker { display: none; }
  #about summary::after { content: ''; width: 5px; height: 5px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); margin-left: 2px; transition: transform .15s; }
  #about[open] summary::after { transform: rotate(45deg); }
  #about summary:hover { color: var(--dim); }
  #plan { font-size: 12.5px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
  #plan span { color: var(--faint); font-size: 11.5px; }
  #where { padding: 0 10px 4px; display: flex; gap: 6px; }
  #where .ib { flex: none; width: 32px; height: 32px; }
  #where .ib svg { width: 16px; height: 16px; }
  #where .ib:disabled { opacity: .35; cursor: default; }   /* nothing to clear */
  /* the two pickers: a button, and a glass menu that always opens below it, from the top of the list */
  .dd { flex: 1; min-width: 0; }
  .dd-btn { box-sizing: border-box; display: flex; align-items: center; width: 100%; height: 32px; border-radius: 10px; padding: 0 8px 0 11px; font-size: 12.5px; color: var(--dim); background: rgba(255, 255, 255, .05); }
  .dd-btn:hover, .dd-btn.open { background: rgba(255, 255, 255, .09); color: var(--ink); }
  .dd-btn span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dd-btn svg { width: 14px; height: 14px; flex: none; opacity: .7; }
  .dd-menu { position: fixed; z-index: 30; box-sizing: border-box; padding: 4px; overflow-y: auto; border-radius: 12px; scrollbar-width: thin;
    background: linear-gradient(180deg, rgba(30, 37, 58, .94), rgba(20, 25, 42, .94)); box-shadow: var(--rim), 0 12px 30px rgba(0, 0, 0, .35); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }
  .dd-item { box-sizing: border-box; position: relative; display: block; width: 100%; padding: 6px 12px 6px 26px; border-radius: 8px; font-size: 12.5px; color: var(--dim); white-space: nowrap; }
  .dd-item:hover { background: rgba(255, 255, 255, .08); color: var(--ink); }
  .dd-item.on { color: var(--ink); }
  .dd-item.on::before { content: '✓'; position: absolute; left: 10px; font-size: 11px; }
  .card.vision .nm { font-style: italic; }
  .card.planned { background: rgba(255, 255, 255, .025); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .05); }
  .card.planned:hover { background: rgba(255, 255, 255, .06); }
  .card.planned.on { background: rgba(255, 255, 255, .1); }
  .card.planned .nm { opacity: .55; white-space: normal; }
  .card .ph { width: 100%; aspect-ratio: 1; display: grid; place-items: center; padding: 0 10px 18px; text-align: center; font-size: 10.5px; color: var(--faint); }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row b { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row em { font-style: normal; color: var(--dim); font-size: 12.5px; }
  .sub { color: var(--faint); font-size: 12px; margin-top: 1px; }
  #tv { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12.5px; letter-spacing: .04em; color: var(--ink); }
  #bar { position: relative; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .08); margin: 7px 0 5px; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--fair); }
  #info[data-v="lean"] #bar i { background: var(--lean); } #info[data-v="heavy"] #bar i { background: var(--heavy); }
  /* the tabs: four five-letter words over a hairline; the open one is brighter and underlined */
  #tabs { display: flex; margin: -6px -4px 2px; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, .07); }
  .tab { flex: 1; height: 36px; position: relative; display: grid; place-items: center; font-size: 13px; font-weight: 500; letter-spacing: .01em; color: var(--faint); transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); }
  .tab.on::after { content: ''; position: absolute; left: 26%; right: 26%; bottom: 0; height: 2px; border-radius: 2px; background: var(--ink); }
  .tab:focus-visible, .ib:focus-visible { outline: none; background: var(--glass-hi); }   /* no outline rings: a lighter pane instead */
  .seg { flex: 1; display: flex; gap: 3px; height: 34px; box-sizing: border-box; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .045); }
  .seg button { height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); transition: background .15s, color .15s; }
  .seg button { flex: 1; }
  .seg button:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
  .seg button.on { color: var(--ink); background: var(--glass-on); }
  .seg svg { width: 16px; height: 16px; }
  #tab-views { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .vw { position: relative; display: block; width: 100%; padding: 0; border-radius: 11px; }   /* click one to turn the stage to that view */
  .vw:hover canvas { background: rgba(255, 255, 255, .06); }
  .vw:focus-visible { outline: none; }
  .vw:focus-visible canvas { background: var(--glass-hi); }
  .vw canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; border-radius: 11px; background: rgba(255, 255, 255, .035); }
  .vw span { position: absolute; left: 10px; top: 8px; font-size: 11px; color: var(--faint); }
  .vw[hidden] { display: none; }
  /* the views' parts colouring: which colour is which part */
  /* the moves tab: the moves as looping tiles, two across, in two groups */
  .pbb:disabled { opacity: .35; pointer-events: none; }
  .mvgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mv { position: relative; display: block; border-radius: 11px; background: var(--glass); box-shadow: var(--rim); overflow: hidden; transition: background .15s, opacity .3s; }
  .mv:hover { background: var(--glass-hi); }
  .mv.on { background: var(--glass-on); }
  .mv.dim { opacity: .38; }   /* live: not seen yet */
  .mv:focus-visible { outline: none; background: var(--glass-hi); }
  .mv canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; }
  .mv span { position: absolute; left: 5px; right: 5px; bottom: 5px; font-size: 10px; color: var(--ink); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .mv.none { background: none; box-shadow: none; border: 1px dashed rgba(234, 242, 255, .16); aspect-ratio: 1; box-sizing: border-box; }   /* a move this body should have and lacks */
  .mv.none span { color: var(--faint); opacity: 1; }
  #mv-note { margin-top: 10px; }
  #tab-moves > .sec:first-child { margin-top: 6px; }
  #tab-info > #core > .stat:first-child { margin-top: 2px; }
  /* what the stage is doing, quietly under the model's name */
  #ttl-act { font-size: 12px; color: var(--dim); margin-top: 6px; }
  /* the playback strip under the stage */
  #pb { position: fixed; bottom: var(--edge); padding: 7px 8px; display: flex; flex-direction: column; gap: 7px; }
  #pb-row { display: flex; align-items: center; gap: 5px; }
  .pbb { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; color: var(--dim); transition: background .15s, color .15s; }
  .pbb:hover { color: var(--ink); background: rgba(255, 255, 255, .06); }
  .pbb.on { color: var(--ink); background: var(--glass-on); }
  .pbb svg, #pb .seg svg { width: 16px; height: 16px; }
  .pbb:focus-visible { outline: none; background: var(--glass-hi); }
  #pb .seg { flex: none; height: 30px; padding: 2px; gap: 2px; border-radius: 9px; }
  #pb .seg button { height: 26px; min-width: 28px; padding: 0 3px; border-radius: 7px; font: inherit; font-size: 11.5px; }
  #pb-scrub { flex: 1; min-width: 60px; accent-color: #c8d3e6; height: 18px; }
  body.sheetmode { overflow: auto; height: auto; background: #0b0f1a; }
  body.sheetmode #side, body.sheetmode #info, body.sheetmode #sc, body.sheetmode #labels, body.sheetmode #pb, body.sheetmode #ttl { display: none !important; }
  #sheet { display: block; }
  #more { margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 4px 0; border-top: 1px solid rgba(255, 255, 255, .05); }
  #more td:first-child { color: var(--faint); white-space: nowrap; padding-right: 10px; }
  #more td:last-child { color: var(--ink); text-align: right; }

  /* the costs mode of the list: the same glass, a compact table, heaviest first */
  #costtab { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 10px 12px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .15) transparent; }
  #costtab .note { font-size: 11px; color: var(--faint); margin: 4px 4px 8px; line-height: 1.4; }
  #costtab table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
  #costtab col.c-pic { width: 34px; } #costtab col.c-tri { width: 40px; } #costtab col.c-frame { width: 48px; } #costtab col.c-dots { width: 36px; }
  #costtab td.pic { padding: 3px 4px 3px 0; }
  #costtab td.pic canvas { display: block; width: 28px; height: 28px; border-radius: 6px; background: rgba(8, 11, 20, .55); }
  #costtab th { text-align: left; font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 4px 4px 6px; white-space: nowrap; cursor: pointer; user-select: none; }
  #costtab th.on { color: var(--dim); }
  #costtab th.n, #costtab td.n { text-align: right; }
  #costtab td { overflow: hidden; text-overflow: ellipsis; padding: 6px 4px; color: var(--dim); border-top: 1px solid rgba(255, 255, 255, .05); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #costtab td.nm { color: var(--ink); white-space: normal; }
  #costtab td.nm i { font-style: normal; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-left: 4px; }
  #costtab tr[data-id] { cursor: pointer; }
  #costtab tr[data-id]:hover td { background: rgba(255, 255, 255, .04); }
  #costtab tr.on td { background: rgba(255, 255, 255, .09); }
  #costtab tr.heavy td.tri { color: var(--ink); }
  /* the verdict as a small bar: triangles against the budget, ticks at the lean and fair limits (as in the right panel) */
  /* the verdict as three dots: one lit and green when lean, two amber when fair, three coral when heavy */
  .vd { display: inline-flex; gap: 3px; vertical-align: middle; }
  .vd i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .12); }
  .vd.lean i:nth-child(-n+1) { background: var(--lean); }
  .vd.fair i:nth-child(-n+2) { background: var(--fair); }

  // mirror: run f(g) to build the right side (x > 0), then add the same triangles flipped across x = 0 for the left side
  mirror(f) {
    const start = this.v.length; f(this); const end = this.v.length;
    for (let i = start; i < end; i += 27) {
      const t = this.v.slice(i, i + 27);
      for (const k of [0, 9, 18]) { t[k] = -t[k]; t[k + 3] = -t[k + 3]; }                                       // flip x and the normal's x
      this.v.push(...t.slice(0, 9), ...t.slice(18, 27), ...t.slice(9, 18));                                       // swap two corners to keep the winding
    }
    return this;
  }
}

// ── instanced mesh: per instance a mat4 + rgba (a = glow), plus (asset manager only) a vec4 of surface effects:
//    snow on top, char, weathered grey, ash on top; all zero looks exactly as test-06 ──
class InstMesh {
  constructor(geo, cap) {
    const gl = GLX.gl;
    this.cap = cap; this.n = 0; this.data = new Float32Array(cap * 24); this.nv = geo.v.length / 9; this.dirty = true;
    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geo.v), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
    this.ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    for (let i = 0; i < 4; i++) { gl.enableVertexAttribArray(3 + i); gl.vertexAttribPointer(3 + i, 4, gl.FLOAT, false, 96, i * 16); gl.vertexAttribDivisor(3 + i, 1); }
    gl.enableVertexAttribArray(7); gl.vertexAttribPointer(7, 4, gl.FLOAT, false, 96, 64); gl.vertexAttribDivisor(7, 1);
    gl.enableVertexAttribArray(8); gl.vertexAttribPointer(8, 4, gl.FLOAT, false, 96, 80); gl.vertexAttribDivisor(8, 1);
    gl.bindVertexArray(null);
  }
  clear() { this.n = 0; this.dirty = true; }
  add(px, py, pz, yaw, pitch, roll, sx, sy, sz, r, g, b, e, fx) {
    if (this.n >= this.cap) return;
    const o = this.n++ * 24, d = this.data;
    matTRS(d, o, px, py, pz, yaw, pitch, roll, sx, sy, sz);
    d[o + 16] = r; d[o + 17] = g; d[o + 18] = b; d[o + 19] = e || 0;
    d[o + 20] = fx ? fx[0] : 0; d[o + 21] = fx ? fx[1] : 0; d[o + 22] = fx ? fx[2] : 0; d[o + 23] = fx ? fx[3] : 0;
  }
  draw() {
    if (!this.n) return;
    const gl = GLX.gl;
    gl.bindVertexArray(this.vao);
    if (this.dirty) { gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * 24); this.dirty = false; }
    gl.drawArraysInstanced(gl.TRIANGLES, 0, this.nv, this.n);
  }
}

const skLerp = (a, b, t) => a + (b - a) * t;
function skRibs(g, z0, z1, n, y, w, h, r) {
  const B = [1, 1, 1];

}
function skGeo(f) { const g = new Geo(); f(g, [1, 1, 1], [0.18, 0.15, 0.14]); return g; }

// ───────────────────────── round 0: rehearsing the method in STYLE.md on the fish, before the pilot ─────────────────────────
// 2026-11-14. Designer: the fish could be more efficient and better designed for 22 triangles, and its skeleton does not match
// its body (the check finds 59% of it outside). One brief, three rough cuts as looks of one draft, and a skeleton made from
// the same brief and proportions so it fits all three. Its own file, so a parallel session editing drafts.js never collides.

const R0W = [1, 1, 1];
const r0geo = (f) => { const g = new Geo(); f(g); return g; };
// shared proportions (model units, front +Z): nose, widest point, tail root, tail tips; half-height and half-width at the widest
const NOSE = 0.13, MID = 0.01, ROOT = -0.1, TIP = -0.2, HH = 0.055, HW = 0.035;

// the forked tail: two flat triangles, the fish's signature. 2 triangles.
function tail(g) {
  g.tri([0, 0, ROOT + 0.015], [0, 0.07, TIP], [0, 0.008, TIP + 0.045], R0W);
  g.tri([0, 0, ROOT + 0.015], [0, -0.008, TIP + 0.045], [0, -0.065, TIP], R0W);
}
const backFin = (g) => g.tri([0, HH - 0.007, 0.03], [0, HH + 0.033, -0.035], [0, HH - 0.025, -0.055], R0W);   // 1 triangle
const bellyFin = (g) => g.tri([0, -HH + 0.015, -0.03], [0, -HH - 0.01, -0.07], [0, -HH + 0.03, -0.08], R0W);  // 1 triangle

const ROUND0_PARTS = {
  // cut A, 10 triangles: a diamond body and the forked tail. Nothing else.
  fishA: { cap: 34, build: () => r0geo((g) => {
    g.octa([0, 0, NOSE], [0, 0, ROOT], [0, HH, MID], [0, -HH + 0.005, MID], [-HW, 0, MID + 0.01], [HW, 0, MID + 0.01], R0W); tail(g);
  }) },
  // cut B, 12 triangles: cut A with a back fin and a belly fin, so it reads as a fish from the side.
  fishB: { cap: 34, build: () => r0geo((g) => {
    g.octa([0, 0, NOSE], [0, 0, ROOT], [0, HH, MID], [0, -HH + 0.005, MID], [-HW, 0, MID + 0.01], [HW, 0, MID + 0.01], R0W); tail(g); backFin(g); bellyFin(g);
  }) },
  // cut C, 16 triangles: a rounder five-sided body, the fins, and a pair of side fins built with mirror.
  fishC: { cap: 34, build: () => r0geo((g) => {
    g.bicone([0, 0.003, NOSE], [0, 0, ROOT], [0, 0.003, MID + 0.005], HW + 0.001, HH + 0.001, 5, R0W); tail(g); backFin(g); bellyFin(g);
    g.mirror((h) => h.tri([HW - 0.006, -0.012, 0.045], [HW + 0.03, -0.03, 0.0], [HW - 0.008, -0.02, 0.005], R0W));
  }) },
  // the skeleton, made from the same proportions so it sits inside all three cuts: a small skull filling the head, a spine,
  // two pairs of flat rib blades that stay inside the body's outline, and two tail bones in the fin. 20 triangles (the old one: 144).
  skelFish2: { cap: 24, build: () => r0geo((g) => {
    g.diamond(0, 0.002, 0.07, 0.017, 0.022, 0.034, R0W);                                     // skull
    g.limb([0, 0, 0.05], [0, 0, ROOT + 0.025], 0.006, 0.004, 3, R0W);                         // spine, stopping where the body grows too thin
    // ribs, up and down from the spine; each sized to the body's outline where its tip lands, at 70% of it
    const half = (z) => HH * (1 - Math.abs(z - MID) / (z > MID ? NOSE - MID : MID - ROOT));
    for (const z of [0.03, -0.02]) {                                                            // two bold pairs: up close the whole fish is ~26 px
      const tz = z - 0.03, top = half(tz) * 0.72;
      g.tri([0, 0, z], [0, top, tz], [0, 0, z - 0.024], R0W); g.tri([0, 0, z], [0, -top, tz], [0, 0, z - 0.024], R0W);
    }
    g.tri([0, 0.002, ROOT + 0.025], [0, 0.055, TIP + 0.012], [0, 0.043, TIP + 0.008], R0W);   // tail bones, starting where the spine ends
    g.tri([0, -0.002, ROOT + 0.025], [0, -0.043, TIP + 0.008], [0, -0.052, TIP + 0.012], R0W);
  }) },
  // pass 2 (Designer, 2026-11-14: the fitted skeleton does not read as a fish skeleton; it should look like a classic one).
  // The classic fishbone is a pointed skull, a long spine, a comb of ribs swept back, and a forked tail. The bones are flat in
  // the body's plane, which is how a dead fish is seen: lying on its side, from above. The spine is a thin tube so it shows
  // from every side. Three cuts: 4, 5 and 6 rib pairs; the second adds an eye socket, the third a three-bone tail.
  skelFishC1: { cap: 24, build: () => r0geo((g) => { fishbone(g, 4, false, 2); }) },
  skelFishC2: { cap: 24, build: () => r0geo((g) => { fishbone(g, 5, true, 2); }) },
  skelFishC3: { cap: 24, build: () => r0geo((g) => { fishbone(g, 6, true, 3); }) },
  // pass 3 (Designer, 2026-11-14, with a reference picture: do not copy it): the classic rules are a skull that is a triangle with
  // a flat back, not an arrowhead; a tail that is the fish's own tail turned to bone, solid surfaces, not bones; and ribs that
  // are bars crossing the spine. Three cuts: straight ribs; bent ribs with an eye socket; four bent ribs.
  skelFishP1: { cap: 24, build: () => r0geo((g) => { fishbone3(g, 3, false, false); }) },
  skelFishP2: { cap: 24, build: () => r0geo((g) => { fishbone3(g, 3, true, true); }) },
  skelFishP3: { cap: 24, build: () => r0geo((g) => { fishbone3(g, 4, true, true); }) },
};

// pass 3: skull, spine, ribs and a solid tail, all inside the lean fish
function fishbone3(g, ribs, bent, eye) {
  const half = (z) => HH * (1 - Math.abs(z - MID) / (z > MID ? NOSE - MID : MID - ROOT));
  const side = (z) => HW * (1 - Math.abs(z - MID - 0.01) / (z > MID ? NOSE - MID : MID - ROOT));
  // skull: a pyramid pointing forward with a flat diamond back, so from the side it is a triangle with a straight back edge. 6 triangles.
  const zb = 0.052, zn = NOSE - 0.012, hb = half(zb) * 0.92, wb = side(zb) * 0.75;
  const N = [0, 0, zn], T = [0, hb, zb], B = [0, -hb * 0.85, zb], L = [-wb, 0, zb], Rr = [wb, 0, zb], c = [0, 0, (zb + zn) / 2.4];
  g.tri(N, T, L, R0W, c); g.tri(N, L, B, R0W, c); g.tri(N, B, Rr, R0W, c); g.tri(N, Rr, T, R0W, c);
  g.tri(T, Rr, B, R0W, c); g.tri(T, B, L, R0W, c);
  if (eye) g.mirror((h) => h.tri([wb * 0.62 + 0.001, hb * 0.5, zb + 0.022], [wb * 0.55 + 0.001, hb * 0.18, zb + 0.012], [wb * 0.72 + 0.001, hb * 0.25, zb + 0.032], [0.16, 0.13, 0.12]));   // eye socket, each side
  g.limb([0, 0, zb], [0, 0, ROOT + 0.018], 0.0055, 0.004, 3, R0W);                                   // spine
  // ribs: bars crossing the spine, longest mid-body; bent ones sweep back at both ends
  for (let i = 0; i < ribs; i++) {
    const z = 0.03 - i * (0.105 / ribs), sweep = bent ? 0.016 : 0, w = 0.0055;
    const tT = half(z - sweep) * 0.78, tB = (half(z - sweep) - 0.004) * 0.72;
    const top = [[0, 0, z + w], [0, 0, z - w], [0, tT, z - sweep - w], [0, tT, z - sweep + w]];
    const bot = [[0, 0, z + w], [0, -tB, z - sweep + w], [0, -tB, z - sweep - w], [0, 0, z - w]];
    g.quad(top[0], top[1], top[2], top[3], R0W); g.quad(bot[0], bot[1], bot[2], bot[3], R0W);
  }
  tail(g);                                                                                       // the fish's own tail, turned to bone. 2 triangles.
}

// the classic fishbone, sized to the lean fish's outline so every bone stays inside it
function fishbone(g, pairs, eye, tailBones) {
  const half = (z) => HH * (1 - Math.abs(z - MID) / (z > MID ? NOSE - MID : MID - ROOT));
  g.tri([0, 0.002, NOSE - 0.008], [0, half(0.06) * 0.85, 0.06], [0, 0, 0.04], R0W);              // skull: a pointed kite, top half
  g.tri([0, 0.002, NOSE - 0.008], [0, 0, 0.04], [0, -half(0.06) * 0.75, 0.06], R0W);              // and bottom half
  if (eye) g.mirror((h) => h.tri([0.002, 0.013, 0.092], [0.002, 0.004, 0.1], [0.002, 0.003, 0.084], [0.16, 0.13, 0.12]));   // a dark eye socket on each side
  g.limb([0, 0, 0.045], [0, 0, ROOT + 0.012], 0.0055, 0.0035, 3, R0W);                            // spine
  for (let i = 0; i < pairs; i++) {                                                             // ribs, swept back, longest mid-body
    const z = 0.032 - i * (0.11 / pairs), tz = z - 0.03;
    g.tri([0, 0.002, z], [0, half(tz) * 0.82, tz], [0, 0.002, z - 0.013], R0W);
    g.tri([0, -0.002, z], [0, -0.002, z - 0.013], [0, -(half(tz) - 0.004) * 0.78, tz], R0W);
  }
  const root = ROOT + 0.012;                                                                     // the tail: a fork of bones in the fin
  g.tri([0, 0.003, root], [0, 0.062, TIP + 0.01], [0, 0.05, TIP + 0.004], R0W);
  g.tri([0, -0.003, root], [0, -0.048, TIP + 0.004], [0, -0.058, TIP + 0.01], R0W);
  if (tailBones > 2) g.tri([0, 0.003, root], [0, 0.006, TIP + 0.03], [0, -0.006, TIP + 0.03], R0W);
}

// ════════ pilot1.js ════════
// ───────────────────────── pilot 1: six models made by the style method, for Designer's review ─────────────────────────
// Filled by the pilot session on 2026-11-14. Read studies/assets/PILOT.md first; it says what goes here and how.
// Everything in src/ is bundled into one scope, so every top-level name in this file starts with P1 or p1.
// This file holds both the meshes (PILOT1_PARTS) and the catalog entries (PILOT1_ENTRIES); nothing else needs editing.
// Each model: a brief, three rough cuts as looks, the picked one first. The report is studies/assets/PILOT-1-REPORT.md.

const p1geo = (f) => { const g = new Geo(); f(g); return g; };
const P1 = (mesh, o) => Object.assign({ mesh }, o || {});
const P1_WH = [1, 1, 1];
const P1_BONE = [0.97, 0.95, 0.88];
const P1_DARK = [0.2, 0.17, 0.16];     // birch marks and twigs
const P1_PINK = [0.93, 0.62, 0.66];    // the mouse's tail, ears and feet
const P1_SOCKET = [0.16, 0.13, 0.12];  // eye sockets, as the other skeletons have them

// ── shape helpers (kept here because this session may not edit gl.js) ──
// hull: the flat-faced convex hull of a handful of points, the cheapest believable rock. A closed hull of V points costs
// 2V - 4 triangles. With `open`, the face it stands on (pointing straight down) is left out.
function p1Hull(g, pts, col, open) {
  const n = pts.length, c = [0, 0, 0], seen = new Set();
  for (const p of pts) for (let k = 0; k < 3; k++) c[k] += p[k] / n;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) for (let k = j + 1; k < n; k++) {
    let nr = cross(sub(pts[j], pts[i]), sub(pts[k], pts[i])); const l = Math.hypot(nr[0], nr[1], nr[2]);
    if (l < 1e-9) continue;
    nr = [nr[0] / l, nr[1] / l, nr[2] / l];
    let pos = 0, neg = 0; const on = [i, j, k];
    for (let m = 0; m < n; m++) { if (m === i || m === j || m === k) continue; const d = dot(nr, sub(pts[m], pts[i])); if (d > 1e-6) pos++; else if (d < -1e-6) neg++; else on.push(m); }
    if (pos && neg) continue;                                                        // points on both sides: not a face of the hull
    const key = on.slice().sort((a, b) => a - b).join(','); if (seen.has(key)) continue; seen.add(key);
    if (pos) nr = [-nr[0], -nr[1], -nr[2]];
    if (open && nr[1] < -0.999) continue;
    // a face with more than three points on it is a flat polygon: order its corners around its middle and fan it
    const o = [0, 0, 0]; for (const m of on) for (let q = 0; q < 3; q++) o[q] += pts[m][q] / on.length;
    let u = sub(pts[on[0]], o); const ul = Math.hypot(u[0], u[1], u[2]); u = [u[0] / ul, u[1] / ul, u[2] / ul]; const w = cross(nr, u);
    const ring = on.map((m) => ({ m, a: Math.atan2(dot(sub(pts[m], o), w), dot(sub(pts[m], o), u)) })).sort((a, b) => a.a - b.a).map((x) => x.m);
    for (let t = 1; t < ring.length - 1; t++) g.tri(pts[ring[0]], pts[ring[t]], pts[ring[t + 1]], col, c);
  }
}
// spindle: one or two tips joined through a ring of hand-placed points, so the ring can be a true mirror with a flat belly
// (bicone's ring is a plain ellipse). 2 × ring triangles, or 1 × ring with no second tip.
function p1Spindle(g, a, b, ring, col) {
  const n = ring.length, m = [0, 0, 0];
  for (const p of ring) for (let k = 0; k < 3; k++) m[k] += p[k] / n;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; g.tri(a, ring[i], ring[j], col, m); if (b) g.tri(b, ring[i], ring[j], col, m); }
}
// onFace: a small triangle lying on the face (A, B, C), lifted a hair off it; corners given as weights of A, B and C
function p1OnFace(g, A, B, C, w, lift, col) {
  const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], v = [C[0] - A[0], C[1] - A[1], C[2] - A[2]];
  let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]; const l = Math.hypot(n[0], n[1], n[2]); n = [n[0] / l, n[1] / l, n[2] / l];
  const at = (q) => [0, 1, 2].map((k) => A[k] * q[0] + B[k] * q[1] + C[k] * q[2] + n[k] * lift);
  g.tri(at(w[0]), at(w[1]), at(w[2]), col);
}

// ───────────────────────── 1 · birch ─────────────────────────
// The trunk is pure white and tinted pale bark, so the same mesh chars and weathers with the wood effects. It runs the whole
// height, so it shows between the clumps of the crown. The dark dashes are single triangles lying on the trunk's faces.
const P1_BARK = [0.96, 0.95, 0.9], P1_LEAF = [0.56, 0.78, 0.32], P1_GOLD = [0.96, 0.78, 0.22];
function p1BirchTrunk(g, sides, marks) {
  const y0 = -0.08, y1 = 1.04, r0 = 0.042, r1 = 0.013;
  g.limb([0, y0, 0], [0, y1, 0], r0, r1, sides, P1_WH, false);                         // trunk: 2 × sides
  marks.forEach(([y, face, h], i) => {                                                  // dashes: 1 each
    const r = (r0 + (r1 - r0) * (y - y0) / (y1 - y0)) * 1.1;
    const at = (k) => { const t = (k / sides) * Math.PI * 2; return [Math.sin(t) * r, Math.cos(t) * r]; };
    const A = at(face + (i % 2)), B = at(face + 1 - (i % 2));                          // starts at one edge of the face, points across it
    g.tri([A[0], y + h / 2, A[1]], [A[0], y - h / 2, A[1]], [A[0] + (B[0] - A[0]) * 0.8, y, A[1] + (B[1] - A[1]) * 0.8], P1_DARK);
  });
}
// a drooping bough: a drop hanging from its top-inner end to its outer tip, widest two fifths of the way down. 8 triangles.
const p1Bough = (g, a, b, r) => g.bicone(a, b, [a[0] + (b[0] - a[0]) * 0.42, a[1] + (b[1] - a[1]) * 0.42, a[2] + (b[2] - a[2]) * 0.42], r, r, 4, P1_WH);

// Pass 2 (Designer, 2026-11-14: decent but generic; the foliage could be better shaped and a birch has more than one stripe.
// Four reference pictures, used for direction and not copied). What they share: the white trunk forks and white limbs show
// up into the crown; the leaves are a few separate flat clumps at the limb ends with air between them; dark marks at many
// heights and a dark foot. Pass 1's three dashes each sat on one face of the trunk, so only one ever showed.
function p1BirchFork(g, full) {
  const y0 = -0.08, y1 = 0.56, r0 = 0.05, r1 = 0.032;
  const at = (k, y) => { const t = (k / 3) * Math.PI * 2, r = (r0 + (r1 - r0) * (y - y0) / (y1 - y0)) * 1.1; return [Math.sin(t) * r, y, Math.cos(t) * r]; };
  g.limb([0, y0, 0], [0, y1, 0], r0, r1, 3, P1_WH, false);                               // trunk, up to the fork: 6
  g.limb([0, 0.54, 0], [-0.05, 1.1, 0], 0.03, 0, 3, P1_WH, false);                       // the leader: 3
  g.limb([0, 0.47, 0], [0.2, 0.84, 0.06], 0.025, 0, 3, P1_WH, false);                    // a side limb: 3
  if (full) g.limb([-0.02, 0.74, 0], [-0.2, 0.95, -0.07], 0.017, 0, 3, P1_WH, false);    // a second, off the leader: 3
  for (let k = 0; k < 3; k++) {                                                           // the dark foot: one triangle a face, point up: 3
    const A = at(k, y0), B = at(k + 1, y0), a = at(k, 0.16), b = at(k + 1, 0.16);
    g.tri(A, B, [(a[0] + b[0]) / 2, 0.16, (a[2] + b[2]) / 2], P1_DARK);
  }
  const marks = [[0.24, 0, 0.06], [0.31, 1, 0.055], [0.38, 2, 0.055], [0.45, 0, 0.05], [0.51, 1, 0.045]];
  marks.slice(0, full ? 5 : 4).forEach(([y, face, h], i) => {                             // dashes at many heights, two faces showing from any side: 1 each
    const A = at(face + (i % 2), y), B = at(face + 1 - (i % 2), y);
    g.tri([A[0], y + h / 2, A[2]], [A[0], y - h / 2, A[2]], [A[0] + (B[0] - A[0]) * 0.8, y, A[2] + (B[2] - A[2]) * 0.8], P1_DARK);
  });
}
// a clump of leaves: a squat, lopsided hull of six points (8 triangles), or five (6). Never the same twice.
// (On the pass 2 sheet the clumps were thin slabs; they were made half as thick again, with no triangle added.)
function p1Clump(g, c, r, seed, small) {
  const h = (i) => { const x = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453; return x - Math.floor(x); };
  const n = small ? 3 : 4;
  const pts = [[c[0] + (h(1) - 0.5) * r[0] * 0.5, c[1] + r[1], c[2] + (h(2) - 0.5) * r[2] * 0.5], [c[0] + (h(3) - 0.5) * r[0] * 0.5, c[1] - r[1] * 0.8, c[2] + (h(4) - 0.5) * r[2] * 0.5]];
  for (let i = 0; i < n; i++) { const a = ((i + h(5 + i) * 0.5) / n) * Math.PI * 2 + seed, k = 0.85 + h(9 + i) * 0.3; pts.push([c[0] + Math.cos(a) * r[0] * k, c[1] + (h(13 + i) - 0.5) * r[1] * 0.7, c[2] + Math.sin(a) * r[2] * k]); }
  p1Hull(g, pts, P1_WH);
}

// ───────────────────────── 2 · tall grass ─────────────────────────
// A blade is one triangle from a short base on a small ring to a tip that leans outward, as test-06's tuft does it.
const P1_SEED = [0.86, 0.72, 0.4];
function p1Blade(g, a, h, lean, hw, r0, col) {
  const c = Math.cos(a), s = Math.sin(a), r = r0 == null ? 0.02 : r0;
  g.tri([c * r - s * hw, 0, s * r + c * hw], [c * r + s * hw, 0, s * r - c * hw], [c * lean, h, s * lean], col || P1_WH);
}
// a seed stalk: a thin blade with a tan plume at its tip. 2 triangles.
function p1Plume(g, a, h, lean, top) {
  const c = Math.cos(a), s = Math.sin(a);
  p1Blade(g, a, h, lean, 0.009, 0.008);
  g.tri([c * lean - s * 0.021, h - 0.03, s * lean + c * 0.021], [c * lean + s * 0.021, h - 0.03, s * lean - c * 0.021], [c * (lean + 0.035), top, s * (lean + 0.035)], P1_SEED);
}
function p1GrassB(g, plumes) {
  const H = [0.23, 0.17, 0.2, 0.15], Ln = [0.08, 0.12, 0.09, 0.115];
  for (let i = 0; i < 4; i++) p1Blade(g, i * 1.5708 + 0.5, H[i], Ln[i], 0.018);
  p1Plume(g, 1.3, 0.22, 0.03, 0.31); if (plumes > 1) p1Plume(g, 4.3, 0.19, 0.045, 0.27);
}
// a bent blade: the blade, and a flap folded outward and down from near its tip. 2 triangles.
function p1Bent(g, a, h, lean, hw) {
  const c = Math.cos(a), s = Math.sin(a), r = 0.02, K = [c * lean, h, s * lean], k = 0.68;
  const L = [c * r - s * hw, 0, s * r + c * hw], R = [c * r + s * hw, 0, s * r - c * hw];
  g.tri(L, R, K, P1_WH);
  g.tri([L[0] + (K[0] - L[0]) * k, h * k, L[2] + (K[2] - L[2]) * k], [R[0] + (K[0] - R[0]) * k, h * k, R[2] + (K[2] - R[2]) * k], [c * (lean + 0.085), h * 0.8, s * (lean + 0.085)], P1_WH);
}

// ───────────────────────── 3 · clover patch ─────────────────────────
// A clover leaf is three leaflets around a point: three triangles with their points together. From above it is the club on
// a playing card. The leaves are tinted (green or dry); the heads are an off-white that stays under the tint line.
// Fix pass 1 widened the leaflets (they read as shards). Fix pass 2 laid the leaves on a low cushion that falls away from
// the middle, so they show their faces from the side as well as from above, and made the head a small solid cone: the two
// crossed triangles read as one floating triangle from the front (one more triangle, for the head).
const P1_HEAD = [0.87, 0.86, 0.83];
const p1CloverY = (x, z) => 0.072 - 0.42 * Math.hypot(x, z);
function p1Trefoil(g, cx, cz, r, rot, lift) {
  const at = (a) => { const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r; return [x, Math.max(0.004, p1CloverY(x, z) + lift), z]; };
  for (let k = 0; k < 3; k++) { const a = rot + k * 2.0944; g.tri([cx, p1CloverY(cx, cz) + lift + 0.012, cz], at(a - 0.85), at(a + 0.85), P1_WH); }
}
// a flower head: a squat three-sided cone. 3 triangles.
const p1Head = (g, x, y, z, r, h) => g.limb([x, y, z], [x, y + h, z], r, 0, 3, P1_HEAD, false);

// Pass 2 (Designer, 2026-11-14: he could not tell what the white pyramid was; drop it and spend its three triangles on stems
// from the middle of each leaf down to the ground). The leaves are held up a little so the stems show from the side.
function p1CloverStems(g) {
  for (let k = 0; k < 3; k++) {
    const a = 0.5 + k * 2.0944, cx = Math.cos(a) * 0.085, cz = Math.sin(a) * 0.085, up = 0.035 + k * 0.004;
    p1Trefoil(g, cx, cz, 0.078, a + 0.4 + k * 0.5, up);                                  // a leaf: 3
    p1Blade(g, a, p1CloverY(cx, cz) + up + 0.011, 0.085, 0.013, 0.012);                   // its stem, from the middle of the patch: 1
  }
}

// ───────────────────────── 6 · mouse ─────────────────────────
// Shared proportions (model units, front +Z, drawn at 0.26), so the three cuts and the skeleton are one animal.
const P1M_NOSE = [0, 0.04, 0.215];
const P1M_TAIL = [[0, 0.055, -0.135], [0.03, 0.02, -0.3], [0.12, 0.075, -0.4]];        // the tail's middle line: root, bend, tip
// body: a blunt drop with a flat belly, highest over the hips. 8 triangles (10 with a rounder five-point ring).
function p1MouseBody(g, round) {
  const z = -0.05, F = [0, 0.065, 0.11], Rp = [0, 0.06, -0.15];
  const ring = round ? [[-0.08, 0.004, z], [0.08, 0.004, z], [0.097, 0.085, z], [0, 0.16, z], [-0.097, 0.085, z]]
    : [[-0.085, 0.004, z], [0.085, 0.004, z], [0.05, 0.15, z], [-0.05, 0.15, z]];
  p1Spindle(g, F, Rp, ring, P1_WH);
}
// head: a four-sided point to the nose. 4 triangles open at the back (it is hidden by the ears and body), 8 closed.
const P1M_HT = [0, 0.13, 0.07], P1M_HD = [0, 0.004, 0.075], P1M_HL = [-0.065, 0.06, 0.065], P1M_HR = [0.065, 0.06, 0.065];
function p1MouseHead(g, closed) {
  if (closed) g.octa(P1M_NOSE, [0, 0.075, 0], P1M_HT, P1M_HD, P1M_HL, P1M_HR, P1_WH);
  else p1Spindle(g, P1M_NOSE, null, [P1M_HT, P1M_HL, P1M_HD, P1M_HR], P1_WH);
}
// ears: one big kite a side, facing forward, each nearly the size of the head. 4 triangles. k shrinks them for the bones.
function p1MouseEars(g, col, k, kw, at) {
  const base = at || [0.035, 0.105, 0.05], tip = [base[0] + 0.08 * k, base[1] + 0.16 * k, base[2] - 0.02 * k];
  g.mirror((h) => h.blade(base, tip, 0.16 * k * (kw || 1), [0.16, -0.085, -0.04], col, 0.64));
}
// tail: a flat strip with one bend, tilted so it shows from the side as well as from above (3 triangles), or a round one (9)
function p1MouseTail(g, k, col, round, line) {
  const [a, b, c] = line || P1M_TAIL, w0 = 0.024 * k, w1 = 0.017 * k;
  if (round) { g.limb(a, b, w0, w1, 3, col, false); g.limb(b, c, w1, 0, 3, col, false); return; }
  const off = (p, w, s) => [p[0] + 0.9 * w * s, p[1] + 0.45 * w * s, p[2]];
  g.quad(off(a, w0, -1), off(a, w0, 1), off(b, w1, 1), off(b, w1, -1), col); g.tri(off(b, w1, -1), off(b, w1, 1), c, col);
}
function p1Mouse(g, cut) {
  // body
  p1MouseBody(g, cut === 'C');
  // head
  p1MouseHead(g, cut !== 'A');
  if (cut === 'C') g.mirror((h) => p1OnFace(h, P1M_NOSE, P1M_HR, P1M_HT, [[0.1, 0.52, 0.38], [0.46, 0.36, 0.18], [0.14, 0.28, 0.58]], 0.004, [0.1, 0.08, 0.09]));   // eyes
  // ears
  p1MouseEars(g, cut === 'B' ? P1_PINK : P1_WH, 1);
  if (cut === 'C') g.mirror((h) => h.blade([0.045, 0.125, 0.055], [0.1, 0.235, 0.042], 0.09, [0.16, -0.085, -0.04], P1_PINK, 0.64));                              // pink inside
  // legs
  if (cut === 'B') g.mirror((h) => {                                                    // four pink feet poking out from under the body
    h.tri([0.03, 0.004, 0.09], [0.08, 0.006, 0.185], [0.1, 0.012, 0.09], P1_PINK);
    h.tri([0.06, 0.004, -0.13], [0.085, 0.006, 0], [0.125, 0.012, -0.1], P1_PINK);
  });
  if (cut === 'C') g.mirror((h) => {                                                    // four short pointed legs
    h.limb([0.045, 0.065, 0.075], [0.062, 0, 0.14], 0.03, 0, 3, P1_WH, false);
    h.limb([0.07, 0.075, -0.075], [0.1, 0, -0.02], 0.045, 0, 3, P1_WH, false);

}
// Pass 2 (Designer, 2026-11-14: it is so small that the feet add nothing, and flat on the ground they would flicker against
// it; and the body need not curve under into a belly). Body and head are shells standing on the ground with no underside,
// the feet are gone, and the tail is held clear of the ground. 17 triangles against 27; 15 with the plainer body.
const P1M_TAIL2 = [[0, 0.035, -0.14], [0.03, 0.045, -0.3], [0.12, 0.11, -0.4]], P1M_EAR2 = [0.02, 0.085, 0.055];
function p1MouseFlat(g, plain) {
  // body: a low tent with a flat ridge over the hips (6), or a plain four-sided one (4)
  const z = -0.05, F = [0, 0, 0.11], Rp = [0, 0, -0.16], L = [-0.085, 0, z], R = [0.085, 0, z];
  if (plain) p1Spindle(g, [0, 0.15, z], null, [F, L, Rp, R], P1_WH);
  else { const TL = [-0.05, 0.15, z], TR = [0.05, 0.15, z], c = [0, 0.04, z]; for (const tip of [F, Rp]) { g.tri(tip, L, TL, P1_WH, c); g.tri(tip, TL, TR, P1_WH, c); g.tri(tip, TR, R, P1_WH, c); } }
  // head: four faces up to one point, the nose just off the ground. 4
  p1Spindle(g, [0, 0.13, 0.07], null, [[0, 0.02, 0.215], [-0.065, 0, 0.065], [0, 0, -0.02], [0.065, 0, 0.065]], P1_WH);
  // ears. 4
  p1MouseEars(g, P1_PINK, 1.1, 1, P1M_EAR2);

  // tail. 3
  p1MouseTail(g, 1, P1_PINK, false, P1M_TAIL2);
}
// its skeleton: the classic cartoon. A skull that is a point with a flat back, the mouse's own ears in bone colour (they are
// surfaces in life), a spine, ribs as bars, four leg bones and the long thin tail. Made from the same numbers, so it fits.
// `flat` fits the same bones to the pass 2 body, which is a tent: the skull is a little lower and narrower, the spine ends
// sooner, and the leg bones start lower. The design is the one Designer approved; only these numbers move.
const P1M_FIT = {
  cut: { N: [0, 0.04, 0.2], T: [0, 0.118, 0.08], D: [0, 0.02, 0.084], S: [0.052, 0.062, 0.08], ear: [0.78, 0.9], sp: [[0, 0.085, 0.08], [0, 0.07, -0.13]], rib: [0.046, 0.034],

// ════════ skelfit.js ════════
// ───────────────────────── skeleton fit: a fitted classic skeleton for each made animal ─────────────────────────
// 2026-11-14. test-06's skeletons came from the creature study and were built for other bodies: the rabbit's lies 84%
// outside it, the frog's 45%, the fish's 42%, and the songbird's spread wings stick out 78% each side. Each animal here gets
// its own skeleton, made from that animal's numbers in src/parts.js so it sits inside, and drawn as the classic cartoon:
// a skull that is a point with a flat back and dark eye sockets, ribs as bars, and the parts that are surfaces in life
// (ears, beak, antlers, a fish's tail and fin, a bird's tail fan) kept as those same surfaces in bone colour.
// The style follows the two skeletons Designer has passed: the lean fish's (round0.js) and pilot 1's mouse (pilot1.js).
// Every top-level name starts with SF or sf, because all of src/ is bundled into one scope.

const SF_W = [1, 1, 1];                    // takes the bone tint
const SF_DK = [0.16, 0.13, 0.12];          // eye sockets, as the other skeletons have them
const SF_BONE = [0.97, 0.95, 0.88];
const SF_CRIT = 0.72;                      // catalog.js CRIT: a grown creature of average build
const sfGeo = (f) => { const g = new Geo(); f(g); return g; };
const sfP = (mesh, o) => Object.assign({ mesh, tint: SF_BONE }, o || {});

// a small triangle lying on the face A B C (corners as weights of A, B, C), lifted off it a little: eye sockets
function sfOnFace(g, A, B, C, w, lift, col) {

}
// the skull: a pyramid to the nose N with a flat diamond back (top T, bottom D, right side S, left its mirror). 6 triangles,

  // the socket sits on the face N S T, nearer the back and the top: the big dark eye that makes a skull read
  if (eye) g.mirror((h) => sfOnFace(h, N, S, T, K.eye || [[0.12, 0.5, 0.38], [0.45, 0.35, 0.2], [0.14, 0.26, 0.6]], K.lift || 0.002, SF_DK));

      else h.quad([s[0], s[1], s[2] + w], [s[0], s[1], s[2] - w], [e[0], e[1], e[2] - w], [e[0], e[1], e[2] + w], SF_W);

}

// a flat bar of even width w lying across `side`, from a to b. 2 triangles.

// ───────────────────────── bone kit: the shared pieces every skeleton is built from ─────────────────────────
// 2026-11-14, draft 1. The rules are in BONES.md; this file is the set of pieces those rules name. Each piece has a fixed
// triangle cost (in its comment), so a skeleton's cost can be added up before it is built.
//
// Where it sits: between the creature study's heavy skeletons (Designer: they look really good; 244–424 triangles) and the
// fitted ones in skelfit.js (too light; 28–117). The heavy ones read as cute because of a round skull with round dark
// sockets, knobs at the feet and knees, beads for the neck and tail, and round shafts that hold from every side. The kit keeps
// all of those and makes each one cheaper: a knob is 6 triangles, not a 20-triangle ball; a socket is 5, not 20.
//
// Every piece is built from tri() alone, so it works with any Geo: this asset manager's, test-06's, or the creature study's.
// With the creature study's Geo (which stores a pivot on every vertex) each piece pivots on its own centre, so a skeleton
// built from the kit can come apart bone by bone as it decays. Every top-level name starts with bk or BK, because all of
// src/ is bundled into one scope.

const BK_W = [1, 1, 1];               // bone: pure white takes the bone tint
const BK_DK = [0.16, 0.13, 0.12];     // eye sockets, as the other skeletons have them
const BK_TAU = Math.PI * 2;
const bkSub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const bkAdd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const bkMul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const bkCross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const bkNorm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

// ── shafts: the long part of a bone ──
// tube: a closed, tapered tube from a to b; `sides` 3 (6 triangles) is the default. r1 = 0 makes it a point (3).

// cross: two flat bars crossed at right angles along a → b, w0 wide at a and w1 at b. 4 triangles (2 if w1 = 0).
// Reads from every side but straight down its length. Open shapes are fine here: nothing culls back faces.
function bkCrossBar(g, a, b, w0, w1, col) {

  }
}
// flat: one flat bar along a → b lying across `side`, w0 wide at a and w1 at b. 2 triangles (1 if w1 = 0).
function bkFlat(g, a, b, w0, w1, side, col) {

  bkPiv(g, bkLerp(a, b, 0.5));

  if (w1 > 1e-5) { const b0 = bkAdd(b, bkMul(s, w1 / 2)), b1 = bkAdd(b, bkMul(s, -w1 / 2)); g.tri(a0, a1, b1, c); g.tri(a0, b1, b0, c); } else g.tri(a0, a1, b, c);
}
// shaft: one of the three, by name ('tube', 'cross', 'flat'), at radius r0 → r1. The rule for which to use is in BONES.md.
function bkShaft(g, kind, a, b, r0, r1, side, col) {
  if (kind === 'cross') bkCrossBar(g, a, b, r0 * 2.2, r1 * 2.2, col);
  else if (kind === 'flat') bkFlat(g, a, b, r0 * 2.4, r1 * 2.4, side || [0, 0, 1], col);
  else bkTube(g, a, b, r0, r1, 3, false, col);
}

// ── round pieces ──
// knob: a small round lump, two points joined through a ring of `sides` (3: 6 triangles, 4: 8). Feet, knees, hips,
// vertebrae. r is a number, or [across, across the other way, along the axis]. axis is the line through its two points.
function bkKnob(g, c, r, sides, axis, col) {
  const n = sides || 3, k = col || BK_W, R = typeof r === 'number' ? [r, r, r] : r, ax = bkNorm(axis || [0, 1, 0]), { u, w } = bkFrame(ax);
  bkPiv(g, c);
  const top = bkAdd(c, bkMul(ax, R[2])), bot = bkAdd(c, bkMul(ax, -R[2])), ring = [];
  for (let i = 0; i < n; i++) { const t = BK_TAU * i / n + Math.PI / 2; ring.push(bkAdd(c, bkAdd(bkMul(u, Math.cos(t) * R[0]), bkMul(w, Math.sin(t) * R[1])))); }
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; g.tri(top, ring[i], ring[j], k, c); g.tri(bot, ring[i], ring[j], k, c); }
}
// beads: n knobs in a row from a to b, tapering r0 → r1, each a vertebra of its own with gaps between. 2 × sides each.
// The neck and tail of the heavy skeletons: a dotted line reads as a backbone and is the cutest part of them.
function bkBeads(g, a, b, n, r0, r1, sides, col) {
  const d = bkNorm(bkSub(b, a));
  for (let i = 0; i < n; i++) { const t = n === 1 ? 0.5 : i / (n - 1), r = r0 + (r1 - r0) * t; bkKnob(g, bkLerp(a, b, t), [r, r, r * 0.8], sides, d, col); }
}
// bone: a shaft with a knob at either end or both (the cartoon bone). Cost: the shaft plus 2 × sides a knob.
function bkBone(g, a, b, r0, r1, o) {
  const q = o || {};
  bkShaft(g, q.shaft || 'tube', a, b, r0, r1, q.side, q.col);
  if (q.knobA) bkKnob(g, a, q.knobA, q.knobSides, q.knobAxis, q.col);
  if (q.knobB) bkKnob(g, q.footAt || b, q.knobB, q.knobSides, q.knobAxis, q.col);
}

// ── the skull ──
// socket: a dark eye socket, as a shallow cone pushed out through the cranium's surface: what shows is a round dark patch
// with a slight bump, like the heavy skeletons' dark balls, for `sides` triangles (5) instead of 20. p is the point on the
// surface, n the way out, e its radius.
function bkSocket(g, p, n, e, sides, col) {
  const k = sides || 5, c = col || BK_DK, base = bkAdd(p, bkMul(n, -e * 0.6)), apex = bkAdd(p, bkMul(n, e * 0.45)), { u, w } = bkFrame(n), ring = [];
  for (let i = 0; i < k; i++) { const t = BK_TAU * i / k; ring.push(bkAdd(base, bkAdd(bkMul(u, Math.cos(t) * e), bkMul(w, Math.sin(t) * e)))); }
  bkPiv(g, p);
  for (let i = 0; i < k; i++) g.tri(apex, ring[i], ring[(i + 1) % k], c, base);
}
// skull: the round cranium (the one 20-triangle ball a skeleton may have: it is the face, and the face is what makes it
// cute), a snout to the nose, and a dark socket each side. K = { c, r: [rx, ry, rz], nose, snout: [r at the cranium, r at
// the nose], eye: [x, y, z] the way from the centre to the right socket, eyeR, socketSides }.
// Cost: 20 + snout (4 sides, capped: 10) + 2 × socketSides (5: 10) = 40.
function bkSkull(g, K, col) {
  const c = K.c, r = K.r, k = col || BK_W;
  bkPiv(g, c);
  g.ico(c[0], c[1], c[2], r[0], r[1], r[2], k, 0);
  if (K.nose) { const s = K.snout || [r[0] * 0.6, r[0] * 0.35]; bkTube(g, K.from || [c[0], c[1] - r[1] * 0.2, c[2] + r[2] * 0.3], K.nose, s[0], s[1], 4, true, k); }
  if (K.eye) bkSides((sx) => {
    const d = bkNorm([sx * K.eye[0], K.eye[1], K.eye[2]]), p = [c[0] + d[0] * r[0], c[1] + d[1] * r[1], c[2] + d[2] * r[2]];
    const n = bkNorm([d[0] / r[0], d[1] / r[1], d[2] / r[2]]);

// ── the body ──
// rib: one rib, from the spine s out and down through the bend m to the end e. 'flat' is two bars, wide along the body
// (4 triangles); 'tube' is two thin tubes (12). Call it inside bkSides for a pair.
function bkRib(g, s, m, e, wd, style, col) {
  if (style === 'tube') { bkTube(g, s, m, wd * 0.45, wd * 0.4, 3, false, col); bkTube(g, m, e, wd * 0.4, wd * 0.25, 3, false, col); return; }
  bkFlat(g, s, m, wd, wd, [0, 0, 1], col); bkFlat(g, m, e, wd, wd * 0.75, [0, 0, 1], col);
}
// spine: tubes (or crossed bars) through a list of points, front to back, tapering r0 → r1. 6 (or 4) a segment.
function bkSpine(g, pts, r0, r1, kind, col) {
  for (let i = 0; i < pts.length - 1; i++) {

    bkShaft(g, kind === 'cross' ? 'cross' : 'tube', pts[i], pts[i + 1], r0 + (r1 - r0) * t0, r0 + (r1 - r0) * t1, null, col);
  }
}
// height of a spine at z, for placing ribs on it (points ordered front to back)
function bkSpineY(pts, z) {

}
// surface: a part that is a surface in life (an ear, a fin, a tail fan, a beak's blade), kept as that surface in bone. 1.
function bkSurf(g, a, b, c, col) { bkPiv(g, bkLerp(bkLerp(a, b, 0.5), c, 1 / 3)); g.tri(a, b, c, col || BK_W); }

// ── weights: the same skeleton at three weights, so a test can find the middle Designer is after ──
// A light, B middle, C round. A skeleton builder reads its dials from one of these, so every animal's cuts line up.
const BK_CUTS = {
  A: { label: 'Cut A · light', shaft: 'cross', knob: 3, knees: false, ribs: 3, rib: 'flat', beads: 0.6, sockets: 5 },
  B: { label: 'Cut B · middle', shaft: 'tube', knob: 3, knees: false, ribs: 4, rib: 'flat', beads: 1, sockets: 5 },
  C: { label: 'Cut C · round', shaft: 'tube', knob: 3, knees: true, ribs: 4, rib: 'flat', beads: 1.4, sockets: 6 },
};

const ktGeo = (f) => { const g = new Geo(); f(g); return g; };

// ───────────────────────── deer ─────────────────────────

const KTD_SPINE = [[0, 0.476, 0.17], [0, 0.488, 0.02], [0, 0.466, -0.17]];

// ───────────────────────── fox V2 ─────────────────────────
// Fox V2 (drafts.js fox2, the creature study's default fox since 2026-11-14), not test-06's: a lofted body of four rings,
// a neck up to a head drawn 1.15× (so its numbers here are already scaled), black-stockinged legs, hind legs bent at a hock,
// and a bushy tail carried low. The first kit fox was made to test-06's fox by mistake; Designer: we have moved on to V2.
// The body's rings (z, centre height, half-width, half-height), front to back, so ribs can be sized to it at any z.
const KTF_RINGS = [[0.13, 0.185, 0.036, 0.045], [0.075, 0.18, 0.056, 0.066], [-0.04, 0.19, 0.05, 0.052], [-0.115, 0.195, 0.056, 0.058]];

  return z > R[0][0] ? R[0] : R[R.length - 1];
}
const KTF_SPINE = [[0, 0.222, 0.118], [0, 0.222, 0.0], [0, 0.222, -0.125]];
function ktFox(g, cut) {
  const W = BK_CUTS[cut], beads = (n) => Math.max(1, Math.round(n * W.beads));

  // neck: beads up V2's neck, from the shoulders to the back of the skull. 1 / 2 / 3 × 6
  bkBeads(g, [0, 0.226, 0.122], [0, 0.254, 0.146], beads(2), 0.015, 0.014, W.knob);
  bkSpine(g, KTF_SPINE, 0.01, 0.009, W.shaft);                                                   // 12 (8 crossed)
  // ribs: from the spine out and down through a bend, sized to the body's ring where each lands. 8 a pair
  const zs = W.ribs === 3 ? [0.07, 0.02, -0.03] : [0.085, 0.045, 0.005, -0.035];

    else bkShaft(g, W.shaft, sh, ft, 0.009, 0.006);

    // hind leg: hip, knee, hock, paw, always bent the way V2's is (a straight bone would leave the leg); knobs on cut C. 18 + 8
    const hp = [s * 0.04, 0.19, -0.1], kn = [s * 0.042, 0.1, -0.074], hk = [s * 0.04, 0.05, -0.122], hf = [s * 0.039, 0.02, -0.114];
    bkShaft(g, W.shaft, hp, kn, 0.01, 0.008); bkShaft(g, W.shaft, kn, hk, 0.008, 0.007); bkShaft(g, W.shaft, hk, hf, 0.007, 0.006);

// ───────────────────────── songbird V2 ─────────────────────────
// Songbird V2 (drafts.js bird2): a body ball (0 0 0; 0.052 0.054 0.098) with a cream breast, a head ball (0 0.045 0.095;
// 0.04 0.04 0.045), a beak to (0 0.03 0.175), eyes at (±0.031 0.057 0.117), short legs (±0.022 -0.035 0) → (±0.023 -0.075
// 0.005), a forked tail, and wings that fold at an elbow and hang down its sides. The wing bones follow the wing exactly as
// bird2 moves it (the same shoulder turn, sweep, elbow and fold), so they lie in the wing folded and spread.
function kttBirdWing(g, W, s, folded) {
  const sp = [s * 0.045, 0.012, 0.03], el = [s * 0.11, 0.012, -0.02];
  const tilt = (folded ? 1.45 : 0.3) * s, sweep = (folded ? 1.5 : 0) * s, elbow = (folded ? 0.3 : 0) * s, k = folded ? 0.55 : 1;
  const rY = (v, a) => [Math.cos(a) * v[0] + Math.sin(a) * v[2], v[1], -Math.sin(a) * v[0] + Math.cos(a) * v[2]];
  const rZ = (v, a) => [Math.cos(a) * v[0] - Math.sin(a) * v[1], Math.sin(a) * v[0] + Math.cos(a) * v[1], v[2]];
  const shoulder = (p) => { const r = rZ(rY([(p[0] - sp[0]) * k, (p[1] - sp[1]) * k, (p[2] - sp[2]) * k], sweep), tilt); return [sp[0] + r[0], sp[1] + r[1], sp[2] + r[2]]; };

  bkTube(g, [0, 0.042, 0.112], [0, 0.03, 0.175], 0.012, 0, 4);                                             // the beak: bone in life. 4
  bkBeads(g, [0, 0.026, 0.06], [0, 0.034, 0.074], kttBeads(W, 2), 0.009, 0.009, W.knob);                   // neck. 1 / 2 / 3 × 6
  bkShaft(g, W.shaft, [0, 0.026, 0.05], [0, 0.012, -0.08], 0.006, 0.005);                                  // spine. 6
  const zs = W.ribs === 3 ? [0.03, -0.005, -0.04] : [0.035, 0.008, -0.019, -0.046];
  for (const z of zs) { const y = 0.026 + (0.012 - 0.026) * ((0.05 - z) / 0.13); bkSides((s) => bkRib(g, [0, y, z], [s * 0.042, 0.0, z - 0.008], [s * 0.028, -0.03, z - 0.018], 0.007, W.rib)); }

  bkKnob(g, [0, 0.008, -0.06], [0.026, 0.02, 0.009], W.knob);                                            // hips. 6

  o[8] = (a[4] * b10 - a[5] * b08 + a[7] * b06) * d; o[9] = (a[1] * b08 - a[0] * b10 - a[3] * b06) * d; o[10] = (a[12] * b04 - a[13] * b02 + a[15] * b00) * d; o[11] = (a[9] * b02 - a[8] * b04 - a[11] * b00) * d;
  o[12] = (a[5] * b07 - a[4] * b09 - a[6] * b06) * d; o[13] = (a[0] * b09 - a[1] * b07 + a[2] * b06) * d; o[14] = (a[13] * b01 - a[12] * b03 - a[14] * b00) * d; o[15] = (a[8] * b03 - a[9] * b01 + a[10] * b00) * d;
  return o;
}

// ───────────────────────── catalog: one entry per thing the world draws ─────────────────────────
// An entry is what Designer sees as one model. It is made of one or more parts (meshes in parts.js or drafts.js).
//
//   id       short name, unique
//   group    a key of GROUPS below
//   name     what it is called
//   about    one line on what it is and where it shows up
//   scale    its typical in-game scale: a number, or [x, y, z] when the game stretches it
//   stand    'ground' (stands on the land; height counts from the ground up) or 'float' (fish, birds in flight, clouds)
//   count    the most the game draws at once
//   from     where it comes from (the build and the mesh names)
//   parts(v) returns the parts to draw for variant v: [{ mesh, tint, e, at, yaw, pitch, roll, s }]
//            tint colours the pure-white faces, e is glow (0 to 1), at is an offset in model units,
//            yaw/pitch/roll turn the part, s scales it (number or [x, y, z]); all optional except mesh
//   variants [{ label, ...anything parts(v) reads }]; empty means one look. Later: states such as baby, sick, burnt, dead.
//   status   'draft' for the Drafts group; drafts also say which group they `lineup` with. 'planned' entries (planned.js) have no shape yet
//   envs, tier, needs, eats: where it lives, how sure we are, the states it still needs, and (animals) what it eats; see META below and planned.js
//   wood     for a tree, the parts left when the leaves are gone (trunk and the branches hidden in the crown); its burnt,
//            stripped and dead looks are made from it, with no model of their own
//   skel     for an animal, the id of its skeleton entry; the skull button shows it inside a see-through animal

  { label: 'Stripped', state: 'stripped', fx: null },
  { label: 'Long dead', state: 'dead', fx: [0, 0.12, 0.85, 0] },

for (const e of CATALOG) {

  const healthy = e.parts;

  e.variants = [...(e.variants.length ? e.variants : [{ label: 'Healthy' }]), ...DAMAGE];
  e.needs = e.needs.filter((n) => !NEEDS.tree.includes(n));
}

// Each animal keeps the skeleton it uses, in the Skeletons group, named after it, with only the look it shows (two for a bird
// that also flies). Every other skeleton and the bone kit's test cards are archived: their code stays where it is (skeletons.js,
// skelfit.js, round0.js, kittest.js, kittiny.js) and they leave the gallery. To bring one back, take its id out of ARCHIVE.
const SKEL_ONE = {
  'bk-deer': ['Deer skeleton', [0]],              // the bone kit's round cut; Designer likes it
  'bk-fox': ['Fox V2 skeleton', [0]],             // the bone kit's round cut; Designer likes it
  'bk-bird': ['Songbird V2 skeleton', [0, 3]],    // the bone kit's round cut, folded and in flight
  'p1-skel-mouse': ['Mouse skeleton', [0]],       // pilot 1's, 37 triangles; Designer preferred it to every remake
  'skel-fish': ['Tiny fish skeleton', null],      // the creature study's; Designer preferred it to the kit's
  'skel-frog': ['Frog skeleton', null],           // the creature study's; Designer preferred it to the kit's
  'skel-fish3': ['Small fish skeleton', [0]],     // round 0's classic fishbone, Designer's pick for the lean fish
  'skel-rabbit2': ['Rabbit V2 skeleton', null],   // the creature study's
  'sf-rabbit': ['Rabbit skeleton', [0]],          // skeleton fit; one of the fitted ones Designer found too light
  'sf-fox': ['Fox skeleton', [0]],                // skeleton fit; too light, as above
  'sf-bird': ['Songbird skeleton', [0, 3]],       // skeleton fit; too light, as above; folded and in flight
};
const ARCHIVE = ['skel-small', 'skel-large', 'skel-bird', 'skel-fish2', 'sf-deer', 'sf-frog', 'sf-fish', 'bk-fish', 'bk-frog', 'bk-mouse',
  'bk-deer-test', 'bk-fox-test', 'bk-fish-test', 'bk-frog-test', 'bk-mouse-test', 'bk-bird-test'];
for (let i = CATALOG.length - 1; i >= 0; i--) if (ARCHIVE.includes(CATALOG[i].id)) CATALOG.splice(i, 1);
for (const e of CATALOG) {
  const one = SKEL_ONE[e.id];

  else if (what.startsWith('cuts:')) items = made.filter((e) => String(e.round) === what.slice(5)).flatMap((e) => (e.variants.length ? e.variants : [{}]).map((v, i) => ({ e, vi: i, label: v.label })));
  else if (what === 'made' || what === 'all') items = made;
  else items = what.split(',').map((id) => made.find((e) => e.id === id.trim())).filter(Boolean);
  items = items.map((it) => (it.e ? it : { e: it, vi: 0 }));
  document.body.classList.add('sheetmode');
  const LBL = 26, per = Math.max(1, Math.min(+q.per || 3, items.length)), tw = px * 4, th = px + LBL, gap = 6;
  const cv = el('canvas'); cv.id = 'sheet';
  cv.width = per * tw + (per + 1) * gap; cv.height = Math.ceil(items.length / per) * (th + gap) + gap;
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#0b0f1a'; ctx.fillRect(0, 0, cv.width, cv.height);
  const VIEWS = [{ yaw: 0, pitch: 0.06 }, { yaw: Math.PI / 2, pitch: 0.06 }, { yaw: 0.6, pitch: 0.32 }];
  items.forEach((it, i) => {
    const x0 = gap + (i % per) * (tw + gap), y0 = gap + Math.floor(i / per) * (th + gap), st = statsOf(it.e, it.vi);
    VIEWS.forEach((vw, k) => { ctx.fillStyle = '#161d2d'; ctx.fillRect(x0 + k * px, y0, px, px); drawCell(ctx, x0 + k * px, y0, px, px, it.e, it.vi, vw); });
    ctx.fillStyle = '#26304a'; ctx.fillRect(x0 + 3 * px, y0, px, px);
    drawInGame(ctx, x0 + 3 * px, y0, px, px, it.e, it.vi, GAME_VIEW.height);
    ctx.fillStyle = '#e6edf8'; ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillText(it.e.name + (it.label ? ' · ' + it.label : ''), x0 + 3, y0 + px + 11);
    ctx.fillStyle = '#9aa6bd'; ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(`${st.tris} tri (${st.budget[0]}–${st.budget[1]}, ${st.verdict}) · ${st.colours} col · ${Math.round(st.px)} px in game · ${st.small} too small`, x0 + 3, y0 + px + 23);
  });
  window.__sheetDone = { models: items.length, width: cv.width, height: cv.height };
}

function start() {
  if (location.hash.startsWith('#sheet')) { runSheet(location.hash.slice(1)); return; }
  const tc = document.createElement('canvas'); tc.width = tc.height = 224;
  thumbR = new Renderer(tc, { preserve: true });
  stageR = new Renderer($('#sc'), { world: true });
  for (const k of Object.keys(IC)) for (const n of document.querySelectorAll('[data-ic="' + k + '"]')) n.innerHTML = IC[k];
  buildList();
  stageInput();
  $('#b-line').addEventListener('click', () => setMode(ST.mode === 'lineup' ? 'single' : 'lineup'));
  $('#b-ok').addEventListener('click', () => { const id = ST.e.id; if (APPROVED.has(id)) APPROVED.delete(id); else APPROVED.add(id); saveApproved(); markCards(); hud(); });
  $('#b-skel').addEventListener('click', () => { ST.skel = !ST.skel; hud(); });
  const setTab = (t) => { ST.tab = t; try { localStorage.setItem('bw-assets-tab', t); } catch (_) {} hud(); };
  $('#t-info').addEventListener('click', () => setTab('info'));
  $('#t-views').addEventListener('click', () => setTab('views'));
  $('#t-looks').addEventListener('click', () => setTab('looks'));
  // the views' mode: silhouette or colour, and edges on or off; kept between visits
  const setView = (k, v) => { ST[k] = v; try { localStorage.setItem('bw-assets-' + k, typeof v === 'boolean' ? (v ? '1' : '0') : v); } catch (_) {} hud(); };
  // colour, silhouette or parts: on the stage and in the views
  const setDraw = (v) => { ST.vmode = v; try { localStorage.setItem('bw-assets-draw', v); } catch (_) {} hud(); };
  for (const v of ['col', 'sil', 'parts']) $('#vm-' + v).addEventListener('click', () => setDraw(v));
  // moves: the tab, play through, live, and the strip under the stage
  $('#t-moves').addEventListener('click', () => setTab('moves'));
  $('#mv-all').addEventListener('click', () => playMove('all'));
  $('#mv-live').addEventListener('click', () => startLive());
  $('#pb-play').addEventListener('click', () => { if (!MV.pl && !MV.live) { playMove('all'); return; } MV.playing = !MV.playing; if (MV.playing && MV.pl && MV.pl.ended) MV.pl.reset(); updateStrip(); });
  $('#pb-step').addEventListener('click', () => { MV.playing = false; if (MV.pl) MV.pl.advance(1 / 60); updateStrip(); });
  { const sc = $('#pb-scrub');
    sc.addEventListener('input', () => { if (!MV.pl) return; MV.scrubbing = true; MV.playing = false; MV.pl.seek((sc.value / 1000) * MV.pl.span); updateStrip(); });
    sc.addEventListener('change', () => { MV.scrubbing = false; }); }
  for (const b of document.querySelectorAll('#pb-speed button')) b.addEventListener('click', () => { MV.speed = +b.dataset.v; saveMV(); updateStrip(); });
  $('#pb-loop').addEventListener('click', () => { MV.loop = !MV.loop; saveMV(); updateStrip(); });
  for (const [id, m] of [['#pb-tread', 'treadmill'], ['#pb-path', 'path']]) $(id).addEventListener('click', () => { if (MV.mode === m) return; MV.mode = m; saveMV(); replay(); camForMove(); hud(); });
  $('#b-edge').addEventListener('click', () => setView('vedges', !ST.vedges));
  // a side, front or top view clicked: the stage camera turns to it and holds still until the stage is dragged or zoomed
  for (const b of document.querySelectorAll('#tab-views .vw')) b.addEventListener('click', () => {
    const to = SIL_VIEWS[b.dataset.to], d = ((((to.yaw - ST.yaw) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
    ST.turn = { y0: ST.yaw, p0: ST.pitch, y1: ST.yaw + d, p1: to.pitch, t: 0 }; ST.idle = -Infinity;
  });
  $('#b-costs').addEventListener('click', () => setCosts(!COSTS.on));
  // back home: all kinds, everywhere, no search
  $('#b-reset').addEventListener('click', () => {
    FILTER.kind = ''; FILTER.env = ''; FILTER.q = ''; DD.kind.set(''); DD.env.set(''); $('#q').value = '';
    applyFilter(); if (ST.e) revealCard(ST.e);
  });
  // the list's width: drag its right edge to widen it (two to four across); double-click the edge to put it back
  const SIDE = [214, 520], setSide = (w) => { document.documentElement.style.setProperty('--side', Math.round(w) + 'px'); };
  try { const w = +localStorage.getItem('bw-assets-side'); if (w) setSide(Math.max(SIDE[0], Math.min(SIDE[1], w))); } catch (_) {}
  const grip = $('#grip'); let gripX = null;
  grip.addEventListener('pointerdown', (ev) => { grip.setPointerCapture(ev.pointerId); gripX = ev.clientX - $('#side').getBoundingClientRect().width; grip.classList.add('on'); });
  grip.addEventListener('pointermove', (ev) => { if (gripX == null) return; setSide(Math.max(SIDE[0], Math.min(SIDE[1], ev.clientX - gripX))); measure(); });
  const gripEnd = () => {
    if (gripX == null) return; gripX = null; grip.classList.remove('on');
    try { localStorage.setItem('bw-assets-side', String(Math.round($('#side').getBoundingClientRect().width))); } catch (_) {}
    if (ST.mode === 'lineup') fitRow(); else { const k = [ST.yaw, ST.pitch]; fitSingle(); [ST.yaw, ST.pitch] = k; }
    if (ST.e) revealCard(ST.e);   // the grid reflowed; bring the open model's card back into view
  };
  grip.addEventListener('pointerup', gripEnd); grip.addEventListener('pointercancel', gripEnd);
  grip.addEventListener('dblclick', () => { document.documentElement.style.removeProperty('--side'); try { localStorage.removeItem('bw-assets-side'); } catch (_) {} measure(); fitSingle(); });
  // filters: planned shown, all kinds, everywhere; the choice is kept in this browser
  try { Object.assign(FILTER, JSON.parse(localStorage.getItem('bw-assets-filter') || '{}')); } catch (_) {}
  delete FILTER.vision; if (FILTER.env === 'magical') { FILTER.env = ''; FILTER.kind = '@magical'; }   // magical moved from the places to the kinds
  if (FILTER.env && !ENVIRONMENTS.some((v) => v.id === FILTER.env)) FILTER.env = '';   // a place that no longer exists
  if (!DD.kind.has(FILTER.kind)) FILTER.kind = '';
  DD.env.set(FILTER.env); DD.kind.set(FILTER.kind);
  $('#b-plan').addEventListener('click', () => { FILTER.plan = !FILTER.plan; applyFilter(); });
  applyFilter();
  try { if (localStorage.getItem('bw-assets-costs') === '1') setCosts(true); } catch (_) {}   // the list's mode is kept
  window.addEventListener('resize', () => { resize(); if (ST.mode === 'lineup') fitRow(); else fitSingle(); if (ST.e) hud(); });   // the in-game view depends on the window's height
  // search: type to narrow the list; Escape clears it; '/' jumps to it from anywhere
  $('#q').addEventListener('input', () => { FILTER.q = $('#q').value; applyFilter(); });
  $('#q').addEventListener('keydown', (ev) => { if (ev.key === 'Escape') { $('#q').value = ''; FILTER.q = ''; applyFilter(); $('#q').blur(); } ev.stopPropagation(); });
  window.addEventListener('keydown', (ev) => {
    if (ev.target && /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;   // typing in a field is not a shortcut
    if (ev.key === '/') { ev.preventDefault(); $('#q').focus(); return; }
    if (ev.key === 'c' || ev.key === 'C') { setCosts(!COSTS.on); return; }
    if (ev.key === ' ' && !MV.pl && !MV.live && stripOn()) { ev.preventDefault(); playMove('all'); return; }
    if (ev.key === ' ' && (MV.pl || MV.live)) { ev.preventDefault(); MV.playing = !MV.playing; updateStrip(); return; }
    if (ev.key === 'Escape') { if (MV.pl || MV.live) stopMoves(); else if (ST.mode === 'lineup') setMode('single'); }
    else if (ev.key === 'ArrowRight') { if (ST.tab === 'moves' && kitOf(ST.e)) stepMove(1); else stepVariant(1); }
    else if (ev.key === 'ArrowLeft') { if (ST.tab === 'moves' && kitOf(ST.e)) stepMove(-1); else stepVariant(-1); }
    else if ((ev.key === 'm' || ev.key === 'M') && movesFor(ST.e)) { ST.tab = ST.tab === 'moves' ? 'info' : 'moves'; try { localStorage.setItem('bw-assets-tab', ST.tab); } catch (_) {} hud(); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); stepModel(1); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); stepModel(-1); }
    else if (ev.key === 'e' || ev.key === 'E') setView('vedges', !ST.vedges);
    else if (ev.key === 'l' || ev.key === 'L') setMode(ST.mode === 'lineup' ? 'single' : 'lineup');
    else if (ev.key === 'v' || ev.key === 'V') { ST.tab = ST.tab === 'views' ? 'info' : 'views'; try { localStorage.setItem('bw-assets-tab', ST.tab); } catch (_) {} hud(); }
    else if (ev.key === 'k' || ev.key === 'K') { ST.tab = ST.tab === 'looks' ? 'info' : 'looks'; try { localStorage.setItem('bw-assets-tab', ST.tab); } catch (_) {} hud(); }
    else if ((ev.key === 's' || ev.key === 'S') && skelOf(ST.e)) { ST.skel = !ST.skel; hud(); }
  });
  resize();
  const h = location.hash.slice(1).split('/'), e = CATALOG.find((x) => x.id === h[0]) || CATALOG[0];
  if (h[1] === 'lineup') ST.mode = 'lineup';
  openFirst(e);
  requestAnimationFrame(frame);
  window.BW_ASSETS = { CATALOG, GROUPS, statsOf, openEntry, setMode, ST, MV, get stage() { return stageR; } };
}
// the first model opens once the panels have their size, so the camera fits the free space
function openFirst(e) { ST.e = e; hud(); openEntry(e); revealCard(e); }
start();

})();
</script>
