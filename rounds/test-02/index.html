<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble World</title>
<style>
  :root {
    --bg1: #f6eee1; --bg2: #e3d3ba; --ink: #3a3026; --muted: #8b7a64;
    --card: rgba(255, 251, 243, .86); --line: rgba(80, 60, 40, .13); --accent: #e8743b; --tend: #3c9ad8; --wreck: #e8642c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #24212b; --bg2: #121117; --ink: #efe6d8; --muted: #a39886;
      --card: rgba(36, 33, 42, .86); --line: rgba(255, 240, 220, .11); --accent: #ff9a62; --tend: #6cbcf0; --wreck: #ff8a52;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #24212b; --bg2: #121117; --ink: #efe6d8; --muted: #a39886;
    --card: rgba(36, 33, 42, .86); --line: rgba(255, 240, 220, .11); --accent: #ff9a62; --tend: #6cbcf0; --wreck: #ff8a52;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    background: radial-gradient(ellipse at 50% 40%, var(--bg1) 0%, var(--bg2) 100%) fixed, var(--bg1);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
  .hud { position: fixed; z-index: 2; }
  .card { background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #title { top: 16px; left: 16px; line-height: 1.15; pointer-events: none; }
  #title b { font-size: 20px; letter-spacing: .2px; }
  #status { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #controls { top: 14px; right: 16px; display: flex; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; height: 36px; min-width: 36px; padding: 0 12px; font-size: 14px; font-weight: 650;
    cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .14s cubic-bezier(.3,1.6,.5,1), background .2s, border-color .2s;
  }
  button:active { transform: scale(.9); }
  /* tool dock */
  #dock { left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; align-items: stretch;
    border-radius: 22px; padding: 6px; }
  .grp { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .gl { font-size: 10px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .sep { width: 1px; background: var(--line); margin: 6px 4px; }
  .tool { height: 52px; min-width: 76px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 0 14px; border-width: 2px; border-color: transparent; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .tool .ti { font-size: 22px; line-height: 1; transition: transform .25s cubic-bezier(.3,1.8,.5,1); }
  .tool .tn { font-size: 12px; font-weight: 750; }
  .tool[data-side="tend"].sel { border-color: var(--tend); background: color-mix(in srgb, var(--tend) 14%, transparent); }
  .tool[data-side="wreck"].sel { border-color: var(--wreck); background: color-mix(in srgb, var(--wreck) 14%, transparent); }
  .tool.sel .ti { transform: scale(1.18) rotate(-6deg); }
  .tool kbd { position: absolute; margin: -38px 0 0 52px; font: 700 9.5px ui-monospace, monospace; color: var(--muted); opacity: .7; }
  /* chain ribbon */
  #chain { left: 50%; top: 14px; transform: translateX(-50%); border-radius: 18px; padding: 8px 12px; max-width: min(760px, calc(100vw - 340px));
    display: flex; gap: 8px; align-items: center; transition: opacity .6s, transform .4s cubic-bezier(.3,1.5,.5,1); pointer-events: none; }
  #chain.hide { opacity: 0; transform: translate(-50%, -130%); }
  #chain.idle { opacity: .55; }
  #chain .cn { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  #chain .cn b { font-size: 17px; letter-spacing: 0; display: inline-block; min-width: 14px; text-align: center; }
  #chain .cn b.pop { animation: pop .45s cubic-bezier(.3,1.8,.5,1); }
  #steps { display: flex; flex-wrap: wrap; gap: 3px 2px; align-items: center; font-size: 12px; }
  #steps .p { background: var(--line); border-radius: 8px; padding: 2px 7px 2px 5px; white-space: nowrap; font-weight: 650; }
  #steps .p.new { animation: pop .5s cubic-bezier(.3,1.8,.5,1); background: color-mix(in srgb, var(--accent) 28%, transparent); }
  #steps .ar { color: var(--muted); font-size: 11px; }
  @keyframes pop { 0% { transform: scale(.3); } 100% { transform: scale(1); } }
  /* discoveries */
  #disc { left: 16px; top: 72px; width: 236px; border-radius: 16px; overflow: hidden; }
  #discHead { width: 100%; border: 0; border-radius: 0; background: transparent; display: flex; justify-content: space-between;
    align-items: center; gap: 12px; height: 40px; padding: 0 14px; backdrop-filter: none; }
  #discHead:active { transform: none; }
  #discCount { color: var(--muted); font-variant-numeric: tabular-nums; }
  #discList { list-style: none; margin: 0; padding: 0 8px 8px; max-height: calc(100vh - 230px); overflow-y: auto; }
  #disc.closed #discList { display: none; }
  #discList li { display: flex; gap: 9px; align-items: center; padding: 5px 6px; border-radius: 10px; }
  #discList li .ic { width: 24px; text-align: center; font-size: 17px; }
  #discList li.no .ic { filter: grayscale(1); opacity: .3; }
  #discList li .nm { font-size: 13.5px; font-weight: 650; }
  #discList li .hn { font-size: 11.5px; color: var(--muted); }
  #discList li.no .nm { color: var(--muted); }
  #discList li .rare { font-size: 9.5px; font-weight: 800; color: var(--accent); letter-spacing: .8px; margin-left: 4px; }
  #discList li.fresh { animation: fresh 1.8s ease-out; }
  @keyframes fresh { 0% { background: rgba(255, 200, 80, .6); } 100% { background: transparent; } }
  #toast { left: 50%; top: 70px; transform: translate(-50%, -30px) scale(.9); opacity: 0; border-radius: 18px; padding: 12px 18px 12px 14px;
    display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(60, 40, 20, .2);
    transition: transform .45s cubic-bezier(.3,1.5,.5,1), opacity .3s; pointer-events: none; }
  #toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
  #toast .big { font-size: 34px; }
  #toast .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 800; }
  #toast .n { font-size: 17px; font-weight: 800; }
  #toast .d { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 320px; }
  #hint { left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px); transform: translateX(-50%); font-size: 14px; font-weight: 650;
    border-radius: 999px; padding: 8px 16px; white-space: nowrap; pointer-events: none; transition: opacity .4s; }
  #hint.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .lab { position: absolute; left: 0; top: 0; font-size: 13px; font-weight: 800; white-space: nowrap; will-change: transform, opacity;
    text-shadow: 0 1px 0 rgba(0,0,0,.35), 0 0 6px rgba(0,0,0,.25); color: #fff; }
  .lab i { font-style: normal; font-size: 15px; margin-right: 3px; }
  @media (max-width: 1000px) {
    #chain { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 84px); max-width: calc(100vw - 32px); }
    #chain.hide { transform: translate(-50%, 130%); }
    body.chained #hint { opacity: 0 !important; }
  }
  @media (max-width: 760px) {
    #toast { top: 120px; }
    #disc { top: 64px; width: 210px; }
    #discList { max-height: 45vh; }
    #disc.closed { width: auto; }
    #hint { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 132px); font-size: 12.5px; white-space: normal; text-align: center;
      width: max-content; max-width: calc(100vw - 32px); }
    #title b { font-size: 17px; }
    #status { font-size: 11.5px; max-width: calc(100vw - 180px); }
    #bNew .lbl { display: none; }
  }
  @media (min-width: 761px) { #bNew .ic { display: none; } }
</style>
</head>
<body>
<div id="labels"></div>
<div class="hud" id="title"><b>Bubble World</b><span id="status">Day 1</span></div>
<div class="hud" id="controls">
  <button id="bSound" title="Sound on/off">🔊</button>
  <button id="bSpeed" title="Simulation speed">1×</button>
  <button id="bNew" title="Grow a new world"><span class="lbl">New world</span><span class="ic">↻</span></button>
</div>
<div class="hud card hide" id="chain"><span class="cn">Chain <b id="chainN">0</b></span><div id="steps"></div></div>
<div class="hud card" id="disc"><button id="discHead"><span>Discoveries</span><span id="discCount">0/8</span></button><ul id="discList"></ul></div>
<div class="hud card" id="toast"></div>
<div class="hud card pulse" id="hint">Tap the ground near the pond to crack it open 🌋</div>
<div class="hud card" id="dock">
  <div class="grp"><span class="gl">Tend</span>
    <button class="tool" data-tool="rain" data-side="tend" title="Rain (1)"><span class="ti">🌧️</span><span class="tn">Rain</span></button></div>
  <div class="sep"></div>
  <div class="grp"><span class="gl">Wreck</span>
    <button class="tool sel" data-tool="crack" data-side="wreck" title="Crack (2)"><span class="ti">🌋</span><span class="tn">Crack</span></button></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ═════════════════════════════ Grid & fields ═════════════════════════════
const R = 10, G = 64, CS = 2 * R / G, NC = G * G, TAU = Math.PI * 2, RIN = 9.45;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const F = () => new Float32Array(NC), I = () => new Int32Array(NC);

const cX = F(), cZ = F(), inside = new Uint8Array(NC), nearestIn = new Int32Array(NC);
const insideList = [], outsideList = [];
for (let z = 0; z < G; z++) for (let x = 0; x < G; x++) {
  const i = z * G + x, X = -R + (x + .5) * CS, Z = -R + (z + .5) * CS;
  cX[i] = X; cZ[i] = Z;
  if (Math.hypot(X, Z) < RIN) { inside[i] = 1; insideList.push(i); } else outsideList.push(i);
}
for (const i of outsideList) {
  const r = Math.hypot(cX[i], cZ[i]), k = (RIN - CS) / r;
  let best = -1, bd = 1e9;
  const tx = cX[i] * k, tz = cZ[i] * k;
  for (const j of insideList) { const d = (cX[j] - tx) ** 2 + (cZ[j] - tz) ** 2; if (d < bd) { bd = d; best = j; } }
  nearestIn[i] = best;
}
const INS = Int32Array.from(insideList);

// H ground height, W water, L lava, T lava temperature, M soil moisture, Gr grass, Ht surface heat, Rk rockiness,
// Fe ash/fertility, Fi fire, Ob obsidian, DH deep heat (old vents), Bt new-rock thickness
const H = F(), W = F(), L = F(), T = F(), M = F(), Gr = F(), Ht = F(), Rk = F(), Fe = F(), Fi = F(), Ob = F(), DH = F(), Bt = F(), DHt = F();
const qn = new Uint8Array(NC), natRock = new Uint8Array(NC);
// causal chain ids carried by each kind of stuff
const chW = I(), chL = I(), chM = I(), chF = I(), chG = I(), chH = I(), chHt = I();
const dA = F(), dQ = F();
const FIELDS = [H, W, L, T, M, Gr, Ht, Rk, Fe, Fi, Ob, DH, Bt, DHt];

const cellAt = (x, z) => clamp(Math.floor((z + R) / CS), 0, G - 1) * G + clamp(Math.floor((x + R) / CS), 0, G - 1);
function bil(Fd, x, z) {
  let gx = clamp((x + R) / CS - .5, 0, G - 1.001), gz = clamp((z + R) / CS - .5, 0, G - 1.001);
  const ix = gx | 0, iz = gz | 0, fx = gx - ix, fz = gz - iz, i = iz * G + ix;
  return (Fd[i] * (1 - fx) + Fd[i + 1] * fx) * (1 - fz) + (Fd[i + G] * (1 - fx) + Fd[i + G + 1] * fx) * fz;
}
const ground = (x, z) => bil(H, x, z) + bil(L, x, z);

// value noise
let nSeed = 1;
function hash(ix, iz) {
  let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(nSeed, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z); let fx = x - ix, fz = z - iz;
  fx = fx * fx * (3 - 2 * fx); fz = fz * fz * (3 - 2 * fz);
  return lerp(lerp(hash(ix, iz), hash(ix + 1, iz), fx), lerp(hash(ix, iz + 1), hash(ix + 1, iz + 1), fx), fz);
}
const fbm = (x, z) => vnoise(x, z) * .55 + vnoise(x * 2.1 + 5.3, z * 2.1 - 1.7) * .3 + vnoise(x * 4.3 - 3, z * 4.3 + 9) * .15;

// ═════════════════════════════ World state ═════════════════════════════
let tick = 0, gtick = 0, dayT = .07, day = 1, daylight = 1, sunAlt = 1, speed = 1;
let pressure = 1, shake = 0, wobV = 0, wob = 0;
let vap = 0, vapX = 0, vapZ = 0, vapCh = 0, natVap = 0, cloudCool = 0;
let pond = { x: 0, z: 0 };
const vents = [], clouds = [], trees = [], weeds = [], puffs = [];

function gen() {
  nSeed = (rnd() * 1e6) | 0;
  for (const f of FIELDS) f.fill(0);
  for (const c of [chW, chL, chM, chF, chG, chH, chHt]) c.fill(0);
  qn.fill(0); natRock.fill(0);
  vents.length = clouds.length = trees.length = weeds.length = puffs.length = 0;
  for (const p of [soft, glow]) p.n = 0;
  drops.n = 0;
  vap = vapX = vapZ = natVap = 0; vapCh = 0; pressure = 1;
  const pa = rnd() * TAU;
  pond = { x: Math.cos(pa) * 3.4, z: Math.sin(pa) * 3.4 };
  const hill = { x: -pond.x * .95 + (rnd() - .5) * 2, z: -pond.z * .95 + (rnd() - .5) * 2 };
  for (let i = 0; i < NC; i++) {
    const X = cX[i], Z = cZ[i];
    let h = -2.1 + (fbm(X * .17 + 11, Z * .17 - 4) - .5) * 1.9;
    const dp = Math.hypot(X - pond.x, Z - pond.z), dh = Math.hypot(X - hill.x, Z - hill.z);
    h -= 1.25 * Math.exp(-dp * dp / 6.5);
    h += 1.6 * Math.exp(-dh * dh / 9);
    H[i] = h;
    const n2 = fbm(X * .3 - 7, Z * .3 + 2);
    M[i] = .26 + n2 * .34;
    Gr[i] = clamp(.45 + n2 * .7, 0, 1);
    const rk = smooth(-.75, -.2, h) * .85;
    if (rk > .05) { Rk[i] = rk; natRock[i] = 1; Gr[i] *= 1 - rk; }
  }
  const pc = cellAt(pond.x, pond.z), level = H[pc] + .8;
  for (let i = 0; i < NC; i++) if (Math.hypot(cX[i] - pond.x, cZ[i] - pond.z) < 4.4 && H[i] < level) {
    W[i] = level - H[i]; M[i] = 1; Gr[i] = 0;
  }
  for (let k = 0; k < 80; k++) flowWater();
  for (const i of INS) if (W[i] > .02) { M[i] = 1; Gr[i] = 0; }
  copyOutside();
  // trees
  for (let k = 0; k < 400 && trees.length < 24; k++) {
    const i = INS[(rnd() * INS.length) | 0];
    if (W[i] > 0 || Gr[i] < .55 || Rk[i] > .1 || Math.hypot(cX[i], cZ[i]) > 8.6) continue;
    const x = cX[i] + (rnd() - .5) * CS, z = cZ[i] + (rnd() - .5) * CS;
    if (trees.some(t => Math.hypot(t.x - x, t.z - z) < 1.1)) continue;
    addTree(x, z, .75 + rnd() * .35, 0);
  }
  for (let k = 0; k < 9; k++) {
    for (let a = 0; a < 50; a++) {
      const i = INS[(rnd() * INS.length) | 0];
      if (W[i] > 0 || Gr[i] < .4 || Math.hypot(cX[i], cZ[i]) > 8.3) continue;
      addPuff(cX[i], cZ[i], .9 + rnd() * .2); break;
    }
  }
  addCloud(-2 + rnd() * 4, -2 + rnd() * 4, .55, 0, 9999);
  dayT = .07;
  updateSurface(0); writeTextures();
}

function copyOutside() {
  for (const i of outsideList) { const j = nearestIn[i]; for (const f of FIELDS) f[i] = f[j]; }
}

// ═════════════════════════════ Chains & discoveries ═════════════════════════════
const STEP = {
  crack: ['🌋', 'crack'], rain: ['🌧️', 'rain'], lava: ['🔥', 'lava'], fire: ['🔥', 'wildfire'], ash: ['🌫️', 'ash'],
  steam: ['💨', 'steam'], cloud: ['☁️', 'cloud'], soak: ['💧', 'soaks in'], douse: ['💦', 'fire doused'],
  rock: ['🪨', 'new rock'], obsidian: ['🔮', 'obsidian'], soil: ['🟫', 'new soil'], grass: ['🌱', 'grass returns'],
  fireweed: ['🌸', 'fireweed'], flee: ['🐇', 'puffs flee'], baby: ['🐣', 'baby puff'], geyser: ['⛲', 'geyser'],
  hotspring: ['♨️', 'hot spring'], tree: ['🌳', 'sapling'],
};
const DISC = [
  { id: 'steam', icon: '💨', name: 'Steam', hint: 'what happens when fire meets water?', desc: 'Lava boiled the water into steam.' },
  { id: 'obsidian', icon: '🔮', name: 'Obsidian', hint: 'cool lava in a hurry', desc: 'Lava quenched by water froze into glassy black rock.' },
  { id: 'wildfire', icon: '🔥', name: 'Wildfire', hint: 'lava near dry grass', desc: 'Heat set the dry meadow alight and it spread.' },
  { id: 'douse', icon: '💦', name: 'Doused', hint: 'the sky can put out fires', desc: 'Rain reached a fire and put it out.' },
  { id: 'storm', icon: '⛈️', name: 'Volcano weather', hint: 'can a volcano make its own rain?', desc: 'Steam from lava rose, made a cloud and rained back down.' },
  { id: 'fireweed', icon: '🌸', name: 'Fireweed', hint: 'after the fire, something pink', desc: 'A pioneer flower bloomed on ash left by your crack.' },
  { id: 'geyser', icon: '⛲', name: 'Geyser', hint: 'rain soaking into warm ground', desc: 'Water seeped down to leftover heat and burst back up.' },
  { id: 'cycle', icon: '🐣', name: 'Full circle', rare: true, hint: 'follow one crack all the way back to new life', desc: 'One crack led, link by link, to a newborn puff.' },
];
const chains = new Map();
let chainSeq = 0, focusCh = 0, chainT = 0;
let found = {};
try { found = JSON.parse(localStorage.getItem('bubbleworld.found') || '{}') || {}; } catch (e) { found = {}; }

function newChain(kind, i) { const id = ++chainSeq; chains.set(id, { id, steps: [], set: new Set(), burned: 0 }); link(id, kind, i); return id; }
function link(id, k, i = -1) {
  if (!id) return;
  const c = chains.get(id);
  if (!c || c.set.has(k)) return;
  c.set.add(k); c.steps.push(k);
  focusCh = id; chainT = performance.now();
  renderChain(true);
  sfx('link', c.steps.length);
  if (i >= 0) label(STEP[k][0], STEP[k][1], cX[i], H[i] + L[i] + W[i] + .7, cZ[i]);
  const has = s => c.set.has(s);
  if (k === 'steam' && has('lava')) discover('steam');
  if (k === 'obsidian') discover('obsidian');
  if (k === 'douse') discover('douse');
  if (k === 'rain' && has('steam') && has('cloud')) discover('storm');
  if (k === 'fireweed' && has('crack')) discover('fireweed');
  if (k === 'geyser') discover('geyser');
  if (k === 'baby' && has('crack') && c.steps.length >= 8) discover('cycle');
  if (c.steps.length >= 5) tip(3);
}
const chainEl = document.getElementById('chain'), stepsEl = document.getElementById('steps'), chainN = document.getElementById('chainN');
function renderChain(fresh) {
  const c = chains.get(focusCh); if (!c) return;
  const st = c.steps, from = Math.max(0, st.length - 9);
  stepsEl.innerHTML = (from ? '<span class="ar">…</span>' : '') + st.slice(from).map((k, n) =>
    `<span class="p${fresh && from + n === st.length - 1 ? ' new' : ''}">${STEP[k][0]} ${STEP[k][1]}</span>`).join('<span class="ar">→</span>');
  chainN.textContent = st.length;
  if (fresh) { chainN.classList.remove('pop'); void chainN.offsetWidth; chainN.classList.add('pop'); }
  chainEl.classList.remove('hide', 'idle'); document.body.classList.add('chained');
}
const toastQ = []; let toastBusy = false;
function discover(id) {
  if (found[id]) return;
  found[id] = Date.now();

const labelsEl = document.getElementById('labels'), labs = [], v3 = new THREE.Vector3();
const labCool = {};
const labQ = []; let labLast = 0;
function label(icon, text, x, y, z) {
  const now = performance.now();
  if (labCool[text] && now - labCool[text] < 1500) return;
  labCool[text] = now;
  if (labQ.length < 6) labQ.push([icon, text, x, y, z]);
}
function showLabel(icon, text, x, y, z) {
  if (labs.length > 5) { const o = labs.shift(); o.el.remove(); }
  const el = document.createElement('div'); el.className = 'lab';
  el.innerHTML = `<i>${icon}</i>${text}`; labelsEl.appendChild(el);
  labs.push({ el, x, y, z, t: 0 });
}
function updateLabels(dt) {
  const w = innerWidth, h = innerHeight, now = performance.now();
  if (labQ.length && now - labLast > 520) { labLast = now; showLabel(...labQ.shift()); }
  for (let k = labs.length - 1; k >= 0; k--) {
    const l = labs[k]; l.t += dt;
    if (l.t > 2.6) { l.el.remove(); labs.splice(k, 1); continue; }
    v3.set(l.x, l.y + l.t * 1.1, l.z).applyMatrix4(world.matrixWorld).project(camera);
    const sx = (v3.x * .5 + .5) * w, sy = (-v3.y * .5 + .5) * h;
    const pop = l.t < .25 ? easeBack(l.t / .25) : 1;
    l.el.style.opacity = l.t > 2 ? (2.6 - l.t) / .6 : 1;
    l.el.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%) scale(${pop})`;
  }
}

// ═════════════════════════════ Sound ═════════════════════════════
let AC = null, master = null, soundOn = true, noiseBuf = null;
function ensureAudio() {
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, f2, when = 0) {
  const t0 = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .012); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .03);
}
function noise(dur, vol, freq, q, type = 'bandpass', f2) {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = rnd() * 2 - 1; }
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t0 = AC.currentTime;
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t0); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t0 + dur); f.Q.value = q;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  s.connect(f).connect(g).connect(master); s.start(t0, rnd() * .5); s.stop(t0 + dur + .03);
}
const SCALE = [392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093];
const sfxLast = {}, GAP = { hiss: 260, blorp: 140, douse: 300, poof: 120, munch: 200, bloom: 200, baby: 200, link: 90, rain: 600, geyser: 400 };
function sfx(k, arg) {
  if (!AC || !soundOn || AC.state !== 'running') return;
  const now = performance.now();
  if (sfxLast[k] && now - sfxLast[k] < (GAP[k] || 0)) return;
  sfxLast[k] = now;
  switch (k) {
    case 'crack': noise(1.1, .5, 900, .7, 'lowpass', 60); tone(110, .7, 'sine', .35, 38); tone(70, 1, 'triangle', .2, 30, .05); break;
    case 'blorp': tone(90 + rnd() * 60, .16, 'sine', .08, 50); break;
    case 'hiss': noise(.5, .06, 5000, .8, 'highpass'); break;
    case 'douse': noise(.4, .09, 3500, .6, 'highpass'); tone(700, .12, 'sine', .04, 300); break;
    case 'rain': noise(1.4, .08, 1800, .5); break;
    case 'link': { const f = SCALE[Math.min(SCALE.length - 1, (arg || 1) - 1)]; tone(f, .22, 'triangle', .09); tone(f * 2, .15, 'sine', .03, null, .03); break; }
    case 'disc': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .35, 'triangle', .08, null, i * .08)); break;
    case 'poof': tone(520, .14, 'sine', .07, 260); noise(.15, .05, 1200, 1); break;
    case 'baby': tone(880, .08, 'sine', .07, 1320); tone(1320, .1, 'sine', .05, 1760, .08); break;
    case 'munch': tone(300, .05, 'square', .02, 200); break;
    case 'bloom': tone(990, .12, 'triangle', .05, 1480); break;
    case 'geyser': noise(1.2, .18, 600, .7, 'bandpass', 3000); tone(150, .5, 'sine', .1, 300); break;
    case 'rainTool': tone(620, .1, 'sine', .08, 880); tone(880, .12, 'sine', .06, 1100, .06); break;
    case 'tool': tone(700, .05, 'sine', .05, 900); break;
  }
}

// ═════════════════════════════ HUD & input ═════════════════════════════
const hintEl = document.getElementById('hint');
const TIPS = [
  'Tap the ground near the pond to crack it open 🌋',
  'Watch the lava find the water… drag to orbit, scroll to zoom',
  'Steam rises into a cloud — it will come back as rain',
  'Leave it running — it heals in its own way. Keep poking!',
];
let tipLevel = 0;
function tip(n) {
  if (n <= tipLevel) return;
  tipLevel = n; hintEl.style.opacity = 0;
  setTimeout(() => { hintEl.textContent = TIPS[n]; hintEl.classList.remove('pulse'); hintEl.style.opacity = 1; }, 380);
  if (n === 3) setTimeout(() => { if (tipLevel === 3) hintEl.style.opacity = 0; }, 9000);
}
let tool = 'crack';
function setTool(t) {
  tool = t; ensureAudio(); sfx('tool');
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('sel', b.dataset.tool === t));
  ring.material.color.set(t === 'rain' ? 0x58b4f0 : 0xff7a3d);
  if (t === 'rain' && tipLevel === 0) { hintEl.textContent = 'Tap anywhere to send a rain cloud 🌧️'; }
  if (t === 'crack' && tipLevel === 0) hintEl.textContent = TIPS[0];
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
addEventListener('keydown', e => { if (e.key === '1') setTool('rain'); if (e.key === '2') setTool('crack'); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), inv = new THREE.Matrix4();
let hover = null, ptrX = 0, ptrY = 0, ptrIn = false, down = null, lastInteract = performance.now();
function pick(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(terrain, false)[0];
  if (!hit) return null;
  const p = world.worldToLocal(hit.point.clone());
  return p;
}
function pickCloud(cx, cy) {
  ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  inv.copy(world.matrixWorld).invert();
  const o = ray.ray.origin.clone().applyMatrix4(inv), d = ray.ray.direction.clone().transformDirection(inv);
  let best = null, bt = 1e9;
  for (const c of clouds) {
    const cv = new THREE.Vector3(c.x, c.y, c.z).sub(o), t = cv.dot(d);
    if (t < 0) continue;
    if (cv.lengthSq() - t * t < 1.6 * 1.6 && t < bt) { bt = t; best = c; }
  }
  return best;
}
const cvs = renderer.domElement;
cvs.addEventListener('pointerdown', e => { ensureAudio(); down = { x: e.clientX, y: e.clientY, t: performance.now() }; lastInteract = performance.now(); controls.autoRotate = false; });
cvs.addEventListener('pointermove', e => { ptrX = e.clientX; ptrY = e.clientY; ptrIn = true; });
cvs.addEventListener('pointerleave', () => { ptrIn = false; });
cvs.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null; lastInteract = performance.now();
  if (moved > 7 || dt > 600) return;
  if (tool === 'rain') {
    const c = pickCloud(e.clientX, e.clientY);
    if (c) { c.water = Math.min(1.8, c.water + .6); c.wait = 0; if (!c.ch) c.ch = newChain('rain'); sfx('rainTool'); label('🌧️', 'heavier!', c.x, c.y + 1, c.z); return; }
  }
  const p = pick(e.clientX, e.clientY);
  if (!p) return;
  if (tool === 'crack') crack(p.x, p.z);
  else {
    let x = p.x, z = p.z; const r = Math.hypot(x, z); if (r > 6.2) { x *= 6.2 / r; z *= 6.2 / r; }
    const ch = newChain('rain', -1);
    const c = addCloud(x, z, 1, ch, 25); c.y = 4.3;
    sfx('rainTool'); wobV += .006;
    label('☁️', 'rain cloud', x, c.y + 1, z);
  }
});
cvs.addEventListener('wheel', () => { lastInteract = performance.now(); controls.autoRotate = false; }, { passive: true });

const discEl = document.getElementById('disc');
if (innerWidth < 1100) discEl.classList.add('closed');
document.getElementById('discHead').onclick = () => discEl.classList.toggle('closed');
document.getElementById('bSound').onclick = e => { ensureAudio(); soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔈'; };
document.getElementById('bSpeed').onclick = e => { speed = speed === 1 ? 3 : speed === 3 ? 6 : 1; e.currentTarget.textContent = speed + '×'; };
document.getElementById('bNew').onclick = () => { gen(); wobV += .03; chainEl.classList.add('hide'); document.body.classList.remove('chained'); focusCh = 0; };

const statusEl = document.getElementById('status');
function updStatus() {
  const ph = daylight < .15 ? 'night' : dayT < .13 ? 'morning' : dayT > .4 && dayT < .5 ? 'evening' : 'day';
  const raining = drops.n > 20 ? ' · raining' : vents.length ? ' · erupting' : '';
  const blooms = weeds.filter(w => w.bloom).length;
  statusEl.textContent = `Day ${day} · ${ph}${raining} · 🐇 ${puffs.length} · 🌳 ${trees.filter(t => !t.burnt).length}${blooms ? ' · 🌸 ' + blooms : ''}`;
}

// ═════════════════════════════ Loop ═════════════════════════════
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = 36; camera.updateProjectionMatrix();
  const vf = camera.fov * Math.PI / 360, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const fit = (camera.aspect < 1 ? 11.2 : 12.6) / Math.sin(Math.min(vf, hf));
  controls.maxDistance = Math.max(60, fit * 1.6);
  const off = camera.position.clone().sub(controls.target); off.setLength(fit); camera.position.copy(controls.target).add(off);
  pxScale = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
}
addEventListener('resize', resize); resize();

let last = performance.now(), acc = 0, frameN = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last) / 1000); last = now; frameN++;
  acc += dt * 60 * speed;
  const maxSteps = speed * 2 + 2; let n = 0;
  while (acc >= 1 && n < maxSteps) { tick60(); acc -= 1; n++; }
  if (acc > maxSteps) acc = 0;
  const time = now / 1000;
  uni.uTime.value = time;
  if (dirty) { updateSurface(time); writeTextures(); dirty = false; }
  updateInstances(time);
  updateSky();
  // jelly wobble + shake
  const s = shake * .12;
  world.position.set((rnd() - .5) * s, (rnd() - .5) * s, (rnd() - .5) * s);
  world.scale.set(1 + wob, 1 - wob, 1 + wob);
  // cursor ring
  if (ptrIn && !down && frameN % 2 === 0) hover = pick(ptrX, ptrY);
  if (!ptrIn) hover = null;
  if (hover) { ring.visible = true; ring.position.set(hover.x, hover.y + .06, hover.z); ring.scale.setScalar(1 + Math.sin(time * 6) * .08); }
  else ring.visible = false;
  if (performance.now() - lastInteract > 25000) controls.autoRotate = true;
  controls.update();
  renderer.render(scene, camera);
  updateLabels(dt);
  if (focusCh && performance.now() - chainT > 14000) chainEl.classList.add('idle');
  if (frameN % 30 === 0) updStatus();
}

gen(); renderDisc(); updStatus();
window.__bw = { H, W, L, T, M, Gr, Ht, Fi, Fe, Rk, DH, Ob, crack, puffs, trees, weeds, clouds, chains, vents, cellAt, cX, cZ, get pond() { return pond; },
  tick: n => { for (let k = 0; k < n; k++) tick60(); }, updateSurface, found, renderer, camera, controls, get dayT() { return dayT; }, set dayT(v) { dayT = v; } };
requestAnimationFrame(loop);
</script>
