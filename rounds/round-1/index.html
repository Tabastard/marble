<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sphere World</title>
<style>
  :root {
    --bg1: #f5eddf; --bg2: #e6d6bd; --ink: #3a3026; --muted: #8b7a64;
    --card: rgba(255, 251, 243, .86); --line: rgba(80, 60, 40, .12); --accent: #e8743b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1: #1d1b22; --bg2: #121117; --ink: #efe6d8; --muted: #a39886;
      --card: rgba(36, 33, 42, .86); --line: rgba(255, 240, 220, .1); --accent: #ff9a62;
    }
  }
  :root[data-theme="dark"] {
    --bg1: #1d1b22; --bg2: #121117; --ink: #efe6d8; --muted: #a39886;
    --card: rgba(36, 33, 42, .86); --line: rgba(255, 240, 220, .1); --accent: #ff9a62;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--bg1); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; cursor: pointer; }
  .hud { position: fixed; z-index: 2; }
  #title { top: 16px; left: 16px; line-height: 1.15; pointer-events: none; }
  #title b { font-size: 20px; letter-spacing: .2px; }
  #status { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
  #controls { top: 14px; right: 16px; display: flex; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; height: 36px; min-width: 36px; padding: 0 12px; font-size: 14px; font-weight: 650;
    cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform .12s cubic-bezier(.3,1.6,.5,1);
  }
  button:active { transform: scale(.9); }
  #disc { left: 16px; top: 76px; width: 228px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overflow: hidden; }
  #discHead { width: 100%; border: 0; border-radius: 0; background: transparent; display: flex; justify-content: space-between;
    align-items: center; height: 40px; padding: 0 14px; backdrop-filter: none; }
  #discHead:active { transform: none; }
  #discCount { color: var(--muted); font-variant-numeric: tabular-nums; }
  #discList { list-style: none; margin: 0; padding: 0 8px 8px; max-height: calc(100vh - 190px); overflow-y: auto; }
  #disc.closed #discList { display: none; }
  #discList li { display: flex; gap: 9px; align-items: center; padding: 5px 6px; border-radius: 10px; }
  #discList li .ic { width: 24px; text-align: center; font-size: 17px; }
  #discList li.no .ic { filter: grayscale(1); opacity: .28; }
  #discList li .nm { font-size: 13.5px; font-weight: 650; }
  #discList li .hn { font-size: 11.5px; color: var(--muted); }
  #discList li.no .nm { color: var(--muted); }
  #discList li.fresh { animation: fresh 1.6s ease-out; }
  @keyframes fresh { 0% { background: rgba(255, 200, 80, .55); } 100% { background: transparent; } }
  #toast { left: 50%; top: 16px; transform: translate(-50%, -140%); background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; padding: 12px 18px 12px 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(60, 40, 20, .18);
    transition: transform .45s cubic-bezier(.3,1.5,.5,1); pointer-events: none; }
  #toast.show { transform: translate(-50%, 0); }
  #toast .big { font-size: 34px; }
  #toast .k { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); font-weight: 800; }
  #toast .n { font-size: 17px; font-weight: 800; }
  #toast .ch { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  #toast .ch span.p { background: var(--line); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
  #hint { left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 14px; font-weight: 650;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; white-space: nowrap;
    pointer-events: none; transition: opacity .4s; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hint.pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }
  @media (max-width: 640px) {
    #disc { top: auto; bottom: 62px; width: auto; right: 16px; }
    #discList { max-height: 40vh; }
    #title { max-width: calc(100vw - 172px); }
    #title b { font-size: 17px; }
    #status { font-size: 11.5px; }
    #hint { font-size: 12.5px; white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
    #bNew .lbl { display: none; }
  }
  @media (min-width: 641px) { #bNew .ic { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="title"><b>Sphere World</b><span id="status">Day 1</span></div>
<div class="hud" id="controls">
  <button id="bSound" title="Sound on/off">🔊</button>
  <button id="bSpeed" title="Simulation speed">1×</button>
  <button id="bNew" title="Grow a new world"><span class="lbl">New world</span><span class="ic">↻</span></button>
</div>
<div class="hud" id="disc"><button id="discHead"><span>Discoveries</span><span id="discCount">0/14</span></button><ul id="discList"></ul></div>
<div class="hud" id="toast"></div>
<div class="hud pulse" id="hint">Tap the sky ☁️ to make it rain</div>

<script>
'use strict';
(() => {
// ───────────────────────────── Grid ─────────────────────────────
const N = 200, C = 100, R = 96, TAU = Math.PI * 2;
const E = 0, GLASS = 1, STONE = 2, SOIL = 3, SAND = 4, WATER = 5, SEED = 6, LITTER = 7, RICH = 8, GRAVEL = 9, AQUI = 10;
const SOILY = new Uint8Array(16); [SOIL, SAND, SEED, LITTER, RICH, GRAVEL].forEach(k => SOILY[k] = 1);
const AQCAP = 40, DAY = 9000;
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;

const t = new Uint8Array(N * N), m = new Uint8Array(N * N), v = new Uint8Array(N * N),
      a = new Uint8Array(N * N), st = new Uint8Array(N * N), ins = new Uint8Array(N * N);
const rowMin = new Int16Array(N).fill(N), rowMax = new Int16Array(N).fill(-1);
const colTop = new Int16Array(N).fill(N), colBot = new Int16Array(N).fill(-1);
const ground0 = new Int16Array(N), surfY = new Int16Array(N);
for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
  const dx = x + .5 - C, dy = y + .5 - C;
  if (dx * dx + dy * dy < R * R) {
    ins[y * N + x] = 1;
    if (x < rowMin[y]) rowMin[y] = x; if (x > rowMax[y]) rowMax[y] = x;
    if (y < colTop[x]) colTop[x] = y; if (y > colBot[x]) colBot[x] = y;
  }
}
let Y0 = N, Y1 = 0;
for (let y = 0; y < N; y++) if (rowMax[y] >= rowMin[y]) { Y0 = Math.min(Y0, y); Y1 = Math.max(Y1, y); }
const insideF = (x, y) => (x - C) * (x - C) + (y - C) * (y - C) < (R - .5) * (R - .5);

// ───────────────────────────── State ─────────────────────────────
let frame = 0, stamp = 1, dayT = .1, daylight = 1, sunAlt = 0, vapor = 0, sinceRain = 0, raining = false;
let rainbowA = 0, surfaceWater = 0, wind = .3, day = 1, speed = 1;
const plants = [], bees = [], worms = [], shrooms = [], flies = [], clouds = [], bits = [], fx = [];
const stars = Array.from({ length: 70 }, () => {
  const ang = rnd() * TAU, r = Math.sqrt(rnd()) * R * .92;
  return { x: C + Math.cos(ang) * r, y: C - Math.abs(Math.sin(ang)) * r - 4, p: rnd() * TAU, s: .5 + rnd() * .8 };
});

const KINDS = [
  { name: 'daisy', petal: [255, 255, 255], center: '#f6c445', stem: [90, 165, 72], h: [11, 16], n: 9, size: 1.9, shape: 'daisy' },
  { name: 'poppy', petal: [239, 75, 63], center: '#2b2230', stem: [96, 160, 70], h: [9, 14], n: 5, size: 1.9, shape: 'cup' },
  { name: 'bell', petal: [127, 124, 240], center: '#d9d6ff', stem: [80, 150, 92], h: [10, 15], n: 3, size: 1.7, shape: 'bell' },
  { name: 'sunflower', petal: [255, 196, 26], center: '#6b3d1f', stem: [92, 150, 58], h: [24, 31], n: 15, size: 3.4, shape: 'daisy', big: true },
];

// ───────────────────────────── World generation ─────────────────────────────
function gen() {
  t.fill(0); m.fill(0); a.fill(0); st.fill(0);
  for (const arr of [plants, bees, worms, shrooms, flies, clouds, bits, fx]) arr.length = 0;
  const p1 = rnd() * TAU, p2 = rnd() * TAU, p3 = rnd() * TAU;
  for (let x = 0; x < N; x++)
    ground0[x] = Math.round(100 + 5 * Math.sin(x * .032 + p1) + 2.2 * Math.sin(x * .09 + p2) + .8 * Math.sin(x * .23 + p3));
  const aqX = 70 + rnd() * 60, aqW = 15 + rnd() * 7;
  const sandX = aqX > 100 ? 48 + rnd() * 20 : 132 + rnd() * 20;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x; v[i] = rnd() * 256 | 0;
    if (!ins[i]) { t[i] = GLASS; continue; }
    const s = ground0[x], d = y - s, soilD = 20 + Math.round(2 * Math.sin(x * .15 + p3));
    if (d < 0) t[i] = E;
    else if (d < soilD) {
      t[i] = SOIL; m[i] = Math.min(150, 42 + d * 7);
      const sx = (x - sandX) / 13, sy = (d - 9) / 3.2;
      if (sx * sx + sy * sy < 1) { t[i] = SAND; m[i] = Math.min(m[i], 80); }
    } else if (d < soilD + 3) { t[i] = GRAVEL; m[i] = 110; }
    else {
      t[i] = STONE;
      const ex = (x - aqX) / aqW, ey = (d - (soilD + 9)) / 3.4;
      if (ex * ex + ey * ey < 1) { t[i] = AQUI; a[i] = AQCAP; }
    }
  }
  for (let k = 0; k < 22; k++) {
    const x = 14 + rnd() * 172 | 0, y = ground0[x] + 1 + (rnd() * 3 | 0), i = y * N + x;
    if (t[i] === SOIL) { t[i] = SEED; a[i] = rnd() * 3 | 0; }
  }
  computeSurf();
  for (let k = 0; k < 3; k++) {
    const x = 35 + rnd() * 130 | 0;
    if (!plants.some(p => Math.abs(p.x - x) < 8)) {
      const p = addPlant(x, surfY[x], rnd() * 3 | 0, false, 1);
      p.bloom = 1; p.bloomed = true; p.water = .5; p.age = rnd() * 1500 | 0;
    }
  }
  dayT = .15; vapor = 30; sinceRain = 0; rainbowA = 0; day = 1;
}

function computeSurf() {
  for (let x = 0; x < N; x++) {
    let y = colTop[x];
    if (y > colBot[x]) { surfY[x] = C; continue; }
    while (y < colBot[x] && t[y * N + x] === E) y++;
    surfY[x] = y;
  }
}

// ───────────────────────────── Cell simulation ─────────────────────────────
function swap(i, j) {
  let q = t[i]; t[i] = t[j]; t[j] = q;
  q = m[i]; m[i] = m[j]; m[j] = q;
  q = v[i]; v[i] = v[j]; v[j] = q;
  q = a[i]; a[i] = a[j]; a[j] = q;
  st[i] = st[j] = stamp;
}

function moist(i, cap, sh) {
  // absorb neighbouring water
  if (m[i] < cap) {
    const nb = t[i - N] === WATER ? i - N : t[i - 1] === WATER ? i - 1 : t[i + 1] === WATER ? i + 1 : -1;
    if (nb >= 0 && rnd() < .3) {
      t[nb] = E; m[nb] = 0; m[i] = Math.min(255, m[i] + 50);
      if (rnd() < .02) event('soak', i % N, (i / N | 0));
    }
  }
  // diffuse, biased downward (gravity) — gives a visible soak front
  const r = rnd();
  const j = r < .5 ? i + N : r < .7 ? i - 1 : r < .9 ? i + 1 : i - N;
  const tj = t[j];
  if (SOILY[tj]) {
    const bias = j === i + N ? 5 : j === i - N ? -3 : 0;   // gentle gravity down, capillary rise up
    const d = m[i] - m[j] + bias;
    if (d > 3) {
      let q = d >> sh; if (q < 1) q = 1;
      if (q > m[i]) q = m[i];
      if (m[j] + q > 255) q = 255 - m[j];
      m[i] -= q; m[j] += q;
    }
  } else if (tj === E && j !== i - N && m[i] > 232 && rnd() < .03) {
    // saturated soil seeps into open space
    t[j] = WATER; m[j] = 0; st[j] = stamp; m[i] -= 50;
  }
  // sun dries the topsoil
  if (daylight > .2 && t[i - N] === E && m[i] > 8 && rnd() < .004 * daylight) { m[i] -= 2; vapor += .04; }
}

function simCells() {
  stamp = stamp >= 255 ? 1 : stamp + 1;
  surfaceWater = 0;
  for (let y = Y1; y >= Y0; y--) {
    const x0 = rowMin[y], x1 = rowMax[y];
    const ltr = ((y + frame) & 1) === 0;
    for (let k = 0; k <= x1 - x0; k++) {
      const x = ltr ? x0 + k : x1 - k;
      const i = y * N + x;
      const tp = t[i];
      if (tp <= GLASS || tp === STONE || st[i] === stamp) continue;
      const b = i + N;
      switch (tp) {
        case WATER: {
          const tb = t[b];
          if (tb === E || tb === SEED || tb === LITTER) { swap(i, b); break; }
          const dir = rnd() < .5 ? -1 : 1;
          if (t[b + dir] === E) { swap(i, b + dir); break; }
          if (t[b - dir] === E) { swap(i, b - dir); break; }
          let j = i;
          for (let s = 0; s < 3; s++) { const n = j + dir; if (t[n] !== E) break; j = n; if (t[n + N] === E) break; }
          if (j !== i) { swap(i, j); break; }
          if (t[i - N] === E) {
            surfaceWater++;
            if (daylight > .2 && rnd() < .0009 * daylight) { t[i] = E; vapor += 1; }
          }
          break;
        }
        case SAND: case GRAVEL: {
          const tb = t[b];
          if (tb === E || tb === WATER) { swap(i, b); break; }
          const dir = rnd() < .5 ? -1 : 1;
          const t1 = t[b + dir], t2 = t[b - dir];
          if ((t1 === E || t1 === WATER) && t[i + dir] !== STONE) { swap(i, b + dir); break; }
          if ((t2 === E || t2 === WATER) && t[i - dir] !== STONE) { swap(i, b - dir); break; }
          moist(i, tp === SAND ? 170 : 140, 1);
          break;
        }
        case SOIL: case RICH: {
          const tb = t[b];
          if (tb === E || tb === WATER) { swap(i, b); break; }
          if (rnd() < .1) {
            const dir = rnd() < .5 ? -1 : 1;
            if (t[b + dir] === E && t[i + dir] === E) { swap(i, b + dir); break; }
          }
          moist(i, tp === RICH ? 245 : 232, 3);
          if (tp === RICH && rnd() < .00003) t[i] = SOIL;   // richness slowly fades back
          break;
        }
        case SEED: case LITTER: {
          const tb = t[b];
          if (tb === E) { swap(i, b); break; }
          if (tb === WATER) {               // floats and drifts
            if (rnd() < .05) { const d = rnd() < .5 ? -1 : 1; if (t[i + d] === E && t[b + d] === WATER) swap(i, i + d); }
            break;
          }
          const dir = rnd() < .5 ? -1 : 1;
          if (t[b + dir] === E && t[i + dir] === E) { swap(i, b + dir); break; }
          moist(i, 210, 3);
          if (tp === SEED) {
            if ((i + frame) % 16 === 0) tryGerminate(i, x, y);
            if (t[i - N] !== E && rnd() < .00006) t[i] = RICH;   // buried seeds eventually rot into humus
          }
          else if (m[i] > 70 && SOILY[tb] && rnd() < .00025) { t[i] = RICH; event('humus', x, y); }
          break;
        }
        case AQUI: {
          if (a[i] > 0) {
            const up = i - N;
            if (t[up] === E) {
              a[i]--;
              // under pressure: most of it jets up out of the hole
              if (rnd() < .7) spawnBit(x + .5, y - .5, WATER, (rnd() - .5) * .5, -2.4 - rnd() * 1.4, 0, 0, false);
              else { t[up] = WATER; m[up] = 0; st[up] = stamp; }
              event('spring', x, y);
            } else {
              const d = rnd() < .5 ? -1 : 1;
              if (t[i + d] === E && rnd() < .3) { t[i + d] = WATER; st[i + d] = stamp; a[i]--; event('spring', x, y); }
            }
          } else if (rnd() < .0006) a[i]++;   // slowly recharges from deep ground
          break;
        }
      }
    }
  }
}

function tryGerminate(i, x, y) {
  if (m[i] < 82 || daylight < .1) return;
  let k = 1;
  while (k <= 6 && SOILY[t[(y - k) * N + x]]) k++;
  if (k > 6 || t[(y - k) * N + x] !== E) return;
  const baseY = y - k + 1;
  for (const p of plants) if (Math.abs(p.x - x) < 3) return;
  for (const s of shrooms) if (s.x === x) return;
  if (rnd() > .25) return;
  let kind = a[i] & 3;
  const parent = (a[i] & 4) !== 0;
  let rich = 0;
  for (const j of [i, i + N, i - 1, i + 1, i - N]) if (t[j] === RICH) rich++;
  const sun = rich >= 3 && rnd() < .5;
  if (sun) kind = 3;
  t[i] = SOIL;
  if (!plants.some(p => Math.abs(p.x - x) < 3)) {
    const p = addPlant(x, baseY, kind, parent, 0);
    p.popv = .5;
    event('sprout', x, baseY - 1);
    if (parent) event('gen2', x, baseY);
  }
}

// ───────────────────────────── Particles (flung bits that become cells) ─────────────────────────────
function spawnBit(x, y, tp, vx, vy, mm = 0, aa = 0, rain = false) {
  if (bits.length > 2600) return;
  bits.push({ x, y, vx, vy, tp, m: mm, a: aa, rain });
}
function updBits() {
  for (let k = bits.length - 1; k >= 0; k--) {
    const p = bits[k];
    p.vy = Math.min(3, p.vy + .11); p.vx *= .995;
    const steps = Math.ceil(Math.max(Math.abs(p.vx), Math.abs(p.vy)) * 1.5) || 1;
    const sx = p.vx / steps, sy = p.vy / steps;
    let landed = false, lastI = -1;
    const i0 = (p.y | 0) * N + (p.x | 0);
    if (i0 >= 0 && i0 < N * N && ins[i0] && t[i0] === E) lastI = i0;
    for (let s = 0; s < steps; s++) {
      const nx = p.x + sx, ny = p.y + sy;
      if (!insideF(nx, ny)) {
        const dx = nx - C, dy = ny - C, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
        const dot = p.vx * ux + p.vy * uy;
        if (dot > 0) { p.vx -= 1.5 * dot * ux; p.vy -= 1.5 * dot * uy; }
        break;
      }
      const ci = (ny | 0) * N + (nx | 0);
      if (t[ci] !== E) { landed = true; break; }
      p.x = nx; p.y = ny; lastI = ci;
    }
    if (landed) {
      if (lastI >= 0 && t[lastI] === E) {
        t[lastI] = p.tp; m[lastI] = p.m; a[lastI] = p.a; v[lastI] = rnd() * 256 | 0; st[lastI] = stamp;
        if (p.rain) sfx('drop');
      }
      bits[k] = bits[bits.length - 1]; bits.pop();
    }
  }
}

// ───────────────────────────── Weather ─────────────────────────────
function chordHalf(y) { const d = y - C; return Math.sqrt(Math.max(0, R * R - d * d)); }
function addCloud(x, y, rain) {
  const w = 20 + rnd() * 10, puffs = [], n = 6 + (rnd() * 3 | 0);
  for (let k = 0; k < n; k++) {
    const f = k / (n - 1) - .5, mid = 1 - Math.abs(f) * 2;
    puffs.push({ dx: f * w * .85 + (rnd() - .5) * 2, dy: (rnd() - .5) * 2 - mid * 2.5, r: 3.6 + rnd() * 2 + mid * 3 });
  }
  const c = { x, y, w, rain, vx: (rnd() - .5) * .05, puffs, sc: .2, scv: .15, alpha: 0 };
  clouds.push(c);
  return c;
}
function updClouds() {
  raining = false;
  for (let k = clouds.length - 1; k >= 0; k--) {
    const c = clouds[k];
    c.scv += (1 - c.sc) * .2; c.scv *= .78; c.sc += c.scv;
    c.x += c.vx + (wind - .3) * .03;
    const lim = chordHalf(c.y) - c.w * .5 - 3;
    if (c.x < C - lim) { c.x = C - lim; c.vx = Math.abs(c.vx); }
    if (c.x > C + lim) { c.x = C + lim; c.vx = -Math.abs(c.vx); }
    if (c.rain > 0) {
      raining = true; sinceRain = 0;
      c.alpha = Math.min(1, c.alpha + .05);

// ───────────────────────────── Plants ─────────────────────────────

}

// ───────────────────────────── Creatures ─────────────────────────────
function spawnBee() {

let wob = 0, wobv = 0;
function dig(cx, cy, rad, loud) {

  for (let x = Math.round(cx - rad - 3); x <= cx + rad + 3; x++) if (x >= 0 && x < N) rimY = Math.min(rimY, surfY[x]);
  rimY = Math.min(rimY, cy) - 2;
  for (let dy = -Math.ceil(rad); dy <= rad; dy++) for (let dx = -Math.ceil(rad); dx <= rad; dx++) {
    if (dx * dx + dy * dy > r2) continue;
    const x = Math.round(cx + dx), y = Math.round(cy + dy);
    if (x < 0 || y < 0 || x >= N || y >= N) continue;
    const i = y * N + x, tp = t[i];
    if (!ins[i]) continue;
    if (SOILY[tp] || tp === WATER || (tp === STONE && rnd() < .55)) {
      const pt = tp === STONE ? GRAVEL : tp;
      const mm = m[i], aa = a[i];

      spawnBit(cx + .5 + dx * .4, rimY - rnd() * 2, pt, side * (.55 + rnd() * .9), -.7 - rnd() * .9, mm, aa);
    }

    if (Math.abs(p.x - cx) <= rad + .5 && p.y >= cy - rad - 1 && p.y <= cy + rad + 1) killPlant(k, true, 1.2);
  }
  for (let k = shrooms.length - 1; k >= 0; k--) {
    const s = shrooms[k];
    if (Math.abs(s.x - cx) <= rad && Math.abs(s.y - cy) <= rad + 1) shrooms.splice(k, 1);
  }
  for (const w of worms) if (w.seg.some(s => Math.hypot(s[0] - cx, s[1] - cy) < rad)) w.dead = true;
  if (removed) {
    fx.push({ k: 'ring', x: cx, y: cy, life: 22, max: 22, r: rad });
    wobv += loud ? .012 : .005;
    sfx('dig');
  }
}

    const g = ctx.createRadialGradient(x, y, 0, x, y, cs * 3);
    g.addColorStop(0, `rgba(230,255,120,${k * .9})`); g.addColorStop(1, 'rgba(230,255,120,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, cs * 3, 0, TAU); ctx.fill();
  }
}
function drawBits() {
  for (const p of bits) {
    const x = SX(p.x), y = SY(p.y);
    if (p.tp === WATER) {
      ctx.strokeStyle = p.rain ? 'rgba(170,215,255,.75)' : 'rgba(150,215,255,.9)';
      ctx.lineWidth = cs * (p.rain ? .32 : .6);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * cs * 1.4, y - p.vy * cs * 1.4); ctx.stroke();
    } else {
      ctx.fillStyle = p.tp === SEED ? '#f2c260' : p.tp === LITTER ? '#b0743a' : p.tp === SAND ? '#e6c98a' :
        p.tp === GRAVEL ? '#9a968f' : p.tp === RICH ? '#5a3e30' : '#7d5638';
      ctx.fillRect(x - cs * .5, y - cs * .5, cs, cs);
    }
  }
}
function drawClouds() {
  for (const c of clouds) {
    const sc = c.sc, wet = clamp(c.rain / 160, 0, 1);
    const base = mixC(mixC([92, 104, 140], [255, 255, 255], daylight), [178, 190, 206], wet * .8);
    ctx.globalAlpha = clamp(c.alpha, 0, 1);
    ctx.fillStyle = rgb(mixC(base, [60, 70, 100], .18));
    for (const p of c.puffs) { ctx.beginPath(); ctx.arc(SX(c.x + p.dx * sc), SY(c.y + p.dy * sc + 1), p.r * cs * sc, 0, TAU); ctx.fill(); }
    ctx.fillStyle = rgb(base);
    for (const p of c.puffs) { ctx.beginPath(); ctx.arc(SX(c.x + p.dx * sc), SY(c.y + p.dy * sc - .4), p.r * cs * sc * .94, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}
function drawFx(textPass) {
  for (const f of fx) {
    const k = f.life / f.max;
    if (textPass !== (f.k === 'txt')) continue;
    if (f.k === 'txt') {
      const fs = Math.max(12, cs * 3.3);
      ctx.font = `800 ${fs}px ui-rounded, "SF Pro Rounded", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      const y = SY(f.y) - (1 - k) * cs * 7, x = SX(f.x);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(40,30,20,.55)'; ctx.strokeText(f.txt, x, y);
      ctx.fillStyle = f.col; ctx.fillText(f.txt, x, y);
      ctx.globalAlpha = 1;
    } else if (f.k === 'ring') {
      ctx.strokeStyle = `rgba(255,255,255,${k * .8})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(SX(f.x), SY(f.y), cs * (f.r + (1 - k) * 6), 0, TAU); ctx.stroke();
    } else if (f.k === 'spk') {
      ctx.fillStyle = f.col; ctx.globalAlpha = k;
      const s = cs * .8 * k + 1; ctx.fillRect(SX(f.x) - s / 2, SY(f.y) - s / 2, s, s); ctx.globalAlpha = 1;
    } else if (f.k === 'petal' || f.k === 'leaf') {
      ctx.fillStyle = f.col; ctx.globalAlpha = Math.min(1, k * 2);
      ctx.beginPath(); ctx.ellipse(SX(f.x), SY(f.y), cs * .7, cs * .35, f.life * .2, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
    } else if (f.k === 'spore') {
      ctx.fillStyle = `rgba(230,220,200,${k * .6})`;
      ctx.beginPath(); ctx.arc(SX(f.x), SY(f.y - (1 - k) * 3), cs * (1 + (1 - k) * 3), 0, TAU); ctx.fill();
    }
  }
}
function updFx() {
  for (let k = fx.length - 1; k >= 0; k--) {
    const f = fx[k];
    if (f.vx !== undefined) { f.x += f.vx; f.y += f.vy; if (f.k === 'petal' || f.k === 'leaf') { f.vy += .02; f.vx *= .97; } else { f.vx *= .92; f.vy *= .92; } }
    if (--f.life <= 0) fx.splice(k, 1);
  }
}

function drawGlassAndBase() {
  const r = R * cs;
  // inner rim shade
  let g = ctx.createRadialGradient(bx, by, r * .72, bx, by, r);
  g.addColorStop(0, 'rgba(20,30,50,0)'); g.addColorStop(1, 'rgba(20,30,50,.3)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
  // highlight
  g = ctx.createLinearGradient(bx - r * .7, by - r * .8, bx - r * .1, by - r * .25);
  g.addColorStop(0, 'rgba(255,255,255,.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(bx - r * .4, by - r * .5, r * .34, r * .17, -.68, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(bx + r * .5, by - r * .62, r * .028, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = r * .03;
  ctx.beginPath(); ctx.arc(bx, by, r * .9, Math.PI * .15, Math.PI * .42); ctx.stroke();
  // rim
  ctx.lineWidth = Math.max(2, cs * 1.2); ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.arc(bx, by, r + ctx.lineWidth * .5, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(70,90,120,.35)';
  ctx.beginPath(); ctx.arc(bx, by, r + cs * 1.3, 0, TAU); ctx.stroke();
}
function drawBase() {
  const r = R * cs, top = by + r * .93, w1 = r * .44, w2 = r * .58, h = r * .15;
  ctx.fillStyle = 'rgba(60,40,20,.18)';
  ctx.beginPath(); ctx.ellipse(bx, top + h + r * .03, w2 * 1.15, r * .07, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(bx - w2, 0, bx + w2, 0);
  g.addColorStop(0, '#7a4f2c'); g.addColorStop(.35, '#b47a45'); g.addColorStop(.6, '#a06a3a'); g.addColorStop(1, '#6a4224');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(bx - w1, top); ctx.lineTo(bx + w1, top); ctx.lineTo(bx + w2, top + h); ctx.lineTo(bx - w2, top + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c99060';
  ctx.beginPath(); ctx.ellipse(bx, top, w1, r * .045, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,230,190,.25)';
  ctx.fillRect(bx - w2 * .95, top + h * .55, w2 * 1.9, h * .1);
}

function render(time) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bgTop = getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim() || '#f5eddf';
  const bgBot = getComputedStyle(document.documentElement).getPropertyValue('--bg2').trim() || '#e6d6bd';
  const g = ctx.createRadialGradient(bx, by, R * cs * .5, bx, by, Math.max(W, H));
  g.addColorStop(0, bgTop); g.addColorStop(1, bgBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // warm glow from the world
  const glow = ctx.createRadialGradient(bx, by, R * cs * .9, bx, by, R * cs * 1.5);
  glow.addColorStop(0, daylight > .4 ? 'rgba(255,240,200,.35)' : 'rgba(120,140,220,.22)'); glow.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

  wobv += -wob * .25; wobv *= .8; wob += wobv;
  ctx.save();
  ctx.translate(bx, by); ctx.scale(1 + wob, 1 - wob); ctx.translate(-bx, -by);
  ctx.save();
  ctx.beginPath(); ctx.arc(bx, by, R * cs, 0, TAU); ctx.clip();
  drawSky(time);
  drawCells(time);
  drawWorms();
  drawShrooms();
  for (const p of plants) drawPlant(p, time);
  drawBits();
  drawBees(time);
  drawFlies(time);
  drawClouds();
  drawFx(false);
  ctx.restore();
  drawGlassAndBase();
  ctx.restore();
  drawBase();
  ctx.save(); ctx.translate(bx, by); ctx.scale(1 + wob, 1 - wob); ctx.translate(-bx, -by);
  drawFx(true);
  ctx.restore();
}

// ───────────────────────────── HUD & input ─────────────────────────────
const hintEl = document.getElementById('hint');
const TIPS = [
  'Tap the sky ☁️ to make it rain',
  'Watch the water soak in… seeds are sleeping in the soil',
  'A sprout! Tap the ground to dig · tap a flower to boop it',
  'Leave it running — or keep poking. What else is down there?',
];
let tipLevel = 0;
function tip(n) {
  if (n <= tipLevel) return;
  tipLevel = n;
  hintEl.style.opacity = 0;
  setTimeout(() => { hintEl.textContent = TIPS[n]; hintEl.classList.remove('pulse'); hintEl.style.opacity = 1; }, 380);
  if (n === 3) setTimeout(() => { if (tipLevel === 3) hintEl.style.opacity = .55; }, 12000);
}

const ptr = { down: false, x: 0, y: 0, mode: null, t: 0 };
function act(first) {
  const cx = (ptr.x - ox) / cs, cy = (ptr.y - oy) / cs;
  if (first) {
    if (!insideF(cx, cy)) { ptr.mode = null; return; }
    let best = null, bd = 3.4;
    for (const p of plants) if (p.growth > .3) { const d = Math.hypot(p.hx - cx, p.hy - cy); if (d < bd) { bd = d; best = p; } }
    if (best) { boop(best); ptr.mode = 'boop'; return; }
    const xi = clamp(cx | 0, 0, N - 1);
    ptr.mode = cy < surfY[xi] - 2 ? 'rain' : 'dig';
  }
  if (ptr.mode === 'rain') tapRain(cx, cy, first);
  else if (ptr.mode === 'dig' && insideF(cx, cy)) dig(cx, cy, first ? 4.6 : 3.4, first);
}
cvs.addEventListener('pointerdown', e => {
  ensureAudio();
  try { cvs.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY; ptr.t = 0;
  act(true);
});
cvs.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; });
const up = () => { ptr.down = false; ptr.mode = null; };
cvs.addEventListener('pointerup', up); cvs.addEventListener('pointercancel', up);

document.getElementById('bSound').onclick = e => {
  ensureAudio(); soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔈';
};
document.getElementById('bSpeed').onclick = e => {
  speed = speed === 1 ? 3 : speed === 3 ? 8 : 1; e.currentTarget.textContent = speed + '×';
};
document.getElementById('bNew').onclick = () => { gen(); wobv += .02; };
document.getElementById('discHead').onclick = () => { discTouched = true; discEl.classList.toggle('closed'); };

const statusEl = document.getElementById('status');
function updStatus() {
  const ph = daylight < .1 ? 'night' : sunAlt > 0 && dayT < .12 ? 'morning' : dayT > .38 && dayT < .5 ? 'evening' : dayT > .5 ? 'night' : 'day';
  const w = raining ? ' · raining' : '';
  statusEl.textContent = `Day ${day} · ${ph}${w} · ${stats.flowers} 🌼 · ${bees.length} 🐝 · ${worms.length} 🪱`;
}

// ───────────────────────────── Loop ─────────────────────────────
let last = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  if (window.innerWidth !== W || window.innerHeight !== H) layout();
  acc += dt * 60 * speed;
  let n = 0;
  const maxSteps = speed * 2 + 2;
  while (acc >= 1 && n < maxSteps) {
    step(); acc -= 1; n++;
    if (ptr.down) {
      ptr.t++;
      if (ptr.mode === 'rain') act(false);
      else if (ptr.mode === 'dig' && ptr.t % 9 === 0) act(false);
    }
  }
  if (acc > maxSteps) acc = 0;
  updFx();
  render(now / 1000);
  if (frame % 20 === 0) updStatus();
}

layout(); gen(); renderDisc(); updStatus();
// debug handle for poking at the sim from the console
window.__sw = { t, m, plants, bees, worms, shrooms, flies, clouds, bits, step, found, get vapor() { return vapor; }, get day() { return day; } };
requestAnimationFrame(loop);
})();
</script>
</body>
