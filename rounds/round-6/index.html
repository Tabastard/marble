<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dewdrop — a world in a bubble</title>
<style>
  :root { --tend: #7df0b4; --wreck: #ff8d5c; --gold: #ffd66b; --ink: #eaf2ff; --panel: rgba(16, 22, 44, .62); --line: rgba(255, 255, 255, .13); }
  * { box-sizing: border-box; }

  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
  #top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; gap: 10px; }
  #top > * { pointer-events: auto; }
  #title { padding: 9px 14px; cursor: pointer; }
  #title h1 { margin: 0; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
  #count { font-size: 12px; opacity: .85; margin-top: 2px; }
  #count b { color: var(--tend); } #count b.gold { color: var(--gold); }
  #menu { display: flex; gap: 6px; padding: 6px; }
  #menu button { all: unset; cursor: pointer; padding: 6px 11px; border-radius: 10px; font-size: 12.5px; color: var(--ink); opacity: .85; }
  #menu button:hover { background: rgba(255, 255, 255, .1); opacity: 1; }
  #menu button.off { opacity: .45; }
  #bar { position: fixed; left: 0; right: 0; bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  #tip { pointer-events: none; padding: 6px 13px; border-radius: 999px; background: rgba(8, 12, 28, .6); border: 1px solid var(--line); font-size: 12.5px; max-width: 92vw; text-align: center; }
  #tip.tend b { color: var(--tend); } #tip.wreck b { color: var(--wreck); }
  #sets { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; pointer-events: auto; padding: 0 8px; }
  .set { padding: 7px 8px 8px; }
  .set h2 { margin: 0 0 5px 6px; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; opacity: .9; }
  .set.tend h2 { color: var(--tend); } .set.wreck h2 { color: var(--wreck); }
  .row { display: flex; gap: 5px; }
  .tool { all: unset; position: relative; cursor: pointer; width: 62px; height: 60px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: rgba(255, 255, 255, .05); border: 1px solid transparent; transition: transform .12s cubic-bezier(.3, 1.6, .5, 1), background .12s, border-color .12s; }
  .tool:hover { background: rgba(255, 255, 255, .11); transform: translateY(-2px); }
  .tool:active { transform: scale(.94); }
  .tool svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tool svg .thin { stroke-width: 1.6; }
  .tool span { font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  .tool kbd { position: absolute; top: 3px; right: 6px; font: 9.5px ui-monospace, monospace; opacity: .4; }
  .tool.tend { color: #cfeedd; } .tool.wreck { color: #f6d6c8; }
  .tool.tend.on { background: rgba(125, 240, 180, .2); border-color: var(--tend); color: #fff; transform: translateY(-4px); box-shadow: 0 6px 18px rgba(125, 240, 180, .25); }
  .tool.wreck.on { background: rgba(255, 141, 92, .22); border-color: var(--wreck); color: #fff; transform: translateY(-4px); box-shadow: 0 6px 18px rgba(255, 141, 92, .28); }
  #toasts { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 430px); }
  .toast { padding: 9px 16px 10px; border-radius: 14px; background: rgba(14, 20, 42, .78); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); text-align: center; animation: pop .45s cubic-bezier(.2, 1.7, .4, 1); transition: opacity .5s, transform .5s; max-width: 100%; }
  .toast.out { opacity: 0; transform: translateY(-10px) scale(.96); }
  .toast .tag { font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; opacity: .7; }
  .toast .tt { font-size: 16px; font-weight: 700; }
  .toast .tx { font-size: 12.5px; opacity: .88; }
  .toast.small .tt { color: #9fe8ff; } .toast.life .tt { color: var(--tend); }
  .toast.step { border-color: rgba(255, 214, 107, .4); } .toast.step .tt { font-size: 12px; letter-spacing: .08em; color: var(--gold); text-transform: uppercase; }
  .toast.rare { border-color: var(--gold); background: linear-gradient(180deg, rgba(70, 52, 10, .85), rgba(22, 20, 40, .85)); box-shadow: 0 0 40px rgba(255, 214, 107, .35); padding: 14px 20px 15px; }
  .toast.rare .tag { color: var(--gold); opacity: 1; } .toast.rare .tt { font-size: 23px; color: #fff3c9; }

  #journal { position: fixed; top: 70px; left: 12px; bottom: 150px; width: min(340px, calc(100vw - 24px)); padding: 12px 14px; overflow: auto; transform: translateX(-112%); transition: transform .3s cubic-bezier(.3, 1.3, .5, 1); -webkit-user-select: text; user-select: text; }
  #journal.open { transform: none; }
  #journal h3 { margin: 12px 0 6px; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; opacity: .7; }
  #journal h3:first-child { margin-top: 2px; }
  #journal-close { all: unset; cursor: pointer; position: sticky; float: right; top: 0; padding: 2px 8px; border-radius: 8px; opacity: .7; }
  #journal-close:hover { background: rgba(255, 255, 255, .12); }

  .rare.found { border-color: rgba(255, 214, 107, .5); background: rgba(255, 214, 107, .09); }

  .pips i { width: 16px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .16); } .pips i.on { background: var(--gold); }

  .chip.on { opacity: 1; background: rgba(159, 232, 255, .16); color: #d9f6ff; } .chip.on.life { background: rgba(125, 240, 180, .16); color: #d9ffe9; }

  #help { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity .5s; }
  #help.hide { opacity: 0; }
  #help .card { padding: 16px 22px; text-align: center; max-width: min(92vw, 440px); pointer-events: auto; cursor: pointer; }
  #help.hide .card { pointer-events: none; }
  #help h2 { margin: 0 0 6px; font-size: 18px; } #help p { margin: 4px 0; opacity: .9; font-size: 13px; } #help em { color: var(--tend); font-style: normal; font-weight: 600; } #help em.w { color: var(--wreck); }
  #err { display: none; position: fixed; inset: 20px; padding: 18px; background: rgba(60, 10, 10, .92); border-radius: 12px; white-space: pre-wrap; font: 12px ui-monospace, monospace; overflow: auto; z-index: 9; -webkit-user-select: text; user-select: text; }
  #err.show { display: block; }
  @media (max-width: 760px) { .tool { width: 52px; height: 52px; } .tool span { font-size: 10px; } .tool kbd { display: none; } #menu button { padding: 6px 7px; font-size: 11.5px; } #journal { bottom: 220px; } }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="top">
  <div id="title" class="panel" onclick="document.getElementById('btn-journal').click()">
    <h1>Dewdrop</h1>
    <div id="count"></div>
  </div>
  <div id="menu" class="panel">
    <button id="btn-journal" title="What this world has done so far (J)">Journal</button>
    <button id="btn-sound" title="Toggle sound (M)">Sound on</button>
    <button id="btn-new" title="Start over with a fresh landscape">New world</button>
    <button id="btn-help" title="How to play">?</button>
  </div>
</div>
<div id="journal" class="panel">
  <button id="journal-close" title="Close">✕</button>
  <div id="journal-body"></div>
  <button id="btn-forget" title="Clear every discovery">Forget all discoveries</button>
</div>
<div id="toasts"></div>
<div id="help">
  <div class="card panel">
    <h2>A small world in a glass bubble</h2>
    <p><em>Drag on the land</em> to use the selected tool.</p>
    <p><em>Drag the glass or the stars</em> (or right-drag) to orbit · scroll to zoom.</p>
    <p>One set of tools <em>tends</em>, the other <em class="w">wrecks</em>. Use any tool on whatever the last one left behind, and watch what the world does next.</p>
  </div>
</div>
<div id="bar">
  <div id="tip" class="tip"></div>
  <div id="sets">
    <div class="set tend panel"><h2>Tend</h2><div class="row" id="tools-tend"></div></div>
    <div class="set wreck panel"><h2>Wreck</h2><div class="row" id="tools-wreck"></div></div>
  </div>
</div>
<pre id="err"></pre>
<script>

  cam: { yaw: 0.6, pitch: 0.42, dist: 40, tx: 0, ty: -1.3, tz: 0, pos: [0, 0, 0], fwd: [0, 0, -1], right: [1, 0, 0], up: [0, 1, 0], tanF: 0.34, aspect: 1.6 },

  events: [],
  wonders: [],
  stars: [],           // fallen meteorites

  trees: [],

  seed: 1,
  vapor: 0,

// ════════ gl.js ════════
// ───────────────────────── gl: a very small WebGL2 toolkit ─────────────────────────

// ── instanced mesh: per instance a mat4 + rgba (a = glow) ──
class InstMesh {
  constructor(geo, cap) {
    const gl = GLX.gl;
    this.cap = cap; this.n = 0; this.data = new Float32Array(cap * 20); this.nv = geo.v.length / 9; this.dirty = true;
    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(geo.v), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 36, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 36, 24);
    this.ib = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    for (let i = 0; i < 4; i++) { gl.enableVertexAttribArray(3 + i); gl.vertexAttribPointer(3 + i, 4, gl.FLOAT, false, 80, i * 16); gl.vertexAttribDivisor(3 + i, 1); }
    gl.enableVertexAttribArray(7); gl.vertexAttribPointer(7, 4, gl.FLOAT, false, 80, 64); gl.vertexAttribDivisor(7, 1);
    gl.bindVertexArray(null);
  }
  clear() { this.n = 0; this.dirty = true; }
  add(px, py, pz, yaw, pitch, roll, sx, sy, sz, r, g, b, e) {
    if (this.n >= this.cap) return;
    const o = this.n++ * 20, d = this.data;
    matTRS(d, o, px, py, pz, yaw, pitch, roll, sx, sy, sz);
    d[o + 16] = r; d[o + 17] = g; d[o + 18] = b; d[o + 19] = e || 0;
  }
  draw() {
    if (!this.n) return;
    const gl = GLX.gl;
    gl.bindVertexArray(this.vao);
    if (this.dirty) { gl.bindBuffer(gl.ARRAY_BUFFER, this.ib); gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * 20); this.dirty = false; }
    gl.drawArraysInstanced(gl.TRIANGLES, 0, this.nv, this.n);
  }
}

// ── a dynamic float buffer bound to a VAO (particles, immediate triangles) ──
class DynBuf {
  constructor(floats) {
    const gl = GLX.gl;
    this.vao = gl.createVertexArray(); this.buf = gl.createBuffer();
    gl.bindVertexArray(this.vao); gl.bindBuffer(gl.ARRAY_BUFFER, this.buf); gl.bufferData(gl.ARRAY_BUFFER, floats * 4, gl.DYNAMIC_DRAW);
  }
  upload(data, floats) {
    const gl = GLX.gl;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    if (floats > 0) gl.bufferSubData(gl.ARRAY_BUFFER, 0, data, 0, floats);
  }
}

const AU = { ctx: null, out: null, noise: null, loops: {}, on: true, last: {} };

function audioInit() {
  if (AU.ctx || typeof window === 'undefined') return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    const ctx = AU.ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = 0.004; comp.release.value = 0.2;
    AU.out = ctx.createGain(); AU.out.gain.value = AU.on ? 0.7 : 0;
    AU.out.connect(comp); comp.connect(ctx.destination);
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
    // continuous beds, silent until something drives them
    mkLoop('rain', 'bandpass', 2600, 0.6);
    mkLoop('wind', 'bandpass', 500, 1.2);
    mkLoop('rumble', 'lowpass', 75, 0.8);
    mkLoop('fire', 'bandpass', 1300, 0.7);
    mkLoop('earth', 'lowpass', 240, 1.5);
    mkLoop('hiss', 'highpass', 4200, 0.5);
    mkLoop('air', 'lowpass', 320, 0.3);
    setLoop('air', 0.035);
    // sun pad
    const g = ctx.createGain(); g.gain.value = 0; g.connect(AU.out);
    for (const f of [329.6, 415.3, 493.9, 659.3]) {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.detune.value = rr(-7, 7);
      const og = ctx.createGain(); og.gain.value = 0.22; o.connect(og); og.connect(g); o.start();
    }

}

}

}

function panNode(pan) {

const W = {};
const W_FIELDS = ['h', 'w', 'fL', 'fR', 'fU', 'fD', 'lava', 'lh', 'lq', 'T', 'moist', 'fert', 'veg', 'flo', 'aq', 'sb', 'fire', 'ash', 'snow', 'ice', 'char', 'vent', 'dig', 'wth', 'glac', 'raint', 'top', 'tmp', 'tmp2', 'tmp3', 'flow', 'ero'];

function worldAlloc() {
  for (const f of W_FIELDS) W[f] = new Float32Array(NN);
  W.mat = new Uint8Array(NN);

  W.treeAt = new Int16Array(NN);       // tree index + 1, 0 = none
  W.dormant = new Uint8Array(NN);      // seeds waiting out the cold
  W.fireList = new Int32Array(2048); W.lavaList = new Int32Array(2048); W.ventList = [];
  W.texH = new Float32Array(NN * 4);   // top, water surface, water depth, ice
  W.texC = new Uint8Array(NN * 4);     // rgb + emissive
  W.lavaCells = 0; W.fireCells = 0; W.meltAcc = 0; W.wetCells = 0; W.boil = 0;
  W.xs = new Float32Array(N);

const tempAmbient = (y) => 17 - 7.5 * (y - Y0);

function worldGen(seed) {
  const rng = mulberry(seed * 7919 + 13);
  for (const f of W_FIELDS) W[f].fill(0);

  W.lavaCells = 0; W.fireCells = 0; W.meltAcc = 0; W.fireHeat = 0;
  const ang = rng() * TAU, ox = rng() * 100, oz = rng() * 100;
  const mx = Math.cos(ang) * 4.4, mz = Math.sin(ang) * 4.4;                 // mountain
  const lx = Math.cos(ang + 2.5) * 3.0, lz = Math.sin(ang + 2.5) * 3.0;     // lake

  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, x = W.xs[i], z = W.xs[j];
    let e = Y0 + (fbm(x * 0.21 + ox, z * 0.21 + oz, 4) - 0.5) * 1.7 + (fbm(x * 0.9 + oz, z * 0.9 + ox, 2) - 0.5) * 0.18;
    const dm = Math.hypot(x - mx, z - mz);

// which cells lie inside the glass
function worldInside() {
  const { h, inside, xs } = W;
  const lim = (R - 0.06) * (R - 0.06);
  for (let j = 1; j < N - 1; j++) {
    const z = xs[j];
    for (let i = 1; i < N - 1; i++) {
      const c = j * N + i, x = xs[i], y = h[c];
      const ins = x * x + z * z + y * y < lim ? 1 : 0;

}
function clearCell(c) {

  W.fL[c] = W.fR[c] = W.fU[c] = W.fD[c] = 0;
}
function worldTops() {
  const { h, lava, snow, top } = W;
  for (let c = 0; c < NN; c++) top[c] = h[c] + lava[c] + snow[c] * SNOWK;

// bilinear sample of a field at world xz
function sampleField(f, x, z) {
  let gx = (x + HALF) / CS, gz = (z + HALF) / CS;
  gx = clamp(gx, 0, N - 1.001); gz = clamp(gz, 0, N - 1.001);
  const i = gx | 0, j = gz | 0, fx = gx - i, fz = gz - j, c = j * N + i;

const topAt = (x, z) => sampleField(W.top, x, z);
const surfAt = (x, z) => sampleField(W.top, x, z) + Math.max(0, sampleField(W.w, x, z));
const cellPos = (c) => [W.xs[c % N], W.top[c], W.xs[(c / N) | 0]];

const glassRadius = (y) => Math.sqrt(Math.max(0, RR - y * y));

// call fn(c, falloff 0..1, dist) for every cell within r of (x,z)
function forBrush(x, z, r, fn, includeOutside) {
  const i0 = Math.max(1, Math.floor((x - r + HALF) / CS)), i1 = Math.min(N - 2, Math.ceil((x + r + HALF) / CS));
  const j0 = Math.max(1, Math.floor((z - r + HALF) / CS)), j1 = Math.min(N - 2, Math.ceil((z + r + HALF) / CS));
  const xs = W.xs, ins = W.inside;
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const dx = xs[i] - x, dz = xs[j] - z, d = Math.sqrt(dx * dx + dz * dz);
    if (d > r) continue;
    const c = j * N + i;
    if (!includeOutside && !ins[c]) continue;
    const t = 1 - d / r;
    fn(c, t * t * (3 - 2 * t), d);
  }
}

// ── primitive reactions other systems call ──
function precip(c, amt) {            // rain where warm, snow where cold

  if (W.T[c] < 0.5) W.snow[c] = Math.min(1.4, W.snow[c] + amt * 1.6);
  else { W.w[c] += amt; W.moist[c] = Math.min(1, W.moist[c] + amt * 6); }

}
function igniteCell(c, force) {

  if (W.fire[c] > 0) return true;
  if (W.veg[c] > 0.12 || W.treeAt[c]) {
    if (!force && rnd() < W.moist[c] * 1.1 - 0.2) return false;
    W.fire[c] = 0.25;
    if (W.treeAt[c]) treeIgnite(W.treeAt[c] - 1);

}
function addLava(c, amt) {

}

// ───────────────────────── water: virtual pipes, so it sloshes and makes waves ─────────────────────────
function waterStep() {
  const { h, w, lava, fL, fR, fU, fD, inside, ice, tmp, flow, ero } = W;
  const k = 0.15;
  for (let c = 0; c < NN; c++) tmp[c] = h[c] + lava[c] + w[c];
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i, d = w[c];
    if (d <= 0 || !inside[c] || ice[c] > 0.5) { fL[c] = fR[c] = fU[c] = fD[c] = 0; continue; }

    let a = inside[c - 1] && ice[c - 1] <= 0.5 ? fL[c] * damp + k * (s - tmp[c - 1]) : 0;
    let b = inside[c + 1] && ice[c + 1] <= 0.5 ? fR[c] * damp + k * (s - tmp[c + 1]) : 0;
    let u = inside[c - N] && ice[c - N] <= 0.5 ? fU[c] * damp + k * (s - tmp[c - N]) : 0;
    let dn = inside[c + N] && ice[c + N] <= 0.5 ? fD[c] * damp + k * (s - tmp[c + N]) : 0;
    if (a < 0) a = 0; if (b < 0) b = 0; if (u < 0) u = 0; if (dn < 0) dn = 0;
    const sum = a + b + u + dn;
    if (sum > d) { const sc = d / sum; a *= sc; b *= sc; u *= sc; dn *= sc; }

function lavaStep(dt) {

// ───────────────────────── heat, snow and ice ─────────────────────────

  let melt = 0, mc = -1;
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i;
    if (!inside[c]) continue;
    const amb = tempAmbient(h[c]);
    let ta = amb;
    if (snow[c] > 0.03 || ice[c] > 0.5) ta = Math.min(ta, 2.5);
    if (vent[c] > 0) ta += vent[c] * 75;
    let t = T[c];
    t += (ta - t) * dt * 0.085;
    t += (0.25 * (T[c - 1] + T[c + 1] + T[c - N] + T[c + N]) - t) * 0.035;
    if (fire[c] > 0 && t < 115) t = 115;
    if (w[c] > 0.004) {
      // still water freezes; running water keeps itself just above freezing and cuts through snow
      if (ice[c] <= 0.5 && W.flow[c] > 0.0008 + 0.012 * w[c]) { if (t < 1.5) t = 1.5; if (ice[c] > 0) ice[c] = Math.max(0, ice[c] - dt * 0.5); }
      else if (t < -1) { ice[c] = Math.min(1, ice[c] + dt * 0.5); if (ice[c] > 0.6 && w[c] > 0.05) discover('ice', W.xs[i], h[c] + w[c], W.xs[j]); }
      else if (ice[c] > 0 && t > 1) ice[c] = Math.max(0, ice[c] - dt * 0.05 * Math.min(t, 40));
      if (t > 99 && lava[c] <= 0) t = 99;                       // boiling water holds the ground at 100°
    } else if (ice[c] > 0) ice[c] = 0;
    if (snow[c] > 0) {
      if (t > 0.5) {
        const m = Math.min(snow[c], dt * 0.0042 * Math.min(t, 60));
        snow[c] -= m; w[c] += m * 0.55; W.moist[c] = Math.min(1, W.moist[c] + m * 3);
        if (m > 0.0004) { melt += m; mc = c; }
        if (snow[c] < 0.002) snow[c] = 0;
      }
      // deep snow on a bitter peak packs into glacier ice
      if (snow[c] > 0.55 && amb < -8) { glac[c] = Math.min(1, glac[c] + dt * 0.3); if (glac[c] >= 1) discover('glacier', W.xs[i], W.top[c], W.xs[j]); }
      else if (snow[c] < 0.3) glac[c] = 0;
    } else glac[c] = 0;
    T[c] = t;
  }
  if (melt > 0) {
    W.meltAcc += melt;
    if (W.meltAcc > 2.5 && mc >= 0) { const p = cellPos(mc); discover('meltwater', p[0], p[1], p[2]); }
  }
}

// ───────────────────────── fire: eats growth, leaves ash ─────────────────────────
function fireStep(dt) {
  const { fire, veg, flo, w, snow, ash, char, T, moist, inside, treeAt } = W;
  // a long-burning fire dampens the air around it, so every fire eventually spends itself
  const damp = Math.max(0, 1 - W.fireHeat / 9000);
  let count = 0;
  for (let c = N; c < NN - N; c++) {
    const f = fire[c];
    if (f <= 0) continue;
    if (w[c] > 0.012 || snow[c] > 0.03 || !inside[c]) { fire[c] = 0; continue; }
    if (count < 2048) W.fireList[count] = c;
    count++;
    const tr = treeAt[c] ? G.trees[treeAt[c] - 1] : null;
    if (veg[c] > 0.02) {
      veg[c] = Math.max(0, veg[c] - dt * 0.2); flo[c] = 0;
      fire[c] = Math.min(1, f + dt * 2);
      ash[c] = Math.min(1, ash[c] + dt * 0.22); char[c] = 1;
    } else if (tr && tr.st === 1) { fire[c] = Math.max(0.5, f - dt * 0.3); ash[c] = Math.min(1, ash[c] + dt * 0.1); char[c] = 1; }
    else { fire[c] = f - dt * 1.3; if (fire[c] <= 0) { fire[c] = 0; continue; } }
    if (tr && tr.st === 0) treeIgnite(treeAt[c] - 1);
    moist[c] = Math.max(0, moist[c] - dt * 0.15);
    if (rnd() < dt * 3.6 * f) {                         // mostly creeps to a neighbour, sometimes spots ahead
      const rg = rnd() < 0.25 ? 2 : 1, sp = 2 * rg + 1;
      const n = c + (((rnd() * sp) | 0) - rg) + (((rnd() * sp) | 0) - rg) * N;
      if (n > N && n < NN - N && n !== c && fire[n] <= 0 && inside[n] && (veg[n] > 0.25 || treeAt[n]) && w[n] < 0.01 && snow[n] < 0.02 && rnd() > moist[n] * 1.15 - 0.17 && (treeAt[n] || rnd() < veg[n] * 1.4) && rnd() < damp) {
        fire[n] = 0.15;
      }
    }
  }
  W.fireCells = count;
  if (count > 25) rareStep('elder', 1);
  W.fireHeat = count > 0 ? W.fireHeat + count * dt : Math.max(0, W.fireHeat - dt * 70);
  if (count > 70) { discover('wildfire'); }
}

// ───────────────────────── moisture, soaking, evaporation ─────────────────────────
function moistStep(dt) {
  const { moist, w, T, raint, inside, vent } = W;
  let wet = 0, vap = 0;
  const evk = dt * 0.00004 * (1 + 30 * smooth(1200, 3000, W.wetCells));     // the more open water, the faster it returns to the sky
  for (let j = 1; j < N - 1; j++) for (let i = 1; i < N - 1; i++) {
    const c = j * N + i;
    if (!inside[c]) continue;
    let m = moist[c];
    const d = w[c];
    if (d > 0.02) { m += (1 - m) * 0.2; wet++; }
    else {
      m += (0.25 * (moist[c - 1] + moist[c + 1] + moist[c - N] + moist[c + N]) - m) * 0.07;
      const t = T[c];
      m -= dt * 0.0042 * (1 + (t > 20 ? (t - 20) * 0.07 : 0)) * (m > 0.2 ? 1 : 0.2);
      if (m < 0.2 && t < 40) m += dt * 0.0012;
    }
    if (d > 0) {
      if (d < 0.02 && raint[c] <= 0 && m < 0.97 && T[c] > 0 && W.ice[c] < 0.5 && W.flow[c] < 0.0008) { const s = Math.min(d, dt * 0.014 * (1 - m)); w[c] -= s; m = Math.min(1, m + s * 20); }   // thin films soak into thirsty ground
      if (vent[c] < 0.2) { const ev = Math.min(w[c], evk * (1 + clamp(T[c] - 17, 0, 30) * 0.1)); w[c] -= ev; vap += ev; }
    }
    moist[c] = m < 0 ? 0 : m > 1 ? 1 : m;
    if (raint[c] > 0) raint[c] -= dt;
  }
  W.wetCells = wet;
  G.vapor = Math.min(48, G.vapor + vap * 0.35 + dt * 0.2);
}

// ───────────────────────── growth: grass, flowers, water plants, weathering ─────────────────────────
function vegStep(phase, dtv) {
  const { veg, flo, aq, sb, w, T, moist, fert, mat, snow, lava, fire, ash, char, wth, inside, treeAt, ice } = W;
  let nTrees = G.trees.length;
  for (let c = N + phase; c < NN - N; c += 8) {
    if (!inside[c]) continue;
    if (char[c] > 0) char[c] = Math.max(0, char[c] - dtv * 0.006 * (1 + veg[c] * 4));
    if (lava[c] > 0 || fire[c] > 0) continue;
    const t = T[c], m = moist[c];
    if (snow[c] > 0.04) {                                    // asleep under snow
      if (flo[c] > 0) flo[c] = Math.max(0, flo[c] - dtv * 0.25);
      if (sb[c] > 0) W.dormant[c] = 1;
      continue;
    }
    let v = veg[c];
    const k = mat[c];
    // ash needs a real soaking, not a drizzle, to become loam
    if ((w[c] > 0.05 || W.raint[c] > 2) && ash[c] > 0.3 && wetAsh(c)) discover('loam', W.xs[c % N], W.top[c], W.xs[(c / N) | 0]);
    if (w[c] > 0.06) {

      if (t > 2 && ice[c] < 0.5 && t < 60) {
        if (aq[c] > 0) aq[c] = Math.min(1, aq[c] + dtv * 0.03);
        else if (sb[c] > 0) { aq[c] = 0.3; if (w[c] > 0.3) discover('lily', W.xs[c % N], W.h[c] + w[c], W.xs[(c / N) | 0]); }
        else if (w[c] < 0.4) {
          const nb = Math.max(aq[c - 1], aq[c + 1], aq[c - N], aq[c + N]);
          if (rnd() < (nb > 0.5 ? 0.004 : 0.0003) * dtv) aq[c] = 0.05;
        }
      } else if (aq[c] > 0 && t >= 60) aq[c] = Math.max(0, aq[c] - dtv * 0.2);
    } else {
      if (aq[c] > 0) aq[c] = Math.max(0, aq[c] - dtv * 0.15);
      const a = ash[c];
      let cap = k === SOIL || k === LOAM ? 1 : k === SAND ? 0.3 : (k === BASALT || k === ROCK) ? 0.2 : 0;
      if (a > 0.2 && k !== OBSIDIAN && k !== GLASS) cap = Math.max(cap, 0.55);
      if (m > 0.6 && v <= 0 && t > 1 && (k === ROCK || k === BASALT)) rareStep('mossback', 1);
      if (cap > 0 && t > 1 && t < 46 && m > 0.24) {

        if (v > 0) { if (v < cap) v = Math.min(cap, v + dtv * 0.075 * (0.4 + m) * fr * (sb[c] > 0 ? 4 : 1)); else v -= dtv * 0.02; }
        else {
          let p = 0.0009;
          if (sb[c] > 0) p = 0.9;
          else if ((k === ROCK || k === BASALT) && a <= 0.2) p = 0;          // bare stone stays bare until seed reaches it
          else { const nb = Math.max(veg[c - 1], veg[c + 1], veg[c - N], veg[c + N]); if (nb > 0.3) p = 0.55 * nb; }
          if (rnd() < p * dtv * (0.3 + m)) {
            v = 0.05;
            if (sb[c] > 0 && rnd() < 0.2) { const sx = W.xs[c % N], sz = W.xs[(c / N) | 0]; fxGlints(sx, W.top[c] + 0.05, sz, 1, 0.6, 1, 0.4, 0.3); SFX.sprout(panAt(sx, W.top[c], sz)); }   // seeds taking
            if (k === ROCK || k === BASALT) discover('moss', W.xs[c % N], W.top[c], W.xs[(c / N) | 0]);
            if (sb[c] > 0 && W.dormant[c]) { W.dormant[c] = 0; discover('thaw', W.xs[c % N], W.top[c], W.xs[(c / N) | 0]); }
          }
        }
      } else if (v > 0) {
        if (m < 0.13 || t >= 46) v -= dtv * 0.03;
        else if (t <= 1) v -= dtv * 0.004;
        else if (cap <= 0) v -= dtv * 0.1;
      }
      // flowers
      if (v > 0.6 && m > 0.36 && t > 6 && t < 40) {
        if (flo[c] > 0) flo[c] = Math.min(1, flo[c] + dtv * 0.06);
        else {
          let p = 0.0007 * (fert[c] + 0.3);
          if (sb[c] > 0) p = 0.5;
          else if (Math.max(flo[c - 1], flo[c + 1], flo[c - N], flo[c + N]) > 0.6) p = 0.006;
          if (rnd() < p * dtv) { flo[c] = 0.12; if (a > 0.12) discover('fireweed', W.xs[c % N], W.top[c], W.xs[(c / N) | 0]); }
        }
      } else if (flo[c] > 0) flo[c] = Math.max(0, flo[c] - dtv * 0.06);
      // bushes and trees arrive once a meadow has matured
      if (v > 0.8 && m > 0.42 && !treeAt[c] && nTrees < 520) {
        const p = sb[c] > 0 ? 0.006 : 0.00003;
        if (rnd() < p * dtv && trySapling(c, false) >= 0) nTrees++;
      }
      // weathering: living things turn bare rock and sand into soil
      if ((k === BASALT || k === ROCK) && v > 0.1 && m > 0.3) { wth[c] += dtv; if (wth[c] > (k === ROCK ? 170 : 100)) { mat[c] = SOIL; wth[c] = 0; fert[c] = 0.65; } }
      else if (k === SAND && v > 0.22 && m > 0.3) { wth[c] += dtv; if (wth[c] > 40) { mat[c] = SOIL; wth[c] = 0; } }
      else if (k === SOIL && m < 0.045 && t > 42 && t < 75 && v < 0.05 && a < 0.05 && char[c] < 0.1) {       // baked dry: soil crumbles to sand
        wth[c] -= dtv * 1.5; if (wth[c] < -9) { mat[c] = SAND; wth[c] = 0; discover('desert', W.xs[c % N], W.top[c], W.xs[(c / N) | 0]); }
      }
      // ash settles into the soil
      if (a > 0 && v > 0.3) { ash[c] = Math.max(0, a - dtv * 0.012); fert[c] = Math.min(1, fert[c] + dtv * 0.008); }
    }
    if (sb[c] > 0) {
      if (t < 1 || snow[c] > 0.02) W.dormant[c] = 1;
      else { sb[c] = Math.max(0, sb[c] - dtv * 0.04); if (sb[c] === 0) W.dormant[c] = 0; }
    }
    veg[c] = v < 0 ? 0 : v > 1 ? 1 : v;
  }
}

// ash + water → rich loam
function wetAsh(c) {
  if (W.ash[c] > 0.3 && W.lava[c] <= 0 && W.mat[c] !== OBSIDIAN && W.mat[c] !== GLASS) {
    W.mat[c] = LOAM; W.fert[c] = 1; W.ash[c] = 0; W.char[c] *= 0.3; W.wth[c] = 0;
    return true;
  }
  return false;
}

// once a second: where are the hot vents, and is water sitting on one?
function worldVentScan() {
  const vl = W.ventList; vl.length = 0;
  const { vent, w, h, inside } = W;
  for (let c = N; c < NN - N; c++) {
    if (vent[c] <= 0.15 || !inside[c]) continue;
    if (vl.length < 400) vl.push(c);
    if (h[c] < MAGMA_Y) {                                // an open well to the magma keeps itself topped up
      if (h[c] + W.lava[c] < MAGMA_Y + 0.12) addLava(c, 0.05);
      W.lh[c] = 1;
      continue;
    }
    if (h[c] < MAGMA_Y + 0.25) continue;
    if (w[c] > 0.1 && W.lava[c] <= 0) discover('hotspring', W.xs[c % N], h[c] + w[c], W.xs[(c / N) | 0]);
  }
}

function worldStep(dt) {
  if ((G.step & 3) === 0) worldInside();
  if (G.step % 20 === 0) worldVentScan();
  waterStep(); waterStep();
  lavaStep(dt);
  thermalStep(dt);
  fireStep(dt);
  moistStep(dt);
  vegStep((G.step * 5) & 7, dt * 8);
  worldTops();
}

// ───────────────────────── textures for the renderer ─────────────────────────
const MATCOL = [
  [0.72, 0.56, 0.37, 0.44, 0.31, 0.20],   // soil  (dry rgb, wet rgb)
  [0.92, 0.82, 0.58, 0.76, 0.66, 0.44],   // sand
  [0.58, 0.57, 0.60, 0.46, 0.46, 0.50],   // rock
  [0.25, 0.23, 0.27, 0.19, 0.18, 0.22],   // basalt
  [0.10, 0.07, 0.15, 0.08, 0.05, 0.13],   // obsidian
  [0.62, 0.88, 0.82, 0.52, 0.80, 0.76],   // glass
  [0.30, 0.19, 0.12, 0.22, 0.13, 0.08],   // loam
];
function worldTextures() {
  const { h, w, lava, lh, top, ice, mat, moist, veg, ash, char, snow, fire, T, vent, raint, glac, flo, texH, texC, inside } = W;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const c = j * N + i, o = c * 4;
    const tp = top[c];
    texH[o] = tp;
    const d = w[c];
    if (d > 0.003) { texH[o + 1] = h[c] + lava[c] + d; texH[o + 2] = d; }
    else if (i > 0 && j > 0 && i < N - 1 && j < N - 1) {
      let s = 0, n = 0;
      for (let q = 0; q < 8; q++) {
        const nb = c + (q < 3 ? q - 1 - N : q < 5 ? (q === 3 ? -1 : 1) : q - 6 + N);
        if (w[nb] > 0.003) { s += h[nb] + lava[nb] + w[nb]; n++; }
      }
      texH[o + 1] = n ? s / n : tp - 0.06; texH[o + 2] = 0;
    } else { texH[o + 1] = tp - 0.06; texH[o + 2] = 0; }
    texH[o + 3] = ice[c];
    // colour
    const mc = MATCOL[mat[c]], wetk = Math.min(1, moist[c] * 0.8 + (raint[c] > 0 ? 0.3 : 0));
    const hv = 0.94 + 0.12 * hash2(i * 1.7, j * 1.3);
    let r = (mc[0] + (mc[3] - mc[0]) * wetk) * hv, g = (mc[1] + (mc[4] - mc[1]) * wetk) * hv, b = (mc[2] + (mc[5] - mc[2]) * wetk) * hv;
    let e = 0;
    const v = veg[c];
    if (v > 0.01) {
      const lush = Math.min(1, v * moist[c] * 1.6), a = Math.min(1, v * 1.7 + 0.08);
      let gr = 0.66 - 0.40 * lush, gg = 0.80 - 0.19 * lush, gb = 0.32 - 0.07 * lush;
      if (moist[c] < 0.2) { const y = (0.2 - moist[c]) * 5; gr += (0.80 - gr) * y; gg += (0.72 - gg) * y; gb += (0.36 - gb) * y; }
      if (flo[c] > 0.3) { gr += 0.05; gg += 0.03; }
      r += (gr - r) * a; g += (gg - g) * a; b += (gb - b) * a;
    }
    if (ash[c] > 0.01) { const a = Math.min(0.9, ash[c] * 1.1); r += (0.63 - r) * a; g += (0.61 - g) * a; b += (0.60 - b) * a; }
    if (char[c] > 0.01) { const a = char[c] * 0.82; r += (0.13 - r) * a; g += (0.11 - g) * a; b += (0.10 - b) * a; }
    if (vent[c] > 0.05) { const a = Math.min(0.6, vent[c]); r += (0.34 - r) * a; g += (0.16 - g) * a; b += (0.12 - b) * a; e = Math.max(e, vent[c] * 0.22); }
    if (snow[c] > 0.004) {
      const a = smooth(0, 0.1, snow[c]);
      const gl = glac[c];
      r += (0.95 - 0.17 * gl - r) * a; g += (0.97 - 0.05 * gl - g) * a; b += (1.0 - b) * a;
    }
    const t = T[c];
    if (t > 75 && d < 0.01) e = Math.max(e, Math.min(0.42, (t - 75) / 320));
    if (fire[c] > 0) e = Math.max(e, 0.3 + fire[c] * 0.35);
    if (lava[c] > 0.001) {
      const a = smooth(0.0, 0.03, lava[c]);
      r += (0.24 - r) * a; g += (0.09 - g) * a; b += (0.07 - b) * a;
      e = Math.max(e, a * (0.45 + 0.55 * lh[c]));
    }
    if (!inside[c]) e = 0;
    texC[o] = r >= 1 ? 255 : (r * 255) | 0; texC[o + 1] = g >= 1 ? 255 : (g * 255) | 0; texC[o + 2] = b >= 1 ? 255 : (b * 255) | 0;
    texC[o + 3] = (e * 255) | 0;
  }
}

// ───────────────────────── fx: particles, bolts, rings, clouds, lights ─────────────────────────



function makePool(cap) {
  const f = () => new Float32Array(cap);
  return { cap, n: 0, px: f(), py: f(), pz: f(), vx: f(), vy: f(), vz: f(), life: f(), max: f(), s0: f(), s1: f(), r: f(), g: f(), b: f(), a: f(), grav: f(), drag: f(), st: f(), fl: new Uint8Array(cap), data: new Float32Array(cap * 9) };
}
const PA = makePool(3600);   // alpha-blended: smoke, steam, rain, snow, dust
const PB = makePool(2600);   // additive: fire, sparks, glints
const FL_GROUND = 1, FL_FADEIN = 2, FL_WIND = 4, FL_FREE = 8;   // FREE: may exist outside the glass

function emit(P, x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a, grav, drag, fl, st) {
  if (P.n >= P.cap) return;
  const i = P.n++;
  P.px[i] = x; P.py[i] = y; P.pz[i] = z; P.vx[i] = vx; P.vy[i] = vy; P.vz[i] = vz;
  P.life[i] = life; P.max[i] = life; P.s0[i] = s0; P.s1[i] = s1;
  P.r[i] = r; P.g[i] = g; P.b[i] = b; P.a[i] = a; P.grav[i] = grav; P.drag[i] = drag; P.fl[i] = fl | 0; P.st[i] = st || 1;
}
function poolStep(P, dt) {
  const lim = R - 0.18, lim2 = lim * lim;
  const wx = G.windX || 0, wz = G.windZ || 0;
  let i = 0;
  while (i < P.n) {
    let dead = (P.life[i] -= dt) <= 0;
    if (!dead) {
      const k = Math.max(0, 1 - P.drag[i] * dt);
      let vx = P.vx[i] * k, vy = P.vy[i] * k - P.grav[i] * dt, vz = P.vz[i] * k;
      const fl = P.fl[i];
      if (fl & FL_WIND) { vx += wx * dt; vz += wz * dt; }

        const vn = vx * nx + vy * ny + vz * nz;
        if (vn > 0) { vx -= vn * nx; vy -= vn * ny; vz -= vn * nz; }
      }
      if (fl & FL_GROUND) {
        const c = cellAt(x, z);
        if (c >= 0 && y < W.top[c] + W.w[c]) dead = true;
      }
      P.px[i] = x; P.py[i] = y; P.pz[i] = z; P.vx[i] = vx; P.vy[i] = vy; P.vz[i] = vz;
    }
    if (dead) {
      const l = --P.n;
      if (i !== l) {

// ───────── trees ─────────  st: 0 alive, 1 burning, 2 snag, 3 fallen;  sp: 0 broadleaf, 1 pine, 2 elder
function trySapling(c, force, sp) {
  const T = G.trees;
  if (c < N || c >= NN - N || !W.inside[c] || W.treeAt[c] || T.length >= 540) return -1;
  if (W.w[c] > 0.03 || W.lava[c] > 0 || W.snow[c] > 0.1 || W.fire[c] > 0) return -1;
  const k = W.mat[c];
  if (k !== SOIL && k !== LOAM) return -1;
  if (!force && (W.moist[c] < 0.4 || W.veg[c] < 0.3 || W.T[c] < 0.5 || W.T[c] > 45)) return -1;
  if (W.treeAt[c - 1] || W.treeAt[c + 1] || W.treeAt[c - N] || W.treeAt[c + N]) return -1;
  if (!force) {                                          // no thickets: a little elbow room
    let near = 0;
    for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) if (W.treeAt[c + di + dj * N]) near++;
    if (near > 2) return -1;
  }
  const i = c % N, j = (c / N) | 0;
  const species = sp !== undefined ? sp : (tempAmbient(W.h[c]) < 6.5 ? 1 : 0);
  const t = {
    c, x: W.xs[i] + (hash2(i, j) - 0.5) * CS * 0.7, z: W.xs[j] + (hash2(j, i) - 0.5) * CS * 0.7,
    s: 0.12, sp: species, st: 0, t: 0, yaw: rnd() * TAU, fx: 0, fz: 0, fall: 0, hp: 1,
    k: 0.75 + rnd() * 0.5, hue: rnd(), sway: 0,
  };
  T.push(t);
  W.treeAt[c] = T.length;
  return T.length - 1;
}
function treeIgnite(idx) {
  const t = G.trees[idx];
  if (!t || t.st !== 0 || t.sp === 2) return;
  t.st = 1; t.t = 0;
  SFX.ignite(panAt(t.x, 0, t.z));
}
function treeFell(idx, dx, dz) {
  const t = G.trees[idx];
  if (!t || t.st === 3 || t.sp === 2 || t.s < 0.3) return;
  const l = Math.hypot(dx, dz) || 1;
  t.fx = dx / l; t.fz = dz / l; t.fall = 0.001; t.t = 0;
  t.dead = t.st !== 0;
  t.st = 3;
  SFX.treefall(panAt(t.x, 0, t.z));
}
function treeRemove(idx) {
  const T = G.trees, t = T[idx], last = T.length - 1;
  W.treeAt[t.c] = 0;
  if (idx !== last) { T[idx] = T[last]; W.treeAt[T[idx].c] = idx + 1; }
  T.pop();
}
function treesStep(dtv, phase) {
  const T = G.trees;
  for (let i = T.length - 1; i >= 0; i--) if ((i & 7) === phase) treeUpdate(i, dtv);
}
function treeUpdate(i, dtv) {
  const T = G.trees, t = T[i];
  if (!t) return;
  const c = t.c;
  if (!W.inside[c]) { treeRemove(i); return; }
  if (t.st === 0) {
    const m = W.moist[c], tm = W.T[c];
    if (t.sp !== 2) {
      if (W.lava[c] > 0 || W.fire[c] > 0.3) { treeIgnite(i); return; }
      if (W.w[c] > 0.3 || m < 0.09 || tm > 60) t.hp -= dtv * 0.06; else if (t.hp < 1) t.hp = Math.min(1, t.hp + dtv * 0.05);
      if (t.hp <= 0) { t.st = 2; t.t = 0; return; }
    }
    if (m > 0.26 && tm > 0 && tm < 46 && t.s < 1) t.s = Math.min(1, t.s + dtv * (t.sp === 2 ? 0.09 : 0.0105) * (0.5 + m) * (0.6 + W.fert[c]));
    if (t.s > 0.85 && rnd() < dtv * 0.004) {
      const c2 = c + (((rnd() * 9) | 0) - 4) + (((rnd() * 9) | 0) - 4) * N;
      trySapling(c2, false);
    }
  } else if (t.st === 1) {
    t.t += dtv;
    W.fire[c] = Math.max(W.fire[c], 0.6);
    if (t.t > 5.5) { t.st = 2; t.t = 0; W.ash[c] = Math.min(1, W.ash[c] + 0.5); W.char[c] = 1; }
  } else if (t.st === 2) {
    t.t += dtv;
    if (t.t > 85) { W.fert[c] = Math.min(1, W.fert[c] + 0.2); treeRemove(i); }
  } else {
    t.t += dtv;
    if (t.t > 50) { W.fert[c] = Math.min(1, W.fert[c] + 0.2); W.sb[c] = 1; treeRemove(i); }
  }
}
const CAN = [[0.28, 0.62, 0.25], [0.36, 0.7, 0.28], [0.22, 0.55, 0.3], [0.45, 0.72, 0.25]];
function treesDraw(dt) {

  const time = G.time;
  for (let i = 0; i < T.length; i++) {
    const t = T[i], y = W.top[t.c] - 0.02, s = (0.35 + 0.75 * t.s) * t.k;

      const gs = 0.25 + 1.0 * t.s, pulse = 0.12 + 0.06 * Math.sin(time * 1.3);
      M.elderTrunk.add(t.x, y, t.z, t.yaw, 0, 0, gs, gs, gs, 1, 1, 1, 0);
      M.elderCanopy.add(t.x, y, t.z, t.yaw, 0, 0, gs, gs, gs, 0.62, 0.86, 0.3, pulse);
      continue;
    }
    let pitch = 0, yaw = t.yaw;
    if (t.fall > 0) {
      if (t.fall < 1) t.fall = Math.min(1, t.fall + dt * (0.6 + t.fall * 3));
      yaw = Math.atan2(t.fx, t.fz); pitch = t.fall * t.fall * 1.5;
    }
    const snow = W.snow[t.c] > 0.05 ? 1 : 0;
    if (t.st === 2 || (t.st === 3 && t.dead)) { M.snag.add(t.x, y, t.z, yaw, pitch, 0, s, s, s, 1, 1, 1, 0); continue; }
    if (t.s < 0.34) {                                 // a bush

function mossbackStep(w, dt) {

  w.rise = Math.min(1, w.rise + dt * 0.8);

      const S = HAB.S.barren.length ? HAB.S.barren : HAB.S.grass;

      for (let q = 0; q < 4 && S.length; q++) { const s = pick(S), sd = Math.hypot(W.xs[s % N] - w.gx, W.xs[(s / N) | 0] - w.gz); if (sd < bd && sd > 0.6) { bd = sd; k = s; } }

    return;
  }
  const sp = w.fireT ? 0.75 : 0.34;

    if (rnd() < 0.5) fxGlints(nx, W.top[nc] + 0.05, nz, 2, 0.6, 1, 0.4, 0.4);
  }
}

// fallen meteorites: hot at first, and waiting for something to happen to them

function toolDown(hit) {
  const t = TOOLMAP[G.tool];

}
function toolUp() {

}

function toolsStep(dt) {
  if (TS.cool > 0) TS.cool -= dt;

  const rad = TOOLMAP[id].r;
  if (id === 'raise') {
    let gey = -1;
    forBrush(x, z, rad, (c, f) => {
      const dh = dt * 1.55 * f;
      if (W.h[c] + W.lava[c] < HMAX) W.h[c] = Math.min(HMAX, W.h[c] + dh);
      if (W.ero[c] > 0) W.ero[c] = Math.max(0, W.ero[c] - dh);

      else if (W.vent[c] > 0) W.vent[c] = Math.max(0, W.vent[c] - dh * 1.3);       // fresh earth seals a dry vent

    if (gey >= 0) { TS.geyT += dt; if (TS.geyT > 0.45) { TS.geyT = 0; makeWonder('geyser', gey); } }

      if (W.flo[c] > 0) W.flo[c] = Math.max(0, W.flo[c] - dh * 2);
      const k = W.mat[c];
      if (W.dig[c] > 0.3 && (k === BASALT || k === OBSIDIAN || k === GLASS || k === LOAM || k === SAND)) { strataMat(c); W.dig[c] = 0; }
      else if (k === SOIL && W.h[c] < ROCK_Y - 0.2) strataMat(c);

  if (PA.n) { poolFill(PA); gl.bindVertexArray(RD.partA.vao); gl.bindBuffer(gl.ARRAY_BUFFER, RD.partA.buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, PA.data, 0, PA.n * 9); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, PA.n); }
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  if (PB.n) { poolFill(PB); gl.bindVertexArray(RD.partB.vao); gl.bindBuffer(gl.ARRAY_BUFFER, RD.partB.buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, PB.data, 0, PB.n * 9); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, PB.n); }
  p = RD.pIm; gl.useProgram(p.p);
  if (IMB.n) { gl.bindVertexArray(RD.imB.vao); gl.bindBuffer(gl.ARRAY_BUFFER, RD.imB.buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, IMB.d, 0, IMB.n * 7); gl.drawArrays(gl.TRIANGLES, 0, IMB.n); }
  // 6. the glass
  gl.disable(gl.DEPTH_TEST); gl.blendFunc(gl.ONE, gl.ONE);
  rayUniforms(RD.pGlass);
  gl.bindVertexArray(RD.fsVao); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.BLEND); gl.depthMask(true); gl.bindVertexArray(null);
}

// clouds are drawn as instanced puffs, squashed against the glass where they touch it
function cloudsDraw() {
  M.puff.clear();
  const time = G.time;
  for (const c of G.clouds) {
    const g = clamp(c.grow, 0, 1);
    if (g <= 0.01) continue;
    const bx = c.pinned && c.cx !== undefined ? c.cx : c.x, bz = c.pinned && c.cz !== undefined ? c.cz : c.z;
    let r = lerp(1, 0.34, c.dark), gg = lerp(1, 0.36, c.dark), b = lerp(1, 0.43, c.dark);
    if (c.tint) { r *= c.tint[0]; gg *= c.tint[1]; b *= c.tint[2]; if (c.kind === 'ash') { r = c.tint[0]; gg = c.tint[1]; b = c.tint[2]; } }
    for (const q of c.puffs) {
      const s = q.s * c.size * g * 1.25;
      let px = bx + q.ox * c.size * 1.25, py = c.y + q.oy * c.size + Math.sin(time * 0.6 + q.ph) * 0.04, pz = bz + q.oz * c.size * 1.25;
      const d = Math.hypot(px, py, pz), lim = R - s * 0.75 - 0.1;
      if (d > lim) { const k = lim / d; px *= k; py *= k; pz *= k; }
      M.puff.add(px, py, pz, q.ph, 0, 0, s, s * 0.8, s, r, gg, b, 0);
    }
  }
}

// ════════ main.js ════════
// ───────────────────────── main: boot, input, the loop ─────────────────────────












const STEP = 0.05;
const IN = { mode: null, lx: 0, ly: 0, px: 0, py: 0, keys: {}, touches: new Map(), pinch: 0, anchor: null, apx: 0, apy: 0 };
const LOOP = { last: 0, acc: 0, skip: false, carry: 0, floraT: 0, slow: 0, fast: 0 };

const ICONS = {
  raise: '<path d="M3 19 L10 8 L14 13 L17 10 L21 19 Z"/><path d="M12 2.5v4M10 4.5l2-2 2 2" class="thin"/>',
  lower: '<path d="M3 9h4c1 6 3 9 5 9s4-3 5-9h4"/><path d="M12 4v6M10 8l2 2 2-2" class="thin"/>',
  water: '<path d="M12 3c3.2 4.4 5.5 7.4 5.5 10.6a5.5 5.5 0 0 1-11 0C6.500 10.4 8.800 7.400 12 3Z"/>',
  seed: '<path d="M12 21v-9"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6Z"/><path d="M12 16c0-3-2-5-6-5 0 3 2 5 6 5Z"/>',
  sun: '<circle cx="12" cy="12" r="4.200"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100" class="thin"/>',
  erupt: '<path d="M3 20 L9.500 10h5L21 20Z"/><path d="M12 9V4M9 7.500 7.500 4M15 7.500 16.500 4" class="thin"/>',
  quake: '<path d="M2.500 6h19M2.500 18h19" class="thin"/><path d="M13 6l-3 4 4 2-4 3 2 3"/>',
  meteor: '<circle cx="8.500" cy="15.500" r="4.500"/><path d="M12 11.500 20.500 3M14.500 14 21 8M9.500 9 15 3.500" class="thin"/>',
  storm: '<path d="M6.500 12.500a4 4 0 0 1 .8-7.900 5.500 5.500 0 0 1 10.400 1.400 3.300 3.300 0 0 1-.700 6.500Z"/><path d="M12.500 12.500 10 17h3.500L11.500 21.500" class="thin"/>',
  blizzard: '<path d="M12 2.500v19M3.800 7.200l16.400 9.600M3.800 16.800l16.400-9.600" class="thin"/><path d="M9.500 4.500 12 7l2.500-2.500M9.500 19.500 12 17l2.500 2.500" class="thin"/>',
};

// ───────── picking: where on the land is the pointer? ─────────
function pickLand(px, py) {
  const cv = IN.canvas, cam = G.cam;
  const w = cv.clientWidth || 1, h = cv.clientHeight || 1;
  const nx = (px / w) * 2 - 1, ny = 1 - (py / h) * 2;
  let dx = cam.fwd[0] + cam.right[0] * nx * cam.tanF * cam.aspect + cam.up[0] * ny * cam.tanF;
  let dy = cam.fwd[1] + cam.right[1] * nx * cam.tanF * cam.aspect + cam.up[1] * ny * cam.tanF;
  let dz = cam.fwd[2] + cam.right[2] * nx * cam.tanF * cam.aspect + cam.up[2] * ny * cam.tanF;
  const l = 1 / Math.hypot(dx, dy, dz); dx *= l; dy *= l; dz *= l;
  const ox = cam.pos[0], oy = cam.pos[1], oz = cam.pos[2];
  const rr2 = (R - 0.03) * (R - 0.03);
  const b = ox * dx + oy * dy + oz * dz, c = ox * ox + oy * oy + oz * oz - rr2, disc = b * b - c;
  if (disc <= 0) return null;
  const sq = Math.sqrt(disc), t0 = Math.max(0, -b - sq), t1 = -b + sq;
  let tp = t0;
  if (oy + dy * t0 < surfAt(ox + dx * t0, oz + dz * t0)) return null;       // entered through the cut-away, not the land
  for (let t = t0 + 0.08; t <= t1; t += 0.08) {
    const x = ox + dx * t, y = oy + dy * t, z = oz + dz * t;
    if (y < surfAt(x, z)) {
      let a = tp, bb = t;
      for (let i = 0; i < 7; i++) { const m = (a + bb) / 2; if (oy + dy * m < surfAt(ox + dx * m, oz + dz * m)) bb = m; else a = m; }
      const m = (a + bb) / 2;
      return [ox + dx * m, oy + dy * m, oz + dz * m];
    }
    tp = t;
  }
  return null;
}

// ───────── UI ─────────
function $(id) { return document.getElementById(id); }
function selectTool(id) {
  if (!TOOLMAP[id]) return;
  if (IN.mode === 'tool') { toolUp(); IN.mode = null; }
  G.tool = id;
  for (const t of TOOLS) { const b = $('tool-' + t.id); if (b) b.classList.toggle('on', t.id === id); }
  const tip = $('tip');
  if (tip) { tip.innerHTML = '<b>' + TOOLMAP[id].name + '</b> — ' + TOOLMAP[id].tip; tip.className = 'tip ' + TOOLMAP[id].set; }
}
function buildUI() {
  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.id = 'tool-' + t.id; b.className = 'tool ' + t.set; b.title = t.tip;
    b.innerHTML = '<svg viewBox="0 0 24 24">' + ICONS[t.id] + '</svg><span>' + t.name + '</span><kbd>' + ((i + 1) % 10) + '</kbd>';
    b.addEventListener('click', () => { boot(); selectTool(t.id); SFX.click(); });
    $(t.set === 'tend' ? 'tools-tend' : 'tools-wreck').appendChild(b);
  });
  $('btn-journal').addEventListener('click', () => { boot(); toggleJournal(); SFX.click(); });
  $('journal-close').addEventListener('click', () => toggleJournal(false));
  $('btn-sound').addEventListener('click', () => { boot(); const on = audioToggle(); $('btn-sound').classList.toggle('off', !on); $('btn-sound').textContent = on ? 'Sound on' : 'Sound off'; });
  $('btn-new').addEventListener('click', () => { boot(); newWorld(); SFX.shimmer(0); });
  $('btn-help').addEventListener('click', () => { $('help').classList.toggle('hide'); });
  $('help').addEventListener('click', () => { $('help').classList.add('hide'); boot(); });
  $('btn-forget').addEventListener('click', () => { discReset(); journalRender(); });
  selectTool('raise');
}
function toggleJournal(v) { DS.open = v === undefined ? !DS.open : v; $('journal').classList.toggle('open', DS.open); DS.dirty = true; }
function boot() { audioInit(); audioResume(); G.idle = 0; }

// ───────── input ─────────
function bindInput(cv) {
  const pos = (e) => { const r = cv.getBoundingClientRect(); IN.px = e.clientX - r.left; IN.py = e.clientY - r.top; };
  cv.addEventListener('pointerdown', (e) => {
    boot(); pos(e);
    $('help').classList.add('hide');
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    IN.touches.set(e.pointerId, [e.clientX, e.clientY]);
    G.pointer.over = true;
    if (IN.touches.size >= 2) {                          // two fingers: orbit + pinch
      if (IN.mode === 'tool') toolUp();
      IN.mode = 'pinch'; IN.pinch = 0; return;
    }
    IN.lx = e.clientX; IN.ly = e.clientY;
    const hit = pickLand(IN.px, IN.py);
    G.pointer.hit = hit;
    if (e.button === 0 && !e.shiftKey && !e.altKey && !e.ctrlKey && hit) { IN.mode = 'tool'; IN.anchor = hit; IN.apx = IN.px; IN.apy = IN.py; toolDown(hit); }
    else IN.mode = 'orbit';
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    pos(e); G.pointer.over = true; G.idle = Math.min(G.idle, 5.9);
    if (IN.touches.has(e.pointerId)) IN.touches.set(e.pointerId, [e.clientX, e.clientY]);
    if (IN.mode === 'pinch' && IN.touches.size >= 2) {
      const p = [...IN.touches.values()], d = Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]), mx = (p[0][0] + p[1][0]) / 2, my = (p[0][1] + p[1][1]) / 2;
      if (IN.pinch > 0) { G.cam.dist = clamp(G.cam.dist * IN.pinch / d, 13, 62); G.cam.yaw -= (mx - IN.lx) * 0.006; G.cam.pitch = clamp(G.cam.pitch + (my - IN.ly) * 0.005, -0.14, 1.36); }
      IN.pinch = d; IN.lx = mx; IN.ly = my; G.idle = 0;
      return;
    }
    if (IN.mode === 'orbit') {
      G.cam.yaw -= (e.clientX - IN.lx) * 0.006;
      G.cam.pitch = clamp(G.cam.pitch + (e.clientY - IN.ly) * 0.005, -0.14, 1.36);
      G.idle = 0;
    }
    IN.lx = e.clientX; IN.ly = e.clientY;
  });
  const up = (e) => {
    IN.touches.delete(e.pointerId);
    if (IN.mode === 'tool') toolUp();
    if (IN.mode === 'pinch' && IN.touches.size > 0) { IN.pinch = 0; return; }
    IN.mode = null;
    if (e.pointerType === 'touch') { G.pointer.over = false; G.pointer.hit = null; }
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { if (IN.mode === null) { G.pointer.over = false; G.pointer.hit = null; } });
  cv.addEventListener('contextmenu', (e) => e.preventDefault());
  cv.addEventListener('wheel', (e) => {
    e.preventDefault(); boot();
    const k = e.ctrlKey ? 0.012 : 0.0014, dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
    G.cam.dist = clamp(G.cam.dist * Math.exp(clamp(dy, -200, 200) * k), 13, 62);
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || !e.key) return;
    IN.keys[e.key.toLowerCase()] = true;
    const d = e.key.length === 1 ? '1234567890'.indexOf(e.key) : -1;
    if (d >= 0) { boot(); selectTool(TOOLS[d].id); SFX.click(); }
    else if (e.key === 'j' || e.key === 'J') toggleJournal();
    else if (e.key === 'm' || e.key === 'M') $('btn-sound').click();
    else if (e.key === 'Escape') { toggleJournal(false); $('help').classList.add('hide'); }
  });
  window.addEventListener('keyup', (e) => { if (e.key) IN.keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { IN.keys = {}; if (IN.mode === 'tool') toolUp(); IN.mode = null; });
}

// ───────── world lifecycle ─────────
function newWorld(seed) {
  G.seed = seed || ((Math.random() * 1e6) | 0) + 1;
  G.events.length = 0; G.wonders.length = 0; G.stars.length = 0; G.clouds.length = 0; G.lights.length = 0;
  BOMBS.length = 0; MOTES.length = 0; BOLTS.length = 0; RINGS.length = 0; PINGS.length = 0; PA.n = 0; PB.n = 0;
  G.vapor = 10; G.shake = 0;
  twisterReset(); toolsReset();
  worldGen(G.seed);
  lifeGen();
  for (let i = 0; i < 3; i++) { const a = rnd() * TAU, d = 2 + rnd() * 5; const c = makeCloud(Math.cos(a) * d, Math.sin(a) * d, { life: 40 + rnd() * 60 }); c.grow = 1; }
  habitatScan();
  floraBuild();
  worldTextures();
}

function simStep() {
  G.step++;
  worldStep(STEP);
  cloudsStep(STEP);
  treesStep(STEP * 8, G.step & 7);
  if (G.step % 20 === 10) { habitatScan(); crittersCensus(); }
}

function tick(dt) {
  G.dt = dt; G.time += dt; G.idle += dt;
  renderResize();
  // keyboard orbit, and a slow drift when left alone
  const k = IN.keys, cam = G.cam;
  if (k['arrowleft'] || k['a']) { cam.yaw -= dt * 1.4; G.idle = 0; }
  if (k['arrowright'] || k['d']) { cam.yaw += dt * 1.4; G.idle = 0; }
  if (k['arrowup'] || k['w']) { cam.pitch = clamp(cam.pitch + dt * 0.9, -0.14, 1.36); G.idle = 0; }
  if (k['arrowdown'] || k['s']) { cam.pitch = clamp(cam.pitch - dt * 0.9, -0.14, 1.36); G.idle = 0; }
  if (k['='] || k['+']) cam.dist = clamp(cam.dist * (1 - dt), 13, 62);
  if (k['-'] || k['_']) cam.dist = clamp(cam.dist * (1 + dt), 13, 62);
  if (G.idle > 25) cam.yaw += dt * 0.035 * Math.min(1, (G.idle - 25) / 5);
  cameraUpdate();
  const p = G.pointer;
  if (G.testHit) p.hit = G.testHit;
  else if (IN.mode === 'tool' && IN.anchor && (G.tool === 'raise' || G.tool === 'lower') && Math.hypot(IN.px - IN.apx, IN.py - IN.apy) < 4) {
    // while sculpting with a still pointer, stay on the same spot of land instead of sliding up the growing slope
    p.hit = [IN.anchor[0], surfAt(IN.anchor[0], IN.anchor[2]), IN.anchor[2]];
  } else {
    p.hit = p.over && IN.mode !== 'orbit' && IN.mode !== 'pinch' ? pickLand(IN.px, IN.py) : null;
    if (p.hit) { IN.anchor = p.hit; IN.apx = IN.px; IN.apy = IN.py; }
  }

  toolsStep(dt);
  eventsStep(dt);
  LOOP.acc += dt;
  let n = 0;
  while (LOOP.acc >= STEP && n < 3) { simStep(); LOOP.acc -= STEP; n++; }
  if (LOOP.acc > STEP) LOOP.acc = 0;
  wondersStep(dt);
  crittersStep(dt);
  fxAmbient(dt);
  fxStep(dt);
  LOOP.floraT -= dt;
  if (LOOP.floraT <= 0) { LOOP.floraT = 0.5; floraBuild(); }
  worldTops();
  worldTextures();
  treesDraw(dt); crittersDraw(); cloudsDraw();
  fxDraw(dt); wondersDraw(); toolsDraw();

  // the world's own noises
  if (W.fireCells > 0) { setLoop('fire', Math.min(0.3, 0.05 + W.fireCells * 0.003), 1300); if (rnd() < dt * Math.min(28, 3 + W.fireCells * 0.4)) SFX.crackle((rnd() - 0.5) * 1.2); }
  if (W.lavaCells > 0) { setLoop('rumble', Math.min(0.14, W.lavaCells * 0.0007), 70); if (rnd() < dt * Math.min(2.5, W.lavaCells * 0.02)) SFX.blip((rnd() - 0.5)); }
  if (W.boil > 0) { setLoop('hiss', Math.min(0.22, 0.04 + W.boil * 0.012)); }
  for (const c of G.clouds) if (c.rain > 0 && c.kind !== 'tool') { setLoop('rain', 0.09); break; }
  audioStep();
  journalRender();
  if (!G.headless) renderFrame();
}

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - LOOP.last) / 1000;
  LOOP.last = now;
  if (!(dt > 0)) return;
  if (dt > 0.1) dt = 0.1;
  const busy = G.idle < 6 || G.events.length > 0 || G.twister || IN.mode !== null;
  if (!busy) {                                           // nobody is poking: half frame rate, stay cool
    LOOP.skip = !LOOP.skip;
    if (LOOP.skip) { LOOP.carry = dt; return; }
    dt = Math.min(0.1, dt + LOOP.carry); LOOP.carry = 0;
  } else {
    // if the machine struggles, quietly lower the resolution
    if (dt > 0.042) LOOP.slow += dt; else LOOP.slow = Math.max(0, LOOP.slow - dt * 0.5);
    if (LOOP.slow > 2.5 && renderScaleGet() > 0.55) { renderScale(renderScaleGet() - 0.15); LOOP.slow = 0; }
  }
  tick(dt);
}

function start() {
  const cv = $('c');
  IN.canvas = cv;
  const gl = glInit(cv);
  if (!gl) { $('err').textContent = 'This toy needs WebGL2, which this browser does not seem to offer.'; $('err').classList.add('show'); return; }
  worldAlloc();
  modelsInit();
  const ok = renderInit(cv);
  if (!ok) { $('err').textContent = 'Shader problem:\n' + GLX.errors.join('\n'); $('err').classList.add('show'); }
  discLoad();
  buildUI();
  bindInput(cv);
  renderResize();
  newWorld();
  window.dewdrop = { G, W, HAB, DS, TOOLS, M, SHADERS, tick, newWorld, startEvent, makeWonder, selectTool, toolDown, toolUp, discover, rareStep, RNG };
  LOOP.last = performance.now();
  requestAnimationFrame(frame);
}
if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
}

})();
</script>
