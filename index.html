<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23dfeef5'/%3E%3Cpath d='M3.5 38h57a29 29 0 0 1-57 0z' fill='%238a6a4a'/%3E%3Cpath d='M3.6 36h56.8v4H3.6z' fill='%238fb573'/%3E%3C/svg%3E">
<script>
/* ======================================================================
   DATA. Edit here; the page is built from it.

   PLAY is the one picture on the page: the current game.

   LISTS are plain text. An item with a path is published and opens;
   an item without one is not published yet and shows faint
   (set SHOW_UNPUBLISHED to false to hide those).
     num:    optional short index shown before the title
     path:   the folder inside this repo that opens
     prompt: optional readable page of the prompt that made it
   ====================================================================== */
var SHOW_UNPUBLISHED = true;

var PLAY = { title: 'Marble', path: 'rounds/test-06/', prompt: 'rounds/test-06/prompt.html', cover: 'rounds/test-06/hero.jpg' };

var LISTS = [
  { id: 'rounds', name: 'Rounds', icon: 'stack', items: [
    { num: '1', title: 'Flat garden',    path: 'rounds/test-01/', prompt: 'rounds/test-01/prompt.html' },
    { num: '2', title: 'First sphere' },
    { num: '3', title: 'Breadth' },
    { num: '4', title: 'Balance' },
    { num: '5', title: 'Wonders' },
    { num: 'C', title: 'Prompt only' },
    { num: '6', title: 'The hand',       path: 'rounds/test-06/', prompt: 'rounds/test-06/prompt.html' },
  ]},
  { id: 'studies', name: 'Studies', icon: 'drop', items: [
    { title: 'Lava' },
    { title: 'Water' },
    { title: 'Sky and weather' },
    { title: 'Layers and caves' },
    { title: 'Creatures' },
    { title: 'Scale' },
    { title: 'Interface' },
    { title: 'Tool settings' },
  ]},
  { id: 'tools', name: 'Tools', icon: 'tool', items: [
    { title: 'Asset manager', path: 'tools/assets/' },
  ]},
];
</script>
<style>
:root {
  --bg: #0e1114;
  --pane: #181c20;
  --text: #eceeef;
  --muted: #9aa2a7;
  --faint: #4e565c;
  --radius: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 16px 16px 32px;
}
a { color: inherit; text-decoration: none; }

header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.mark { width: 30px; height: 30px; flex: none; }
h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }

main { display: grid; gap: 36px; }

/* The one picture: the current game. */
.hero {
  position: relative; overflow: hidden; border-radius: var(--radius); background: var(--pane);
  aspect-ratio: 16 / 11; box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
}
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.95); transition: transform .5s ease, filter .3s ease; }
.hero:hover img, .hero:focus-within img { transform: scale(1.015); filter: brightness(1); }
.hero .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(to top, rgba(8, 10, 12, .85), rgba(8, 10, 12, 0)); pointer-events: none; }
.hero .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 20px 22px; }
.hero h2 { margin: 0 auto 0 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.hero .go::after { content: ""; position: absolute; inset: 0; }   /* the whole picture opens the game */
.pill {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px;
  font-size: 14px; font-weight: 500; border-radius: 999px; padding: 8px 15px; outline: none;
  background: rgba(255, 255, 255, .14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.pill.main { background: var(--text); color: var(--bg); }
.pill:hover, .pill:focus-visible { background: rgba(255, 255, 255, .26); }
.pill.main:hover, .pill.main:focus-visible { background: #fff; }
.pill:focus-visible { box-shadow: 0 0 0 3px rgba(236, 238, 239, .45); }
.pill svg { width: 14px; height: 14px; }

/* Text lists. */
.index { display: grid; gap: 28px 32px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-content: start; }
.head { display: flex; align-items: center; gap: 8px; padding: 0 10px 8px; }
.head svg { width: 14px; height: 14px; color: var(--faint); }
h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
li { display: flex; align-items: center; border-radius: 10px; }
li.on:hover, li.on:focus-within { background: rgba(255, 255, 255, .06); }
.item { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 12px; padding: 7px 10px; outline: none; border-radius: 10px; }
.item:focus-visible { box-shadow: inset 0 0 0 2px rgba(236, 238, 239, .45); }
.num { width: 14px; flex: none; color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
li.off { color: var(--faint); }
.doc { flex: none; display: grid; place-items: center; width: 32px; height: 32px; margin-right: 2px; border-radius: 8px; color: var(--faint); outline: none; }
.doc svg { width: 15px; height: 15px; }
li.on:hover .doc, .doc:focus-visible { color: var(--muted); }
.doc:hover, .doc:focus-visible { color: var(--text); background: rgba(255, 255, 255, .08); }

/* Laptop and projector: one screen, full width. */
@media (min-width: 900px) and (min-height: 560px) {
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; padding: 18px 32px 32px; }
  header { flex: none; margin-bottom: 18px; }
  main { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 48px; }
  .hero { aspect-ratio: auto; height: 100%; }
  .index { grid-template-columns: minmax(0, 1fr); gap: 26px; min-height: 0; overflow: auto; padding-top: 2px; }
  .index li { break-inside: avoid; }
  .name { font-size: 16px; }
}
/* Short screens (720p projectors): each list folds into two columns to stay short. */
@media (min-width: 900px) and (min-height: 560px) and (max-height: 820px) {
  .index { gap: 18px; }
  .index ul { columns: 2; column-gap: 16px; }
  .item { padding: 5px 10px; }
}
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <clipPath id="ball"><circle cx="32" cy="32" r="29"/></clipPath>
      <radialGradient id="sky" cx=".35" cy=".25" r=".9">
        <stop offset="0" stop-color="#f3f9fc"/><stop offset="1" stop-color="#cfe3ee"/>
      </radialGradient>
    </defs>
    <g clip-path="url(#ball)">
      <rect width="64" height="64" fill="url(#sky)"/>
      <path d="M0 37 C14 33 22 36 32 35 S52 33 64 36 V64 H0Z" fill="#8fb573"/>
      <path d="M0 40 C14 37 22 39 32 38.5 S52 37 64 39.5 V64 H0Z" fill="#a9825a"/>
      <path d="M0 47 C16 45 30 47 40 46 S56 45 64 46.5 V64 H0Z" fill="#7d6f63"/>
      <path d="M0 55 C18 54 30 55.5 44 54.5 S58 54 64 55 V64 H0Z" fill="#5f5650"/>
      <ellipse cx="32" cy="62.5" rx="14" ry="4" fill="#e0703a" opacity=".9"/>
    </g>
    <ellipse cx="22" cy="17" rx="9" ry="5" transform="rotate(-28 22 17)" fill="#fff" opacity=".7"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  </svg>
  <h1>Marble</h1>
</header>
<main id="root"></main>

<script>
(function () {
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    stack: '<path d="M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    drop:  '<path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    tool:  '<path d="M14.5 5.5a4 4 0 0 0 4.9 5L20 11l-8.5 8.5a2.1 2.1 0 0 1-3-3L17 8l.5.6a4 4 0 0 1-3-3.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    doc:   '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function hero(p) {
    return '<section class="hero">' +
      '<img src="' + esc(p.cover) + '" alt="">' +
      '<div class="shade"></div>' +
      '<div class="foot">' +
        '<h2><a class="go" href="' + esc(p.path) + '" tabindex="-1">' + esc(p.title) + '</a></h2>' +
        (p.prompt ? '<a class="pill nav" href="' + esc(p.prompt) + '">' + svg('doc') + 'Prompt</a>' : '') +
        '<a class="pill main nav" href="' + esc(p.path) + '">' + svg('play') + 'Play</a>' +
      '</div></section>';
  }

  function item(it) {
    var label = (it.num ? '<span class="num">' + esc(it.num) + '</span>' : '') + '<span class="name">' + esc(it.title) + '</span>';
    if (!it.path) return '<li class="off"><span class="item">' + label + '</span></li>';
    return '<li class="on"><a class="item nav" href="' + esc(it.path) + '">' + label + '</a>' +
      (it.prompt ? '<a class="doc" href="' + esc(it.prompt) + '" aria-label="Prompt for ' + esc(it.title) + '">' + svg('doc') + '</a>' : '') +
      '</li>';
  }

  function list(l) {
    var items = l.items.filter(function (it) { return it.path || SHOW_UNPUBLISHED; });
    if (!items.length) return '';
    return '<section><div class="head">' + svg(l.icon) + '<h3>' + esc(l.name) + '</h3></div>' +
      '<ul>' + items.map(item).join('') + '</ul></section>';
  }

  function render() {
    document.getElementById('root').innerHTML =
      (PLAY ? hero(PLAY) : '') +
      '<div class="index">' + LISTS.map(list).join('') + '</div>';
  }

  // Arrow keys move between things that open, for presenting from a keyboard or clicker.
  function onKey(ev) {
    if (!/^Arrow(Left|Right|Up|Down)$/.test(ev.key)) return;
    var els = Array.prototype.slice.call(document.querySelectorAll('.nav'));
    if (!els.length) return;
    var i = els.indexOf(document.activeElement);
    if (i < 0) { (document.querySelector('.pill.main') || els[0]).focus(); ev.preventDefault(); return; }
    var r = els[i].getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = -1, bestD = Infinity;
    var horiz = ev.key === 'ArrowRight' || ev.key === 'ArrowLeft';
    els.forEach(function (e, j) {
      if (j === i) return;
      var q = e.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      var ok = ev.key === 'ArrowRight' ? dx > 4 : ev.key === 'ArrowLeft' ? dx < -4 : ev.key === 'ArrowDown' ? dy > 4 : dy < -4;
      if (!ok) return;
      var d = horiz ? Math.abs(dx) + Math.abs(dy) * 3 : Math.abs(dy) + Math.abs(dx) * 3;
      if (d < bestD) { bestD = d; best = j; }
    });
    if (best >= 0) { els[best].focus(); ev.preventDefault(); }
  }

  render();
  // Safe to run twice: replace the listener rather than stacking it.
  if (window.__marbleKey) document.removeEventListener('keydown', window.__marbleKey);
  window.__marbleKey = onKey;
  document.addEventListener('keydown', onKey);
})();
</script>
</body>
</html>
