<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23dfeef5'/%3E%3Cpath d='M3.5 38h57a29 29 0 0 1-57 0z' fill='%238a6a4a'/%3E%3Cpath d='M3.6 36h56.8v4H3.6z' fill='%238fb573'/%3E%3C/svg%3E">
<script>
/* ======================================================================
   DATA. Edit here; the page is built from it.

   Each group is a section of the page and a heading in the sidebar.
   An item with a path is published: its card opens it. An item without
   one is not published yet and shows as a faint placeholder (set
   SHOW_UNPUBLISHED to false to hide those).
     id:     anchor for the sidebar link, e.g. 'round-6'
     num:    optional short index shown before the title
     path:   the folder inside this repo that opens
     cover:  picture for the card (16:10)
     prompt: optional readable page of the prompt that made it
   ====================================================================== */
var SHOW_UNPUBLISHED = true;

var GROUPS = [
  { id: 'play', name: 'Play', icon: 'play', items: [
    { id: 'marble', title: 'Marble', path: 'rounds/test-06/', cover: 'rounds/test-06/hero.jpg', prompt: 'rounds/test-06/prompt.html' },
  ]},
  { id: 'rounds', name: 'Rounds', icon: 'stack', items: [
    { id: 'round-1', num: '1', title: 'Flat garden',  path: 'rounds/test-01/', cover: 'rounds/test-01/cover.jpg', prompt: 'rounds/test-01/prompt.html' },
    { id: 'round-2', num: '2', title: 'First sphere', path: 'rounds/test-02/', cover: 'rounds/test-02/cover.jpg', prompt: 'rounds/test-02/prompt.html' },
    { id: 'round-3', num: '3', title: 'Breadth' },
    { id: 'round-4', num: '4', title: 'Balance' },
    { id: 'round-5', num: '5', title: 'Wonders' },
    { id: 'clean-1', num: 'C', title: 'Prompt only' },
    { id: 'round-6', num: '6', title: 'The hand',     path: 'rounds/test-06/', cover: 'rounds/test-06/cover.jpg', prompt: 'rounds/test-06/prompt.html' },
  ]},
  { id: 'studies', name: 'Studies', icon: 'drop', items: [
    { id: 'lava',          title: 'Lava' },
    { id: 'water',         title: 'Water' },
    { id: 'sky',           title: 'Sky and weather' },
    { id: 'layers',        title: 'Layers and caves' },
    { id: 'creatures',     title: 'Creatures', path: 'studies/creatures/', cover: 'studies/creatures/cover.jpg' },
    { id: 'scale',         title: 'Scale' },
    { id: 'interface',     title: 'Interface', path: 'studies/interface/', cover: 'studies/interface/cover.jpg' },
    { id: 'tool-settings', title: 'Tool settings' },
  ]},
  { id: 'tools', name: 'Tools', icon: 'tool', items: [
    { id: 'assets', title: 'Asset manager', path: 'tools/assets/', cover: 'tools/assets/cover.jpg' },
    { id: 'tool-map', title: 'Tool map', path: 'tools/tool-map/', cover: 'tools/tool-map/cover.jpg' },
  ]},
];
</script>
<style>
:root {
  --bg: #0e1114;
  --side: #121619;
  --pane: #171b1f;
  --empty: #14181b;
  --text: #eceeef;
  --muted: #9aa2a7;
  --faint: #4e565c;
  --hover: rgba(255, 255, 255, .06);
  --radius: 12px;
  --side-w: 248px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
svg { display: block; }

/* Sidebar */
.side {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w);
  background: var(--side); overflow-y: auto; padding: 18px 12px 32px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.mark { width: 28px; height: 28px; flex: none; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.side h2 { display: flex; align-items: center; gap: 8px; margin: 18px 0 4px; padding: 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side h2 svg { width: 13px; height: 13px; color: var(--faint); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side a {
  display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 8px;
  color: var(--muted); outline: none; transition: background .15s ease, color .15s ease;
}
.side a.off { color: var(--faint); }
.side a:hover, .side a:focus-visible { background: var(--hover); color: var(--text); }
.side a.here { background: rgba(255, 255, 255, .09); color: var(--text); }
.side .num { width: 12px; flex: none; color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Content */
main { margin-left: var(--side-w); padding: 28px 40px 50vh; max-width: calc(var(--side-w) + 1180px); }
.group { margin-bottom: 44px; scroll-margin-top: 24px; }
.group > h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.group > h2 svg { width: 14px; height: 14px; color: var(--faint); }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }

.card { position: relative; scroll-margin-top: 24px; border-radius: var(--radius); }
.pic {
  position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: var(--pane);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .22);
  transition: transform .18s ease, box-shadow .18s ease;
}
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.92); transition: filter .25s ease; }
.card.on:hover .pic, .card.on:focus-within .pic { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 12px 30px rgba(0, 0, 0, .38); }
.card.on:hover img, .card.on:focus-within img { filter: brightness(1); }
.card.off .pic { background: var(--empty); box-shadow: none; display: grid; place-items: center; }
.card.off .pic svg { width: 22%; opacity: .18; }
.card.flash .pic { box-shadow: 0 0 0 2px rgba(236, 238, 239, .5), 0 12px 30px rgba(0, 0, 0, .38); }

.meta { display: flex; align-items: center; gap: 10px; padding: 10px 2px 0; min-height: 40px; }
.meta .num { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; }
.go { font-weight: 500; outline: none; }
.go::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); }   /* the whole card opens the piece */
.card.on:has(.go:focus-visible) .pic { box-shadow: 0 0 0 3px rgba(236, 238, 239, .5); }
.card.off .title { color: var(--faint); }
.doc {
  position: relative; z-index: 1; margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted); padding: 5px 10px; border-radius: 999px; outline: none;
}
.doc svg { width: 13px; height: 13px; }
.doc:hover, .doc:focus-visible { color: var(--text); background: var(--hover); }

/* Prompt panel: slides in from the right. */
.veil { position: fixed; inset: 0; background: rgba(4, 6, 8, .45); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20; }
.veil.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 94vw); z-index: 21;
  background: var(--side); box-shadow: -20px 0 60px rgba(0, 0, 0, .45);
  transform: translateX(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .3s; visibility: hidden;
  display: flex; flex-direction: column; outline: none;
}
.panel.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { .panel, .panel.open, .veil { transition: none; } }
.ptop { display: flex; align-items: flex-start; gap: 8px; padding: 20px 20px 14px 24px; flex: none; }
.ptop .what { flex: 1; min-width: 0; }
.pkick { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ptitle { margin: 4px 0 0; font-size: 19px; font-weight: 600; line-height: 1.25; }
.pfacts { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.icon {
  flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
  color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; outline: none;
}
.icon:hover, .icon:focus-visible { background: var(--hover); color: var(--text); }
.icon svg { width: 16px; height: 16px; }
.pbody { flex: 1; overflow-y: auto; padding: 0 24px 40px; font-size: 14px; line-height: 1.6; overscroll-behavior: contain; }
.pctx { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.pbody h3 { margin: 18px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.pbody p { margin: 0; color: #dfe2e4; }
.pbody .wait { color: var(--faint); }

/* Phones: no sidebar, the sections simply stack. */
@media (max-width: 760px) {
  .side { position: static; width: auto; padding: 16px 8px 0; background: none; }
  .side nav { display: none; }
  .brand { padding-bottom: 6px; }
  main { margin-left: 0; padding: 16px 16px 40px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .meta { font-size: 14px; gap: 6px; }
  .doc { padding: 5px 6px; font-size: 0; }
  .doc svg { width: 15px; height: 15px; }
}
</style>
</head>
<body>
<aside class="side">
  <a class="brand" href="#top" aria-label="Marble, back to top">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <clipPath id="ball"><circle cx="32" cy="32" r="29"/></clipPath>
        <radialGradient id="sky" cx=".35" cy=".25" r=".9">
          <stop offset="0" stop-color="#f3f9fc"/><stop offset="1" stop-color="#cfe3ee"/>
        </radialGradient>
      </defs>
      <g clip-path="url(#ball)">
        <rect width="64" height="64" fill="url(#sky)"/>
        <path d="M0 37 C14 33 22 36 32 35 S52 33 64 36 V64 H0Z" fill="#8fb573"/>
        <path d="M0 40 C14 37 22 39 32 38.5 S52 37 64 39.5 V64 H0Z" fill="#a9825a"/>
        <path d="M0 47 C16 45 30 47 40 46 S56 45 64 46.5 V64 H0Z" fill="#7d6f63"/>
        <path d="M0 55 C18 54 30 55.5 44 54.5 S58 54 64 55 V64 H0Z" fill="#5f5650"/>
        <ellipse cx="32" cy="62.5" rx="14" ry="4" fill="#e0703a" opacity=".9"/>
      </g>
      <ellipse cx="22" cy="17" rx="9" ry="5" transform="rotate(-28 22 17)" fill="#fff" opacity=".7"/>
      <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
    </svg>
    <h1>Marble</h1>
  </a>
  <nav id="nav"></nav>
</aside>
<main id="top"></main>
<div class="veil" id="veil"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" tabindex="-1">
  <div class="ptop">
    <div class="what">
      <p class="pkick" id="pkick"></p>
      <h2 class="ptitle" id="ptitle"></h2>
      <p class="pfacts" id="pfacts"></p>
    </div>
    <a class="icon" id="ppage" href="#" aria-label="Open as a full page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <button class="icon" id="pclose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<script>
(function () {
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    stack: '<path d="M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    drop:  '<path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    tool:  '<path d="M14.5 5.5a4 4 0 0 0 4.9 5L20 11l-8.5 8.5a2.1 2.1 0 0 1-3-3L17 8l.5.6a4 4 0 0 1-3-3.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    doc:   '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    ball:  '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.3 13.5c3-1 6 .6 8.7 0s5.7-1 8.7 0" fill="none" stroke="currentColor" stroke-width="1.4"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shown(items) { return items.filter(function (it) { return it.path || SHOW_UNPUBLISHED; }); }

  function card(it) {
    var num = it.num ? '<span class="num">' + esc(it.num) + '</span>' : '';
    if (!it.path) {
      return '<article class="card off" id="' + esc(it.id) + '">' +
        '<div class="pic">' + svg('ball') + '</div>' +
        '<div class="meta">' + num + '<span class="title">' + esc(it.title) + '</span></div></article>';
    }
    return '<article class="card on" id="' + esc(it.id) + '">' +
      '<div class="pic">' + (it.cover ? '<img src="' + esc(it.cover) + '" alt="" loading="lazy">' : '') + '</div>' +
      '<div class="meta">' + num + '<a class="go" href="' + esc(it.path) + '">' + esc(it.title) + '</a>' +
        (it.prompt ? '<a class="doc" href="' + esc(it.prompt) + '">' + svg('doc') + 'Prompt</a>' : '') +
      '</div></article>';
  }

  function render() {
    var groups = GROUPS.map(function (g) { return { g: g, items: shown(g.items) }; }).filter(function (x) { return x.items.length; });
    document.getElementById('top').innerHTML = groups.map(function (x) {
      return '<section class="group" id="' + esc(x.g.id) + '"><h2>' + svg(x.g.icon) + esc(x.g.name) + '</h2>' +
        '<div class="grid">' + x.items.map(card).join('') + '</div></section>';
    }).join('');
    document.getElementById('nav').innerHTML = groups.map(function (x) {
      return '<h2>' + svg(x.g.icon) + esc(x.g.name) + '</h2><ul>' + x.items.map(function (it) {
        return '<li><a href="#' + esc(it.id) + '" data-to="' + esc(it.id) + '"' + (it.path ? '' : ' class="off"') + '>' +
          (it.num ? '<span class="num">' + esc(it.num) + '</span>' : '') + '<span>' + esc(it.title) + '</span></a></li>';
      }).join('') + '</ul>';
    }).join('');
  }

  // Prompt panel. The prompt pages stay the source: the panel reads one and
  // shows it as plain paragraphs. A cmd/ctrl-click still opens the page itself.
  var cache = {}, lastFocus = null, panel = document.getElementById('panel');
  function text(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function loadPrompt(href) {
    if (cache[href]) return Promise.resolve(cache[href]);
    return fetch(href).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
      var d = new DOMParser().parseFromString(html, 'text/html');
      var p = {
        kick: text(d.querySelector('.kicker')),
        title: text(d.querySelector('h1')),
        facts: Array.prototype.map.call(d.querySelectorAll('.facts li'), text).join(' · '),
        context: text(d.querySelector('.context')),
        parts: Array.prototype.map.call(d.querySelectorAll('.part'), function (s) {
          return { label: text(s.querySelector('.label')), body: Array.prototype.map.call(s.querySelectorAll('p'), text).join(' ') };
        })
      };
      return (cache[href] = p);
    });
  }
  function openPrompt(href) {
    lastFocus = document.activeElement;
    var body = document.getElementById('pbody');
    document.getElementById('pkick').textContent = 'Prompt';
    document.getElementById('ptitle').textContent = '';
    document.getElementById('pfacts').textContent = '';
    document.getElementById('ppage').setAttribute('href', href);
    body.innerHTML = '<p class="wait">Loading…</p>';
    body.scrollTop = 0;
    panel.classList.add('open'); document.getElementById('veil').classList.add('open');
    panel.focus({ preventScroll: true });
    loadPrompt(href).then(function (p) {
      document.getElementById('pkick').textContent = p.kick;
      document.getElementById('ptitle').textContent = p.title;
      document.getElementById('pfacts').textContent = p.facts;
      body.innerHTML = (p.context ? '<p class="pctx">' + esc(p.context) + '</p>' : '') +
        p.parts.map(function (s) { return (s.label ? '<h3>' + esc(s.label) + '</h3>' : '') + '<p>' + esc(s.body) + '</p>'; }).join('');
    }).catch(function () {
      body.innerHTML = '<p class="wait">This prompt did not load. <a href="' + esc(href) + '" style="text-decoration:underline">Open it as a page</a>.</p>';
    });
  }
  function closePrompt() {
    if (!panel.classList.contains('open')) return;
    panel.classList.remove('open'); document.getElementById('veil').classList.remove('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function onPrompt(ev) {
    var a = ev.target.closest('a.doc');
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    ev.preventDefault();
    openPrompt(a.getAttribute('href'));
  }
  function onKey(ev) { if (ev.key === 'Escape') closePrompt(); }

  // A sidebar click scrolls to the card and marks it briefly.
  function onNav(ev) {
    var a = ev.target.closest('a[data-to]');
    if (!a) return;
    var el = document.getElementById(a.getAttribute('data-to'));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    history.replaceState(null, '', '#' + el.id);
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('flash'); }, 1200);
    var go = el.querySelector('.go'); if (go) go.focus({ preventScroll: true });
    lockUntil = Date.now() + 900;
    mark(el.id);
  }

  // The sidebar follows the page: the topmost card in view is marked.
  function mark(id) {
    current = id;
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('here', a.getAttribute('data-to') === id); });
  }
  var lockUntil = 0, current = null;
  function spy() {
    if (Date.now() < lockUntil) return;   // a sidebar jump is still scrolling
    var cards = document.querySelectorAll('.card'), best = null, bestTop = Infinity;
    cards.forEach(function (c) {
      var r = c.getBoundingClientRect();
      if (r.bottom > 60 && r.top < innerHeight * .6 && r.top < bestTop - 2) { bestTop = r.top; best = c; }
    });
    // Cards side by side share a row: keep the marked one if it is in that row.
    var cur = current && document.getElementById(current);
    if (cur && Math.abs(cur.getBoundingClientRect().top - bestTop) < 3) return;
    if (best) mark(best.id);
  }

  render();
  // Safe to run twice: replace listeners rather than stacking them.
  if (window.__marble) {
    document.removeEventListener('click', window.__marble.nav);
    document.removeEventListener('click', window.__marble.prompt);
    document.removeEventListener('keydown', window.__marble.key);
    removeEventListener('scroll', window.__marble.spy);
  }
  var raf = 0, onScroll = function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; spy(); }); };
  window.__marble = { nav: onNav, prompt: onPrompt, key: onKey, spy: onScroll };
  document.addEventListener('click', onNav);
  document.addEventListener('click', onPrompt);
  document.addEventListener('keydown', onKey);
  document.getElementById('veil').onclick = closePrompt;
  document.getElementById('pclose').onclick = closePrompt;
  addEventListener('scroll', onScroll, { passive: true });
  spy();
})();
</script>
</body>
</html>
