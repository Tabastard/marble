<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble World</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* ======================================================================
   DATA. Edit here; the page is built from it.

   PLAY is the current game: first in the list, the page opens on it, and
   its START key launches it.
   Each of GROUPS is one section of the list on the left. A group with
   hidden: true is kept here but not shown.
   Choosing a piece puts it on the stage: its picture, and beside it its
   name, sub, text and key; under that, its prompt or notes, read from
   their pages. Only published pieces belong here.
     id:     its address, e.g. #water (keep it unique across the page)
     title:  its name;  sub: a short line under it (every piece has one)
     text:   a sentence or two about it, shown on its card
     path:   the folder (or page) inside this repo that opens
     cover:  picture (16:10; the list shows a square from its middle)
     prompt: optional readable page of the prompt that made it
     needs:  optional page of what a study found the full system needs
   ====================================================================== */
var PLAY = {
  id: 'marble', title: 'Marble World', version: '1.0',   // the build START opens (Snow Globe 1.0, the MVP)
  text: 'A small living world inside a glass marble. Tend it by raising land, bringing rain and planting seeds, or wreck it with volcanoes, asteroids, tornadoes and worse. Every action sets off a chain of reactions through ground, water, heat and life, and whatever you do, the world recovers in its own way.',
  path: 'game/', cover: 'game/feature.jpg'
};

var GROUPS = [
  // Rounds are numbered in the order they were made.
  { id: 'rounds', name: 'Prompts', one: 'Prompt', launch: 'Play', items: [
    { id: 'round-1', title: '1st Prompt', sub: 'The first brief', path: 'rounds/round-1/', cover: 'rounds/round-1/cover.jpg', prompt: 'rounds/round-1/prompt.html',
      text: 'The first build, from a short concept. It came out as a flat, side-on garden: rain, dig and a flower to boop, with sound made in code and a discovery book with hints. No heat and nothing to wreck yet.' },
    { id: 'round-2', title: '2nd Prompt', sub: 'The first world in 3D', path: 'rounds/round-2/', cover: 'rounds/round-2/cover.jpg', prompt: 'rounds/round-2/prompt.html',
      text: 'A world you orbit in full 3D, with one tool on each side: rain to tend it and a crack to wreck it. Every disaster is volcanic, and the land cannot be shaped yet. Now played inside the current glass and interface.' },
    { id: 'round-3', title: '3rd Prompt', sub: 'Several tools on each side', path: 'rounds/round-3/', cover: 'rounds/round-3/cover.jpg', prompt: 'rounds/round-3/prompt.html',
      text: 'Four tools to tend and four to wreck, with eighteen discoveries. The breadth and the tone arrive, but fire outruns every remedy and the rewards pile up on screen.' },
    { id: 'round-4', title: '4th Prompt', sub: 'Every disaster has an end', path: 'rounds/round-4/', cover: 'rounds/round-4/cover.jpg', prompt: 'rounds/round-4/prompt.html',
      text: 'Round 3 reworked with what playing it taught: the bubble floats free, rain reaches the glass and puts fire out, burned ground has to regrow before it can burn again, and rewards fade.' },
    { id: 'round-5', title: '5th Prompt', sub: 'Aftermaths and wonders', path: 'rounds/round-5/', cover: 'rounds/round-5/cover.jpg', prompt: 'rounds/round-5/prompt.html',
      text: 'Aftermaths stay in the ground, new life arrives by itself, and among 45 small discoveries sit six wonders, each made by three steps in the right order.' },
    { id: 'round-6', title: '6th Prompt', sub: 'The prompt alone', path: 'rounds/round-6/', cover: 'rounds/round-6/cover.jpg', prompt: 'rounds/round-6/prompt.html',
      text: 'The same prompt as round 5, given to a different model in an empty folder with nothing else. It drew its own sphere, underground layers, lava and animals, and it runs light.' },
    { id: 'round-7', title: '7th Prompt', sub: 'A landscape in a glass bubble', path: 'rounds/round-7/', cover: 'rounds/round-7/cover.jpg', prompt: 'rounds/round-7/prompt.html',
      text: 'Round 6 carried forward with the best of round 5: materials as properties, rare recipes made in order, a journal that remembers how, and a hand that picks up animals and fallen stars.' },
  ]},
  { id: 'tools', name: 'Tools', one: 'Tool', launch: 'Open', items: [
    { id: 'model-manager', title: 'Model Manager', sub: 'Browse and edit every model', path: 'tools/model-manager/', cover: 'tools/model-manager/cover.jpg',
      text: 'Every model the world draws at its real size, with its looks and moves, beside an empty card for every model the design still needs. Edit mode moves, turns, scales, copies, deletes and recolours any part, down to single points. Saving downloads the changes as a small file, and any model can be exported as an OBJ.' },
    { id: 'interface', title: 'Interface', sub: 'The glass and everything around it', path: 'tools/interface/', cover: 'tools/interface/cover.jpg',
      text: 'The shell every study now runs inside: the new glass, the camera, the clock, the tools, the feed and the journal, and the sound mixer, around a placeholder world. Orbit the sphere, raise and lower the ground, or hold to charge a crater.' },
    { id: 'tool-map', title: 'Tool map', sub: 'Every tool on one map', path: 'tools/tool-map/', cover: 'tools/tool-map/cover.jpg',
      text: 'Every tool drafted for the game on one map: how each one arrives in the world and what it writes into the ground.' },
  ]},
  { id: 'studies', name: 'Studies', one: 'Study', launch: 'Open', items: [
    { id: 'lava', title: 'Lava', sub: 'Six ways to move a flow', path: 'studies/lava/a.html', cover: 'studies/lava/cover.jpg', needs: 'studies/lava/needs.html',
      text: 'Six cheap ways to move lava over the same piece of land, from a flow worked out in advance to rivers, toes and ribbons. Raise a volcano, open a vent and poke the flow.' },
    { id: 'water', title: 'Water', sub: 'Three ways to make it flow', path: 'studies/water/a.html', cover: 'studies/water/cover.jpg', needs: 'studies/water/needs.html',
      text: 'Three ways to do water on the same land: every cell flowing, a calm coarse grid, and lakes with one level fed by little streams. A fourth page tries the side view and bubbles.' },
    { id: 'sky', title: 'Sky and weather', sub: 'Clouds, rain and storms', path: 'studies/sky-weather/', cover: 'studies/sky-weather/cover.jpg',
      text: 'Clouds, rain, snow, lightning and wind, eight weather states, and fire tuned against rain on the same land. Still in progress.' },
    { id: 'creatures', title: 'Creatures', sub: 'Animals that feel alive', path: 'studies/creatures/', cover: 'studies/creatures/cover.jpg', needs: 'studies/creatures/needs.html',
      text: 'Making the animals move like living things, and letting them be harmed and die in a cute way. Poke them, carry them and throw them.' },
    { id: 'scale', title: 'Scale', sub: 'How big the land should feel', path: 'studies/scale/', cover: 'studies/scale/cover.jpg',
      text: 'How big the land should feel, and what that costs. Change the grid, the detail of the land and the size of everything living on it while it runs. Still in progress.' },
    { id: 'nuke', title: 'Nuke', sub: 'A mushroom cloud from one formula', path: 'studies/nuke/', cover: 'studies/nuke/cover.jpg',
      text: 'A big explosion drawn without any fluid simulation: the fireball, stem and mushroom cloud are one formula drawn per pixel, so the timeline can be scrubbed to any moment. Detonate it, orbit it and change the settings live.' },
    { id: 'nuke-marble', title: 'Nuke in the marble', sub: 'The mushroom cloud inside the glass', path: 'studies/nuke-marble/', cover: 'studies/nuke-marble/cover.jpg',
      text: 'The nuke set off inside the glass sphere. The cap flattens against the dome and rolls down the walls, the shock bounces back off the glass, and the soot takes a long time to clear. Scrub, loop and tune it on the timeline, and orbit the whole marble.' },
    { id: 'land', title: 'Land tools', sub: 'A paint shop for shaping land', path: 'studies/land/', cover: 'studies/land/cover.jpg',
      text: 'A workbench for land tools on an open slab rather than in the sphere. Shape a small landscape with a large set of brushes, try each one by hand, change it and save it as a new tool. Only the tending side: nothing here wrecks.' },
    { id: 'strikes', title: 'Strikes', sub: 'Hitting the world from the sky', path: 'studies/strikes/', cover: 'studies/strikes/cover.jpg', needs: 'studies/strikes/needs.html',
      text: 'Asteroids from pebble to giant, a meteor shower, an ice comet, a fireball, lightning and a laser, each judged by how the hit feels and what it leaves behind. A bench of eight ground types takes the same strike at once.' },
    { id: 'styles', title: 'Styles', sub: 'Other ways to draw the models', path: 'studies/styles/', cover: 'studies/styles/cover.jpg',
      text: 'Mock-ups for the Model Manager’s Styles tab. Three ways to lay out a stack of effects, with saved looks and a palette you can edit, and three ways to grow leaves over a tree’s crown, drawn with the real renderer and its pixel pass.' },
  ]},
];
</script>
<style>
/* Two columns. On the left, the name and every piece as a list, by section. On the right, the
   stage: the chosen piece as a card (its picture, and beside it its name, what it is and its
   key), and under the card its prompt or notes. The page opens on the current game. */
:root {
  --bg: #0e1114;
  --pane: #171b1f;
  --side: #0a0c0e;
  --text: #eceeef;
  --soft: #c3c9cd;
  --muted: #9aa2a7;
  --faint: #4e565c;
  --line: rgba(255, 255, 255, .08);
  --hover: rgba(255, 255, 255, .05);
  --list-w: 300px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
svg, img { display: block; }
.scroll { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }

.side { position: fixed; inset: 0 auto 0 0; width: var(--list-w); overflow-y: auto; overscroll-behavior: contain; background: var(--side); padding: 20px 12px 32px; }
.stage { position: fixed; top: 0; bottom: 0; left: var(--list-w); right: 0; overflow-y: auto; overscroll-behavior: contain; padding: 32px 40px 80px; }

/* The name at the top of the list; it goes back to the current game. */
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 8px; border-radius: 10px; outline: none; }
.brand:focus-visible { box-shadow: 0 0 0 2px rgba(236, 238, 239, .35); }
.brand img { width: 46px; height: 46px; flex: none; }
.brand b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
.brand span { display: block; margin-top: 2px; font-size: 12.5px; color: #7d868c; }

/* The list: a row per piece, with a small square picture, its name and a short line. */
.sec h2 { margin: 20px 8px 6px; font-size: 11px; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; color: #6f787e; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 11px; align-items: center; padding: 6px 8px; border-radius: 9px; outline: none; transition: background .12s ease; }
.item:hover { background: var(--hover); }
.item:focus-visible { box-shadow: 0 0 0 2px rgba(236, 238, 239, .35); }
.item.on { background: rgba(255, 255, 255, .1); }
.item .pic { aspect-ratio: 1; border-radius: 7px; overflow: hidden; background: var(--pane); }
.item .pic img { width: 100%; height: 100%; object-fit: cover; filter: brightness(.85); transition: filter .15s ease; }
.item:hover .pic img, .item.on .pic img { filter: none; }
.item h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.25; }
.item p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.on p { color: var(--soft); }

/* The card: the picture (it launches too), and beside it the name, what it is and the key. */
.wrap { max-width: 1060px; margin: 0 auto; }
.card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
.card .pic { display: block; aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden; background: var(--pane); outline: none; }
.card .pic:focus-visible { box-shadow: 0 0 0 2px rgba(236, 238, 239, .45); }
.card .pic img { width: 100%; height: 100%; object-fit: cover; }
.kick { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.card h1 { margin: 6px 0 0; font-size: 32px; font-weight: 650; letter-spacing: -.025em; line-height: 1.08; }
.card .ver { margin-left: .25em; font-weight: 400; color: #6f787e; }
.card .sub { margin: 7px 0 0; font-size: 16px; color: var(--soft); }
.card .text { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #aab1b6; max-width: 38em; }
.key {
  display: inline-flex; align-items: center; gap: 9px; margin-top: 20px; padding: 10px 20px 9px; border-radius: 9px;
  background: #eef0f1; color: #101315; font-size: 13px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 4px 0 #7c858b; outline: none; transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
}
.key svg { width: 11px; height: 11px; }
.key:hover { background: #fff; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #7c858b; }
.key:focus-visible { box-shadow: 0 4px 0 #7c858b, 0 0 0 3px rgba(236, 238, 239, .45); }

/* Under the card: the prompt or notes. A prompt reads as one column of paragraphs; a long
   list of notes runs in two columns. The arrow opens the page itself. */
.notes { margin-top: 40px; }
.notes:empty { display: none; }
.doc + .doc { margin-top: 48px; }
.nhead { display: flex; align-items: center; gap: 14px; padding: 0 2px 14px; border-bottom: 1px solid rgba(255, 255, 255, .1); }
.nhead > div { flex: 1; min-width: 0; }
.nhead .kick { font-size: 10.5px; color: var(--faint); }
.nhead h2 { margin: 4px 0 0; font-size: 21px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
.nhead .model { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.out { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); outline: none; }
.out:hover, .out:focus-visible { background: var(--hover); color: var(--text); }
.out svg { width: 15px; height: 15px; }
.nbody { margin-top: 24px; padding: 0 2px; }
.nbody.lists { columns: 2 340px; column-gap: 48px; }
.nbody.prose { max-width: 44em; }
.nbody h3 { margin: 0; padding: 20px 0 8px; font-size: 11px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: #6f787e; break-after: avoid; }
.nbody > h3:first-child { padding-top: 0; }
.nbody ul { list-style: none; margin: 0; padding: 0; }
.nbody li { margin: 0 0 .65em; font-size: 14.5px; line-height: 1.55; color: #dfe2e4; break-inside: avoid; }
.nbody li.lead { margin-top: 1em; color: var(--muted); font-style: italic; break-after: avoid; }   /* introduces the lines after it */
.nbody p { margin: 0 0 1em; font-size: 15px; line-height: 1.7; color: #dfe2e4; }
.nbody .wait { color: var(--faint); }
.nbody .wait a { text-decoration: underline; }

.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

/* The top bar only shows on phones, where the list moves under the stage. */
.top { display: none; }

@media (max-width: 1240px) {
  :root { --list-w: 260px; }
  .stage { padding: 26px 28px 72px; }
  .card { gap: 24px; }
  .card h1 { font-size: 28px; }
}
@media (max-width: 960px) {
  .card { grid-template-columns: minmax(0, 1fr); gap: 16px; }
}
/* Phones: the stage first, then the list; choosing scrolls back up to the stage. */
@media (max-width: 760px) {
  body { display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 14px 0; }
  .top img { width: 28px; height: 28px; }
  .top b { font-size: 16px; font-weight: 600; }
  .side, .stage { position: static; width: auto; overflow: visible; }
  .stage { order: 1; padding: 12px 14px 8px; }
  .side { order: 2; background: none; padding: 0 6px 40px; }
  .side .brand { display: none; }
  .card { padding: 10px; border-radius: 12px; }
  .card h1 { font-size: 25px; }
  .card .text { font-size: 14px; }
  .notes { margin-top: 28px; }
  .nbody li, .nbody p { font-size: 14px; }
}
</style>
</head>
<body>
<a class="top" href="#" data-pick="" aria-label="Marble World, the current game"><img src="logo.png" alt="" width="28" height="28"><b>Marble World</b></a>
<aside class="side scroll" id="side" aria-label="Everything on the site">
  <a class="brand" href="#" data-pick="" aria-label="Marble World, the current game"><img src="logo.png" alt="" width="46" height="46"><div><b>Marble World</b><span>A universe in a bubble</span></div></a>
  <nav id="list"></nav>
</aside>
<main class="stage scroll" id="stage" aria-live="polite">
  <div class="wrap" id="wrap"></div>
</main>

<script>
(function () {
  var ICONS = {
    play: '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    out:  '<path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var phone = matchMedia('(max-width: 760px)');
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var stage = document.getElementById('stage'), wrap = document.getElementById('wrap');

  // The sections as listed: the current game first, then every shown group.
  var sections = [{ id: 'play', name: 'Play', one: 'The current game', launch: 'Start', items: [PLAY] }].concat(
    GROUPS.filter(function (g) { return !g.hidden; }).map(function (g) {
      return Object.assign({}, g, { launch: g.launch === 'Play' ? 'Start' : g.launch, items: g.items.filter(function (it) { return it.path; }) });
    }).filter(function (g) { return g.items.length; }));
  var byId = {}, order = [];
  sections.forEach(function (g) { g.items.forEach(function (it) { byId[it.id] = { item: it, group: g }; order.push(it.id); }); });
  var chosen = null;

  function href(it) { return it === PLAY ? '#' : '#' + it.id; }
  function renderList() {
    document.getElementById('list').innerHTML = sections.map(function (g) {
      return '<section class="sec" aria-label="' + esc(g.name) + '"><h2>' + esc(g.name) + '</h2>' + g.items.map(function (it) {
        var sub = it === PLAY ? 'The current game' : it.sub;
        return '<a class="item" href="' + href(it) + '" data-pick="' + esc(it === PLAY ? '' : it.id) + '" data-id="' + esc(it.id) + '">' +
          '<span class="pic"><img src="' + esc(it.cover) + '" alt="" loading="lazy"></span>' +
          '<div><h3>' + esc(it.title) + '</h3>' + (sub ? '<p>' + esc(sub) + '</p>' : '') + '</div></a>';
      }).join('') + '</section>';
    }).join('');
  }

  // The stage: the card for the chosen piece, then its prompt or notes.
  function renderStage(it, g) {
    var docs = [];
    if (it.prompt) docs.push({ href: it.prompt, kind: 'Prompt' });
    if (it.needs) docs.push({ href: it.needs, kind: 'Notes' });
    var title = esc(it.title) + (it.version ? '<span class="ver">' + esc(it.version) + '</span>' : '');
    wrap.innerHTML = '<div class="fade">' +
      '<section class="card" aria-label="' + esc(it.title) + '">' +
        '<a class="pic" href="' + esc(it.path) + '" tabindex="-1" aria-hidden="true"><img src="' + esc(it.cover) + '" alt=""></a>' +
        '<div><div class="kick">' + esc(g.one) + '</div><h1 id="title">' + title + '</h1>' +
          '<p class="sub">' + esc(it === PLAY ? 'A universe in a bubble' : it.sub) + '</p>' +
          (it.text ? '<p class="text">' + esc(it.text) + '</p>' : '') +
          '<a class="key" id="launch" href="' + esc(it.path) + '">' + svg('play') + esc(g.launch) + '</a></div>' +
      '</section>' +
      '<div class="notes" id="notes">' + docs.map(function (d, i) { return '<section class="doc" data-doc="' + i + '"></section>'; }).join('') + '</div></div>';
    docs.forEach(function (d, i) { showDoc(d, wrap.querySelector('.doc[data-doc="' + i + '"]'), it.id); });
  }

  // A prompt or notes page, read from the page itself: its title, the model that built it,
  // and each part as plain text. Nothing else from the page is carried across.
  var cache = {};
  function text(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  function plain(el) {
    return Array.prototype.map.call(el.childNodes, function (n) {
      if (n.nodeType === 3) return esc(n.textContent.replace(/\s+/g, ' '));
      if (n.nodeType !== 1 || n.classList.contains('tag')) return '';   // no labels: they made the page busy
      if (n.tagName === 'STRONG' || n.tagName === 'B') return '<strong>' + esc(text(n)) + '</strong>';
      return esc(n.textContent.replace(/\s+/g, ' '));
    }).join('').trim();
  }
  function loadDoc(url) {
    if (cache[url]) return cache[url];
    return (cache[url] = fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
      var d = new DOMParser().parseFromString(html, 'text/html');
      var lists = !!d.querySelector('.part li');
      return {
        title: text(d.querySelector('h1')),
        // The model that built it, from the page's facts ("Claude Opus 5.5 in Claude Code").
        model: (Array.prototype.map.call(d.querySelectorAll('.facts li'), text).filter(function (f) { return /claude|gpt|gemini|llama|mistral/i.test(f); })[0] || '').replace(/\s+in\s+.*$/, ''),
        lists: lists,
        body: Array.prototype.map.call(d.querySelectorAll('.part'), function (s) {
          return (lists && s.querySelector('.label') ? '<h3>' + esc(text(s.querySelector('.label'))) + '</h3>' : '') +
            (s.querySelector('li')
              ? '<ul>' + Array.prototype.map.call(s.querySelectorAll('li'), function (li) { return (li.classList.contains('lead') ? '<li class="lead">' : '<li>') + plain(li) + '</li>'; }).join('') + '</ul>'
              : Array.prototype.map.call(s.querySelectorAll('p'), function (p) { return '<p>' + plain(p) + '</p>'; }).join(''));
        }).join('')
      };
    }));
  }
  function showDoc(d, box, id) {
    var head = function (title, model) {
      return '<div class="nhead"><div><div class="kick">' + d.kind + '</div><h2>' + esc(title) + '</h2>' + (model ? '<p class="model">' + esc(model) + '</p>' : '') + '</div>' +
        '<a class="out" href="' + esc(d.href) + '" title="Open as a page" aria-label="Open the ' + d.kind.toLowerCase() + ' as a page">' + svg('out') + '</a></div>';
    };
    var shown = false;
    setTimeout(function () { if (!shown && chosen === id) box.innerHTML = head('', '') + '<div class="nbody"><p class="wait">Loading…</p></div>'; }, 150);
    loadDoc(d.href).then(function (p) {
      shown = true;
      if (chosen !== id) return;
      box.innerHTML = head(p.title, p.model) + '<div class="nbody ' + (p.lists ? 'lists' : 'prose') + '">' + p.body + '</div>';
    }).catch(function () {
      shown = true;
      if (chosen !== id) return;
      box.innerHTML = head(d.kind, '') + '<div class="nbody"><p class="wait">This page did not load. <a href="' + esc(d.href) + '">Open it as a page</a>.</p></div>';
    });
  }

  // Choose by id ('' or an unknown id is the current game). The address follows, so a link
  // can open straight onto a piece and Back from a piece returns to it.
  function choose(id, how) {
    var hit = byId[id] || byId[PLAY.id], it = hit.item;
    if (chosen !== it.id) {
      chosen = it.id;
      renderStage(it, hit.group);
      stage.scrollTop = 0;
    }
    var row = null;
    document.querySelectorAll('.item').forEach(function (a) {
      var on = a.getAttribute('data-id') === it.id;
      a.classList.toggle('on', on);
      if (on) { a.setAttribute('aria-current', 'true'); row = a; } else a.removeAttribute('aria-current');
    });
    if (how !== 'load') history.replaceState(null, '', it === PLAY ? location.pathname : '#' + it.id);
    if (phone.matches) { if (how !== 'load') scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); }
    else if (row) row.scrollIntoView({ block: 'nearest' });
    if (how === 'keys' && row) row.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (ev) {
    var a = ev.target.closest('[data-pick]');
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    ev.preventDefault();
    choose(a.getAttribute('data-pick'), 'list');
  });
  // Up and down step through the list while it has the focus (elsewhere they scroll as usual).
  document.addEventListener('keydown', function (ev) {
    var d = { ArrowDown: 1, ArrowUp: -1 }[ev.key], f = document.activeElement;
    if (!d || ev.metaKey || ev.ctrlKey || ev.altKey || !f || !f.closest || !f.closest('.side')) return;
    ev.preventDefault();
    var from = f.classList.contains('item') ? f.getAttribute('data-id') : chosen;   // from the piece with the focus
    var i = Math.max(0, Math.min(order.length - 1, order.indexOf(from) + d));
    choose(order[i] === PLAY.id ? '' : order[i], 'keys');
  });
  function onHash() { choose(decodeURIComponent(location.hash.slice(1)), 'load'); }
  addEventListener('hashchange', onHash);

  renderList();
  onHash();
})();
</script>
</body>
</html>
