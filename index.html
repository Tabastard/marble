<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23dfeef5'/%3E%3Cpath d='M3.5 38h57a29 29 0 0 1-57 0z' fill='%238a6a4a'/%3E%3Cpath d='M3.6 36h56.8v4H3.6z' fill='%238fb573'/%3E%3C/svg%3E">
<script>
/* ======================================================================
   DATA. Each published piece is one entry. Nothing else needs editing.

   group:  play | rounds | studies | tools   (a group with no entries is hidden)
   path:   the folder (or file) inside this repo that opens, e.g. 'rounds/test-06/'
   cover:  picture for the card, e.g. 'rounds/test-06/cover.jpg' (16:10, 1440x900)
   prompt: optional readable page of the prompt that made it

   The whole page fits on one screen on a laptop or projector. Cards share
   each row's width, so a row of many cards gets narrower cards, not a scroll.
   ====================================================================== */
var ENTRIES = [
  { id: 'current', group: 'play',   title: 'Marble',        path: 'rounds/test-06/', cover: 'rounds/test-06/cover.jpg', prompt: 'rounds/test-06/prompt.html' },
  { id: 'test-01', group: 'rounds', title: 'Round 1',       path: 'rounds/test-01/', cover: 'rounds/test-01/cover.jpg', prompt: 'rounds/test-01/prompt.html' },
  { id: 'test-06', group: 'rounds', title: 'Round 6',       path: 'rounds/test-06/', cover: 'rounds/test-06/cover.jpg', prompt: 'rounds/test-06/prompt.html' },
  { id: 'assets',  group: 'tools',  title: 'Asset manager', path: 'tools/assets/',   cover: 'tools/assets/cover.jpg' },
];

var GROUPS = [
  { id: 'play',    name: 'Play',    icon: 'play' },
  { id: 'rounds',  name: 'Rounds',  icon: 'stack' },
  { id: 'studies', name: 'Studies', icon: 'drop' },
  { id: 'tools',   name: 'Tools',   icon: 'tool' },
];
</script>
<style>
:root {
  --bg: #0e1114;
  --pane: #181c20;
  --text: #eceeef;
  --muted: #9aa2a7;
  --faint: #5d666c;
  --radius: 14px;
  --gap: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 16px 16px 24px;
}

header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.mark { width: 34px; height: 34px; flex: none; }
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }

/* Groups */
section { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex: none; }
.head svg { width: 15px; height: 15px; color: var(--faint); }
h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Cards: the cover fills the card, the title sits on it. */
.card {
  position: relative; overflow: hidden; border-radius: var(--radius);
  background: var(--pane); min-width: 0;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  transition: transform .18s ease, box-shadow .18s ease;
}
.card:hover, .card:focus-within { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4); }
.card:has(.go:focus-visible) { box-shadow: 0 0 0 3px rgba(236, 238, 239, .55), 0 14px 36px rgba(0, 0, 0, .4); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease, filter .3s ease; filter: brightness(.92); }
.card:hover img, .card:focus-within img { transform: scale(1.025); filter: brightness(1); }
.card .fallback { position: absolute; inset: 0; display: grid; place-items: center; }
.card .fallback svg { width: 28%; opacity: .5; }
.shade { position: absolute; left: 0; right: 0; bottom: 0; height: 56%; background: linear-gradient(to top, rgba(8, 10, 12, .82), rgba(8, 10, 12, 0)); pointer-events: none; }
.foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.go { color: var(--text); text-decoration: none; font-weight: 600; font-size: 16px; outline: none; text-shadow: 0 1px 6px rgba(0, 0, 0, .5); }
.go::after { content: ""; position: absolute; inset: 0; }   /* the whole card opens the piece */
.play .go { font-size: 24px; }
.play .foot { padding: 18px 20px; }
.chip {
  position: relative; z-index: 1; margin-left: auto;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); text-decoration: none;
  background: rgba(255, 255, 255, .14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-radius: 999px; padding: 5px 11px;
}
.chip:hover, .chip:focus-visible { background: rgba(255, 255, 255, .24); outline: none; }
.chip svg { width: 13px; height: 13px; }

/* Small or short screens: a plain scrolling list. */
#groups, .rest { display: grid; gap: 28px; }
.row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.row .card { aspect-ratio: 16 / 10; }

/* Laptop and projector: everything on one screen, full width. */
@media (min-width: 820px) and (min-height: 520px) {
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; padding: 18px 28px 28px; }
  header { flex: none; }
  #groups { flex: 1; min-height: 0; display: grid; gap: 28px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
  #groups.solo { grid-template-columns: minmax(0, 1fr); }
  .play, .rest { min-height: 0; }
  .rest { display: grid; gap: var(--gap); grid-auto-rows: minmax(0, 1fr); }
  .row { flex: 1; min-height: 0; display: flex; gap: var(--gap); container-type: size; }
  .row .card { aspect-ratio: auto; height: 100%; flex: 0 1 calc(100cqh * 1.6); }
  .play .row .card { flex: 1 1 0; }
}
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <clipPath id="ball"><circle cx="32" cy="32" r="29"/></clipPath>
      <radialGradient id="sky" cx=".35" cy=".25" r=".9">
        <stop offset="0" stop-color="#f3f9fc"/><stop offset="1" stop-color="#cfe3ee"/>
      </radialGradient>
    </defs>
    <g clip-path="url(#ball)">
      <rect width="64" height="64" fill="url(#sky)"/>
      <path d="M0 37 C14 33 22 36 32 35 S52 33 64 36 V64 H0Z" fill="#8fb573"/>
      <path d="M0 40 C14 37 22 39 32 38.5 S52 37 64 39.5 V64 H0Z" fill="#a9825a"/>
      <path d="M0 47 C16 45 30 47 40 46 S56 45 64 46.5 V64 H0Z" fill="#7d6f63"/>
      <path d="M0 55 C18 54 30 55.5 44 54.5 S58 54 64 55 V64 H0Z" fill="#5f5650"/>
      <ellipse cx="32" cy="62.5" rx="14" ry="4" fill="#e0703a" opacity=".9"/>
    </g>
    <ellipse cx="22" cy="17" rx="9" ry="5" transform="rotate(-28 22 17)" fill="#fff" opacity=".7"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
  </svg>
  <h1>Marble</h1>
</header>
<main id="groups"></main>

<script>
(function () {
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    stack: '<path d="M12 3 3 8l9 5 9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    drop:  '<path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    tool:  '<path d="M14.5 5.5a4 4 0 0 0 4.9 5L20 11l-8.5 8.5a2.1 2.1 0 0 1-3-3L17 8l.5.6a4 4 0 0 1-3-3.1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    doc:   '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
  };
  var MARBLE = document.querySelector('.mark').outerHTML.replace('class="mark"', '').replace(/id="(ball|sky)"/g, 'id="$1-c"').replace(/#(ball|sky)\)/g, '#$1-c)');

  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function card(e) {
    return '<div class="card">' +
      (e.cover ? '<img src="' + esc(e.cover) + '" alt="">' : '<div class="fallback">' + MARBLE + '</div>') +
      '<div class="shade"></div>' +
      '<div class="foot"><a class="go" href="' + esc(e.path) + '">' + esc(e.title) + '</a>' +
        (e.prompt ? '<a class="chip" href="' + esc(e.prompt) + '">' + svg('doc') + 'Prompt</a>' : '') +
      '</div></div>';
  }

  function section(g, items) {
    return '<section class="' + g.id + '">' +
      '<div class="head">' + svg(g.icon) + '<h2>' + esc(g.name) + '</h2></div>' +
      '<div class="row">' + items.map(card).join('') + '</div></section>';
  }

  function render() {
    var filled = GROUPS.map(function (g) {
      return { g: g, items: ENTRIES.filter(function (e) { return e.group === g.id; }) };
    }).filter(function (x) { return x.items.length; });
    var play = filled.filter(function (x) { return x.g.id === 'play'; });
    var rest = filled.filter(function (x) { return x.g.id !== 'play'; });
    var root = document.getElementById('groups');
    root.className = play.length && rest.length ? '' : 'solo';
    root.innerHTML =
      play.map(function (x) { return section(x.g, x.items); }).join('') +
      (rest.length ? '<div class="rest">' + rest.map(function (x) { return section(x.g, x.items); }).join('') + '</div>' : '');
  }

  // Arrow keys move between cards, for presenting from a keyboard or clicker.
  function onKey(ev) {
    if (!/^Arrow(Left|Right|Up|Down)$/.test(ev.key)) return;
    var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
    if (!cards.length) return;
    var links = cards.map(function (c) { return c.querySelector('.go'); });
    var i = links.indexOf(document.activeElement);
    if (i < 0) { links[0].focus(); ev.preventDefault(); return; }
    var r = cards[i].getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, best = -1, bestD = Infinity;
    cards.forEach(function (c, j) {
      if (j === i) return;
      var q = c.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      var ok = ev.key === 'ArrowRight' ? dx > 4 : ev.key === 'ArrowLeft' ? dx < -4 : ev.key === 'ArrowDown' ? dy > 4 : dy < -4;
      if (!ok) return;
      var horiz = ev.key === 'ArrowRight' || ev.key === 'ArrowLeft';
      var d = horiz ? Math.abs(dx) + Math.abs(dy) * 2 : Math.abs(dy) + Math.abs(dx) * 2;
      if (d < bestD) { bestD = d; best = j; }
    });
    if (best >= 0) { links[best].focus(); ev.preventDefault(); }
  }

  render();
  // Safe to run twice: replace the listener rather than stacking it.
  if (window.__marbleKey) document.removeEventListener('keydown', window.__marbleKey);
  window.__marbleKey = onKey;
  document.addEventListener('keydown', onKey);
})();
</script>
</body>
</html>
