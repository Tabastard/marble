<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble World</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* ======================================================================
   DATA. Edit here; the page is built from it.

   PLAY is the current game. It sits at the top of the list, it is what the
   page opens on, and START launches it.
   Each of GROUPS is one list in the sidebar and one stretch of the middle
   column, which runs through all of them in order: a row per piece with its
   picture, words and launch button. Choosing a row shows its prompt or notes
   on the right. Only published pieces belong here.
     id:     its address, e.g. #round-6 (keep it unique across the page)
     title:  its name;  sub: an optional second line under it
     text:   a sentence or two about it, shown beside its picture
     path:   the folder (or page) inside this repo that opens
     cover:  picture (16:10)
     prompt: optional readable page of the prompt that made it
     needs:  optional page of what a study found the full system needs
   ====================================================================== */
var PLAY = {
  id: 'marble', title: 'Marble World', version: 'v7',   // the round START opens
  text: 'A small living world inside a glass marble, floating free in space. Tend it by raising land, bringing rain and planting life, or wreck it with eruptions, quakes, meteors and storms. Every action sets off a chain of reactions through ground, water, heat and life, and whatever you do, the world recovers in its own way.',
  path: 'rounds/round-7/', cover: 'rounds/round-7/hero.jpg', ratio: '6 / 5', prompt: 'rounds/round-7/prompt.html'
};

var GROUPS = [
  // Rounds are numbered in the order they were made.
  { id: 'rounds', name: 'Rounds', one: 'Round', launch: 'Play', items: [
    { id: 'round-1', title: '1st Prompt', sub: 'The first brief', path: 'rounds/round-1/', cover: 'rounds/round-1/cover.jpg', prompt: 'rounds/round-1/prompt.html',
      text: 'The first build, from a short concept. It came out as a flat, side-on garden: rain, dig and a flower to boop, with sound made in code and a discovery book with hints. No heat and nothing to wreck yet.' },
    { id: 'round-2', title: '2nd Prompt', sub: 'The first world in 3D', path: 'rounds/round-2/', cover: 'rounds/round-2/cover.jpg', prompt: 'rounds/round-2/prompt.html',
      text: 'A world you orbit in full 3D, with one tool on each side: rain to tend it and a crack to wreck it. Every disaster is volcanic, and the land cannot be shaped yet.' },
    { id: 'round-3', title: '3rd Prompt', sub: 'Several tools on each side', path: 'rounds/round-3/', cover: 'rounds/round-3/cover.jpg', prompt: 'rounds/round-3/prompt.html',
      text: 'Four tools to tend and four to wreck, with eighteen discoveries. The breadth and the tone arrive, but fire outruns every remedy and the rewards pile up on screen.' },
    { id: 'round-4', title: '4th Prompt', sub: 'Every disaster has an end', path: 'rounds/round-4/', cover: 'rounds/round-4/cover.jpg', prompt: 'rounds/round-4/prompt.html',
      text: 'Round 3 reworked with what playing it taught: the bubble floats free, rain reaches the glass and puts fire out, burned ground has to regrow before it can burn again, and rewards fade.' },
    { id: 'round-5', title: '5th Prompt', sub: 'Aftermaths and wonders', path: 'rounds/round-5/', cover: 'rounds/round-5/cover.jpg', prompt: 'rounds/round-5/prompt.html',
      text: 'Aftermaths stay in the ground, new life arrives by itself, and among 45 small discoveries sit six wonders, each made by three steps in the right order.' },
    { id: 'round-6', title: '6th Prompt', sub: 'The prompt alone', path: 'rounds/round-6/', cover: 'rounds/round-6/cover.jpg', prompt: 'rounds/round-6/prompt.html',
      text: 'The same prompt as round 5, given to a different model in an empty folder with nothing else. It drew its own sphere, underground layers, lava and animals, and it runs light.' },
    { id: 'round-7', title: '7th Prompt', sub: 'A landscape in a glass bubble', path: 'rounds/round-7/', cover: 'rounds/round-7/cover.jpg', prompt: 'rounds/round-7/prompt.html',
      text: 'Round 6 carried forward with the best of round 5: materials as properties, rare recipes made in order, a journal that remembers how, and a hand that picks up animals and fallen stars.' },
  ]},
  { id: 'studies', name: 'Studies', one: 'Study', launch: 'Open', items: [
    { id: 'lava', title: 'Lava', path: 'studies/lava/a.html', cover: 'studies/lava/cover.jpg', needs: 'studies/lava/needs.html',
      text: 'Six cheap ways to move lava over the same piece of land, from a flow worked out in advance to rivers, toes and ribbons. Raise a volcano, open a vent and poke the flow.' },
    { id: 'water', title: 'Water', path: 'studies/water/a.html', cover: 'studies/water/cover.jpg', needs: 'studies/water/needs.html',
      text: 'Three ways to do water on the same land: every cell flowing, a calm coarse grid, and lakes with one level fed by little streams. A fourth page tries the side view and bubbles.' },
    { id: 'sky', title: 'Sky and weather', path: 'studies/sky-weather/', cover: 'studies/sky-weather/cover.jpg',
      text: 'Clouds, rain, snow, lightning and wind, eight weather states, and fire tuned against rain on the same land. Still in progress.' },
    { id: 'creatures', title: 'Creatures', path: 'studies/creatures/', cover: 'studies/creatures/cover.jpg', needs: 'studies/creatures/needs.html',
      text: 'Making the animals move like living things, and letting them be harmed and die in a cute way. Poke them, carry them and throw them.' },
    { id: 'scale', title: 'Scale', path: 'studies/scale/', cover: 'studies/scale/cover.jpg',
      text: 'How big the land should feel, and what that costs. Change the grid, the detail of the land and the size of everything living on it while it runs. Still in progress.' },
    { id: 'interface', title: 'Interface', path: 'studies/interface/', cover: 'studies/interface/cover.jpg',
      text: 'A working shell of what sits on the screen around the bubble: the tools, the feed and the journal. The bubble is a placeholder and every event is made up.' },
  ]},
  { id: 'tools', name: 'Tools', one: 'Tool', launch: 'Open', items: [
    { id: 'assets', title: 'Asset manager', path: 'tools/assets/', cover: 'tools/assets/cover.jpg',
      text: 'A gallery of every model the world draws, each at its real size, beside an empty card for every model the design still needs.' },
    { id: 'tool-map', title: 'Tool map', path: 'tools/tool-map/', cover: 'tools/tool-map/cover.jpg',
      text: 'Every tool drafted for the game on one map: how each one arrives in the world and what it writes into the ground.' },
  ]},
];
</script>
<style>
:root {
  --bg: #0e1114;
  --side: #0a0c0e;
  --pane: #171b1f;
  --docbg: #121619;
  --text: #eceeef;
  --soft: #c3c9cd;
  --muted: #9aa2a7;
  --faint: #4e565c;
  --hover: rgba(255, 255, 255, .06);
  --radius: 5px;
  --side-w: 248px;
  --doc-w: clamp(340px, 27vw, 480px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
svg { display: block; }
button { font: inherit; color: inherit; }
.scroll { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .12) transparent; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .12); border-radius: 4px; }

/* Three columns: the sidebar, every piece as a row, and the chosen one's prompt or notes. */
.side { position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); background: var(--side); overflow-y: auto; padding: 18px 12px 32px; }
.list { position: fixed; left: var(--side-w); right: var(--doc-w); top: 0; bottom: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 32px; }
.doc { position: fixed; right: 0; top: 0; bottom: 0; width: var(--doc-w); overflow-y: auto; overscroll-behavior: contain; background: var(--docbg); }

/* Sidebar */
.brandbox { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 8px 6px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; border-radius: 12px; outline: none; }
.brand:focus-visible { box-shadow: 0 0 0 3px rgba(236, 238, 239, .35); }
.mark { width: 64px; height: 64px; flex: none; display: block; }
.brand h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.tagline { margin: 4px 0 0; font-size: 13.5px; color: #7d868c; }
/* The START key: a soft grey key with a lip that sinks when pressed. */
.start {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-width: 128px;
  margin: 18px 0 8px; padding: 11px 22px 10px; border-radius: 10px;
  background: #c4cacf; color: #101315; font-size: 14.5px; font-weight: 800; letter-spacing: .16em;
  box-shadow: 0 4px 0 #5f676d; outline: none; transition: transform .08s ease, box-shadow .08s ease, background .15s ease;
}
.start svg { width: 15px; height: 15px; }
.start:hover { background: #d0d5d9; }
.start:active { transform: translateY(3px); box-shadow: 0 1px 0 #5f676d; }
.start:focus-visible { box-shadow: 0 4px 0 #5f676d, 0 0 0 3px rgba(236, 238, 239, .45); }
.side ul { list-style: none; margin: 0; padding: 0; }
.navhead { display: flex; align-items: center; margin: 12px 0 2px; border-radius: 8px; }
.navhead:hover { background: var(--hover); }
.navsec {
  flex: 1; padding: 6px 10px; border-radius: 8px; outline: none;
  font-size: 13.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #dfe3e6;
}
.navsec:hover, .navsec:focus-visible { color: var(--text); }
.navsec:focus-visible { box-shadow: inset 0 0 0 2px rgba(236, 238, 239, .3); }
.fold { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; outline: none; }
.fold:hover, .fold:focus-visible { background: var(--hover); color: var(--text); }
.fold svg { width: 14px; height: 14px; transition: transform .2s ease; }
.navgroup.closed .fold svg { transform: rotate(-90deg); }
.navgroup.closed ul { display: none; }
.side ul a {
  display: flex; align-items: baseline; gap: 10px; padding: 6px 10px 6px 24px; border-radius: 8px; font-size: 16.5px;
  color: var(--muted); outline: none; transition: background .15s ease, color .15s ease;
}
.side ul a:hover, .side ul a:focus-visible { background: var(--hover); color: var(--text); }
.side ul a.here { background: rgba(255, 255, 255, .09); color: var(--text); }

/* The middle: every piece as a row, its picture beside its name, what it is and
   its button. The current game comes first; then each group under a heading
   that stays pinned until the next one pushes it off. */
.feature { padding-top: 30px; }
.lgroup { margin-top: 26px; }
.lgroup:last-child { min-height: 100vh; padding-bottom: 40px; }   /* so the last heading can reach the top too */
.lhead {
  position: sticky; top: 0; z-index: 2; background: var(--bg);
  display: flex; align-items: center; gap: 12px; padding: 22px 0 12px;
  box-shadow: 0 6px 10px -2px var(--bg);   /* rows fade out under it */
}
.lhead h2 { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: #e4e7e9; }
.lhead::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, .14); }
.entries { display: flex; flex-direction: column; gap: 6px; }
.entry {
  display: grid; grid-template-columns: minmax(170px, 36%) minmax(0, 1fr); gap: 24px; align-items: start;
  margin: 0 -14px; padding: 14px; border-radius: 10px; cursor: pointer; transition: background .15s ease;
}
.entry:hover { background: rgba(255, 255, 255, .03); }
.entry.on { background: rgba(255, 255, 255, .065); }
.entry .pic { display: block; position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: var(--pane); transition: box-shadow .15s ease; }
.entry .pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.86) saturate(.94); transition: filter .2s ease; }
.entry:hover .pic img, .entry.on .pic img { filter: none; }
.entry.on .pic { box-shadow: 0 0 0 2px rgba(236, 238, 239, .8); }
.info { min-width: 0; padding-top: 1px; }
.entry h3 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.01em; line-height: 1.15; }
.entry h3 a { outline: none; }
.entry:has(h3 a:focus-visible) { box-shadow: 0 0 0 2px rgba(236, 238, 239, .45); }
.entry h3 .ver { margin-left: .35em; font-size: .55em; font-weight: 500; letter-spacing: 0; color: var(--faint); vertical-align: .45em; }
.entry .sub { margin: 4px 0 0; font-size: 15.5px; color: var(--soft); }
.entry .text { margin: 8px 0 0; font-size: 14.5px; line-height: 1.55; color: #aab1b6; max-width: 40em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.feature .entry { grid-template-columns: minmax(200px, 42%) minmax(0, 1fr); }
.feature .pic { aspect-ratio: 6 / 5; }
.feature h3 { font-size: 36px; letter-spacing: -.02em; }
.feature .text { font-size: 15.5px; color: var(--soft); margin-top: 12px; }
.feature .actions { margin-top: 20px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500; background: rgba(255, 255, 255, .08); color: var(--text); outline: none;
  transition: background .15s ease;
}
.pill:hover, .pill:focus-visible { background: rgba(255, 255, 255, .15); }
.pill.main { background: var(--text); color: var(--bg); padding-left: 16px; padding-right: 19px; }
.pill.main:hover, .pill.main:focus-visible { background: #fff; }
.pill:focus-visible { box-shadow: 0 0 0 3px rgba(236, 238, 239, .4); }
.pill svg { width: 13px; height: 13px; }
.feature .pill { padding: 10px 18px; font-size: 14px; }
.pill.mdoc { display: none; }   /* on narrow screens, where there is no prompt column */

/* The right: the chosen piece's prompt or notes. */
.dtop { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 22px 16px 12px 24px; background: var(--docbg); box-shadow: 0 6px 10px -2px var(--docbg); }
.dlabel, .dtab { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: #e4e7e9; white-space: nowrap; }
.dtabs { display: flex; gap: 2px; margin-left: -8px; }
.dtab { border: 0; background: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; color: var(--faint); outline: none; }
.dtab:hover, .dtab:focus-visible { color: var(--soft); background: var(--hover); }
.dtab.on { color: #e4e7e9; }
.dtop .rule { flex: 1; height: 1px; background: rgba(255, 255, 255, .14); }
.icon {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; margin: -6px 0;
  color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; outline: none;
}
.icon:hover, .icon:focus-visible { background: var(--hover); color: var(--text); }
.icon svg { width: 15px; height: 15px; }
.dbody { padding: 4px 24px 48px; font-size: 14px; line-height: 1.6; }
.doc.fade .dbody { animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .doc.fade .dbody { animation: none; } }
.dbody h3 { margin: 18px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.dbody h3.dtitle { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.005em; line-height: 1.25; text-transform: none; color: var(--text); }
.dbody p { margin: 0; color: #dfe2e4; }
.dbody p.dfacts, .dbody p.dctx { color: var(--muted); font-size: 13px; }
.dbody p.dfacts { margin-top: 6px; }
.dbody p.dctx { margin-top: 14px; }
.dbody ul.needs { list-style: none; margin: 0; padding: 0; }
.dbody ul.needs li { margin: 0 0 .5em; color: #dfe2e4; line-height: 1.5; }
.tag {
  display: inline-block; vertical-align: 1px; margin-left: 4px; padding: 0 6px; border-radius: 999px;
  font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; line-height: 17px;
}
.tag.asked { background: rgba(255, 255, 255, .16); color: var(--text); }
.tag.liked { background: rgba(255, 255, 255, .09); color: var(--muted); }
.tag.proposed { background: rgba(255, 255, 255, .045); color: #7d868c; }
.dctx .tag { margin: 0 2px 0 4px; }
.dbody p.wait { color: var(--faint); }

/* Smaller laptops: narrower columns. */
@media (max-width: 1240px) {
  :root { --side-w: 220px; --doc-w: 320px; }
  .list { padding: 0 24px; }
  .entry { grid-template-columns: minmax(150px, 34%) minmax(0, 1fr); gap: 18px; }
  .entry h3 { font-size: 20px; }
  .feature h3 { font-size: 30px; }
}
/* No room for the prompt column: each row gets buttons for its prompt and notes instead. */
@media (max-width: 980px) {
  .doc { display: none; }
  .list { right: 0; }
  .pill.mdoc { display: inline-flex; }
}
/* Phones: one column, each picture above its words. */
@media (max-width: 760px) {
  .side, .list { position: static; width: auto; overflow: visible; }
  .side { padding: 16px 16px 0; background: none; }
  .side nav { display: none; }
  .brandbox { flex-direction: row; justify-content: flex-start; padding: 0 0 6px; }
  .brand { flex-direction: row; gap: 10px; }
  .mark { width: 32px; height: 32px; }
  .tagline, .start { display: none; }
  .list { padding: 0 16px 40px; }
  .feature { padding-top: 8px; }
  .entry, .feature .entry { grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0 -10px; padding: 10px; }
  .lgroup:last-child { min-height: 0; }
  .lhead { padding: 18px 0 10px; }
  .feature h3 { font-size: 28px; }
}
</style>
</head>
<body>
<aside class="side scroll">
  <div class="brandbox">
    <a class="brand" href="#" aria-label="Marble World, back to the start">
      <img class="mark" src="logo.png" alt="" width="64" height="64">
      <h1>Marble World</h1>
    </a>
    <p class="tagline">A universe in a bubble</p>
    <a class="start" id="start" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>START</a>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
</aside>
<main class="list scroll" id="list"></main>
<aside class="doc scroll" id="doc" aria-label="Prompt and notes"></aside>

<script>
(function () {
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    doc:   '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    list:  '<path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.3" fill="currentColor"/>',
    down:  '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    out:   '<path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var phone = matchMedia('(max-width: 760px)');
  var list = document.getElementById('list'), doc = document.getElementById('doc');

  var groups = GROUPS.map(function (g) {
    return Object.assign({}, g, { items: g.items.filter(function (it) { return it.path; }) });
  }).filter(function (g) { return g.items.length; });
  var byId = {};
  groups.forEach(function (g) { byId[g.id] = { group: g }; g.items.forEach(function (it) { byId[it.id] = { group: g, item: it }; }); });
  var chosen = null;   // the piece whose prompt shows on the right

  // Sidebar: each group's name goes to it, the arrow beside it folds its list,
  // and this browser remembers which lists are folded.
  var CLOSED_KEY = 'marble-nav-closed';
  function readClosed() { try { return JSON.parse(localStorage.getItem(CLOSED_KEY) || '[]'); } catch (e) { return []; } }
  function saveClosed(l) { try { localStorage.setItem(CLOSED_KEY, JSON.stringify(l)); } catch (e) {} }
  function renderNav() {
    var closed = readClosed();
    document.getElementById('nav').innerHTML = groups.map(function (g) {
      var shut = closed.indexOf(g.id) >= 0;
      return '<div class="navgroup' + (shut ? ' closed' : '') + '" data-group="' + esc(g.id) + '">' +
        '<div class="navhead"><a class="navsec" href="#' + esc(g.id) + '" data-pick="' + esc(g.id) + '">' + esc(g.name) + '</a>' +
        '<button class="fold" type="button" aria-expanded="' + !shut + '" aria-label="Fold ' + esc(g.name) + '">' + svg('down') + '</button></div>' +
        '<ul>' + g.items.map(function (it) {
          return '<li><a href="#' + esc(it.id) + '" data-pick="' + esc(it.id) + '">' + esc(it.title) + '</a></li>';
        }).join('') + '</ul></div>';
    }).join('');
  }
  function onFold(ev) {
    var b = ev.target.closest('button.fold');
    if (!b) return;
    var box = b.closest('.navgroup'), shut = box.classList.toggle('closed');
    b.setAttribute('aria-expanded', String(!shut));
    var l = readClosed().filter(function (id) { return id !== box.getAttribute('data-group'); });
    if (shut) l.push(box.getAttribute('data-group'));
    saveClosed(l);
  }

  // The middle: one row per piece. A click anywhere on a row chooses it (its
  // prompt shows on the right); its own button launches it.
  function entry(it, launch) {
    var href = it.id === (PLAY && PLAY.id) ? '#' : '#' + it.id;
    return '<article class="entry" data-pick="' + esc(it.id) + '">' +
      '<span class="pic"><img src="' + esc(it.cover) + '" alt="" loading="lazy"></span>' +
      '<div class="info">' +
        '<h3><a href="' + href + '" data-pick="' + esc(it.id) + '">' + esc(it.title) + '</a>' + (it.version ? '<span class="ver">' + esc(it.version) + '</span>' : '') + '</h3>' +
        (it.sub ? '<p class="sub">' + esc(it.sub) + '</p>' : '') +
        (it.text ? '<p class="text">' + esc(it.text) + '</p>' : '') +
        '<div class="actions"><a class="pill main launch" href="' + esc(it.path) + '">' + svg('play') + esc(launch) + '</a>' +
          (it.prompt ? '<a class="pill mdoc" href="' + esc(it.prompt) + '">' + svg('doc') + 'One-shot prompt</a>' : '') +
          (it.needs ? '<a class="pill mdoc" href="' + esc(it.needs) + '">' + svg('list') + 'Needs</a>' : '') +
        '</div></div></article>';
  }
  function renderList() {
    list.innerHTML = (PLAY ? '<section class="feature">' + entry(PLAY, 'Play') + '</section>' : '') +
      groups.map(function (g) {
        return '<section class="lgroup" data-group="' + esc(g.id) + '"><div class="lhead"><h2>' + esc(g.name) + '</h2></div>' +
          '<div class="entries">' + g.items.map(function (it) { return entry(it, g.launch); }).join('') + '</div></section>';
      }).join('');
  }
  // Scrolls only the list (never the page on a computer) so a row is in full view below its heading.
  function reveal(el, smooth) {
    var how = smooth && !reduced ? 'smooth' : 'auto';
    if (phone.matches) { el.scrollIntoView({ block: 'nearest', behavior: how }); return; }
    var r = el.getBoundingClientRect(), l = list.getBoundingClientRect();
    var sec = el.closest('.lgroup'), head = sec ? sec.querySelector('.lhead').offsetHeight : 0;
    if (r.top < l.top + head + 4) list.scrollBy({ top: r.top - l.top - head - 4, behavior: how });
    else if (r.bottom > l.bottom - 8) list.scrollBy({ top: Math.min(r.bottom - l.bottom + 20, r.top - l.top - head - 4), behavior: how });
  }
  function revealGroup(id, smooth) {
    var sec = list.querySelector('.lgroup[data-group="' + id + '"]');
    if (!sec) return;
    if (phone.matches) { sec.scrollIntoView({ block: 'start', behavior: smooth && !reduced ? 'smooth' : 'auto' }); return; }
    list.scrollTo({ top: sec.offsetTop, behavior: smooth && !reduced ? 'smooth' : 'auto' });
  }

  // Choose by id: a piece, a group (goes to it and chooses its first piece),
  // or nothing (the current game, at the top).
  function pick(id, how) {
    var hit = byId[id], it = hit ? (hit.item || hit.group.items[0]) : PLAY;
    var key = it ? it.id : null;
    if (chosen !== key) { chosen = key; renderDoc(it || {}); }
    var row = null;
    list.querySelectorAll('.entry').forEach(function (e) {
      var on = e.getAttribute('data-pick') === key;
      e.classList.toggle('on', on);
      if (on) { e.setAttribute('aria-current', 'true'); row = e; } else { e.removeAttribute('aria-current'); }
    });
    if (hit && !hit.item && how === 'nav') revealGroup(hit.group.id, true);
    else if (!hit && how === 'nav') { if (phone.matches) scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); else list.scrollTo({ top: 0, behavior: reduced ? 'auto' : 'smooth' }); }
    else if (row && how !== 'list' && !(how === 'load' && !hit)) reveal(row, how !== 'load');
    document.querySelectorAll('#nav a[data-pick]').forEach(function (a) {
      a.classList.toggle('here', !!hit && a.getAttribute('data-pick') === key);
    });
    if (how !== 'load') history.replaceState(null, '', hit ? '#' + key : location.pathname);
  }
  function onPick(ev) {
    if (ev.target.closest('a.pill, .dtop')) return;   // a launch or document link goes where it says
    var plain = !(ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button);
    var a = ev.target.closest('[data-pick]');
    if (a && plain) {
      ev.preventDefault();
      var id = a.getAttribute('data-pick');
      pick(PLAY && id === PLAY.id ? null : id, a.closest('.entry') ? 'list' : 'nav');
      return;
    }
    if (ev.target.closest('a.brand') && plain) { ev.preventDefault(); pick(null, 'nav'); }
  }
  // Up and down step through the rows, on into the next group.
  function onKey(ev) {
    var on = document.activeElement && document.activeElement.closest && document.activeElement.closest('.entry');
    var d = { ArrowDown: 1, ArrowUp: -1 }[ev.key];
    if (!on || !d) return;
    var all = Array.prototype.slice.call(list.querySelectorAll('.entry')), i = all.indexOf(on) + d;
    if (i < 0 || i >= all.length) return;
    ev.preventDefault();
    all[i].querySelector('h3 a').focus({ preventScroll: true });
    var id = all[i].getAttribute('data-pick');
    pick(PLAY && id === PLAY.id ? null : id, 'keys');
  }

  // The right: the chosen piece's prompt or needs. The pages stay the source:
  // the column reads one and shows a prompt as plain paragraphs and a needs
  // list as a list. The arrow at the top opens the page itself.
  var cache = {}, docs = [], docTurn = 0;
  function text(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  // Rebuilds a fragment from text, keeping only the labels (Asked, Liked,
  // Proposed) and bold, so nothing else from a page is carried across.
  function safe(el) {
    if (!el) return '';
    return Array.prototype.map.call(el.childNodes, function (n) {
      if (n.nodeType === 3) return esc(n.textContent.replace(/\s+/g, ' '));
      if (n.nodeType !== 1) return '';
      var kind = n.classList.contains('tag') && ['asked', 'liked', 'proposed'].filter(function (k) { return n.classList.contains(k); })[0];
      if (kind) return '<span class="tag ' + kind + '">' + esc(text(n)) + '</span>';
      if (n.tagName === 'STRONG' || n.tagName === 'B') return '<strong>' + esc(text(n)) + '</strong>';
      return esc(n.textContent.replace(/\s+/g, ' '));
    }).join('').trim();
  }
  function loadDoc(href) {
    if (cache[href]) return Promise.resolve(cache[href]);
    return fetch(href).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
      var d = new DOMParser().parseFromString(html, 'text/html');
      var p = {
        title: text(d.querySelector('h1')),
        facts: Array.prototype.map.call(d.querySelectorAll('.facts li'), text).join(' · '),
        context: safe(d.querySelector('.context')),
        parts: Array.prototype.map.call(d.querySelectorAll('.part'), function (s) {
          var ul = s.querySelector('ul.needs');
          var body = ul
            ? '<ul class="needs">' + Array.prototype.map.call(ul.querySelectorAll('li'), function (li) { return '<li>' + safe(li) + '</li>'; }).join('') + '</ul>'
            : '<p>' + esc(Array.prototype.map.call(s.querySelectorAll('p'), text).join(' ')) + '</p>';
          return { label: text(s.querySelector('.label')), body: body };
        })
      };
      return (cache[href] = p);
    });
  }
  function renderDoc(it) {
    docs = [];
    if (it.prompt) docs.push({ href: it.prompt, label: 'One-shot prompt' });
    if (it.needs) docs.push({ href: it.needs, label: 'Needs' });
    showDoc(0);
  }
  function showDoc(i) {
    var turn = ++docTurn, d = docs[i];
    var label = docs.length > 1
      ? '<div class="dtabs" role="tablist">' + docs.map(function (x, j) {
          return '<button type="button" class="dtab' + (j === i ? ' on' : '') + '" role="tab" aria-selected="' + (j === i) + '" data-doc="' + j + '">' + esc(x.label) + '</button>';
        }).join('') + '</div>'
      : '<h2 class="dlabel">' + esc(d ? d.label : 'Notes') + '</h2>';
    doc.innerHTML = '<div class="dtop">' + label + '<span class="rule"></span>' +
        (d ? '<a class="icon" href="' + esc(d.href) + '" aria-label="Open as a full page" title="Open as a page">' + svg('out') + '</a>' : '') +
      '</div><div class="dbody" id="dbody">' + (d ? '' : '<p class="wait">Nothing written for this one yet.</p>') + '</div>';
    doc.scrollTop = 0;
    doc.classList.remove('fade'); void doc.offsetWidth; doc.classList.add('fade');
    if (!d) return;
    var body = document.getElementById('dbody'), shown = false;
    setTimeout(function () { if (!shown && turn === docTurn) body.innerHTML = '<p class="wait">Loading…</p>'; }, 150);
    loadDoc(d.href).then(function (p) {
      if (turn !== docTurn) return;
      shown = true;
      body.innerHTML = '<h3 class="dtitle">' + esc(p.title) + '</h3>' +
        (p.facts ? '<p class="dfacts">' + esc(p.facts) + '</p>' : '') +
        (p.context ? '<p class="dctx">' + p.context + '</p>' : '') +
        p.parts.map(function (s) { return (s.label ? '<h3>' + esc(s.label) + '</h3>' : '') + s.body; }).join('');
    }).catch(function () {
      if (turn !== docTurn) return;
      shown = true;
      body.innerHTML = '<p class="wait">This page did not load. <a href="' + esc(d.href) + '" style="text-decoration:underline">Open it as a page</a>.</p>';
    });
  }
  function onDocTab(ev) {
    var b = ev.target.closest('[data-doc]');
    if (b) showDoc(+b.getAttribute('data-doc'));
  }
  function onHash() { pick(decodeURIComponent(location.hash.slice(1)) || null, 'load'); }

  renderNav();
  renderList();
  var start = document.getElementById('start');
  if (PLAY) start.setAttribute('href', PLAY.path); else start.hidden = true;
  // Safe to run twice: replace listeners rather than stacking them.
  if (window.__marble) {
    var o = window.__marble;
    ['pick', 'tab', 'fold'].forEach(function (k) { document.removeEventListener('click', o[k]); });
    document.removeEventListener('keydown', o.key);
    removeEventListener('hashchange', o.hash);
  }
  window.__marble = { pick: onPick, tab: onDocTab, fold: onFold, key: onKey, hash: onHash };
  document.addEventListener('click', onPick);
  document.addEventListener('click', onDocTab);
  document.addEventListener('click', onFold);
  document.addEventListener('keydown', onKey);
  addEventListener('hashchange', onHash);
  onHash();   // the address chooses what shows first, so Back from a piece returns to it
})();
</script>
</body>
</html>
