<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble World</title>
<meta name="description" content="A small world in a glass sphere, and the builds, studies and tools that made it.">
<meta name="theme-color" content="#0e1114">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
/* ======================================================================
   DATA. Edit here; the page is built from it.

   PLAY is the current game, shown large at the top with a description.
   Each of GROUPS is one side-scrolling row on the page and one folding
   list in the sidebar. Only published pieces belong here.
     id:     anchor for the sidebar link, e.g. 'round-6'
     path:   the folder (or page) inside this repo that opens
     cover:  picture for the card (16:10)
     prompt: optional readable page of the prompt that made it
     needs:  optional page of what a study found the full system needs
     nav:    optional name for the sidebar, if it differs from the card title
   ====================================================================== */
var PLAY = {
  id: 'marble', title: 'Marble World',
  text: 'A small living world inside a glass marble, floating free in space. Tend it by raising land, bringing rain and planting life, or wreck it with eruptions, quakes, meteors and storms. Every action sets off a chain of reactions through ground, water, heat and life, and whatever you do, the world recovers in its own way.',
  version: 'v7',   // the round Play opens
  path: 'rounds/round-7/', cover: 'rounds/round-7/hero.jpg', prompt: 'rounds/round-7/prompt.html'
};

var GROUPS = [
  // Rounds are numbered in the order they were made.
  { id: 'rounds', name: 'Rounds', items: [
    { id: 'round-1', title: 'Round 1', nav: '1st Prompt', path: 'rounds/round-1/', cover: 'rounds/round-1/cover.jpg', prompt: 'rounds/round-1/prompt.html' },
    { id: 'round-2', title: 'Round 2', nav: '2nd Prompt', path: 'rounds/round-2/', cover: 'rounds/round-2/cover.jpg', prompt: 'rounds/round-2/prompt.html' },
    { id: 'round-3', title: 'Round 3', nav: '3rd Prompt', path: 'rounds/round-3/', cover: 'rounds/round-3/cover.jpg', prompt: 'rounds/round-3/prompt.html' },
    { id: 'round-4', title: 'Round 4', nav: '4th Prompt', path: 'rounds/round-4/', cover: 'rounds/round-4/cover.jpg', prompt: 'rounds/round-4/prompt.html' },
    { id: 'round-5', title: 'Round 5', nav: '5th Prompt', path: 'rounds/round-5/', cover: 'rounds/round-5/cover.jpg', prompt: 'rounds/round-5/prompt.html' },
    { id: 'round-6', title: 'Round 6', nav: '6th Prompt', path: 'rounds/round-6/', cover: 'rounds/round-6/cover.jpg', prompt: 'rounds/round-6/prompt.html' },
    { id: 'round-7', title: 'Round 7', nav: '7th Prompt', path: 'rounds/round-7/', cover: 'rounds/round-7/cover.jpg', prompt: 'rounds/round-7/prompt.html' },
  ]},
  { id: 'studies', name: 'Studies', items: [
    { id: 'lava',      title: 'Lava',            path: 'studies/lava/a.html',  cover: 'studies/lava/cover.jpg',  needs: 'studies/lava/needs.html' },
    { id: 'water',     title: 'Water',           path: 'studies/water/a.html', cover: 'studies/water/cover.jpg', needs: 'studies/water/needs.html' },
    { id: 'sky',       title: 'Sky and weather', path: 'studies/sky-weather/', cover: 'studies/sky-weather/cover.jpg' },
    { id: 'creatures', title: 'Creatures',       path: 'studies/creatures/',   cover: 'studies/creatures/cover.jpg', needs: 'studies/creatures/needs.html' },
    { id: 'scale',     title: 'Scale',           path: 'studies/scale/',       cover: 'studies/scale/cover.jpg' },
    { id: 'interface', title: 'Interface',       path: 'studies/interface/',   cover: 'studies/interface/cover.jpg' },
  ]},
  { id: 'tools', name: 'Tools', items: [
    { id: 'assets',   title: 'Asset manager', path: 'tools/assets/',   cover: 'tools/assets/cover.jpg' },
    { id: 'tool-map', title: 'Tool map',      path: 'tools/tool-map/', cover: 'tools/tool-map/cover.jpg' },
  ]},
];
</script>
<style>
:root {
  --bg: #0e1114;
  --side: #0a0c0e;
  --pane: #171b1f;
  --text: #eceeef;
  --soft: #c3c9cd;
  --muted: #9aa2a7;
  --faint: #4e565c;
  --hover: rgba(255, 255, 255, .06);
  --radius: 5px;
  --side-w: 248px;
  --card-w: clamp(240px, 22vw, 330px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
svg { display: block; }
button { font: inherit; color: inherit; }

/* Sidebar */
.side {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w);
  background: var(--side); overflow-y: auto; padding: 18px 12px 32px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.mark { width: 30px; height: 30px; flex: none; display: block; }
.brand h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
.side ul { list-style: none; margin: 0; padding: 0; }
.navhead {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  margin: 12px 0 2px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer;
  font-size: 13.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #dfe3e6; outline: none;
}
.navhead:hover, .navhead:focus-visible { background: var(--hover); color: var(--text); }
.navhead svg { width: 14px; height: 14px; color: var(--muted); transition: transform .2s ease; }
.navplay svg { width: 12px; height: 12px; margin-right: 1px; }
.navplay:hover svg, .navplay:focus-visible svg { color: var(--text); }
.navgroup.closed .navhead svg { transform: rotate(-90deg); }
.navgroup.closed ul { display: none; }
.side ul a {
  display: flex; align-items: baseline; gap: 10px; padding: 7px 10px 7px 24px; border-radius: 8px; font-size: 16.5px;
  color: var(--muted); outline: none; transition: background .15s ease, color .15s ease;
}
.side ul a:hover, .side ul a:focus-visible { background: var(--hover); color: var(--text); }
.side ul a.here { background: rgba(255, 255, 255, .09); color: var(--text); }

/* Content */
main { margin-left: var(--side-w); padding: 32px 40px 40vh; min-width: 0; }

/* The current game, large, with what it is beside it. */
.hero {
  display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr); gap: 44px; align-items: center;
  max-width: 1240px; margin-bottom: 52px; scroll-margin-top: 32px;
}
.hero .pic { display: block; aspect-ratio: 6 / 5; }
.hero .copy { min-width: 0; }
.hero h2 { margin: 0; font-size: 44px; font-weight: 650; letter-spacing: -.02em; line-height: 1.05; }
.hero p.text { margin: 16px 0 0; font-size: 16px; line-height: 1.6; color: var(--soft); max-width: 34em; }
.hero h2 .ver { margin-left: .35em; font-size: .5em; font-weight: 500; letter-spacing: 0; color: var(--faint); vertical-align: .55em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 500; background: rgba(255, 255, 255, .08); color: var(--text); outline: none;
  transition: background .15s ease;
}
.pill:hover, .pill:focus-visible { background: rgba(255, 255, 255, .15); }
.pill.main { background: var(--text); color: var(--bg); }
.pill.main:hover, .pill.main:focus-visible { background: #fff; }
.pill:focus-visible { box-shadow: 0 0 0 3px rgba(236, 238, 239, .4); }
.pill svg { width: 14px; height: 14px; }

/* One side-scrolling row per group. */
.group { margin-bottom: 40px; scroll-margin-top: 24px; }
.ghead { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.ghead h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--soft); }
.arrows { margin-left: auto; display: flex; gap: 4px; }
.arrows button {
  width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 8px;
  background: none; color: var(--muted); cursor: pointer; outline: none;
}
.arrows button:hover:not(:disabled), .arrows button:focus-visible { background: var(--hover); color: var(--text); }
.arrows button:disabled { color: var(--faint); opacity: .5; cursor: default; }
.arrows svg { width: 16px; height: 16px; }
.group:not(.overflows) .arrows { visibility: hidden; }
.row {
  display: flex; gap: 18px; overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x proximity; scroll-padding-left: 4px;
  padding: 6px 4px 14px; margin: -6px -4px -6px;   /* room for the lift and shadow on hover */
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .14) transparent;
}
.row::-webkit-scrollbar { height: 8px; }
.row::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 4px; }
.row .card { flex: 0 0 var(--card-w); scroll-snap-align: start; }

.card { position: relative; scroll-margin-top: 24px; scroll-margin-left: 4px; }
.pic {
  position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius); overflow: hidden; background: var(--pane);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .22);
  transition: transform .18s ease, box-shadow .18s ease;
}
.pic img { width: 100%; height: 100%; object-fit: cover; display: block; filter: brightness(.92); transition: filter .25s ease; }
.card:hover .pic, .card:focus-within .pic { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0, 0, 0, .35), 0 12px 28px rgba(0, 0, 0, .38); }
.card:hover img, .card:focus-within img { filter: brightness(1); }
.card.flash .pic { box-shadow: 0 0 0 2px rgba(236, 238, 239, .5), 0 12px 28px rgba(0, 0, 0, .38); }
.meta { display: flex; align-items: center; gap: 10px; padding: 10px 2px 0; min-height: 40px; }
.go { font-weight: 500; outline: none; }
.go::after { content: ""; position: absolute; inset: 0; }   /* the whole card opens the piece */
.card:has(.go:focus-visible) .pic { box-shadow: 0 0 0 3px rgba(236, 238, 239, .5); }
.doc {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted); padding: 5px 10px; border-radius: 999px; outline: none;
}
.meta .go { margin-right: auto; }
.doc svg { width: 13px; height: 13px; }
.doc:hover, .doc:focus-visible { color: var(--text); background: var(--hover); }
.hero .card:hover .pic, .hero .card:focus-within .pic { transform: none; }

/* Side panel for prompts and needs: slides in from the right. */
.veil { position: fixed; inset: 0; background: rgba(4, 6, 8, .45); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 20; }
.veil.open { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 94vw); z-index: 21;
  background: #14181b; box-shadow: -20px 0 60px rgba(0, 0, 0, .45);
  transform: translateX(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .3s; visibility: hidden;
  display: flex; flex-direction: column; outline: none;
}
.panel.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
@media (prefers-reduced-motion: reduce) { .panel, .panel.open, .veil { transition: none; } }
.ptop { display: flex; align-items: flex-start; gap: 8px; padding: 20px 20px 14px 24px; flex: none; }
.ptop .what { flex: 1; min-width: 0; }
.pkick { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ptitle { margin: 4px 0 0; font-size: 19px; font-weight: 600; line-height: 1.25; }
.pfacts { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.icon {
  flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
  color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; outline: none;
}
.icon:hover, .icon:focus-visible { background: var(--hover); color: var(--text); }
.icon svg { width: 16px; height: 16px; }
.pbody { flex: 1; overflow-y: auto; padding: 0 24px 40px; font-size: 14px; line-height: 1.6; overscroll-behavior: contain; }
.pctx { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.pbody h3 { margin: 18px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.pbody p { margin: 0; color: #dfe2e4; }
.pbody ul.needs { list-style: none; margin: 0; padding: 0; }
.pbody ul.needs li { margin: 0 0 .5em; color: #dfe2e4; line-height: 1.5; }
.tag {
  display: inline-block; vertical-align: 1px; margin-left: 4px; padding: 0 6px; border-radius: 999px;
  font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; line-height: 17px;
}
.tag.asked { background: rgba(255, 255, 255, .16); color: var(--text); }
.tag.liked { background: rgba(255, 255, 255, .09); color: var(--muted); }
.tag.proposed { background: rgba(255, 255, 255, .045); color: #7d868c; }
.pctx .tag { margin: 0 2px 0 4px; }
.pbody .wait { color: var(--faint); }

/* Narrower screens: the game's description goes under its picture. */
@media (max-width: 1100px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 22px; max-width: 760px; }
  .hero h2 { font-size: 36px; }
}
/* Phones: no sidebar. */
@media (max-width: 760px) {
  :root { --card-w: 72vw; }
  .side { position: static; width: auto; padding: 16px 8px 0; background: none; }
  .side nav { display: none; }
  .brand { padding-bottom: 6px; }
  main { margin-left: 0; padding: 16px 16px 40px; }
  .hero { margin-bottom: 36px; }
  .hero h2 { font-size: 30px; }
  .ghead h2 { font-size: 17px; }
  .meta { font-size: 14px; gap: 6px; }
}
</style>
</head>
<body>
<aside class="side">
  <a class="brand" href="#top" aria-label="Marble World, back to top">
    <img class="mark" src="logo.png" alt="" width="30" height="30">
    <h1>Marble World</h1>
  </a>
  <nav id="nav"></nav>
</aside>
<main id="top"></main>
<div class="veil" id="veil"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle" tabindex="-1">
  <div class="ptop">
    <div class="what">
      <p class="pkick" id="pkick"></p>
      <h2 class="ptitle" id="ptitle"></h2>
      <p class="pfacts" id="pfacts"></p>
    </div>
    <a class="icon" id="ppage" href="#" aria-label="Open as a full page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <button class="icon" id="pclose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="pbody" id="pbody"></div>
</aside>

<script>
(function () {
  var ICONS = {
    play:  '<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
    doc:   '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10A.5.5 0 0 1 7 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 11h5M10 14.5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
    list:  '<path d="M9 6.5h11M9 12h11M9 17.5h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="17.5" r="1.3" fill="currentColor"/>',
    down:  '<path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    left:  '<path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    right: '<path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  function svg(name) { return '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[name] + '</svg>'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function published(items) { return items.filter(function (it) { return it.path; }); }

  function card(it) {
    return '<article class="card" id="' + esc(it.id) + '">' +
      '<div class="pic">' + (it.cover ? '<img src="' + esc(it.cover) + '" alt="" loading="lazy">' : '') + '</div>' +
      '<div class="meta"><a class="go" href="' + esc(it.path) + '">' + esc(it.title) + '</a>' +
        (it.prompt ? '<a class="doc" href="' + esc(it.prompt) + '">' + svg('doc') + 'One-shot prompt</a>' : '') +
        (it.needs ? '<a class="doc" href="' + esc(it.needs) + '">' + svg('list') + 'Needs</a>' : '') +
      '</div></article>';
  }

  function hero(p) {
    return '<section class="hero card" id="' + esc(p.id) + '">' +
      '<a class="pic" href="' + esc(p.path) + '" tabindex="-1" aria-hidden="true"><img src="' + esc(p.cover) + '" alt=""></a>' +
      '<div class="copy">' +
        '<h2>' + esc(p.title) + (p.version ? '<span class="ver">' + esc(p.version) + '</span>' : '') + '</h2>' +
        (p.text ? '<p class="text">' + esc(p.text) + '</p>' : '') +
        '<div class="actions">' +
          '<a class="pill main" href="' + esc(p.path) + '">' + svg('play') + 'Play</a>' +
          (p.prompt ? '<a class="pill doc-open" href="' + esc(p.prompt) + '">' + svg('doc') + 'One-shot prompt</a>' : '') +
        '</div>' +
      '</div></section>';
  }

  function render() {
    var groups = GROUPS.map(function (g) { return { g: g, items: published(g.items) }; }).filter(function (x) { return x.items.length; });
    document.getElementById('top').innerHTML = (PLAY ? hero(PLAY) : '') + groups.map(function (x) {
      return '<section class="group" id="' + esc(x.g.id) + '">' +
        '<div class="ghead"><h2>' + esc(x.g.name) + '</h2>' +
          '<div class="arrows"><button type="button" data-dir="-1" aria-label="Scroll ' + esc(x.g.name) + ' left">' + svg('left') + '</button>' +
          '<button type="button" data-dir="1" aria-label="Scroll ' + esc(x.g.name) + ' right">' + svg('right') + '</button></div></div>' +
        '<div class="row">' + x.items.map(card).join('') + '</div></section>';
    }).join('');
    var closed = readClosed();
    document.getElementById('nav').innerHTML =
      (PLAY ? '<a class="navhead navplay" href="' + esc(PLAY.path) + '"><span>Play</span>' + svg('play') + '</a>' : '') +
      groups.map(function (x) { return navGroup(x.g, x.items, closed); }).join('');
    updateArrows();
  }

  // Sidebar lists fold shut with a click on their heading; this browser remembers which.
  var CLOSED_KEY = 'marble-nav-closed';
  function readClosed() { try { return JSON.parse(localStorage.getItem(CLOSED_KEY) || '[]'); } catch (e) { return []; } }
  function saveClosed(list) { try { localStorage.setItem(CLOSED_KEY, JSON.stringify(list)); } catch (e) {} }
  function navGroup(g, items, closed) {
    var shut = closed.indexOf(g.id) >= 0;
    return '<div class="navgroup' + (shut ? ' closed' : '') + '" data-group="' + esc(g.id) + '">' +
      '<button class="navhead" type="button" aria-expanded="' + !shut + '"><span>' + esc(g.name) + '</span>' + svg('down') + '</button>' +
      '<ul>' + items.map(function (it) {
        return '<li><a href="#' + esc(it.id) + '" data-to="' + esc(it.id) + '"><span>' + esc(it.nav || it.title) + '</span></a></li>';
      }).join('') + '</ul></div>';
  }
  function onFold(ev) {
    var b = ev.target.closest('button.navhead');
    if (!b) return;
    var box = b.parentNode, shut = box.classList.toggle('closed');
    b.setAttribute('aria-expanded', String(!shut));
    var list = readClosed().filter(function (id) { return id !== box.getAttribute('data-group'); });
    if (shut) list.push(box.getAttribute('data-group'));
    saveClosed(list);
  }

  // Row arrows: shown only when a row is wider than the page, and dimmed at either end.
  function updateArrows() {
    document.querySelectorAll('.group').forEach(function (g) {
      var row = g.querySelector('.row'), max = row.scrollWidth - row.clientWidth;
      g.classList.toggle('overflows', max > 4);
      var b = g.querySelectorAll('.arrows button');
      b[0].disabled = row.scrollLeft <= 4;
      b[1].disabled = row.scrollLeft >= max - 4;
    });
  }
  function onArrow(ev) {
    var b = ev.target.closest('.arrows button');
    if (!b) return;
    var row = b.closest('.group').querySelector('.row');
    row.scrollBy({ left: +b.getAttribute('data-dir') * row.clientWidth * .8, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  // Side panel for prompts and needs. The pages stay the source: the panel reads
  // one and shows a prompt as plain paragraphs and a needs list as a list.
  // A cmd/ctrl-click still opens the page itself.
  var cache = {}, lastFocus = null, panel = document.getElementById('panel');
  function text(el) { return el ? el.textContent.replace(/\s+/g, ' ').trim() : ''; }
  // Rebuilds a fragment from text, keeping only the labels (Asked, Liked,
  // Proposed) and bold, so nothing else from a page is carried across.
  function safe(el) {
    if (!el) return '';
    return Array.prototype.map.call(el.childNodes, function (n) {
      if (n.nodeType === 3) return esc(n.textContent.replace(/\s+/g, ' '));
      if (n.nodeType !== 1) return '';
      var kind = n.classList.contains('tag') && ['asked', 'liked', 'proposed'].filter(function (k) { return n.classList.contains(k); })[0];
      if (kind) return '<span class="tag ' + kind + '">' + esc(text(n)) + '</span>';
      if (n.tagName === 'STRONG' || n.tagName === 'B') return '<strong>' + esc(text(n)) + '</strong>';
      return esc(n.textContent.replace(/\s+/g, ' '));
    }).join('').trim();
  }
  function loadPrompt(href) {
    if (cache[href]) return Promise.resolve(cache[href]);
    return fetch(href).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (html) {
      var d = new DOMParser().parseFromString(html, 'text/html');
      var p = {
        kick: text(d.querySelector('.kicker')),
        title: text(d.querySelector('h1')),
        facts: Array.prototype.map.call(d.querySelectorAll('.facts li'), text).join(' · '),
        context: safe(d.querySelector('.context')),
        parts: Array.prototype.map.call(d.querySelectorAll('.part'), function (s) {
          var list = s.querySelector('ul.needs');
          var body = list
            ? '<ul class="needs">' + Array.prototype.map.call(list.querySelectorAll('li'), function (li) { return '<li>' + safe(li) + '</li>'; }).join('') + '</ul>'
            : '<p>' + esc(Array.prototype.map.call(s.querySelectorAll('p'), text).join(' ')) + '</p>';
          return { label: text(s.querySelector('.label')), body: body };
        })
      };
      return (cache[href] = p);
    });
  }
  function openPrompt(href) {
    lastFocus = document.activeElement;
    var body = document.getElementById('pbody');
    document.getElementById('pkick').textContent = '';
    document.getElementById('ptitle').textContent = '';
    document.getElementById('pfacts').textContent = '';
    document.getElementById('ppage').setAttribute('href', href);
    body.innerHTML = '<p class="wait">Loading…</p>';
    body.scrollTop = 0;
    panel.classList.add('open'); document.getElementById('veil').classList.add('open');
    panel.focus({ preventScroll: true });
    loadPrompt(href).then(function (p) {
      document.getElementById('pkick').textContent = p.kick;
      document.getElementById('ptitle').textContent = p.title;
      document.getElementById('pfacts').textContent = p.facts;
      body.innerHTML = (p.context ? '<p class="pctx">' + p.context + '</p>' : '') +
        p.parts.map(function (s) { return (s.label ? '<h3>' + esc(s.label) + '</h3>' : '') + s.body; }).join('');
    }).catch(function () {
      body.innerHTML = '<p class="wait">This page did not load. <a href="' + esc(href) + '" style="text-decoration:underline">Open it as a page</a>.</p>';
    });
  }
  function closePrompt() {
    if (!panel.classList.contains('open')) return;
    panel.classList.remove('open'); document.getElementById('veil').classList.remove('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function onPrompt(ev) {
    var a = ev.target.closest('a.doc, a.doc-open');
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    ev.preventDefault();
    openPrompt(a.getAttribute('href'));
  }
  function onKey(ev) { if (ev.key === 'Escape') closePrompt(); }

  // A sidebar click scrolls to the card (down the page and along its row) and marks it briefly.
  function onNav(ev) {
    var a = ev.target.closest('a[data-to]');
    if (!a) return;
    var el = document.getElementById(a.getAttribute('data-to'));
    if (!el) return;
    ev.preventDefault();
    el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start', inline: 'nearest' });
    history.replaceState(null, '', '#' + el.id);
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    clearTimeout(el._t); el._t = setTimeout(function () { el.classList.remove('flash'); }, 1200);
    var go = el.querySelector('.go, .pill.main'); if (go) go.focus({ preventScroll: true });
    lockUntil = Date.now() + 900;
    mark(el.id);
  }

  // The sidebar follows the page: the first card in view, in the topmost row, is marked.
  function mark(id) {
    current = id;
    document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('here', a.getAttribute('data-to') === id); });
  }
  var lockUntil = 0, current = null;
  function inView(c) {
    var r = c.getBoundingClientRect(), row = c.closest('.row');
    if (r.bottom <= 60 || r.top >= innerHeight * .6) return false;
    if (!row) return true;
    var rr = row.getBoundingClientRect();
    return r.right > rr.left + 20 && r.left < rr.right - 20;
  }
  function spy() {
    if (Date.now() < lockUntil) return;   // a sidebar jump is still scrolling
    var cards = Array.prototype.filter.call(document.querySelectorAll('.card'), inView);
    if (!cards.length) return;
    var top = Math.min.apply(null, cards.map(function (c) { return c.getBoundingClientRect().top; }));
    var rowCards = cards.filter(function (c) { return Math.abs(c.getBoundingClientRect().top - top) < 3; });
    if (rowCards.some(function (c) { return c.id === current; })) return;   // keep the marked one if it is still showing
    mark(rowCards[0].id);
  }

  render();
  // Safe to run twice: replace listeners rather than stacking them.
  if (window.__marble) {
    var o = window.__marble;
    ['nav', 'prompt', 'fold', 'arrow'].forEach(function (k) { document.removeEventListener('click', o[k]); });
    document.removeEventListener('keydown', o.key);
    removeEventListener('scroll', o.spy);
    removeEventListener('resize', o.resize);
    document.removeEventListener('scroll', o.rows, true);
  }
  var raf = 0, onScroll = function () { if (!raf) raf = requestAnimationFrame(function () { raf = 0; spy(); }); };
  var onRows = function (ev) { if (ev.target.classList && ev.target.classList.contains('row')) { updateArrows(); onScroll(); } };
  window.__marble = { nav: onNav, prompt: onPrompt, fold: onFold, arrow: onArrow, key: onKey, spy: onScroll, resize: updateArrows, rows: onRows };
  document.addEventListener('click', onNav);
  document.addEventListener('click', onPrompt);
  document.addEventListener('click', onFold);
  document.addEventListener('click', onArrow);
  document.addEventListener('keydown', onKey);
  document.getElementById('veil').onclick = closePrompt;
  document.getElementById('pclose').onclick = closePrompt;
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', updateArrows);
  document.addEventListener('scroll', onRows, { capture: true, passive: true });
  spy();
})();
</script>
</body>
